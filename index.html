const UploadAttendanceModal = ({ open, onClose, onImport, employees, settings, leaves, leaveTypes }) => {
  const fileRef = useRef(null);
  const [preview, setPreview] = useState(null);
  const [errors, setErrors]   = useState([]);

  const downloadTemplate = () => {
    // create sample Excel with the expected columns
    const ws = XLSX.utils.aoa_to_sheet([
      ['employee_id', 'date',       'check_in', 'check_out'],
      ['EMP1001',     '2025-01-15', '08:00',    '17:00'],
      ['EMP1002',     '2025-01-15', '08:30',    '17:30'],
    ]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Attendance');
    XLSX.writeFile(wb, 'attendance_template.xlsx');
  };

  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type: 'binary' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { defval: '', raw: true });

        // แปลงค่าเวลาจาก Excel เป็นรูปแบบ HH:MM
        // รองรับ: "08:30" (string), 0.3958 (Excel time fraction), 8.5 (decimal hour)
        const parseTime = (val) => {
          if (val === '' || val === null || val === undefined) return '';
          // ถ้าเป็น string ที่มี : อยู่แล้ว
          if (typeof val === 'string') {
            const s = val.trim();
            if (s === '') return '';
            // รูปแบบ HH:MM หรือ HH:MM:SS
            const m = s.match(/^(\d{1,2}):(\d{2})/);
            if (m) {
              return `${m[1].padStart(2,'0')}:${m[2]}`;
            }
            // string ที่เป็นตัวเลข (เช่น "0.3958")
            const num = parseFloat(s);
            if (!isNaN(num)) return fractionToTime(num);
            return s;
          }
          // ถ้าเป็นตัวเลข = Excel time fraction
          if (typeof val === 'number') {
            return fractionToTime(val);
          }
          return String(val);
        };

        // แปลง fraction (0-1) หรือ datetime serial เป็น HH:MM
        const fractionToTime = (num) => {
          // ถ้าเป็น datetime serial (เช่น 45678.396) เอาเฉพาะเศษทศนิยม (ส่วนที่เป็นเวลา)
          let frac = num >= 1 ? num - Math.floor(num) : num;
          const totalMinutes = Math.round(frac * 24 * 60);
          const h = Math.floor(totalMinutes / 60) % 24;
          const m = totalMinutes % 60;
          return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
        };

        const records = [];
        const errs = [];
        rows.forEach((row, idx) => {
          const empId = String(row.employee_id || row.รหัสพนักงาน || '').trim();
          const dateRaw = row.date !== undefined ? row.date : row.วันที่;
          const date  = String(dateRaw ?? '').trim();
          const checkIn  = parseTime(row.check_in  ?? row.เข้างาน);
          const checkOut = parseTime(row.check_out ?? row.ออกงาน);
          if (!empId) {
            errs.push(`แถวที่ ${idx + 2}: ไม่พบรหัสพนักงาน`);
            return;
          }
          if (!employees.some(e => e.id === empId)) {
            errs.push(`แถวที่ ${idx + 2}: ไม่พบพนักงานรหัส ${empId}`);
            return;
          }
          if (!date) {
            errs.push(`แถวที่ ${idx + 2}: ไม่ระบุวันที่`);
            return;
          }
          // normalize date → YYYY-MM-DD
          let normDate;
          if (typeof dateRaw === 'number') {
            // Excel serial number → ใช้ SSF
            const d = XLSX.SSF.parse_date_code(dateRaw);
            normDate = d ? `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}` : '';
          } else {
            normDate = toYMD(dateRaw);
          }
          if (!normDate) normDate = date;

          let status, leaveType = null, leavePeriod = null, leaveHours = null;

          // หาการลาที่อนุมัติแล้วในวันนั้น (ใช้ทั้งกรณีมี/ไม่มีสแกน)
          const matchLeave = (leaves || []).find(l =>
            l.employeeId === empId &&
            l.status === 'approved' &&
            toYMD(l.startDate) <= normDate &&
            toYMD(l.endDate)   >= normDate
          );

          if (!checkIn && !checkOut) {
            // ไม่มีเวลาเข้า-ออก → เทียบกับการลาที่อนุมัติแล้วในวันนั้น
            if (matchLeave) {
              if (matchLeave.type === 'wfh' || matchLeave.type === 'offsite') {
                status = 'wfh';
              } else {
                status = 'leave';
              }
              leaveType = matchLeave.type;
              leavePeriod = matchLeave.period || 'full';
              leaveHours = matchLeave.hours || null;
            } else {
              // เช็ควันอาทิตย์ — ไม่ใช่วันทำงาน ไม่นับขาดงาน
              const dObj = new Date(normDate + 'T00:00:00');
              if (!isNaN(dObj) && dObj.getDay() === 0) {
                status = 'holiday';   // วันหยุด (อาทิตย์)
              } else {
                status = 'absent';
              }
            }
          } else {
            // มีการสแกน (เข้า และ/หรือ ออก)
            // 1) คำนวณ ตรงเวลา/สาย จากเวลาเข้า
            const [wsH, wsM] = (settings?.workStart || '08:00').split(':').map(Number);
            const allowedMin = (wsH * 60 + wsM) + Number(settings?.lateMinutes ?? 5);
            const [ciH, ciM] = (checkIn || '0:0').split(':').map(Number);
            const ciMin = (ciH || 0) * 60 + (ciM || 0);
            const baseAtt = (checkIn && ciMin > allowedMin) ? 'late' : 'ontime';

            // 2) ถ้ามีลาครึ่งวัน/ลาเป็นชั่วโมงในวันเดียวกัน → ขึ้นสถานะลาแบบนั้น (มาทำงานบางส่วน + ลาบางส่วน)
            const isPartialLeave = matchLeave &&
              matchLeave.type !== 'wfh' && matchLeave.type !== 'offsite' &&
              (matchLeave.period === 'morning' || matchLeave.period === 'afternoon' || matchLeave.period === 'hours');

            if (isPartialLeave) {
              status = 'partial';                 // มาทำงาน + ลาบางส่วน
              leaveType = matchLeave.type;
              leavePeriod = matchLeave.period;
              leaveHours = matchLeave.hours || null;
            } else if (checkIn && !checkOut) {
              // 3) สแกนเข้าแต่ไม่สแกนออก
              status = 'nocheckout';
            } else {
              status = baseAtt;
            }
          }

          records.push({
            id: `ATT${Date.now()}-${idx}`,
            employeeId: empId,
            date: normDate,
            checkIn,
            checkOut: checkOut || null,
            source: 'fingerprint',
            status,
            leaveType,  // เก็บประเภทการลา (ถ้า status = leave/partial)
            leavePeriod, // full/morning/afternoon/hours
            leaveHours,  // จำนวนชั่วโมง (ถ้าลาเป็นชั่วโมง)
          });
        });
        setPreview(records);
        setErrors(errs);
      } catch (err) {
        setErrors([`อ่านไฟล์ไม่สำเร็จ: ${err.message}`]);
        setPreview(null);
      }
    };
    reader.readAsBinaryString(file);
  };

  const reset = () => { setPreview(null); setErrors([]); if (fileRef.current) fileRef.current.value = ''; };
  const close = () => { reset(); onClose(); };

  return (
    <Modal open={open} onClose={close} title="อัปโหลดข้อมูลการเข้างานจาก Excel" size="lg">
      {!preview ? (
        <div className="space-y-5">
          <div className="bg-flow-50 border border-flow-200 rounded-xl p-4">
            <div className="flex items-start gap-3">
              <div className="w-8 h-8 rounded-lg bg-flow-100 text-flow-700 flex items-center justify-center shrink-0">
                <Icon name="info" className="w-4 h-4" />
              </div>
              <div className="text-sm text-ink-700">
                <strong>รูปแบบไฟล์ที่ต้องการ:</strong> ไฟล์ Excel (.xlsx, .xls) ที่ส่งออกจากเครื่องสแกนลายนิ้วมือ
                ต้องมีคอลัมน์: <code className="px-1.5 py-0.5 bg-white rounded font-mono text-xs">employee_id</code>,
                <code className="ml-1 px-1.5 py-0.5 bg-white rounded font-mono text-xs">date</code>,
                <code className="ml-1 px-1.5 py-0.5 bg-white rounded font-mono text-xs">check_in</code>,
                <code className="ml-1 px-1.5 py-0.5 bg-white rounded font-mono text-xs">check_out</code>
                <button onClick={downloadTemplate} className="mt-2 inline-flex items-center gap-1.5 text-flow-700 hover:text-flow-800 font-medium">
                  <Icon name="download" className="w-4 h-4" />
                  ดาวน์โหลดไฟล์ตัวอย่าง
                </button>
              </div>
            </div>
          </div>

          <label className="block">
            <div className="border-2 border-dashed border-ink-200 hover:border-flow-400 hover:bg-flow-50/30 rounded-2xl p-10 text-center cursor-pointer transition-colors">
              <div className="w-16 h-16 mx-auto rounded-2xl bg-flow-100 text-flow-700 flex items-center justify-center mb-3">
                <Icon name="upload" className="w-7 h-7" />
              </div>
              <div className="font-display font-semibold text-ink-900 mb-1">ลากไฟล์มาที่นี่ หรือคลิกเพื่อเลือก</div>
              <div className="text-sm text-ink-500">รองรับไฟล์ .xlsx และ .xls (สูงสุด 10MB)</div>
              <input ref={fileRef} type="file" accept=".xlsx,.xls" onChange={handleFile} className="hidden" />
            </div>
          </label>

          {errors.length > 0 && (
            <div className="bg-red-50 border border-red-200 rounded-xl p-4 text-sm">
              <div className="font-medium text-red-700 mb-2">ตรวจพบปัญหา {errors.length} รายการ:</div>
              <ul className="space-y-1 text-red-600 text-xs">
                {errors.slice(0, 5).map((er, i) => <li key={i}>• {er}</li>)}
                {errors.length > 5 && <li className="text-red-500">...และอีก {errors.length - 5} รายการ</li>}
              </ul>
            </div>
          )}
        </div>
      ) : (
        <div className="space-y-4">
          <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4 flex items-center gap-3">
            <div className="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center">
              <Icon name="check" className="w-4 h-4" />
            </div>
            <div className="text-sm">
              <strong className="text-emerald-700">พบข้อมูล {preview.length} รายการ</strong>
              {errors.length > 0 && <span className="text-ink-600 ml-2">(ข้ามไป {errors.length} แถว ที่มีปัญหา)</span>}
            </div>
          </div>

          <div className="border border-ink-100 rounded-xl overflow-hidden max-h-80 overflow-y-auto">
            <table className="w-full text-xs">
              <thead className="bg-ink-50 text-ink-600 sticky top-0">
                <tr>
                  <th className="text-left px-3 py-2">รหัส</th>
                  <th className="text-left px-3 py-2">วันที่</th>
                  <th className="text-left px-3 py-2">เข้างาน</th>
                  <th className="text-left px-3 py-2">ออกงาน</th>
                  <th className="text-left px-3 py-2">สถานะ</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-ink-100">
                {preview.slice(0, 20).map((r, i) => {
                  const info = attStatusInfo(r.status, r.leaveType, leaveTypes, { leavePeriod: r.leavePeriod, leaveHours: r.leaveHours });
                  return (
                    <tr key={i}>
                      <td className="px-3 py-2 font-mono">{r.employeeId}</td>
                      <td className="px-3 py-2">{r.date}</td>
                      <td className="px-3 py-2 font-mono">{r.checkIn || '-'}</td>
                      <td className="px-3 py-2 font-mono">{r.checkOut || '-'}</td>
                      <td className="px-3 py-2">
                        <Badge color={info.color}>{info.label}</Badge>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            {preview.length > 20 && (
              <div className="px-3 py-2 text-center text-xs text-ink-500 bg-ink-50">
                ...และอีก {preview.length - 20} รายการ
              </div>
            )}
          </div>

          <div className="flex justify-end gap-2 pt-4 border-t border-ink-100">
            <Button variant="secondary" onClick={reset}>ยกเลิก</Button>
            <Button icon="check" onClick={() => { onImport(preview); reset(); }}>นำเข้าข้อมูล</Button>
          </div>
        </div>
      )}
    </Modal>
  );
};

/* =============================================================
   IMPORT EMPLOYEES MODAL — นำเข้าพนักงาน + ประวัติการลา จาก Excel
   รองรับไฟล์ format เดิมของบริษัท (ชีต "พนักงาน" และ "บันทึกการลา")
   ============================================================= */
const ImportEmployeesModal = ({ open, onClose, existingEmployees, branches, leaveTypes, onImport }) => {
  const fileRef = useRef(null);
  const [preview, setPreview] = useState(null);  // { employees: [], leaves: [] }
  const [errors, setErrors] = useState([]);
  const [tab, setTab] = useState('employees');

  // mapping: ชื่อภาคไทย → branchId
  const branchMap = useMemo(() => {
    const m = {};
    branches.forEach(b => {
      m[b.name] = b.id;
      m[b.short] = b.id;
      m[b.id] = b.id;
    });
    // map ดั้งเดิม
    m['ภาคกลาง']  = m['ภาคกลาง']  || 'LLK';
    m['ภาคอีสาน'] = m['ภาคอีสาน'] || 'ISN';
    m['ภาคเหนือ'] = m['ภาคเหนือ'] || 'NRT';
    return m;
  }, [branches]);

  // mapping: ประเภทการลาภาษาไทย → id
  const leaveTypeMap = useMemo(() => {
    const m = {};
    leaveTypes.forEach(t => {
      m[t.label] = t.id;
      m[t.id] = t.id;
    });
    // เพิ่ม mapping ตามไฟล์ตัวอย่าง
    m['ลาป่วย']            = m['ลาป่วย']    || 'sick';
    m['ลากิจ']             = m['ลากิจ']     || 'personal';
    m['ลาพักร้อน']         = m['ลาพักร้อน'] || 'vacation';
    m['ลาคลอด']            = m['ลาคลอด']   || 'maternity';
    m['ลาบวช']             = m['ลาบวช']    || 'ordain';
    m['ขาดงาน']            = 'absent';
    m['ลาไม่รับเงินเดือน'] = 'unpaid';
    return m;
  }, [leaveTypes]);

  const reset = () => {
    setPreview(null); setErrors([]);
    if (fileRef.current) fileRef.current.value = '';
  };
  const close = () => { reset(); onClose(); };

  const handleFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type: 'binary', cellDates: true });
        const errs = [];
        const employees = [];
        const leaves = [];

        // ===== หาชีตพนักงาน =====
        const empSheetName = wb.SheetNames.find(n =>
          /พนักงาน|employees?/i.test(n)) || wb.SheetNames[0];
        const empWs = wb.Sheets[empSheetName];
        const empRows = XLSX.utils.sheet_to_json(empWs, { defval: '', raw: false });

        empRows.forEach((row, idx) => {
          // หา field โดยลองหลายชื่อ
          const id = String(row['รหัสพนักงาน'] || row['employee_id'] || row['id'] || '').trim();
          const fullName = String(row['ชื่อ-นามสกุล'] || row['ชื่อ'] || row['name'] || '').trim();
          const branchRaw = String(row['ภาค'] || row['สาขา'] || row['branch'] || '').trim();
          const position = String(row['ตำแหน่ง'] || row['position'] || '').trim();
          const department = String(row['แผนก'] || row['department'] || '').trim();
          const startDate = row['วันเริ่มงาน'] || row['startDate'] || '';
          const phone = String(row['โทรศัพท์'] || row['phone'] || '').trim();
          const statusRaw = String(row['สถานะ'] || row['status'] || 'ทำงานอยู่').trim();

          // โควต้าการลาเฉพาะบุคคล
          const sickQ = row['สิทธิ์ป่วย/ปี'];
          const vacQ  = row['สิทธิ์พักร้อน/ปี'];
          const perQ  = row['สิทธิ์กิจ/ปี'];

          if (!id) return; // ข้าม row ว่าง
          if (!fullName) {
            errs.push(`พนักงาน แถว ${idx+2}: ไม่ระบุชื่อ (${id})`);
            return;
          }

          // แยกชื่อ-นามสกุล
          const parts = fullName.split(/\s+/);
          const firstName = parts[0] || fullName;
          const lastName  = parts.slice(1).join(' ');

          // map ภาค → branchId
          const branchId = branchMap[branchRaw] || (branchRaw ? branchRaw : 'LLK');

          // โควต้าเฉพาะบุคคล (override)
          // ถ้าเป็น "-" → บันทึก "-" เพื่อให้รู้ว่าไม่ได้กำหนดสิทธิ์ (ลาแล้วติดลบ)
          // ถ้าเป็นตัวเลข → บันทึกเป็นจำนวนเต็ม
          // ถ้าว่าง → ไม่ override (ใช้ค่า default)
          const overrideQuota = {};
          const setOverride = (key, val) => {
            const s = String(val ?? '').trim();
            if (s === '') return;             // ว่าง — ไม่ override
            if (s === '-') overrideQuota[key] = '-';  // ไม่กำหนดสิทธิ์
            else if (!isNaN(Number(s))) overrideQuota[key] = Number(s);
          };
          setOverride('sick',     sickQ);
          setOverride('vacation', vacQ);
          setOverride('personal', perQ);

          // แปลงวันเริ่มงาน
          let startDateStr = new Date().toISOString().split('T')[0];
          if (startDate instanceof Date) {
            startDateStr = startDate.toISOString().split('T')[0];
          } else if (typeof startDate === 'string' && startDate.trim()) {
            const d = new Date(startDate);
            if (!isNaN(d)) startDateStr = d.toISOString().split('T')[0];
          }

          employees.push({
            id, firstName, lastName,
            branchId, department: department || 'ทั่วไป',
            position: position || 'พนักงาน',
            email: '', phone,
            startDate: startDateStr,
            status: /ลาออก|พ้น|inactive/.test(statusRaw) ? 'inactive' : 'active',
            leaveQuotaOverride: overrideQuota,
            photo: '',
          });
        });

        // ===== หาชีตการลา (ถ้ามี) =====
        const lvSheetName = wb.SheetNames.find(n =>
          /บันทึกการลา|leaves?|การลา/i.test(n));
        if (lvSheetName) {
          const lvWs = wb.Sheets[lvSheetName];
          const lvRows = XLSX.utils.sheet_to_json(lvWs, { defval: '', raw: false });

          lvRows.forEach((row, idx) => {
            const empId = String(row['รหัสพนักงาน'] || row['employee_id'] || '').trim();
            const typeRaw = String(row['ประเภทการลา'] || row['type'] || '').trim();
            const startRaw = row['วันที่เริ่มลา'] || row['startDate'] || row['start_date'] || '';
            const endRaw   = row['วันที่สิ้นสุด'] || row['endDate']   || row['end_date']   || '';
            const days = Number(row['จำนวนวัน'] || row['days'] || 0);
            const period = String(row['ช่วงเวลา'] || '').trim();
            const reason = String(row['หมายเหตุ'] || row['reason'] || '').trim();
            const statusRaw = String(row['สถานะ'] || row['status'] || 'อนุมัติ').trim();

            if (!empId) return;
            if (!typeRaw || !startRaw) {
              errs.push(`การลา แถว ${idx+2}: ข้อมูลไม่ครบ (${empId})`);
              return;
            }

            // แปลงวันที่
            const toDateStr = (v) => {
              if (v instanceof Date) return v.toISOString().split('T')[0];
              if (typeof v === 'string') {
                const d = new Date(v);
                if (!isNaN(d)) return d.toISOString().split('T')[0];
              }
              return '';
            };
            const startDate = toDateStr(startRaw);
            const endDate = toDateStr(endRaw) || startDate;
            if (!startDate) return;

            const typeId = leaveTypeMap[typeRaw] || typeRaw.toLowerCase();
            const status = /อนุมัติ|approved/.test(statusRaw) ? 'approved'
                         : /ปฏิเสธ|rejected/.test(statusRaw) ? 'rejected'
                         : 'pending';

            leaves.push({
              id: `LV_IMP_${empId}_${idx}_${startDate.replace(/-/g,'')}`,
              employeeId: empId,
              type: typeId,
              startDate, endDate,
              days: days || 1,
              reason: reason + (period ? ` [${period}]` : ''),
              status,
              createdAt: new Date(startDate).toISOString(),
            });
          });
        }

        // ตรวจสอบ leave references
        const empIdSet = new Set(employees.map(e => e.id).concat(existingEmployees.map(e => e.id)));
        const orphanLeaves = leaves.filter(l => !empIdSet.has(l.employeeId)).length;
        if (orphanLeaves > 0) {
          errs.push(`มี ${orphanLeaves} รายการลา อ้างถึงรหัสพนักงานที่ไม่มีในระบบ`);
        }

        setPreview({ employees, leaves, empSheetName, lvSheetName });
        setErrors(errs);
        setTab('employees');
      } catch (err) {
        setErrors([`อ่านไฟล์ไม่สำเร็จ: ${err.message}`]);
        setPreview(null);
      }
    };
    reader.readAsBinaryString(file);
  };

  if (!open) return null;

  return (
    <Modal open={open} onClose={close} title="นำเข้าข้อมูลพนักงานจาก Excel" size="xl">
      {!preview ? (
        <div className="space-y-5">
          <div className="bg-flow-50 border border-flow-200 rounded-xl p-4">
            <div className="flex items-start gap-3">
              <div className="w-8 h-8 rounded-lg bg-flow-100 text-flow-700 flex items-center justify-center shrink-0">
                <Icon name="info" className="w-4 h-4" />
              </div>
              <div className="text-sm text-ink-700">
                <div className="font-medium text-flow-800 mb-1">รองรับไฟล์ Excel ที่มี:</div>
                <ul className="space-y-0.5 text-xs">
                  <li>• <strong>ชีตพนักงาน</strong> — ต้องมีคอลัมน์: <code className="px-1 bg-white rounded">รหัสพนักงาน</code>, <code className="px-1 bg-white rounded">ชื่อ-นามสกุล</code>, <code className="px-1 bg-white rounded">ภาค</code></li>
                  <li>• <strong>ชีตบันทึกการลา (ถ้ามี)</strong> — ระบบจะนำเข้าประวัติให้ด้วย</li>
                  <li>• <strong>ภาคจะแปลงอัตโนมัติ</strong>: ภาคกลาง→LLK, อีสาน→ISN, เหนือ→NRT</li>
                  <li>• <strong>สิทธิ์การลาเฉพาะบุคคล</strong>: ระบบรู้จักคอลัมน์ "สิทธิ์ป่วย/ปี", "สิทธิ์พักร้อน/ปี", "สิทธิ์กิจ/ปี"</li>
                </ul>
              </div>
            </div>
          </div>

          <label className="block">
            <div className="border-2 border-dashed border-ink-200 hover:border-brand-400 hover:bg-brand-50/30 rounded-2xl p-10 text-center cursor-pointer transition-colors">
              <div className="w-16 h-16 mx-auto rounded-2xl bg-brand-100 text-brand-700 flex items-center justify-center mb-3">
                <Icon name="upload" className="w-7 h-7" />
              </div>
              <div className="font-display font-semibold text-ink-900 mb-1">ลากไฟล์มาที่นี่ หรือคลิกเพื่อเลือก</div>
              <div className="text-sm text-ink-500">รองรับไฟล์ .xlsx และ .xls (สูงสุด 10MB)</div>
              <input ref={fileRef} type="file" accept=".xlsx,.xls" onChange={handleFile} className="hidden" />
            </div>
          </label>

          {errors.length > 0 && (
            <div className="bg-red-50 border border-red-200 rounded-xl p-4 text-sm">
              <div className="font-medium text-red-700 mb-2">ปัญหา {errors.length} รายการ:</div>
              <ul className="space-y-1 text-red-600 text-xs">
                {errors.slice(0, 5).map((e, i) => <li key={i}>• {e}</li>)}
              </ul>
            </div>
          )}
        </div>
      ) : (
        <div className="space-y-4">
          {/* สรุปข้อมูล */}
          <div className="grid grid-cols-2 gap-3">
            <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4 flex items-center gap-3">
              <div className="w-10 h-10 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center">
                <Icon name="users" className="w-5 h-5" />
              </div>
              <div>
                <div className="font-display text-2xl font-bold text-emerald-700">{preview.employees.length}</div>
                <div className="text-xs text-ink-600">พนักงาน (จากชีต "{preview.empSheetName}")</div>
              </div>
            </div>
            <div className="bg-flow-50 border border-flow-200 rounded-xl p-4 flex items-center gap-3">
              <div className="w-10 h-10 rounded-lg bg-flow-100 text-flow-700 flex items-center justify-center">
                <Icon name="calendar" className="w-5 h-5" />
              </div>
              <div>
                <div className="font-display text-2xl font-bold text-flow-700">{preview.leaves.length}</div>
                <div className="text-xs text-ink-600">{preview.lvSheetName ? `รายการลา (จาก "${preview.lvSheetName}")` : 'ไม่มีชีตการลา'}</div>
              </div>
            </div>
          </div>

          {errors.length > 0 && (
            <div className="bg-gold-50 border border-gold-200 rounded-xl p-3 text-sm">
              <div className="text-gold-800 font-medium mb-1">⚠ คำเตือน {errors.length} รายการ</div>
              <ul className="text-xs text-ink-700 space-y-0.5">
                {errors.slice(0, 3).map((e, i) => <li key={i}>• {e}</li>)}
                {errors.length > 3 && <li className="text-ink-500">...และอีก {errors.length - 3} รายการ</li>}
              </ul>
            </div>
          )}

          {/* Tabs */}
          <div className="flex items-center gap-2 bg-ink-50 p-1 rounded-xl w-fit">
            <button onClick={() => setTab('employees')}
              className={cls('px-4 py-1.5 rounded-lg text-sm font-medium transition-all',
                tab === 'employees' ? 'bg-white text-brand-700 shadow-soft' : 'text-ink-600')}>
              พนักงาน ({preview.employees.length})
            </button>
            {preview.leaves.length > 0 && (
              <button onClick={() => setTab('leaves')}
                className={cls('px-4 py-1.5 rounded-lg text-sm font-medium transition-all',
                  tab === 'leaves' ? 'bg-white text-brand-700 shadow-soft' : 'text-ink-600')}>
                การลา ({preview.leaves.length})
              </button>
            )}
          </div>

          <div className="border border-ink-100 rounded-xl overflow-hidden max-h-80 overflow-y-auto">
            {tab === 'employees' ? (
              <table className="w-full text-xs">
                <thead className="bg-ink-50 text-ink-600 sticky top-0">
                  <tr>
                    <th className="text-left px-3 py-2">รหัส</th>
                    <th className="text-left px-3 py-2">ชื่อ-นามสกุล</th>
                    <th className="text-left px-3 py-2">สาขา</th>
                    <th className="text-left px-3 py-2">ตำแหน่ง</th>
                    <th className="text-left px-3 py-2">แผนก</th>
                    <th className="text-left px-3 py-2">สิทธิ์</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-ink-100">
                  {preview.employees.slice(0, 30).map((e, i) => {
                    const branch = branches.find(b => b.id === e.branchId);
                    const overrideCount = Object.keys(e.leaveQuotaOverride || {}).length;
                    return (
                      <tr key={i}>
                        <td className="px-3 py-2 font-mono">{e.id}</td>
                        <td className="px-3 py-2">{e.firstName} {e.lastName}</td>
                        <td className="px-3 py-2"><Badge color="blue">{branch?.short || e.branchId}</Badge></td>
                        <td className="px-3 py-2 text-ink-600">{e.position}</td>
                        <td className="px-3 py-2 text-ink-600">{e.department}</td>
                        <td className="px-3 py-2">
                          {overrideCount > 0 ? (
                            <Badge color="yellow">เฉพาะ {overrideCount}</Badge>
                          ) : (
                            <span className="text-ink-400">ค่าเริ่มต้น</span>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            ) : (
              <table className="w-full text-xs">
                <thead className="bg-ink-50 text-ink-600 sticky top-0">
                  <tr>
                    <th className="text-left px-3 py-2">รหัส</th>
                    <th className="text-left px-3 py-2">ประเภท</th>
                    <th className="text-left px-3 py-2">เริ่ม</th>
                    <th className="text-left px-3 py-2">สิ้นสุด</th>
                    <th className="text-left px-3 py-2">วัน</th>
                    <th className="text-left px-3 py-2">สถานะ</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-ink-100">
                  {preview.leaves.slice(0, 30).map((l, i) => {
                    const type = leaveTypes.find(t => t.id === l.type);
                    return (
                      <tr key={i}>
                        <td className="px-3 py-2 font-mono">{l.employeeId}</td>
                        <td className="px-3 py-2">{type?.label || l.type}</td>
                        <td className="px-3 py-2">{l.startDate}</td>
                        <td className="px-3 py-2">{l.endDate}</td>
                        <td className="px-3 py-2 text-center">{l.days}</td>
                        <td className="px-3 py-2">
                          <Badge color={l.status === 'approved' ? 'green' : l.status === 'rejected' ? 'red' : 'yellow'}>
                            {l.status === 'approved' ? 'อนุมัติ' : l.status === 'rejected' ? 'ปฏิเสธ' : 'รอ'}
                          </Badge>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            )}
            {((tab === 'employees' && preview.employees.length > 30) ||
              (tab === 'leaves' && preview.leaves.length > 30)) && (
              <div className="px-3 py-2 text-center text-xs text-ink-500 bg-ink-50">
                แสดง 30 จาก {tab === 'employees' ? preview.employees.length : preview.leaves.length} รายการ
              </div>
            )}
          </div>

          <div className="bg-flow-50 border border-flow-100 rounded-xl p-3 text-xs text-ink-700">
            <Icon name="info" className="w-4 h-4 text-flow-700 inline mr-1" />
            หากพนักงานมีรหัสซ้ำกับที่มีอยู่ ระบบจะ <strong>อัปเดตข้อมูลทับ</strong> ของเดิม
          </div>

          <div className="flex justify-end gap-2 pt-4 border-t border-ink-100">
            <Button variant="secondary" onClick={reset}>ยกเลิก</Button>
            <Button icon="check" onClick={() => { onImport(preview.employees, preview.leaves); reset(); }}>
              นำเข้าข้อมูล
            </Button>
          </div>
        </div>
      )}
    </Modal>
  );
};

/* =============================================================
   LEAVES PAGE
   ============================================================= */
const LeavesPage = () => {
  const { employees, leaves, setLeaves, leaveTypes, branches, user, addToast } = useApp();
  const [filter, setFilter] = useState('all');
  const [openRequest, setOpenRequest] = useState(false);

  // สิทธิ์อนุมัติ: admin/hr อนุมัติได้ทุกคน, พนักงานตาม approvalScope
  const currentEmp = employees.find(e => e.id === user.empId);
  const approvalScope = currentEmp?.approvalScope || (currentEmp?.canApprove ? 'manager' : 'none');
  // ระดับสิทธิ์รวม login role
  const isFullApprover = user.role === 'admin' || user.role === 'hr' || user.role === 'manager' || approvalScope === 'manager';
  const isRegionalApprover = approvalScope === 'regional';
  const canApproveLeaves = isFullApprover || isRegionalApprover;

  // เช็คว่าอนุมัติคำขอของพนักงานคนนี้ได้ไหม
  const canApproveLeaveOf = (emp) => {
    if (!emp) return false;
    if (isFullApprover) return true;
    // ผู้จัดการภาค: อนุมัติเฉพาะคนในภาคตัวเอง (และไม่ใช่ตัวเอง)
    if (isRegionalApprover) {
      return emp.branchId === currentEmp.branchId && emp.id !== currentEmp.id;
    }
    return false;
  };

  const visible = useMemo(() => {
    return leaves.filter(l => {
      if (filter !== 'all' && l.status !== filter) return false;
      const emp = employees.find(e => e.id === l.employeeId);
      if (!emp) return false;
      if (user.role === 'manager' && emp.branchId !== user.branchId) return false;
      if (user.role === 'employee' && emp.id !== user.empId) return false;
      return true;
    }).sort((a,b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
  }, [leaves, filter, employees, user]);

  const updateStatus = (id, status) => {
    const updated = leaves.find(l => l.id === id);
    if (!updated) return;
    const newLeave = { ...updated, status };
    setLeaves(leaves.map(l => l.id === id ? newLeave : l));
    addToast('success', status === 'approved' ? 'อนุมัติคำขอลาแล้ว' : 'ปฏิเสธคำขอลาแล้ว');
    if (api.enabled()) {
      api.post('saveLeave', { data: newLeave })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
  };

  return (
    <div className="p-8 space-y-6 animate-fade-up">
      <Topbar
        title="การลา"
        subtitle="จัดการคำขอลาของพนักงาน"
        action={<Button icon="plus" onClick={() => setOpenRequest(true)}>ขอลา</Button>}
      />

      {/* Filter tabs */}
      <div className="flex items-center gap-2 bg-white border border-ink-100 p-1.5 rounded-xl w-fit">
        {[
          { id: 'all',      label: 'ทั้งหมด' },
          { id: 'pending',  label: 'รออนุมัติ' },
          { id: 'approved', label: 'อนุมัติแล้ว' },
          { id: 'rejected', label: 'ปฏิเสธ' },
        ].map(t => (
          <button
            key={t.id}
            onClick={() => setFilter(t.id)}
            className={cls(
              'px-4 py-1.5 rounded-lg text-sm font-medium transition-all',
              filter === t.id ? 'bg-flow-600 text-white shadow-soft' : 'text-ink-600 hover:text-ink-900',
            )}
          >
            {t.label}
            <span className="ml-2 text-xs opacity-75">
              {t.id === 'all' ? leaves.length : leaves.filter(l => l.status === t.id).length}
            </span>
          </button>
        ))}
      </div>

      <div className="grid lg:grid-cols-2 gap-4">
        {visible.map(l => {
          const emp = employees.find(e => e.id === l.employeeId);
          const type = leaveTypes.find(t => t.id === l.type);
          const branch = emp ? branches.find(b => b.id === emp.branchId) : null;
          if (!emp || !type) return null;

          return (
            <Card key={l.id} className="p-5 lift">
              <div className="flex items-start justify-between mb-3">
                <div className="flex items-center gap-3">
                  <Avatar name={`${emp.firstName} ${emp.lastName}`} photo={emp.photo} />
                  <div>
                    <div className="font-medium text-ink-900">{emp.firstName} {emp.lastName}</div>
                    <div className="text-xs text-ink-500">{emp.id} · {branch?.short}</div>
                  </div>
                </div>
                <Badge color={
                  l.status === 'approved' ? 'green' :
                  l.status === 'rejected' ? 'red' : 'yellow'
                }>
                  {l.status === 'approved' ? 'อนุมัติแล้ว' :
                   l.status === 'rejected' ? 'ปฏิเสธ' : 'รออนุมัติ'}
                </Badge>
              </div>

              <div className="space-y-2.5 text-sm">
                <div className="flex items-center gap-2">
                  <span
                    className="inline-block w-2 h-2 rounded-full"
                    style={{ background: type.color }}
                  />
                  <span className="font-medium text-ink-900">{type.label}</span>
                  <span className="text-ink-400">·</span>
                  <span className="text-ink-600">{l.days} วัน</span>
                </div>
                <div className="flex items-center gap-2 text-ink-600">
                  <Icon name="calendar" className="w-4 h-4 text-ink-400" />
                  <span className="text-xs">{fmtDate(l.startDate)} → {fmtDate(l.endDate)}</span>
                </div>
                <div className="text-sm text-ink-700 bg-ink-50 rounded-lg p-3">
                  <div className="text-xs text-ink-500 mb-0.5">เหตุผล:</div>
                  {l.reason}
                </div>
              </div>

              {l.status === 'pending' && canApproveLeaveOf(emp) && (
                <div className="flex gap-2 mt-4 pt-4 border-t border-ink-100">
                  <Button variant="success" size="sm" icon="check" className="flex-1" onClick={() => updateStatus(l.id, 'approved')}>
                    อนุมัติ
                  </Button>
                  <Button variant="danger" size="sm" icon="x" className="flex-1" onClick={() => updateStatus(l.id, 'rejected')}>
                    ปฏิเสธ
                  </Button>
                </div>
              )}
            </Card>
          );
        })}
        {visible.length === 0 && (
          <Card className="lg:col-span-2">
            <Empty icon="calendar" title="ไม่มีคำขอลา" desc="ยังไม่มีคำขอที่ตรงกับเงื่อนไข" />
          </Card>
        )}
      </div>

      <LeaveRequestModal
        open={openRequest}
        onClose={() => setOpenRequest(false)}
        onSave={(req) => {
          setLeaves([...leaves, req]);
          addToast('success', 'ส่งคำขอลาเรียบร้อย รอการอนุมัติ');
          if (api.enabled()) {
            api.post('saveLeave', { data: req })
              .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
          }
          setOpenRequest(false);
        }}
        employees={employees}
        leaves={leaves}
        leaveTypes={leaveTypes}
        user={user}
      />
    </div>
  );
};

const LeaveRequestModal = ({ open, onClose, onSave, employees, leaves, leaveTypes, user }) => {
  const [form, setForm] = useState({
    employeeId: '', type: leaveTypes[0]?.id || 'sick',
    startDate: new Date().toISOString().split('T')[0],
    endDate:   new Date().toISOString().split('T')[0],
    period: 'full',          // full / morning / afternoon / hours
    hours: 2,                // ถ้า period = 'hours'
    medicalCert: false,      // มีใบรับรองแพทย์ (สำหรับลาป่วย)
    reason: '',
  });

  useEffect(() => {
    if (open) {
      setForm(f => ({
        ...f,
        employeeId: user.empId || employees[0]?.id || '',
        type: leaveTypes[0]?.id || 'sick',
        period: 'full',
        hours: 2,
      }));
    }
  }, [open]);

  // เมื่อเปลี่ยนช่วงเวลาเป็นครึ่งวัน/ชั่วโมง → ตั้ง endDate = startDate (เพราะลาวันเดียว)
  useEffect(() => {
    if (form.period !== 'full' && form.startDate !== form.endDate) {
      setForm(f => ({ ...f, endDate: f.startDate }));
    }
  }, [form.period]);

  // คำนวณจำนวนวัน (รองรับครึ่งวัน + ชั่วโมง)
  const days = useMemo(() => {
    if (!form.startDate || !form.endDate) return 0;
    const s = new Date(form.startDate); const e = new Date(form.endDate);
    if (isNaN(s) || isNaN(e)) return 0;
    const dayCount = Math.floor((e - s) / (1000 * 60 * 60 * 24)) + 1;
    if (dayCount < 1) return 0;

    // ครึ่งวัน (เช้า/บ่าย) = 0.5
    if (form.period === 'morning' || form.period === 'afternoon') {
      return 0.5;
    }
    // ชั่วโมง: 8 ชั่วโมง = 1 วัน (ปัดเป็นทศนิยม 2 ตำแหน่ง)
    if (form.period === 'hours') {
      const h = Number(form.hours) || 0;
      return Math.round((h / 8) * 100) / 100;
    }
    return dayCount;
  }, [form.startDate, form.endDate, form.period, form.hours]);

  // คำนวณโควต้าของพนักงานที่เลือก ในปีปัจจุบัน
  const currentEmp = employees.find(e => e.id === form.employeeId);
  const year = String(new Date().getFullYear());
  const quota = currentEmp ? calcQuota(currentEmp, leaveTypes, leaves, year) : [];
  const selectedQuota = quota.find(q => q.id === form.type);
  // ติดลบได้ — เตือนถ้าเกิน แต่ยังส่งได้
  const exceedsQuota = selectedQuota && (selectedQuota.remaining - days) < 0;
  const selectedType = leaveTypes.find(t => t.id === form.type);
  // ขาดงาน / ลาไม่รับเงินเดือน — ไม่ต้องเช็คโควต้า (max=0 อยู่แล้ว)
  const skipQuotaCheck = selectedType && (selectedType.id === 'absent' || selectedType.id === 'unpaid' || selectedQuota?.max === 0);

  // early return ต้องอยู่ "หลัง" hooks ทั้งหมด (กฎ React Hooks)
  if (!open) return null;

  const periodLabel = {
    full: 'เต็มวัน',
    morning: 'ครึ่งวันเช้า',
    afternoon: 'ครึ่งวันบ่าย',
    hours: `${form.hours} ชั่วโมง`,
  }[form.period];

  const submit = (e) => {
    e.preventDefault();
    if (days <= 0) return alert('จำนวนวันลาไม่ถูกต้อง');
    if (form.period === 'hours' && (!form.hours || form.hours < 0.5)) {
      return alert('กรุณาระบุจำนวนชั่วโมง (อย่างน้อย 0.5 ชั่วโมง)');
    }
    onSave({
      id: `LV${Date.now()}`,
      employeeId: form.employeeId,
      type: form.type,
      startDate: form.startDate,
      endDate: form.endDate,
      days,
      period: form.period,
      hours: form.period === 'hours' ? Number(form.hours) : null,
      medicalCert: form.type === 'sick' ? !!form.medicalCert : false,
      reason: form.reason + (form.period !== 'full' ? ` [${periodLabel}]` : ''),
      status: 'pending',
      createdAt: new Date().toISOString(),
    });
  };

  return (
    <Modal open={open} onClose={onClose} title="คำขอลา" size="md">
      <form onSubmit={submit} className="space-y-4">
        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">พนักงาน</label>
          <Select value={form.employeeId} onChange={(e) => setForm({ ...form, employeeId: e.target.value })} required>
            {employees.filter(e => user.role !== 'manager' || e.branchId === user.branchId).map(e => (
              <option key={e.id} value={e.id}>{e.firstName} {e.lastName} ({e.id})</option>
            ))}
          </Select>
        </div>

        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">ประเภทการลา</label>
          <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
            {leaveTypes.map(t => {
              const q = quota.find(x => x.id === t.id);
              const isNoQuotaType = t.id === 'absent' || t.id === 'unpaid' || t.max === 0;
              return (
                <button
                  key={t.id} type="button"
                  onClick={() => setForm({ ...form, type: t.id })}
                  className={cls(
                    'p-3 rounded-xl border text-sm font-medium text-left transition-all',
                    form.type === t.id
                      ? 'border-flow-500 bg-flow-50 ring-2 ring-flow-100'
                      : 'border-ink-200 hover:border-ink-300',
                  )}
                >
                  <div className="flex items-center gap-2 mb-0.5">
                    <span className="w-2 h-2 rounded-full" style={{ background: t.color }} />
                    <span className="text-ink-900">{t.label}</span>
                    {q?.customized && !q?.noQuota && (
                      <span className="text-[9px] px-1.5 py-0.5 bg-gold-100 text-gold-700 rounded font-semibold">เฉพาะ</span>
                    )}
                    {q?.noQuota && (
                      <span className="text-[9px] px-1.5 py-0.5 bg-red-100 text-red-700 rounded font-semibold">ไม่มีสิทธิ์</span>
                    )}
                  </div>
                  <div className="text-[11px] text-ink-500">
                    {isNoQuotaType ? (
                      <span className="text-ink-500">ไม่นับโควต้า</span>
                    ) : q?.noQuota ? (
                      <span className="text-red-600">ลาแล้วติดลบ ({q.used} วัน)</span>
                    ) : (
                      <>คงเหลือ <strong className={q?.remaining < 0 ? 'text-red-500' : q?.remaining === 0 ? 'text-gold-600' : 'text-emerald-600'}>{q?.remaining ?? t.max}</strong>/{q?.max ?? t.max} วัน</>
                    )}
                  </div>
                </button>
              );
            })}
          </div>
        </div>

        {/* แสดงโควต้าของประเภทที่เลือก */}
        {selectedQuota && currentEmp && !skipQuotaCheck && (
          <div className={cls(
            'border rounded-xl p-3',
            selectedQuota.remaining < 0 ? 'bg-red-50 border-red-200' : 'bg-ink-50 border-ink-100'
          )}>
            <div className="flex items-center justify-between text-xs text-ink-600 mb-1.5">
              <span>โควต้าปี {year}: <strong className="text-ink-900">{selectedQuota.label}</strong></span>
              <span>
                ใช้ไป {selectedQuota.used}/{selectedQuota.max} วัน
                {selectedQuota.remaining < 0 && (
                  <span className="ml-2 text-red-600 font-semibold">เกิน {Math.abs(selectedQuota.remaining)} วัน</span>
                )}
              </span>
            </div>
            <div className="w-full h-2 bg-ink-200 rounded-full overflow-hidden">
              <div
                className={cls('h-full transition-all', selectedQuota.remaining < 0 && 'bg-red-500')}
                style={selectedQuota.remaining >= 0 ? {
                  width: `${Math.min(100, (selectedQuota.used / Math.max(1, selectedQuota.max)) * 100)}%`,
                  background: selectedQuota.color,
                } : { width: '100%' }}
              />
            </div>
          </div>
        )}

        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">วันที่เริ่ม</label>
            <Input type="date" value={form.startDate} onChange={(e) => setForm({ ...form, startDate: e.target.value })} required />
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">วันที่สิ้นสุด</label>
            <Input
              type="date"
              value={form.endDate}
              onChange={(e) => setForm({ ...form, endDate: e.target.value })}
              disabled={form.period !== 'full'}
              required
            />
          </div>
        </div>

        {/* ช่วงเวลา */}
        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">ช่วงเวลา</label>
          <div className="grid grid-cols-4 gap-2">
            {[
              { id: 'full',      label: 'เต็มวัน',   sub: '1 วัน',    icon: 'calendar' },
              { id: 'morning',   label: 'ครึ่งวันเช้า',  sub: '0.5 วัน', icon: 'sparkle' },
              { id: 'afternoon', label: 'ครึ่งวันบ่าย',  sub: '0.5 วัน', icon: 'sparkle' },
              { id: 'hours',     label: 'รายชั่วโมง', sub: 'กำหนดเอง', icon: 'refresh' },
            ].map(p => (
              <button
                key={p.id} type="button"
                onClick={() => setForm({ ...form, period: p.id })}
                className={cls(
                  'p-2.5 rounded-xl border text-center transition-all',
                  form.period === p.id
                    ? 'border-flow-500 bg-flow-50 ring-2 ring-flow-100'
                    : 'border-ink-200 hover:border-ink-300',
                )}
              >
                <div className="text-xs font-medium text-ink-900">{p.label}</div>
                <div className="text-[10px] text-ink-500 mt-0.5">{p.sub}</div>
              </button>
            ))}
          </div>
        </div>

        {/* ระบุชั่วโมง (เฉพาะกรณี period=hours) */}
        {form.period === 'hours' && (
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">จำนวนชั่วโมง</label>
            <div className="flex items-center gap-2">
              <Input
                type="number"
                min={0.5} max={8} step={0.5}
                value={form.hours}
                onChange={(e) => setForm({ ...form, hours: Number(e.target.value) })}
                required
                className="flex-1"
              />
              <span className="text-sm text-ink-500">ชั่วโมง</span>
              <span className="text-xs text-ink-400 ml-2">(8 ชม. = 1 วัน)</span>
            </div>
            <div className="flex gap-1 mt-2">
              {[1, 2, 3, 4].map(h => (
                <button key={h} type="button" onClick={() => setForm({ ...form, hours: h })}
                  className="text-xs px-2 py-1 rounded-lg border border-ink-200 hover:border-flow-400 hover:bg-flow-50">
                  {h} ชม.
                </button>
              ))}
            </div>
          </div>
        )}

        {/* Summary */}
        {days > 0 && (
          <div className={cls(
            'border rounded-xl p-3 flex items-center gap-2 text-sm',
            exceedsQuota && !skipQuotaCheck
              ? 'bg-red-50 border-red-200'
              : 'bg-flow-50 border-flow-200',
          )}>
            <Icon name="info" className={cls('w-4 h-4 shrink-0', exceedsQuota && !skipQuotaCheck ? 'text-red-600' : 'text-flow-700')} />
            <span className="text-ink-700">
              ลา <strong className="text-flow-700">{periodLabel}</strong>
              {' '}รวม <strong className="text-flow-700">{days} วัน</strong>
              {selectedQuota && !skipQuotaCheck && (
                <> · คงเหลือหลังลา{' '}
                  <strong className={(selectedQuota.remaining - days) < 0 ? 'text-red-600' : 'text-emerald-600'}>
                    {(selectedQuota.remaining - days).toFixed(selectedQuota.remaining - days % 1 === 0 ? 0 : 2)}
                  </strong> วัน
                  {(selectedQuota.remaining - days) < 0 && <span className="text-red-600 font-semibold"> (ติดลบ)</span>}
                </>
              )}
              {skipQuotaCheck && (
                <span className="text-ink-500"> (ไม่นับโควต้า)</span>
              )}
            </span>
          </div>
        )}

        {/* ใบรับรองแพทย์ — เฉพาะลาป่วย */}
        {form.type === 'sick' && (
          <button
            type="button"
            onClick={() => setForm({ ...form, medicalCert: !form.medicalCert })}
            className={cls(
              'w-full flex items-center justify-between p-3 rounded-xl border transition-colors',
              form.medicalCert ? 'bg-emerald-50 border-emerald-200' : 'bg-ink-50 border-ink-200 hover:border-ink-300',
            )}
          >
            <div className="flex items-center gap-2">
              <div className={cls('w-8 h-8 rounded-lg flex items-center justify-center',
                form.medicalCert ? 'bg-emerald-200 text-emerald-700' : 'bg-ink-200 text-ink-500')}>
                <Icon name="check" className="w-4 h-4" />
              </div>
              <div className="text-left">
                <div className="font-medium text-ink-900 text-sm">มีใบรับรองแพทย์</div>
                <div className="text-xs text-ink-600">พนักงานรายเดือนที่มีใบรับรองแพทย์จะไม่ถูกหักเงิน</div>
              </div>
            </div>
            <div className={cls('relative w-11 h-6 rounded-full transition-colors shrink-0',
              form.medicalCert ? 'bg-emerald-500' : 'bg-ink-300')}>
              <div className={cls('absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform',
                form.medicalCert ? 'translate-x-[22px]' : 'translate-x-0.5')} />
            </div>
          </button>
        )}

        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">เหตุผลการลา</label>
          <Textarea
            rows={3}
            placeholder="ระบุเหตุผลของการลาอย่างชัดเจน..."
            value={form.reason}
            onChange={(e) => setForm({ ...form, reason: e.target.value })}
            required
          />
        </div>

        <div className="flex justify-end gap-2 pt-4 border-t border-ink-100">
          <Button type="button" variant="secondary" onClick={onClose}>ยกเลิก</Button>
          <Button type="submit" icon="check">
            {exceedsQuota && !skipQuotaCheck ? 'ส่งคำขอ (เกินโควต้า)' : 'ส่งคำขอ'}
          </Button>
        </div>
      </form>
    </Modal>
  );
};

/* =============================================================
   ASSETS — ทรัพย์สินบริษัท
   ============================================================= */

// สร้างรหัสทรัพย์สินถัดไป: FFC-{ภาค}-{หมวด}-{รันนิ่ง4หลัก}
const genAssetCode = (branchId, catCode, existingAssets) => {
  const brCode = ASSET_BRANCH_CODE[branchId] || branchId;
  const prefix = `FFC-${brCode}-${catCode}-`;
  // หาเลขรันนิ่งสูงสุดที่มีอยู่
  let maxNum = 0;
  existingAssets.forEach(a => {
    if (a.code && a.code.startsWith(prefix)) {
      const num = parseInt(a.code.slice(prefix.length), 10);
      if (!isNaN(num) && num > maxNum) maxNum = num;
    }
  });
  return prefix + String(maxNum + 1).padStart(4, '0');
};

const AssetsPage = () => {
  const { assets, setAssets, branches, employees, departments, user, addToast } = useApp();
  const [search, setSearch] = useState('');
  const [filterBranch, setFilterBranch] = useState('all');
  const [filterCat, setFilterCat] = useState('all');
  const [filterStatus, setFilterStatus] = useState('all');
  const [openForm, setOpenForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [viewing, setViewing] = useState(null);
  const [showImport, setShowImport] = useState(false);

  const canEdit = user.role === 'admin' || user.role === 'hr';

  const filtered = useMemo(() => {
    return assets.filter(a => {
      if (user.role === 'manager' && a.branchId !== user.branchId) return false;
      if (filterBranch !== 'all' && a.branchId !== filterBranch) return false;
      if (filterCat !== 'all' && a.category !== filterCat) return false;
      if (filterStatus !== 'all' && a.status !== filterStatus) return false;
      if (search) {
        const q = search.toLowerCase();
        return [a.code, a.name, a.brand, a.serialNo, a.owner]
          .some(v => String(v || '').toLowerCase().includes(q));
      }
      return true;
    });
  }, [assets, filterBranch, filterCat, filterStatus, search, user]);

  // สถิติ
  const stats = useMemo(() => {
    const scoped = assets.filter(a => user.role !== 'manager' || a.branchId === user.branchId);
    const totalValue = scoped.reduce((s, a) => s + (Number(a.purchasePrice) || 0), 0);
    return {
      total: scoped.length,
      working: scoped.filter(a => a.status === 'ใช้งานได้').length,
      broken: scoped.filter(a => a.status === 'ชำรุด/รอซ่อม').length,
      totalValue,
    };
  }, [assets, user]);

  const deleteAsset = (id) => {
    if (!confirm('ยืนยันการลบทรัพย์สินรายการนี้?')) return;
    const updated = assets.filter(a => a.id !== id);
    setAssets(updated);
    addToast('success', 'ลบทรัพย์สินเรียบร้อย');
    if (api.enabled()) {
      api.post('deleteAsset', { id }).catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
  };

  const saveAsset = (asset) => {
    let updated;
    if (editing) {
      updated = assets.map(a => a.id === asset.id ? asset : a);
      addToast('success', 'บันทึกข้อมูลทรัพย์สินเรียบร้อย');
    } else {
      updated = [...assets, asset];
      addToast('success', 'เพิ่มทรัพย์สินเรียบร้อย');
    }
    setAssets(updated);
    if (api.enabled()) {
      api.post('saveAsset', { data: asset }).catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
    setOpenForm(false);
    setEditing(null);
  };

  const fmtBaht = (n) => Number(n || 0).toLocaleString('th-TH', { maximumFractionDigits: 0 });

  return (
    <div className="p-8 space-y-6 animate-fade-up">
      <Topbar
        title="ทรัพย์สินบริษัท"
        subtitle={`ทั้งหมด ${filtered.length} รายการ`}
        action={canEdit && (
          <div className="flex gap-2">
            <Button variant="outline" icon="upload" onClick={() => setShowImport(true)}>นำเข้า Excel</Button>
            <Button icon="plus" onClick={() => { setEditing(null); setOpenForm(true); }}>เพิ่มทรัพย์สิน</Button>
          </div>
        )}
      />

      {/* Stat cards */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        {[
          { label: 'ทรัพย์สินทั้งหมด', value: stats.total,    color: 'flow',  icon: 'box',   suffix: 'รายการ' },
          { label: 'ใช้งานได้',        value: stats.working,  color: 'green', icon: 'check', suffix: 'รายการ' },
          { label: 'ชำรุด/รอซ่อม',     value: stats.broken,   color: 'red',   icon: 'wrench',suffix: 'รายการ' },
          { label: 'มูลค่าสินค้ารวม',  value: fmtBaht(stats.totalValue),  color: 'gold', icon: 'tag', suffix: 'บาท' },
        ].map(s => (

          const map = new Map(assets.map(a => [a.id, a]));

/* ===== IMPORT ASSETS MODAL ===== */
const ImportAssetsModal = ({ open, onClose, existingAssets, branches, onImport }) => {
  const fileRef = useRef(null);
  const [preview, setPreview] = useState(null);
  const [errors, setErrors] = useState([]);

  // map ชื่อภาค → branchId
  const regionMap = { 'ภาคกลาง': 'LLK', 'ภาคอีสาน': 'ISN', 'ภาคเหนือ': 'NRT', 'กลาง': 'LLK', 'อีสาน': 'ISN', 'เหนือ': 'NRT' };

  const reset = () => { setPreview(null); setErrors([]); if (fileRef.current) fileRef.current.value = ''; };
  const close = () => { reset(); onClose(); };

  const handleFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type: 'binary', cellDates: true });
        const assets = [];
        const errs = [];

        // วนทุกชีตที่เป็นภาค
        wb.SheetNames.forEach(sheetName => {
          const branchId = regionMap[sheetName.trim()];
          if (!branchId) return; // ข้ามชีตที่ไม่ใช่ภาค (สรุปรวม, ประวัติซ่อม, การตั้งรหัส)

          const ws = wb.Sheets[sheetName];
          const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false });

          // หาแถว header (มีคำว่า "รหัสทรัพย์สิน")
          let headerIdx = -1;
          for (let i = 0; i < Math.min(rows.length, 15); i++) {
            if (rows[i].some(c => String(c).includes('รหัสทรัพย์สิน'))) { headerIdx = i; break; }
          }
          if (headerIdx === -1) return;

          const headers = rows[headerIdx].map(h => String(h).trim());
          const col = (name) => headers.findIndex(h => h.includes(name));
          const idxCode = col('รหัสทรัพย์สิน');
          const idxName = col('ชื่อทรัพย์สิน');
          const idxType = col('ประเภท');
          const idxBrand = col('ยี่ห้อ');
          const idxSerial = col('Serial');
          const idxDept = col('แผนก');
          const idxOwner = col('ผู้ดูแล');
          const idxBuyDate = col('วันที่ซื้อ');
          const idxPrice = col('ราคาซื้อ');
          const idxLife = col('อายุการใช้งาน');
          const idxCond = col('สภาพ');
          const idxStatus = col('สถานะ');
          const idxNote = col('หมายเหตุ');

          let lastCode = '';
          let subCounter = 0;  // นับรายการย่อยใต้รหัสเดียวกัน (-A, -B, ...)
          for (let i = headerIdx + 1; i < rows.length; i++) {
            const r = rows[i];
            const name = String(r[idxName] || '').trim();
            if (!name) continue; // ข้ามแถวว่าง

            // ถ้ามีรหัส ใช้รหัสนั้น ถ้าไม่มี (เป็นรายการย่อยใต้รหัสเดียวกัน) สืบทอดรหัสล่าสุด
            let code = String(r[idxCode] || '').trim();
            let hasOwnCode = !!code;
            if (code) { lastCode = code; subCounter = 0; }  // เจอรหัสใหม่ → reset ตัวนับย่อย

            const toDate = (v) => {
              if (v instanceof Date) return v.toISOString().split('T')[0];
              if (typeof v === 'string' && v.trim()) {
                const d = new Date(v); if (!isNaN(d)) return d.toISOString().split('T')[0];
              }
              return '';
            };

            // แปลงตัวเลข — ลบ comma และอักษรที่ไม่ใช่ตัวเลขออกก่อน (เช่น "15,990.00" → 15990)
            const parseNum = (v) => {
              if (v == null || v === '') return 0;
              if (typeof v === 'number') return v;
              const cleaned = String(v).replace(/[^0-9.-]/g, '');
              const n = parseFloat(cleaned);
              return isNaN(n) ? 0 : n;
            };

            // map ประเภท → category code: ดึงจากรหัส (ของตัวเอง หรือ รหัสล่าสุดที่สืบทอด)
            let category = 'OF-ACC';
            const codeForCat = code || lastCode;
            if (codeForCat) {
              const m = codeForCat.match(/FFC-[A-Z]+-([A-Z]+-[A-Z]+)-/);
              if (m) category = m[1];
            }

            // รหัสที่แสดง: ถ้ามีรหัสของตัวเอง ใช้เลย / ถ้าเป็นรายการย่อย ใส่ -A, -B ต่อท้าย
            let displayCode;
            if (hasOwnCode) {
              displayCode = code;
            } else if (lastCode) {
              subCounter++;
              displayCode = `${lastCode}-${String.fromCharCode(64 + subCounter)}`; // -A, -B, -C
            } else {
              displayCode = '';  // ไม่มีรหัสเลย — จะสร้างทีหลังได้
            }

            assets.push({
              id: `AST_IMP_${branchId}_${i}`,
              code: displayCode,
              name,
              category,
              branchId,
              brand: String(r[idxBrand] || '').trim(),
              serialNo: String(r[idxSerial] || '').trim(),
              department: String(r[idxDept] || '').trim(),
              owner: String(r[idxOwner] || '').trim(),
              purchaseDate: toDate(r[idxBuyDate]),
              purchasePrice: parseNum(r[idxPrice]),

              currentValue: null,
              condition: String(r[idxCond] || 'ดี').trim(),
              status: String(r[idxStatus] || 'ใช้งานได้').trim(),
              lastCheck: '',
              note: String(r[idxNote] || '').trim(),
            });
          }
        });

    reader.readAsBinaryString(file);

/* =============================================================
   PAYROLL — เงินเดือน + สลิปเงินเดือน
   ============================================================= */
const calcPayroll = (p) => {
  const earnings = (Number(p.baseSalary)||0) + (Number(p.overtime)||0) + (Number(p.transport)||0) + (Number(p.bonus)||0) + (Number(p.otherEarn)||0);
  const deductions = (Number(p.sso)||0) + (Number(p.tax)||0) + (Number(p.absenceDeduct)||0) + (Number(p.gyos)||0) + (Number(p.otherDeduct)||0);
  return { earnings, deductions, net: earnings - deductions };
};

// คำนวณเงินเดือน + การหักอัตโนมัติ จากข้อมูลพนักงาน + การเข้างาน + การลา ของเดือนนั้น
// period = 'YYYY-MM'
const computeAutoPayroll = (emp, range, attendance, leaves, leaveTypes, settings) => {
  // range = { from: 'YYYY-MM-DD', to: 'YYYY-MM-DD' }  หรือ string 'YYYY-MM' (รองรับแบบเก่า)
  let from, to;
  if (typeof range === 'string') {
    // แบบเก่า: ทั้งเดือน
    from = range + '-01';
    const [y, m] = range.split('-').map(Number);
    to = `${range}-${String(new Date(y, m, 0).getDate()).padStart(2, '0')}`;
  } else {
    from = range.from; to = range.to;
  }

  const salaryType = emp.salaryType || 'monthly';
  const base = Number(emp.baseSalary) || 0;
  const special = Number(emp.specialAllowance) || 0;

  // นับจำนวนวันในรอบ (ไม่รวมอาทิตย์) เพื่อ prorate เงินเดือนรายเดือน
  const countWorkdays = (f, t) => {
    let n = 0;
    const d = new Date(f + 'T00:00:00'), end = new Date(t + 'T00:00:00');
    while (d <= end) { if (d.getDay() !== 0) n++; d.setDate(d.getDate() + 1); }
    return n;
  };
  const rangeDays = countWorkdays(from, to);

  // เงินเดือน/วัน: รายเดือน = ฐาน/30, รายวัน = ฐาน (ต่อวันอยู่แล้ว)
  const perDay = salaryType === 'daily' ? base : base / 30;
  const perHour = perDay / 8;

  // เช็ควันอาทิตย์ (getDay()===0) — วันทำงานคือ จันทร์-เสาร์
  const isSunday = (ymd) => {
    const d = new Date(ymd + 'T00:00:00');
    return !isNaN(d) && d.getDay() === 0;
  };
  const inRange = (ymd) => ymd >= from && ymd <= to;

  // กรองข้อมูลในช่วงวันที่ (ตัดวันอาทิตย์ออก — ไม่นับวันทำงาน/ไม่หัก)
  const monthAtt = attendance.filter(a => a.employeeId === emp.id && inRange(toYMD(a.date)) && !isSunday(toYMD(a.date)));
  const monthLeaves = leaves.filter(l => l.employeeId === emp.id && l.status === 'approved' && inRange(toYMD(l.startDate)) && !isSunday(toYMD(l.startDate)));

  // ===== รายได้พื้นฐาน =====
  let baseSalary, workedDays = 0;
  if (salaryType === 'daily') {
    // รายวัน: นับวันที่มาทำงานจริง (ontime/late/wfh)
    workedDays = monthAtt.filter(a => ['ontime','late','wfh','partial','nocheckout'].includes(a.status)).length;
    baseSalary = perDay * workedDays;
  } else {
    // รายเดือน: ถ้ารอบเต็มเดือน = ฐานเต็ม, ถ้ารอบสั้นกว่า = prorate ตามจำนวนวัน
    baseSalary = rangeDays >= 26 ? base : perDay * rangeDays;
  }

  // ===== หักมาสาย =====
  let lateFine = 0;
  const lateDetails = [];
  monthAtt.forEach(a => {
    if (a.status === 'late') {
      const lm = lateMinutesOf(a.checkIn, settings);
      const fine = calcLateFine(lm);
      if (fine > 0) { lateFine += fine; lateDetails.push({ date: toYMD(a.date), minutes: lm, fine }); }
    }
  });

  // ===== หักขาดงาน (จากบันทึกการเข้างาน status='absent') =====
  // วันที่ขาดงานจริงจากการสแกนนิ้ว (ไม่นับวันอาทิตย์ — กรองไว้แล้วตอนสร้าง monthAtt)
  const absentAttDays = monthAtt.filter(a => a.status === 'absent').length;
  const absentAttFine = perDay * absentAttDays;

  // ===== หักการลา =====
  let leaveDeduct = 0;
  const leaveDetails = [];
  // คำนวณโควต้าที่ใช้ไป (เพื่อเช็คว่าเกินหรือไม่)
  const year = from.slice(0, 4);
  const quota = calcQuota(emp, leaveTypes, leaves, year);
  const quotaMap = {};
  quota.forEach(q => { quotaMap[q.id] = q; });

  // จัดกลุ่มการลาตามประเภท เพื่อเช็คเกินโควต้าแบบสะสม
  monthLeaves.forEach(l => {
    const days = Number(l.days) || 0;
    const type = l.type;
    let deduct = 0, reason = '';

    if (type === 'wfh' || type === 'offsite') {
      // WFH / นอกสถานที่ — ไม่หัก
      reason = 'ไม่หัก (ทำงานนอกสถานที่)';
    } else if (type === 'sick') {
      // ลาป่วย
      if (salaryType === 'daily') {
        deduct = perDay * days; reason = 'รายวัน หักเต็มวัน';
      } else {
        // รายเดือน: มีใบรับรองแพทย์ = ไม่หัก, ไม่มี = หักเต็มวัน
        if (l.medicalCert) { reason = 'มีใบรับรองแพทย์ — ไม่หัก'; }
        else { deduct = perDay * days; reason = 'ไม่มีใบรับรองแพทย์ — หักเต็มวัน'; }
      }
    } else if (type === 'personal' || type === 'vacation') {
      // ลากิจ / ลาพักร้อน — ไม่หักถ้าอยู่ในโควต้า, เกินโควต้าหักเต็มวัน
      const q = quotaMap[type];
      if (q && q.remaining < 0) {
        // เกินโควต้า — หักเฉพาะส่วนที่เกิน (สูงสุดเท่ากับวันลานี้)
        const over = Math.min(days, Math.abs(q.remaining));
        deduct = perDay * over;
        reason = over >= days ? 'เกินโควต้า — หักเต็มวัน' : `เกินโควต้า ${over} วัน`;
      } else {
        reason = 'อยู่ในโควต้า — ไม่หัก';
      }
    } else if (type === 'unpaid') {
      // ลาไม่รับเงินเดือน: รายชั่วโมง = perHour × ชม., รายวัน = perDay × วัน
      if (l.period === 'hours' && l.hours) {
        deduct = perHour * Number(l.hours); reason = `รายชั่วโมง ${l.hours} ชม.`;
      } else {
        deduct = perDay * days; reason = 'หักเต็มวัน';
      }
    } else if (type === 'absent') {
      // ขาดงาน — หักเต็มวัน
      deduct = perDay * days; reason = 'ขาดงาน — หักเต็มวัน';
    }

    if (deduct > 0 || reason) {
      // เพิ่มข้อมูลช่วงลา (ครึ่งวัน/ชั่วโมง) ในป้ายกำกับ
      let periodNote = '';
      if (l.period === 'morning') periodNote = ' (ครึ่งเช้า)';
      else if (l.period === 'afternoon') periodNote = ' (ครึ่งบ่าย)';
      else if (l.period === 'hours' && l.hours) periodNote = ` (${l.hours} ชม.)`;
      leaveDetails.push({
        type, label: (leaveTypes.find(t => t.id===type)?.label || type) + periodNote,
        days, deduct, reason, period: l.period || 'full', hours: l.hours || null,
      });
    }
    leaveDeduct += deduct;
  });

  // เพิ่มขาดงานจากการสแกนนิ้ว (status='absent') เข้าในรายการหัก
  if (absentAttDays > 0) {
    leaveDetails.push({ type: 'absent', label: 'ขาดงาน', days: absentAttDays, deduct: absentAttFine, reason: 'ขาดงาน (จากบันทึกเข้างาน) — หักเต็มวัน' });
    leaveDeduct += absentAttFine;
  }

  return {
    salaryType, perDay, perHour, workedDays,
    baseSalary: Math.round(baseSalary * 100) / 100,
    special,
    lateFine: Math.round(lateFine * 100) / 100,
    lateDetails,
    leaveDeduct: Math.round(leaveDeduct * 100) / 100,
    leaveDetails,
    absentDays: absentAttDays,
  };
};

const PayrollPage = () => {
  const { payroll, setPayroll, employees, branches, attendance, leaves, leaveTypes, settings, user, addToast } = useApp();
  const [month, setMonth] = useState(new Date().toISOString().slice(0, 7));
  const [search, setSearch] = useState('');
  const [openForm, setOpenForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [slip, setSlip] = useState(null);
  const [selected, setSelected] = useState([]);   // id ที่เลือกพิมพ์รวม

  const myEmp = employees.find(e => e.id === user.empId);
  const hasPayrollAccess = user.role === 'admin' || user.role === 'hr' || !!myEmp?.canPayroll;
  const canEdit = hasPayrollAccess;

  // payroll ของเดือนที่เลือก (กรองด้วยเดือนของรอบ — รองรับทั้ง period เดิม และ periodFrom ใหม่)
  const monthRecords = useMemo(() => {
    return payroll.filter(p => {
      const pMonth = p.periodFrom ? String(p.periodFrom).slice(0, 7) : p.period;
      if (pMonth !== month) return false;
      if (user.role === 'manager') {
        const emp = employees.find(e => e.id === p.employeeId);
        if (!emp || emp.branchId !== user.branchId) return false;
      }
      if (search) {
        const emp = employees.find(e => e.id === p.employeeId);
        const q = search.toLowerCase();
        return emp && (`${emp.firstName} ${emp.lastName}`.toLowerCase().includes(q) || emp.id.toLowerCase().includes(q));
      }
      return true;
    });
  }, [payroll, month, search, employees, user]);

  const stats = useMemo(() => {
    let totalNet = 0, totalEarn = 0, totalDeduct = 0;
    monthRecords.forEach(p => {
      const c = calcPayroll(p);
      totalNet += c.net; totalEarn += c.earnings; totalDeduct += c.deductions;
    });
    return { count: monthRecords.length, totalNet, totalEarn, totalDeduct };
  }, [monthRecords]);

  const savePayroll = (p) => {
    let updated;
    if (editing) {
      updated = payroll.map(x => x.id === p.id ? p : x);
      addToast('success', 'บันทึกข้อมูลเงินเดือนเรียบร้อย');
    } else {
      updated = [...payroll, p];
      addToast('success', 'เพิ่มข้อมูลเงินเดือนเรียบร้อย');
    }
    setPayroll(updated);
    if (api.enabled()) {
      api.post('savePayroll', { data: p }).catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
    setOpenForm(false);
    setEditing(null);
  };

  const deletePayroll = (id) => {
    if (!confirm('ยืนยันการลบข้อมูลเงินเดือนรายการนี้?')) return;
    setPayroll(payroll.filter(p => p.id !== id));
    addToast('success', 'ลบเรียบร้อย');
    if (api.enabled()) api.post('deletePayroll', { id }).catch(() => {});
  };

  // เลือก/ยกเลิกเลือกพิมพ์
  const toggleSelect = (id) => setSelected(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  const allSelected = monthRecords.length > 0 && selected.length === monthRecords.length;
  const toggleSelectAll = () => setSelected(allSelected ? [] : monthRecords.map(p => p.id));
  const printSelected = () => {
    const recs = monthRecords.filter(p => selected.includes(p.id));
    if (recs.length === 0) { addToast('error', 'กรุณาเลือกพนักงานที่ต้องการพิมพ์'); return; }
    printManySlips(recs, employees, branches, settings);
  };

  const [my, mm] = month.split('-');
  const monthLabel = `${THAI_MONTHS[parseInt(mm,10)-1]} ${parseInt(my,10)+543}`;

  return (
    <div className="p-8 space-y-6 animate-fade-up">
      <Topbar
        title="เงินเดือน"
        subtitle={`รอบ ${monthLabel} · ${stats.count} รายการ`}
        action={canEdit && (
          <Button icon="plus" onClick={() => { setEditing(null); setOpenForm(true); }}>เพิ่มเงินเดือน</Button>
        )}
      />

      {/* Stat cards */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        {[
          { label: 'จำนวนพนักงาน', value: stats.count, suffix: 'คน', color: 'flow', icon: 'users' },
          { label: 'รวมรายได้', value: fmtMoney(stats.totalEarn), suffix: 'บาท', color: 'green', icon: 'tag' },
          { label: 'รวมรายการหัก', value: fmtMoney(stats.totalDeduct), suffix: 'บาท', color: 'red', icon: 'x' },
          { label: 'รวมจ่ายสุทธิ', value: fmtMoney(stats.totalNet), suffix: 'บาท', color: 'gold', icon: 'check' },
        ].map(s => (
          <Card key={s.label} className="p-5 lift">
            <div className="flex items-center gap-3">

                <div className="font-display text-xl font-bold text-ink-900 truncate">{s.value}</div>
                <div className="text-[10px] text-ink-400">{s.suffix}</div>
              </div>
            </div>

        ))}

        <div className="grid md:grid-cols-3 gap-3">
          <div>
            <label className="block text-xs text-ink-500 mb-1">รอบเดือน</label>
            <Input type="month" value={month} onChange={(e) => setMonth(e.target.value)} />
          </div>
          <div className="md:col-span-2">
            <label className="block text-xs text-ink-500 mb-1">ค้นหา</label>

          </div>
        </div>
      </Card>

      {/* Table */}
      <Card className="overflow-hidden">
        {monthRecords.length === 0 ? (
          <Empty icon="tag" title="ยังไม่มีข้อมูลเงินเดือน" desc={`รอบ ${monthLabel} — คลิก "เพิ่มเงินเดือน" เพื่อเริ่มต้น`} />
        ) : (
          <div className="overflow-x-auto">
