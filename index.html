            <div className="font-display" style={{ fontSize: 24, fontWeight: 700, color: '#1E3A8A' }}>{fmtMoney(c.net)}</div>
          </div>

          {/* Signature */}
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', padding: '8px 24px 6px', gap: 24, borderTop: '1px solid #E2E8F0' }}>
            {/* พนักงาน */}
            <div style={{ textAlign: 'center' }}>
              <div style={{ height: 34, marginBottom: 2 }} />
              <div style={{ borderBottom: '1px solid #94A3B8', marginBottom: 3 }} />
              <div style={{ fontSize: 10, color: '#1E293B', fontWeight: 600 }}>ลงชื่อพนักงาน</div>
              <div style={{ fontSize: 10, color: '#1E293B' }}>{emp.firstName} {emp.lastName}</div>
              <div style={{ fontSize: 9, color: '#64748B' }}>{emp.position || ''}</div>
            </div>
            {/* ผู้จ่ายเงิน — มีลายเซ็น */}
            <div style={{ textAlign: 'center' }}>
              <div style={{ height: 34, marginBottom: 2, display: 'flex', alignItems: 'flex-end', justifyContent: 'center' }}>
                <img src={SIGNATURE_ACCOUNTING} alt="ลายเซ็น" style={{ maxHeight: 34, maxWidth: 130 }} />
              </div>
              <div style={{ borderBottom: '1px solid #94A3B8', marginBottom: 3 }} />
              <div style={{ fontSize: 10, color: '#1E293B', fontWeight: 600 }}>ลงชื่อผู้จ่ายเงิน</div>
              <div style={{ fontSize: 10, color: '#1E293B' }}>นางสาวเสาวภา โครตแสนลี</div>
              <div style={{ fontSize: 9, color: '#64748B' }}>ฝ่ายบัญชี</div>
            </div>
          </div>
        </div>
        <div style={{ textAlign: 'center', fontSize: 9, color: '#94A3B8', marginTop: 6 }}>
          วันที่จ่าย: {payDateLabel} · สาขา: {branch?.name || '-'}
        </div>
      </div>

      <div className="flex justify-end gap-2 pt-4 mt-4 border-t border-ink-100">
        <Button variant="secondary" onClick={onClose}>ปิด</Button>
        <Button icon="download" onClick={doPrint}>พิมพ์ / บันทึก PDF</Button>
      </div>
    </Modal>
  );
};

/* =============================================================
   KPI — ประเมินผลงานพนักงาน
   ============================================================= */
// แปลงคะแนน % เป็นเกรด
/* ═══════════════════════════════════════════════════════════
   KPI MODULE — ระบบประเมิน KPI พนักงาน (แบบ A: กรอก % ที่ทำได้)
   โครงสร้าง: สาขา → ตำแหน่ง(template) → หมวด → KPI ย่อย
═══════════════════════════════════════════════════════════ */

// เกรด (ทุกตำแหน่งใช้เกณฑ์เดียวกัน)
const kpiGrade = (pct) => {
  if (pct >= 90) return { grade: 'A', label: 'ดีเยี่ยม', color: '#10B981' };
  if (pct >= 80) return { grade: 'B', label: 'ดี', color: '#06B6D4' };
  if (pct >= 70) return { grade: 'C', label: 'พอใช้', color: '#F59E0B' };
  if (pct >= 60) return { grade: 'D', label: 'ต้องปรับปรุง', color: '#F97316' };
  return { grade: 'F', label: 'ไม่ผ่าน', color: '#EF4444' };
};

// ── ประเภทสาขาตามการผลิต ──
// production = ผลิต+คลัง+ขาย (ครบ 14 ตำแหน่ง) · nonProduction = คลัง+ขาย (ซ่อนฝ่ายผลิต)
const KPI_BRANCH_TYPES = {
  production: ['โกสุมพิสัย', 'ลำลูกกา', 'LLK', 'ISN'],   // ใช้ครบทุกตำแหน่ง
  nonProduction: ['ลำปาง', 'NRT'],                       // ไม่มีฝ่ายผลิต
};
const kpiBranchType = (branchName, branchId) => {
  const n = String(branchName || '');
  if (KPI_BRANCH_TYPES.nonProduction.some(x => n.includes(x) || branchId === x)) return 'nonProduction';
  return 'production';
};

// ตำแหน่งฝ่ายผลิต (ซ่อนในสาขาที่ไม่ผลิต)
const KPI_PRODUCTION_POSITIONS = [
  'หัวหน้าฝ่ายเย็บ', 'พนักงานเย็บ',
  'หัวหน้าโต๊ะตัด', 'พนักงานโต๊ะตัด',
  'หัวหน้า QC', 'พนักงาน QC',
];

// flatten template → รายการ KPI ย่อยทั้งหมด (ข้ามหมวด)
const flattenKpi = (categories) => {
  const items = [];
  (categories || []).forEach(cat => {
    (cat.items || []).forEach(it => items.push({ ...it, catId: cat.id, catName: cat.name, catWeight: cat.weight }));
  });
  return items;
};

// แสดงเป้าหมายเป็นข้อความ (รองรับ operator ≥ ≤ = %)
const fmtKpiTarget = (it) => {
  if (!it) return '';
  if (it.target) return String(it.target);   // เป้าหมายแบบข้อความอิสระ เช่น "≤ 0.5%", "≥ 80%"
  if (it.targetType === 'count') {
    const unit = it.targetUnit === 'week' ? 'สัปดาห์' : 'เดือน';
    return `${it.targetValue} ครั้ง/${unit}`;
  }
  if (it.targetType === 'percent') return `≥ ${it.targetValue}%`;
  return '';
};

// คำนวณคะแนนรวม (แบบ A): คะแนนข้อ = (% ที่ทำได้ ÷ 100) × น้ำหนัก, รวม = ผลรวม
const calcKpiScore = (record, fallbackCategories) => {
  const cats = (record.categories && record.categories.length > 0) ? record.categories : (fallbackCategories || []);
  const items = flattenKpi(cats);
  let totalWeight = 0, weightedScore = 0;
  items.forEach(it => {
    const pctDone = Number(record.scores?.[it.id]) || 0;   // % ที่ทำได้ 0-100
    const weight = Number(it.weight) || 0;
    totalWeight += weight;
    weightedScore += (pctDone / 100) * weight;             // คะแนนถ่วงน้ำหนัก
  });
  // คะแนนรวม = ผลรวมคะแนนถ่วงน้ำหนัก (เต็ม = totalWeight ซึ่งควร 100)
  const pct = totalWeight > 0 ? Math.round((weightedScore / totalWeight) * 100) : 0;
  return { pct, totalWeight, score: Math.round(weightedScore * 10) / 10, categories: cats, items };
};

// รวมน้ำหนักทุกข้อใน template (ต้อง = 100)
const kpiTotalWeight = (categories) => flattenKpi(categories).reduce((s, it) => s + (Number(it.weight) || 0), 0);


/* ───────────────── KPI PAGE ───────────────── */
const KpiPage = () => {
  const { kpiCriteria, setKpiCriteria, kpiRecords, setKpiRecords, employees, branches, user, addToast } = useApp();
  const [tab, setTab] = useState('eval');           // eval | templates
  const [period, setPeriod] = useState(new Date().toISOString().slice(0, 7));
  const [search, setSearch] = useState('');
  const [openEval, setOpenEval] = useState(false);
  const [editingEval, setEditingEval] = useState(null);
  const [openTpl, setOpenTpl] = useState(false);
  const [editingTpl, setEditingTpl] = useState(null);
  const [viewRec, setViewRec] = useState(null);

  const canEdit = user.role === 'admin' || user.role === 'hr' || user.role === 'manager';
  const myEmp = employees.find(e => e.id === user.empId);
  const myScope = myEmp?.approvalScope || (myEmp?.canApprove ? 'manager' : 'none');
  const isRegional = myScope === 'regional';
  const lockedBranch = (user.role === 'manager' || isRegional) ? (user.branchId || myEmp?.branchId) : null;
  const canEvaluate = canEdit || isRegional;

  // templates = kpiCriteria (แต่ละตัว = {id, position, branchType, evaluator, categories[]})
  const templates = kpiCriteria || [];

  const periodRecords = useMemo(() => {
    return (kpiRecords || []).filter(r => {
      if (r.period !== period) return false;
      const emp = employees.find(e => e.id === r.employeeId);
      if (!emp) return false;
      if (lockedBranch && emp.branchId !== lockedBranch) return false;
      if (search) {
        const q = search.toLowerCase();
        return `${emp.firstName} ${emp.lastName}`.toLowerCase().includes(q) || emp.id.toLowerCase().includes(q);
      }
      return true;
    });
  }, [kpiRecords, period, search, employees, lockedBranch]);

  const stats = useMemo(() => {
    if (periodRecords.length === 0) return { count: 0, avg: 0, pass: 0 };
    const scores = periodRecords.map(r => calcKpiScore(r).pct);
    return {
      count: periodRecords.length,
      avg: Math.round(scores.reduce((a, b) => a + b, 0) / scores.length),
      pass: scores.filter(s => s >= 60).length,
    };
  }, [periodRecords]);

  const saveTemplate = (tpl) => {
    let updated;
    if (templates.some(t => t.id === tpl.id)) {
      updated = templates.map(t => t.id === tpl.id ? tpl : t);
      addToast('success', 'บันทึก template เรียบร้อย');
    } else {
      updated = [...templates, tpl];
      addToast('success', 'เพิ่ม template เรียบร้อย');
    }
    setKpiCriteria(updated);
    if (api.enabled()) api.post('saveKpiCriteria', { data: updated }).catch(() => addToast('error', 'บันทึกไม่สำเร็จ'));
    setOpenTpl(false); setEditingTpl(null);
  };
  const deleteTemplate = (id) => {
    if (!confirm('ลบ template นี้?')) return;
    const updated = templates.filter(t => t.id !== id);
    setKpiCriteria(updated);
    if (api.enabled()) api.post('saveKpiCriteria', { data: updated }).catch(() => {});
    addToast('success', 'ลบเรียบร้อย');
  };

  const saveRecord = (rec) => {
    let updated;
    if ((kpiRecords || []).some(x => x.id === rec.id)) {
      updated = kpiRecords.map(x => x.id === rec.id ? rec : x);
      addToast('success', 'บันทึกผลประเมินเรียบร้อย');
    } else {
      updated = [...(kpiRecords || []), rec];
      addToast('success', 'เพิ่มผลประเมินเรียบร้อย');
    }
    setKpiRecords(updated);
    if (api.enabled()) api.post('saveKpiRecord', { data: rec }).catch(() => addToast('error', 'บันทึกไม่สำเร็จ'));
    setOpenEval(false); setEditingEval(null);
  };
  const deleteRecord = (id) => {
    if (!confirm('ลบผลประเมินนี้?')) return;
    setKpiRecords((kpiRecords || []).filter(r => r.id !== id));
    if (api.enabled()) api.post('deleteKpiRecord', { id }).catch(() => {});
    addToast('success', 'ลบเรียบร้อย');
  };

  const [py, pm] = period.split('-');
  const periodLabel = `${THAI_MONTHS[parseInt(pm,10)-1]} ${parseInt(py,10)+543}`;

  return (
    <div className="p-8 space-y-6 animate-fade-up">
      <Topbar
        title="ประเมิน KPI"
        subtitle="ระบบประเมินผลการปฏิบัติงานพนักงาน"
        action={canEvaluate && (
          <div className="flex gap-2">
            {tab === 'eval'
              ? <Button icon="plus" onClick={() => { setEditingEval(null); setOpenEval(true); }}>ประเมินพนักงาน</Button>
              : canEdit && <Button icon="plus" onClick={() => { setEditingTpl(null); setOpenTpl(true); }}>เพิ่มตำแหน่ง</Button>}
          </div>
        )}
      />

      {/* Tabs */}
      <div className="flex gap-1 bg-ink-100 p-1 rounded-xl w-fit">
        {[['eval','ผลการประเมิน'],['templates','คลังตำแหน่ง KPI']].map(([id, label]) => (
          <button key={id} onClick={() => setTab(id)}
            className={cls('px-4 py-2 rounded-lg text-sm font-medium transition-colors', tab === id ? 'bg-white text-brand-700 shadow-soft' : 'text-ink-600 hover:text-ink-900')}>
            {label}
          </button>
        ))}
      </div>

      {tab === 'eval' ? (
        <>
          {/* Stats + period */}
          <div className="flex flex-wrap items-center justify-between gap-3">
            <Input type="month" value={period} onChange={(e) => setPeriod(e.target.value)} className="w-44" />
            <div className="flex gap-3">
              {[['ประเมินแล้ว', stats.count, 'flow'],['คะแนนเฉลี่ย', stats.avg + '%', 'brand'],['ผ่านเกณฑ์', `${stats.pass}/${stats.count}`, 'emerald']].map(([l, v, c]) => (
                <div key={l} className="bg-white rounded-xl border border-ink-100 px-4 py-2 text-center">
                  <div className="text-xs text-ink-500">{l}</div>
                  <div className={cls('font-display text-xl font-bold', `text-${c}-700`)}>{v}</div>
                </div>
              ))}
            </div>
          </div>

          <Input icon="search" placeholder="ค้นหาพนักงาน..." value={search} onChange={(e) => setSearch(e.target.value)} className="max-w-sm" />

          <Card className="overflow-hidden">
            {periodRecords.length === 0 ? (
              <Empty icon="target" title="ยังไม่มีผลประเมิน" desc={`รอบ ${periodLabel} — คลิก "ประเมินพนักงาน" เพื่อเริ่ม`} />
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead className="bg-ink-50 text-ink-600 text-left">
                    <tr>
                      <th className="px-5 py-3 font-medium">พนักงาน</th>
                      <th className="px-5 py-3 font-medium">ตำแหน่งที่ประเมิน</th>
                      <th className="px-5 py-3 font-medium text-center">คะแนนรวม</th>
                      <th className="px-5 py-3 font-medium text-center">เกรด</th>
                      <th className="px-5 py-3 font-medium text-right">จัดการ</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-ink-100">
                    {periodRecords.sort((a, b) => calcKpiScore(b).pct - calcKpiScore(a).pct).map(r => {
                      const emp = employees.find(e => e.id === r.employeeId);
                      if (!emp) return null;
                      const { pct } = calcKpiScore(r);
                      const g = kpiGrade(pct);
                      return (
                        <tr key={r.id} className="hover:bg-flow-50/40 cursor-pointer" onClick={() => setViewRec(r)}>
                          <td className="px-5 py-3">
                            <div className="flex items-center gap-3">
                              <Avatar name={`${emp.firstName} ${emp.lastName}`} photo={emp.photo} size="sm" />
                              <div>
                                <div className="font-medium text-ink-900">{emp.firstName} {emp.lastName}</div>
                                <div className="text-xs text-ink-500">{emp.id}</div>
                              </div>
                            </div>
                          </td>
                          <td className="px-5 py-3 text-ink-700">{r.positionName || '-'}</td>
                          <td className="px-5 py-3">
                            <div className="flex items-center justify-center gap-2">
                              <div className="w-20 h-1.5 bg-ink-100 rounded-full overflow-hidden">
                                <div className="h-full rounded-full" style={{ width: `${pct}%`, background: g.color }} />
                              </div>
                              <span className="font-display font-bold" style={{ color: g.color }}>{pct}%</span>
                            </div>
                          </td>
                          <td className="px-5 py-3 text-center">
                            <span className="inline-flex w-8 h-8 rounded-lg items-center justify-center font-display font-bold text-white" style={{ background: g.color }}>{g.grade}</span>
                          </td>
                          <td className="px-5 py-3 text-right" onClick={(e) => e.stopPropagation()}>
                            <div className="inline-flex gap-1">
                              <button onClick={() => setViewRec(r)} className="p-1.5 rounded-lg text-ink-500 hover:bg-flow-50 hover:text-flow-700" title="ดู"><Icon name="eye" className="w-4 h-4" /></button>
                              {canEvaluate && <>
                                <button onClick={() => { setEditingEval(r); setOpenEval(true); }} className="p-1.5 rounded-lg text-ink-500 hover:bg-flow-50 hover:text-flow-700" title="แก้ไข"><Icon name="edit" className="w-4 h-4" /></button>
                                <button onClick={() => deleteRecord(r.id)} className="p-1.5 rounded-lg text-ink-500 hover:bg-red-50 hover:text-red-600" title="ลบ"><Icon name="trash" className="w-4 h-4" /></button>
                              </>}
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </Card>
        </>
      ) : (
        /* ── คลังตำแหน่ง KPI ── */
        <div className="grid md:grid-cols-2 gap-4">
          {templates.length === 0 ? (
            <div className="md:col-span-2">
              <Empty icon="target" title="ยังไม่มีตำแหน่ง KPI" desc='คลิก "เพิ่มตำแหน่ง" เพื่อสร้าง template การประเมิน' />
            </div>
          ) : templates.map(tpl => {
            const tw = kpiTotalWeight(tpl.categories);
            return (
              <Card key={tpl.id} className="p-5">
                <div className="flex items-start justify-between gap-3 mb-3">
                  <div>
                    <div className="font-display font-semibold text-ink-900">{tpl.position}</div>
                    <div className="text-xs text-ink-500 mt-0.5">
                      {tpl.branchType === 'nonProduction' ? 'คลัง+ขาย (ไม่ผลิต)' : 'ผลิต+คลัง+ขาย'}
                      {tpl.evaluator ? ` · ผู้ประเมิน: ${tpl.evaluator}` : ''}
                    </div>
                  </div>
                  <div className="flex items-center gap-1">
                    <span className={cls('text-xs font-medium px-2 py-0.5 rounded-lg', tw === 100 ? 'bg-emerald-50 text-emerald-700' : 'bg-gold-50 text-gold-700')}>
                      รวม {tw}%
                    </span>
                    {canEdit && <>
                      <button onClick={() => { setEditingTpl(tpl); setOpenTpl(true); }} className="p-1.5 rounded-lg text-ink-500 hover:bg-flow-50 hover:text-flow-700"><Icon name="edit" className="w-4 h-4" /></button>
                      <button onClick={() => deleteTemplate(tpl.id)} className="p-1.5 rounded-lg text-ink-500 hover:bg-red-50 hover:text-red-600"><Icon name="trash" className="w-4 h-4" /></button>
                    </>}
                  </div>
                </div>
                <div className="space-y-1.5">
                  {(tpl.categories || []).map(cat => (
                    <div key={cat.id} className="flex items-center justify-between text-xs bg-ink-50 rounded-lg px-3 py-1.5">
                      <span className="font-medium text-ink-700">{cat.name}</span>
                      <span className="text-ink-500">{(cat.items || []).length} ข้อ · {cat.items?.reduce((s,i)=>s+(Number(i.weight)||0),0)}%</span>
                    </div>
                  ))}
                  {(tpl.categories || []).length === 0 && <div className="text-xs text-ink-400 text-center py-2">ยังไม่มีหมวด KPI</div>}
                </div>
              </Card>
            );
          })}
        </div>
      )}

      <KpiTemplateModal open={openTpl} onClose={() => { setOpenTpl(false); setEditingTpl(null); }} editing={editingTpl} onSave={saveTemplate} />
      <KpiEvalModal open={openEval} onClose={() => { setOpenEval(false); setEditingEval(null); }} editing={editingEval}
        onSave={saveRecord} employees={employees.filter(e => (!lockedBranch || e.branchId === lockedBranch) && e.status !== 'inactive')}
        templates={templates} branches={branches} defaultPeriod={period} />
      {viewRec && <KpiViewModal record={viewRec} onClose={() => setViewRec(null)} employees={employees} branches={branches} />}
    </div>
  );
};

/* ───────────────── KPI TEMPLATE MODAL — สร้าง/แก้ตำแหน่ง ───────────────── */
const KpiTemplateModal = ({ open, onClose, editing, onSave }) => {
  const [form, setForm] = useState({});

  useEffect(() => {
    if (editing) setForm(JSON.parse(JSON.stringify(editing)));
    else setForm({ id: '', position: '', branchType: 'production', evaluator: '', targetOverall: '', categories: [] });
  }, [editing, open]);

  if (!open) return null;

  const cats = form.categories || [];
  const totalW = kpiTotalWeight(cats);

  const addCat = () => setForm(f => ({ ...f, categories: [...(f.categories||[]), { id: `CAT${Date.now()}${Math.floor(Math.random()*999)}`, name: '', items: [] }] }));
  const updateCat = (cid, key, val) => setForm(f => ({ ...f, categories: f.categories.map(c => c.id === cid ? { ...c, [key]: val } : c) }));
  const removeCat = (cid) => setForm(f => ({ ...f, categories: f.categories.filter(c => c.id !== cid) }));

  const addItem = (cid) => setForm(f => ({ ...f, categories: f.categories.map(c => c.id === cid
    ? { ...c, items: [...(c.items||[]), { id: `K${Date.now()}${Math.floor(Math.random()*999)}`, no: (c.items?.length||0)+1, name: '', indicator: '', target: '', weight: 0, method: '', note: '', warning: '' }] }
    : c) }));
  const updateItem = (cid, iid, key, val) => setForm(f => ({ ...f, categories: f.categories.map(c => c.id === cid
    ? { ...c, items: c.items.map(it => it.id === iid ? { ...it, [key]: (key === 'weight') ? (Number(val)||0) : val } : it) }
    : c) }));
  const removeItem = (cid, iid) => setForm(f => ({ ...f, categories: f.categories.map(c => c.id === cid ? { ...c, items: c.items.filter(it => it.id !== iid) } : c) }));

  const submit = (e) => {
    e.preventDefault();
    if (!form.position.trim()) return alert('กรุณาระบุชื่อตำแหน่ง');
    if (totalW !== 100) {
      if (!confirm(`น้ำหนักรวม = ${totalW}% (ไม่ครบ 100%) ต้องการบันทึกต่อหรือไม่?`)) return;
    }
    onSave({ ...form, id: form.id || `TPL${Date.now()}`, position: form.position.trim() });
  };

  return (
    <Modal open={open} onClose={onClose} title={editing ? 'แก้ไขตำแหน่ง KPI' : 'เพิ่มตำแหน่ง KPI'} size="xl">
      <form onSubmit={submit} className="space-y-4">
        <div className="grid md:grid-cols-3 gap-3 bg-brand-50 border border-brand-100 rounded-xl p-4">
          <div className="md:col-span-2">
            <label className="block text-sm font-medium text-ink-700 mb-1.5">ชื่อตำแหน่ง</label>
            <Input value={form.position || ''} onChange={(e) => setForm({ ...form, position: e.target.value })} placeholder="เช่น ผู้จัดการสาขา, พนักงานขาย, หัวหน้า QC" required />
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">ใช้กับสาขาแบบ</label>
            <Select value={form.branchType} onChange={(e) => setForm({ ...form, branchType: e.target.value })}>
              <option value="production">ผลิต+คลัง+ขาย (ทุกสาขา)</option>
              <option value="nonProduction">คลัง+ขาย (ไม่ผลิต เช่น ลำปาง)</option>
            </Select>
          </div>
          <div className="md:col-span-2">
            <label className="block text-sm font-medium text-ink-700 mb-1.5">ผู้ประเมิน (ตำแหน่ง)</label>
            <Input value={form.evaluator || ''} onChange={(e) => setForm({ ...form, evaluator: e.target.value })} placeholder="เช่น ผู้จัดการสาขา, หัวหน้าฝ่าย" />
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">เป้าหมายรวม</label>
            <Input value={form.targetOverall || ''} onChange={(e) => setForm({ ...form, targetOverall: e.target.value })} placeholder="เช่น ≥ 80%" />
          </div>
        </div>

        {/* หมวด + KPI */}
        <div>
          <div className="flex items-center justify-between mb-2">
            <label className="text-sm font-medium text-ink-700">หมวด KPI (RESULT, OPERATE, PLAN, วินัย ฯลฯ)</label>
            <span className={cls('text-xs font-medium', totalW === 100 ? 'text-emerald-600' : 'text-gold-600')}>น้ำหนักรวมทุกข้อ: {totalW}% / 100%</span>
          </div>

          {cats.length === 0 ? (
            <div className="bg-ink-50 rounded-xl p-4 text-center text-sm text-ink-400">ยังไม่มีหมวด — คลิก "เพิ่มหมวด"</div>
          ) : (
            <div className="space-y-3">
              {cats.map((cat, ci) => {
                const catW = (cat.items || []).reduce((s, i) => s + (Number(i.weight) || 0), 0);
                return (
                  <div key={cat.id} className="border border-ink-200 rounded-xl overflow-hidden">
                    <div className="bg-brand-50 px-3 py-2 flex items-center gap-2">
                      <span className="w-6 h-6 rounded-lg bg-brand-200 text-brand-800 flex items-center justify-center text-xs font-bold shrink-0">{ci+1}</span>
                      <Input value={cat.name} onChange={(e) => updateCat(cat.id, 'name', e.target.value)} placeholder="ชื่อหมวด เช่น RESULT (ผลงาน)" className="flex-1 !py-1.5 text-sm" />
                      <span className="text-xs text-brand-700 font-medium shrink-0">{catW}%</span>
                      <button type="button" onClick={() => removeCat(cat.id)} className="p-1 rounded-lg text-ink-400 hover:bg-red-50 hover:text-red-600 shrink-0"><Icon name="trash" className="w-4 h-4" /></button>
                    </div>
                    <div className="p-2 space-y-2">
                      {(cat.items || []).map((it, ii) => (
                        <div key={it.id} className="border border-ink-100 rounded-lg p-2.5 space-y-2 bg-ink-50/50">
                          <div className="flex items-center gap-2">
                            <span className="text-xs text-ink-400 shrink-0">{ci+1}.{ii+1}</span>
                            <Input value={it.name} onChange={(e) => updateItem(cat.id, it.id, 'name', e.target.value)} placeholder="หัวข้อ KPI" className="flex-1 !py-1.5 text-sm" />
                            <div className="flex items-center gap-1 shrink-0">
                              <Input type="number" min={0} max={100} value={it.weight} onChange={(e) => updateItem(cat.id, it.id, 'weight', e.target.value)} className="w-14 !py-1.5 text-sm text-center" />
                              <span className="text-xs text-ink-400">%</span>
                            </div>
                            <button type="button" onClick={() => removeItem(cat.id, it.id)} className="p-1 rounded-lg text-ink-400 hover:bg-red-50 hover:text-red-600 shrink-0"><Icon name="trash" className="w-4 h-4" /></button>
                          </div>
                          <div className="grid md:grid-cols-3 gap-2 pl-6">
                            <Input value={it.indicator} onChange={(e) => updateItem(cat.id, it.id, 'indicator', e.target.value)} placeholder="ตัวชี้วัด/วิธีการวัด" className="!py-1.5 text-xs" />
                            <Input value={it.target} onChange={(e) => updateItem(cat.id, it.id, 'target', e.target.value)} placeholder="เป้าหมาย เช่น ≥80%, ≤0.5%" className="!py-1.5 text-xs" />
                            <Input value={it.method} onChange={(e) => updateItem(cat.id, it.id, 'method', e.target.value)} placeholder="วิธีวัดผล" className="!py-1.5 text-xs" />
                          </div>
                          <div className="grid md:grid-cols-2 gap-2 pl-6">
                            <Input value={it.note} onChange={(e) => updateItem(cat.id, it.id, 'note', e.target.value)} placeholder="คอมมิชชั่น/หมายเหตุ (ไม่คิดคะแนน)" className="!py-1.5 text-xs" />
                            <Input value={it.warning} onChange={(e) => updateItem(cat.id, it.id, 'warning', e.target.value)} placeholder="⚠ ป้ายเตือน (ถ้ามี)" className="!py-1.5 text-xs" />
                          </div>
                        </div>
                      ))}
                      <Button type="button" variant="outline" size="sm" icon="plus" onClick={() => addItem(cat.id)}>เพิ่ม KPI ในหมวดนี้</Button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
          <Button type="button" variant="outline" size="sm" icon="plus" onClick={addCat} className="mt-3">เพิ่มหมวด</Button>
        </div>

        <div className="flex justify-end gap-2 pt-4 border-t border-ink-100">
          <Button type="button" variant="secondary" onClick={onClose}>ยกเลิก</Button>
          <Button type="submit" icon={editing ? 'check' : 'plus'}>{editing ? 'บันทึก' : 'เพิ่มตำแหน่ง'}</Button>
        </div>
      </form>
    </Modal>
  );
};

/* ───────────────── KPI EVAL MODAL — ประเมินพนักงาน (แบบ A: กรอก %) ───────────────── */
const KpiEvalModal = ({ open, onClose, editing, onSave, employees, templates, branches, defaultPeriod }) => {
  const [form, setForm] = useState({});

  useEffect(() => {
    if (editing) {
      setForm(JSON.parse(JSON.stringify(editing)));
    } else {
      setForm({
        id: '', branchId: '', employeeId: '', templateId: '', positionName: '',
        period: defaultPeriod, evaluator: '', evalDate: new Date().toISOString().split('T')[0],
        categories: [], scores: {}, note: '',
      });
    }
  }, [editing, open, defaultPeriod]);

  if (!open) return null;

  // สาขาที่เลือก → กำหนด branchType → กรองตำแหน่งที่ใช้ได้
  const selectedBranch = branches.find(b => b.id === form.branchId);
  const brType = selectedBranch ? kpiBranchType(selectedBranch.name, selectedBranch.id) : null;
  // ตำแหน่งที่ใช้ได้กับสาขานี้: ถ้าสาขาไม่ผลิต → ซ่อน template ที่เป็น production-only ฝ่ายผลิต
  const availableTemplates = templates.filter(t => {
    if (!brType) return true;
    if (brType === 'nonProduction') {
      // ซ่อนตำแหน่งฝ่ายผลิต + template ที่ผูกกับ production เท่านั้น
      if (KPI_PRODUCTION_POSITIONS.some(p => t.position.includes(p))) return false;
    }
    return true;
  });

  // พนักงานในสาขาที่เลือก
  const branchEmps = employees.filter(e => !form.branchId || e.branchId === form.branchId);

  // โหลด template → คัดลอก categories เข้า form
  const loadTemplate = (tplId) => {
    const tpl = templates.find(t => t.id === tplId);
    if (!tpl) { setForm(f => ({ ...f, templateId: '', categories: [], positionName: '' })); return; }
    setForm(f => ({
      ...f, templateId: tplId, positionName: tpl.position,
      evaluator: f.evaluator || tpl.evaluator || '',
      categories: JSON.parse(JSON.stringify(tpl.categories || [])),
    }));
  };

  const setScore = (itemId, val) => {
    const v = Math.max(0, Math.min(100, Number(val) || 0));
    setForm(f => ({ ...f, scores: { ...f.scores, [itemId]: v } }));
  };

  const { pct, score, items } = calcKpiScore(form);
  const g = kpiGrade(pct);
  const totalWeight = items.reduce((s, it) => s + (Number(it.weight) || 0), 0);

  const submit = (e) => {
    e.preventDefault();
    if (!form.branchId) return alert('กรุณาเลือกสาขา');
    if (!form.employeeId) return alert('กรุณาเลือกพนักงาน');
    if (!form.templateId || items.length === 0) return alert('กรุณาเลือกตำแหน่งที่จะประเมิน');
    onSave({ ...form, id: form.id || `KPI${Date.now()}` });
  };

  return (
    <Modal open={open} onClose={onClose} title={editing ? 'แก้ไขผลประเมิน' : 'ประเมินพนักงาน'} size="xl">
      <form onSubmit={submit} className="space-y-4">
        {/* เลือกสาขา → ตำแหน่ง → พนักงาน */}
        <div className="grid md:grid-cols-2 gap-3">
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">1. เลือกสาขา</label>
            <Select value={form.branchId} onChange={(e) => setForm(f => ({ ...f, branchId: e.target.value, employeeId: '', templateId: '', categories: [], positionName: '' }))} required disabled={!!editing}>
              <option value="">— เลือกสาขา —</option>
              {branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
            </Select>
            {brType === 'nonProduction' && <p className="text-xs text-gold-600 mt-1">สาขานี้ไม่มีฝ่ายผลิต — ซ่อนตำแหน่งฝ่ายผลิต</p>}
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">2. เลือกตำแหน่งที่ประเมิน</label>
            <Select value={form.templateId} onChange={(e) => loadTemplate(e.target.value)} disabled={!form.branchId} required>
              <option value="">— เลือกตำแหน่ง —</option>
              {availableTemplates.map(t => <option key={t.id} value={t.id}>{t.position}</option>)}
            </Select>
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">3. เลือกพนักงาน</label>
            <Select value={form.employeeId} onChange={(e) => setForm(f => ({ ...f, employeeId: e.target.value }))} disabled={!form.branchId || !!editing} required>
              <option value="">— เลือกพนักงาน —</option>
              {branchEmps.map(e => <option key={e.id} value={e.id}>{e.firstName} {e.lastName} ({e.id})</option>)}
            </Select>
          </div>
          <div className="grid grid-cols-2 gap-2">
            <div>
              <label className="block text-sm font-medium text-ink-700 mb-1.5">รอบประเมิน</label>
              <Input type="month" value={form.period || ''} onChange={(e) => setForm({ ...form, period: e.target.value })} required />
            </div>
            <div>
              <label className="block text-sm font-medium text-ink-700 mb-1.5">ผู้ประเมิน</label>
              <Input value={form.evaluator || ''} onChange={(e) => setForm({ ...form, evaluator: e.target.value })} placeholder="ชื่อผู้ประเมิน" />
            </div>
          </div>
        </div>

        {/* กรอกคะแนน */}
        {items.length > 0 && (
          <div>
            <div className="flex items-center justify-between mb-2">
              <label className="text-sm font-medium text-ink-700">กรอก % ที่ทำได้ของแต่ละ KPI (0-100)</label>
              <span className={cls('text-xs font-medium', totalWeight === 100 ? 'text-emerald-600' : 'text-gold-600')}>น้ำหนักรวม {totalWeight}%</span>
            </div>
            <div className="space-y-3">
              {(form.categories || []).map(cat => {
                const catW = (cat.items || []).reduce((s, i) => s + (Number(i.weight) || 0), 0);
                return (
                  <div key={cat.id} className="border border-ink-200 rounded-xl overflow-hidden">
                    <div className="bg-brand-50 px-4 py-2 flex justify-between items-center">
                      <span className="font-medium text-brand-900">{cat.name}</span>
                      <span className="text-xs text-brand-600">{catW}%</span>
                    </div>
                    <div className="divide-y divide-ink-100">
                      {(cat.items || []).map(it => {
                        const pctDone = Number(form.scores?.[it.id]) || 0;
                        const earned = Math.round((pctDone / 100) * (Number(it.weight) || 0) * 10) / 10;
                        return (
                          <div key={it.id} className="px-4 py-3">
                            <div className="flex items-start justify-between gap-2 mb-1.5">
                              <div className="min-w-0">
                                <div className="text-sm font-medium text-ink-900">{it.name}</div>
                                <div className="flex flex-wrap gap-x-3 gap-y-0.5 text-xs text-ink-500 mt-0.5">
                                  {it.indicator && <span>วัด: {it.indicator}</span>}
                                  {it.target && <span>เป้า: {it.target}</span>}
                                  <span>น้ำหนัก {it.weight}%</span>
                                </div>
                                {it.note && <div className="text-xs text-ink-400 mt-0.5">หมายเหตุ: {it.note}</div>}
                                {it.warning && <div className="text-xs text-gold-700 bg-gold-50 rounded px-2 py-0.5 mt-1 inline-block">⚠ {it.warning}</div>}
                              </div>
                              <div className="text-right shrink-0">
                                <div className="font-display font-bold text-brand-700">{pctDone}%</div>
                                <div className="text-xs text-ink-400">ได้ {earned}</div>
                              </div>
                            </div>
                            <div className="flex items-center gap-3">
                              <input type="range" min={0} max={100} step={5} value={pctDone} onChange={(e) => setScore(it.id, e.target.value)} className="flex-1 accent-brand-600" />
                              <div className="flex gap-1 shrink-0">
                                {[60,70,80,90,100].map(v => (
                                  <button key={v} type="button" onClick={() => setScore(it.id, v)} className="text-xs px-1.5 py-0.5 rounded border border-ink-200 hover:border-brand-400 hover:bg-brand-50">{v}</button>
                                ))}
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* คะแนนรวม real-time */}
        {items.length > 0 && (
          <div className="rounded-xl p-4 flex items-center justify-between text-white" style={{ background: `linear-gradient(135deg, ${g.color}, ${g.color}dd)` }}>
            <div>
              <div className="text-sm opacity-90">คะแนนรวม (ถ่วงน้ำหนัก)</div>
              <div className="font-display text-3xl font-bold">{pct}%</div>
              <div className="text-xs opacity-80">ได้ {score} จาก {totalWeight} คะแนน</div>
            </div>
            <div className="text-right">
              <div className="font-display text-4xl font-bold">{g.grade}</div>
              <div className="text-sm opacity-90">{g.label}</div>
            </div>
          </div>
        )}

        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">ข้อเสนอแนะ</label>
          <Textarea rows={2} value={form.note || ''} onChange={(e) => setForm({ ...form, note: e.target.value })} placeholder="จุดเด่น จุดที่ควรพัฒนา..." />
        </div>

        <div className="flex justify-end gap-2 pt-4 border-t border-ink-100">
          <Button type="button" variant="secondary" onClick={onClose}>ยกเลิก</Button>
          <Button type="submit" icon={editing ? 'check' : 'plus'}>{editing ? 'บันทึก' : 'บันทึกผลประเมิน'}</Button>
        </div>
      </form>
    </Modal>
  );
};

/* ───────────────── KPI VIEW MODAL — ดูผลประเมิน + Export ───────────────── */
const KpiViewModal = ({ record, onClose, employees, branches }) => {
  const emp = employees.find(e => e.id === record.employeeId);
  const branch = branches.find(b => b.id === record.branchId);
  const { pct, score, items } = calcKpiScore(record);
  const g = kpiGrade(pct);
  const [ry, rm] = (record.period || '').split('-');
  const periodLabel = rm ? `${THAI_MONTHS[parseInt(rm,10)-1]} ${parseInt(ry,10)+543}` : record.period;

  const exportExcel = () => {
    const XLSXlib = window.XLSX;
    const header = ['หมวด', 'ข้อ', 'หัวข้อ KPI', 'ตัวชี้วัด', 'เป้าหมาย', 'น้ำหนัก(%)', '% ที่ทำได้', 'คะแนนที่ได้', 'วิธีวัดผล', 'คอมมิชชั่น/หมายเหตุ'];
    const rows = [];
    (record.categories || []).forEach((cat, ci) => {
      (cat.items || []).forEach((it, ii) => {
        const pctDone = Number(record.scores?.[it.id]) || 0;
        const earned = Math.round((pctDone / 100) * (Number(it.weight) || 0) * 10) / 10;
        rows.push([cat.name, `${ci+1}.${ii+1}`, it.name, it.indicator || '', it.target || '', it.weight, pctDone, earned, it.method || '', it.note || '']);
      });
    });
    rows.push(['', '', '', '', 'รวม', items.reduce((s,i)=>s+(Number(i.weight)||0),0), '', score, '', '']);
    rows.push(['', '', '', '', 'คะแนนรวม', '', `${pct}%`, `เกรด ${g.grade}`, '', '']);

    const meta = [
      ['แบบประเมิน KPI'],
      ['พนักงาน', emp ? `${emp.firstName} ${emp.lastName}` : '', '', 'ตำแหน่ง', record.positionName || ''],
      ['สาขา', branch?.name || '', '', 'รอบประเมิน', periodLabel],
      ['ผู้ประเมิน', record.evaluator || '', '', 'วันที่', record.evalDate || ''],
      [],
    ];
    const ws = XLSXlib.utils.aoa_to_sheet([...meta, header, ...rows]);
    ws['!cols'] = [{wch:16},{wch:6},{wch:28},{wch:24},{wch:14},{wch:10},{wch:10},{wch:11},{wch:20},{wch:24}];
    const wb = XLSXlib.utils.book_new();
    XLSXlib.utils.book_append_sheet(wb, ws, 'KPI');
    XLSXlib.writeFile(wb, `KPI_${emp?.firstName || ''}_${record.period}.xlsx`);
  };

  return (
    <Modal open={true} onClose={onClose} title="ผลประเมิน KPI" size="xl">
      <div className="space-y-4">
        {/* หัว */}
        <div className="grid md:grid-cols-2 gap-3 bg-ink-50 rounded-xl p-4">
          {[['พนักงาน', emp ? `${emp.firstName} ${emp.lastName}` : '-'],['ตำแหน่ง', record.positionName || '-'],['สาขา', branch?.name || '-'],['รอบ', periodLabel],['ผู้ประเมิน', record.evaluator || '-'],['วันที่', record.evalDate || '-']].map(([l, v]) => (
            <div key={l} className="flex justify-between text-sm"><span className="text-ink-500">{l}</span><span className="font-medium text-ink-900">{v}</span></div>
          ))}
        </div>

        {/* คะแนนรวม */}
        <div className="rounded-xl p-4 flex items-center justify-between text-white" style={{ background: `linear-gradient(135deg, ${g.color}, ${g.color}dd)` }}>
          <div><div className="text-sm opacity-90">คะแนนรวม</div><div className="font-display text-3xl font-bold">{pct}%</div></div>
          <div className="text-right"><div className="font-display text-4xl font-bold">{g.grade}</div><div className="text-sm opacity-90">{g.label}</div></div>
        </div>

        {/* รายละเอียดตามหมวด */}
        <div className="space-y-3">
          {(record.categories || []).map(cat => (
            <div key={cat.id} className="border border-ink-200 rounded-xl overflow-hidden">
              <div className="bg-brand-50 px-4 py-2 font-medium text-brand-900">{cat.name}</div>
              <div className="divide-y divide-ink-100">
                {(cat.items || []).map(it => {
                  const pctDone = Number(record.scores?.[it.id]) || 0;
                  const earned = Math.round((pctDone / 100) * (Number(it.weight) || 0) * 10) / 10;
                  return (
                    <div key={it.id} className="px-4 py-2.5">
                      <div className="flex items-center justify-between gap-2">
                        <div className="min-w-0">
                          <div className="text-sm text-ink-900">{it.name}</div>
                          <div className="text-xs text-ink-500">{it.target && `เป้า: ${it.target} · `}น้ำหนัก {it.weight}%</div>
                        </div>
                        <div className="flex items-center gap-3 shrink-0">
                          <div className="w-20 h-1.5 bg-ink-100 rounded-full overflow-hidden">
                            <div className="h-full rounded-full" style={{ width: `${pctDone}%`, background: g.color }} />
                          </div>
                          <span className="text-sm font-medium text-ink-700 w-12 text-right">{pctDone}%</span>
                          <span className="text-xs text-ink-400 w-10 text-right">+{earned}</span>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
        </div>

        {record.note && <div className="bg-ink-50 rounded-xl p-3 text-sm text-ink-700"><span className="text-xs text-ink-400">ข้อเสนอแนะ: </span>{record.note}</div>}

        <div className="flex justify-end gap-2 pt-3 border-t border-ink-100">
          <Button variant="outline" icon="download" onClick={exportExcel}>Export Excel</Button>
          <Button variant="secondary" onClick={onClose}>ปิด</Button>
        </div>
      </div>
    </Modal>
  );
};


/* ═══════════════════════════════════════════════════════════
   EXPENSES PAGE — เบิกค่าใช้จ่าย (ใบขออนุมัติเดินทาง + เบี้ยเลี้ยง)
   ตามระเบียบเบี้ยเลี้ยงเดินทาง FFC (มีผล 1 ก.ค. 2569)
═══════════════════════════════════════════════════════════ */

// อัตราเบี้ยเลี้ยงตามระดับ (ต่างจังหวัดค้างคืน)
const PER_DIEM_RATES = {
  1: { label: 'ระดับ 1 — ปฏิบัติการ/เจ้าหน้าที่', perDiem: 200, lodging: 550, carRate: 4 },
  2: { label: 'ระดับ 2 — อาวุโส/หัวหน้างาน',     perDiem: 230, lodging: 650, carRate: 4 },
  3: { label: 'ระดับ 3 — ผู้จัดการขึ้นไป',        perDiem: 250, lodging: 700, carRate: 4 },
};
const PER_DIEM_TAX_FREE_CAP = 270;   // เบี้ยเลี้ยงยกเว้นภาษีสูงสุด/วัน
const OWN_CAR_RATE = 5;              // รถส่วนตัว 5 บาท/กม. (ไป-กลับ)

// คำนวณเบี้ยเลี้ยงออกพื้นที่ไม่ค้างคืน ตามชั่วโมง
const calcOffsitePerDiem = (level, hours) => {
  const rate = PER_DIEM_RATES[level]?.perDiem || 0;
  if (hours <= 4) return 0;              // ไม่เกิน 4 ชม. = ไม่จ่าย
  if (hours <= 8) return rate * 0.5;     // 4-8 ชม. = 50%
  return rate;                           // เกิน 8 ชม. = 100%
};

const ExpensesPage = () => {
  const { employees, branches, user, settings, setSettings, addToast } = useApp();
  const [openForm, setOpenForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [filterStatus, setFilterStatus] = useState('all');

  const canApproveAll = user.role === 'admin' || user.role === 'hr';
  const myEmp = employees.find(e => e.id === user.empId);

  // เก็บใน settings.expenses (array)
  const expenses = (settings && settings.expenses) || [];

  const saveExpenses = async (list) => {
    const newSettings = { ...settings, expenses: list };
    setSettings(newSettings);
    if (api.enabled()) {
      try { await api.post('saveSettingsKey', { key: 'expenses', data: list }); }
      catch (err) { addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message); }
    }
  };

  const saveOne = (exp) => {
    let list;
    if (expenses.some(e => e.id === exp.id)) list = expenses.map(e => e.id === exp.id ? exp : e);
    else list = [...expenses, exp];
    saveExpenses(list);
    addToast('success', editing ? 'บันทึกเรียบร้อย' : 'สร้างใบเบิกเรียบร้อย');
    setOpenForm(false); setEditing(null);
  };

  const setStatus = (id, status) => {
    saveExpenses(expenses.map(e => e.id === id ? { ...e, status, approvedBy: user.name || user.username, approvedAt: new Date().toISOString() } : e));
    addToast('success', status === 'approved' ? 'อนุมัติแล้ว' : 'ปฏิเสธแล้ว');
  };

  const deleteOne = (id) => {
    if (!confirm('ลบใบเบิกนี้?')) return;
    saveExpenses(expenses.filter(e => e.id !== id));
    addToast('success', 'ลบเรียบร้อย');
  };

  // กรองตามสิทธิ์ + สถานะ
  const visible = expenses.filter(e => {
    if (!canApproveAll && e.employeeId !== user.empId) return false;  // พนักงานเห็นแค่ของตัวเอง
    if (filterStatus !== 'all' && e.status !== filterStatus) return false;
    return true;
  }).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));

  const STATUS = {
    pending:  { label: 'รออนุมัติ', color: 'gold' },
    approved: { label: 'อนุมัติแล้ว', color: 'emerald' },
    rejected: { label: 'ปฏิเสธ', color: 'red' },
    paid:     { label: 'จ่ายแล้ว', color: 'flow' },
  };

  const fmtDate = (iso) => { try { const d = new Date(iso); return `${d.getDate()}/${d.getMonth()+1}/${(d.getFullYear()+543)%100}`; } catch { return ''; } };

  // Export Excel รายการเบิก
  const exportExcel = () => {
    if (visible.length === 0) { addToast('info', 'ไม่มีข้อมูลให้ export'); return; }
    const rows = [['รหัสพนักงาน','ชื่อ-นามสกุล','ระดับ','ปลายทาง','ลักษณะงาน','ประเภท','วันที่','จำนวนวัน','เบี้ยเลี้ยง','ค่าที่พัก','ค่ารถ','ค่าเดินทางอื่น','อื่นๆ','รวมทั้งสิ้น','สถานะ']];
    visible.forEach(e => {
      const emp = employees.find(x => x.id === e.employeeId);
      const b = e.breakdown || {};
      rows.push([
        e.employeeId, emp ? `${emp.firstName} ${emp.lastName}` : '',
        e.level, e.destination || '', e.purpose || '',
        e.tripType === 'overnight' ? 'ค้างคืน' : 'ไปเช้า-เย็นกลับ',

      ]);
    });
    const XLSXlib = window.XLSX;
    const ws = XLSXlib.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:10},{wch:20},{wch:6},{wch:16},{wch:18},{wch:14},{wch:12},{wch:8},{wch:10},{wch:10},{wch:8},{wch:12},{wch:8},{wch:12},{wch:12}];
    const wb = XLSXlib.utils.book_new();
    XLSXlib.utils.book_append_sheet(wb, ws, 'เบิกค่าใช้จ่าย');
    XLSXlib.writeFile(wb, `รายการเบิกค่าใช้จ่าย_${new Date().toISOString().slice(0,10)}.xlsx`);
  };

  // พิมพ์ใบฟอร์มขอเบิก (มีช่องลงชื่อ 3 ฝ่าย)
  const printForm = (exp) => {
    const emp = employees.find(x => x.id === exp.employeeId);

    win.document.write(`

        .header .co-en{font-size:12px;color:#64748B;letter-spacing:.5px}
        .doc-title{text-align:center;font-family:'Prompt',sans-serif;font-size:18px;font-weight:600;color:#0B2A4A;margin:22px 0 4px}
        .doc-no{text-align:center;font-size:12px;color:#94A3B8;margin-bottom:22px}

        .info-grid .full{grid-column:1 / -1}
        .info-item .lbl{font-size:11px;color:#94A3B8;margin-bottom:1px}
        .info-item .val{font-size:14px;font-weight:500;color:#1E293B}
        table{width:100%;border-collapse:collapse;margin:6px 0 4px;font-size:13.5px}
        thead th{background:#0B2A4A;color:#fff;padding:9px 14px;text-align:left;font-family:'Prompt',sans-serif;font-weight:500;font-size:13px}
        thead th.right{text-align:right}
        tbody td{border-bottom:1px solid #E2E8F0;padding:8px 14px}
        tbody td.right{text-align:right;font-variant-numeric:tabular-nums}
        tbody tr:nth-child(even){background:#F8FAFC}
        tfoot td{padding:11px 14px;font-family:'Prompt',sans-serif;font-weight:600;font-size:15px;border-top:2px solid #0B2A4A}
        tfoot td.right{text-align:right;color:#0B2A4A}
        .sign-row{display:flex;justify-content:space-between;margin-top:56px;gap:24px}
        .sign-box{flex:1;text-align:center}
        .sign-img-slot{height:42px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:2px}
        .sign-img-slot img{max-height:42px;max-width:140px}

        .sign-name{font-size:13px;font-weight:500}

        @media print { body{-webkit-print-color-adjust:exact;print-color-adjust:exact} .page{padding:24px 32px} }
      </style></head><body>
      <div class="page">
        <div class="header">
          <img src="${LOGO_EAGLE}" alt="FFC" />
          <div>
            <div class="co-th">บริษัท ฟรีด้อมโฟล เทรดดิ้ง จำกัด</div>
            <div class="co-en">FREEDOM FLOW TRADING CO., LTD.</div>
          </div>
        </div>

        <div class="doc-title">ใบขออนุมัติเดินทางและเบิกค่าใช้จ่าย</div>

        <div class="info-grid">

        <table>
          <thead><tr><th>รายการ</th><th class="right">จำนวนเงิน (บาท)</th></tr></thead>
          <tbody>

            <tr><td>ค่าที่พัก</td><td class="right">${money(b.lodging)}</td></tr>
            <tr><td>ค่ารถส่วนตัว (${exp.carKm||0} กม.)</td><td class="right">${money(b.carCost)}</td></tr>
            <tr><td>ค่าเดินทางอื่น</td><td class="right">${money(b.transport)}</td></tr>
            <tr><td>ค่าใช้จ่ายอื่นๆ</td><td class="right">${money(b.other)}</td></tr>
          </tbody>
          <tfoot><tr><td>รวมทั้งสิ้น</td><td class="right">${money(exp.total)} บาท</td></tr></tfoot>
        </table>

        <div class="sign-row">
          <div class="sign-box">
            <div class="sign-img-slot"></div>
            <div class="sign-line"></div>
            <div class="sign-name">( ${empName} )</div>
            <div class="sign-role">ผู้ขอเบิก</div>
          </div>
          <div class="sign-box">
            <div class="sign-img-slot"></div>
            <div class="sign-line"></div>
            <div class="sign-name">(................................................)</div>
            <div class="sign-role">ผู้บังคับบัญชา</div>

            <div class="sign-img-slot"><img src="${SIGNATURE_ACCOUNTING}" /></div>

        <div class="footer-note">เอกสารนี้พิมพ์จากระบบ FFC HR · ${new Date().toLocaleDateString('th-TH')}</div>

      </body></html>`);
    win.document.close();
  };

  return (
    <div className="p-8 space-y-6 animate-fade-up">
      <Topbar title="เบิกค่าใช้จ่าย" subtitle="ใบขออนุมัติเดินทางและเบิกเบี้ยเลี้ยง"
        action={
          <div className="flex gap-2">
            <Button variant="outline" icon="download" onClick={exportExcel}>Export</Button>
            <Button icon="plus" onClick={() => { setEditing(null); setOpenForm(true); }}>สร้างใบเบิก</Button>
          </div>
        }
      />

      {/* filter สถานะ */}
      <div className="flex gap-1 bg-ink-100 p-1 rounded-xl w-fit">
        {[['all','ทั้งหมด'],['pending','รออนุมัติ'],['approved','อนุมัติแล้ว'],['paid','จ่ายแล้ว']].map(([id,label]) => (
          <button key={id} onClick={() => setFilterStatus(id)}
            className={cls('px-4 py-2 rounded-lg text-sm font-medium transition-colors', filterStatus === id ? 'bg-white text-brand-700 shadow-soft' : 'text-ink-600 hover:text-ink-900')}>
            {label}

        ))}

      <Card className="overflow-hidden">
        {visible.length === 0 ? (
          <Empty icon="receipt" title="ยังไม่มีใบเบิก" desc='คลิก "สร้างใบเบิก" เพื่อขออนุมัติเดินทาง/เบิกเบี้ยเลี้ยง' />
        ) : (
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead className="bg-ink-50 text-ink-600 text-left">
