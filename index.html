                  <th className="px-5 py-3 font-medium">ปลายทาง / งาน</th>
                  <th className="px-5 py-3 font-medium">วันที่</th>
                  <th className="px-5 py-3 font-medium text-right">ยอดรวม</th>
                  <th className="px-5 py-3 font-medium text-center">สถานะ</th>
                  <th className="px-5 py-3 font-medium text-right">จัดการ</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-ink-100">
                {visible.map(exp => {
                  const emp = employees.find(e => e.id === exp.employeeId);
                  const st = STATUS[exp.status] || STATUS.pending;
                  return (
                    <tr key={exp.id} className="hover:bg-flow-50/40">
                      <td className="px-5 py-3">
                        <div className="font-medium text-ink-900">{emp ? `${emp.firstName} ${emp.lastName}` : exp.employeeId}</div>
                        <div className="text-xs text-ink-400">{exp.employeeId}</div>
                      </td>
                      <td className="px-5 py-3">
                        <div className="text-ink-800">{exp.destination || '-'}</div>
                        <div className="text-xs text-ink-400 truncate max-w-[200px]">{exp.purpose || ''}</div>
                      </td>
                      <td className="px-5 py-3 text-ink-600">{fmtDate(exp.dateFrom)}{exp.dateTo && exp.dateTo !== exp.dateFrom ? ` - ${fmtDate(exp.dateTo)}` : ''}</td>
                      <td className="px-5 py-3 text-right font-display font-semibold text-ink-900">{fmtMoney(exp.total || 0)}</td>
                      <td className="px-5 py-3 text-center">
                        <span className={cls('text-xs font-medium px-2.5 py-1 rounded-lg', `bg-${st.color}-50 text-${st.color}-700`)}>{st.label}</span>
                        {exp.slipData && <span className="ml-1 inline-flex items-center" title="มีสลิปโอนเงิน"><Icon name="receipt" className="w-3.5 h-3.5 text-emerald-500" /></span>}
                      </td>
                      <td className="px-5 py-3 text-right">
                        <div className="inline-flex gap-1">
                          <button onClick={() => { setEditing(exp); setOpenForm(true); }} className="p-1.5 rounded-lg text-ink-500 hover:bg-flow-50 hover:text-flow-700" title="ดู/แก้ไข"><Icon name="edit" className="w-4 h-4" /></button>
                          <button onClick={() => printForm(exp)} className="p-1.5 rounded-lg text-ink-500 hover:bg-brand-50 hover:text-brand-700" title="พิมพ์ใบฟอร์ม"><Icon name="file" className="w-4 h-4" /></button>
                          {canApproveAll && exp.status === 'pending' && (
                            <>
                              <button onClick={() => setStatus(exp.id, 'approved')} className="p-1.5 rounded-lg text-emerald-600 hover:bg-emerald-50" title="อนุมัติ"><Icon name="check" className="w-4 h-4" /></button>
                              <button onClick={() => setStatus(exp.id, 'rejected')} className="p-1.5 rounded-lg text-red-500 hover:bg-red-50" title="ปฏิเสธ"><Icon name="x" className="w-4 h-4" /></button>
                            </>
                          )}
                          {canApproveAll && exp.status === 'approved' && (
                            <button onClick={() => setStatus(exp.id, 'paid')} className="p-1.5 rounded-lg text-flow-600 hover:bg-flow-50" title="ทำเครื่องหมายจ่ายแล้ว"><Icon name="tag" className="w-4 h-4" /></button>
                          )}
                          <button onClick={() => deleteOne(exp.id)} className="p-1.5 rounded-lg text-ink-500 hover:bg-red-50 hover:text-red-600" title="ลบ"><Icon name="trash" className="w-4 h-4" /></button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      {openForm && (
        <ExpenseFormModal
          open={openForm}
          onClose={() => { setOpenForm(false); setEditing(null); }}
          editing={editing}
          onSave={saveOne}
          employees={employees}
          myEmp={myEmp}
          canApproveAll={canApproveAll}
        />
      )}
    </div>
  );
};

/* ───────────── EXPENSE FORM MODAL — ใบขออนุมัติเดินทาง + เบิกเบี้ยเลี้ยง ───────────── */
const ExpenseFormModal = ({ open, onClose, editing, onSave, employees, myEmp, canApproveAll }) => {
  const [form, setForm] = useState({});

  useEffect(() => {
    if (editing) setForm(JSON.parse(JSON.stringify(editing)));
    else setForm({
      id: '', employeeId: myEmp?.id || '', level: 1, tripType: 'overnight',
      destination: '', purpose: '', dateFrom: new Date().toISOString().split('T')[0], dateTo: '',
      days: 1, offsiteHours: 0,
      lodgingActual: 0, carKm: 0, transportActual: 0, otherCost: 0,
      status: 'pending', note: '', createdAt: new Date().toISOString(),
    });
  }, [editing, open, myEmp]);

  if (!open) return null;

  const rate = PER_DIEM_RATES[form.level] || PER_DIEM_RATES[1];

  // คำนวณแต่ละส่วน
  const calc = () => {
    let perDiemTotal = 0;
    if (form.tripType === 'overnight') {
      perDiemTotal = (Number(form.days) || 0) * rate.perDiem;     // ค้างคืน: เบี้ยเลี้ยง × วัน
    } else {
      perDiemTotal = calcOffsitePerDiem(form.level, Number(form.offsiteHours) || 0);  // ไปเช้าเย็นกลับ
    }
    const lodging = Math.min(Number(form.lodgingActual) || 0, rate.lodging * (Number(form.days) || 1));  // ไม่เกินเพดาน
    const carCost = (Number(form.carKm) || 0) * OWN_CAR_RATE;
    const transport = Number(form.transportActual) || 0;
    const other = Number(form.otherCost) || 0;
    const total = perDiemTotal + lodging + carCost + transport + other;
    return { perDiemTotal, lodging, carCost, transport, other, total };
  };
  const c = calc();
  const lodgingCap = rate.lodging * (Number(form.days) || 1);
  const overLodging = (Number(form.lodgingActual) || 0) > lodgingCap;

  const submit = (e) => {
    e.preventDefault();
    if (!form.employeeId) return alert('กรุณาเลือกผู้ขอเบิก');
    if (!form.destination.trim()) return alert('กรุณาระบุปลายทาง');
    onSave({ ...form, id: form.id || `EXP${Date.now()}`, total: c.total, breakdown: c });
  };

  const readOnly = editing && editing.status !== 'pending' && !canApproveAll;

  return (
    <Modal open={open} onClose={onClose} title={editing ? 'รายละเอียดใบเบิก' : 'สร้างใบเบิกค่าใช้จ่าย'} size="xl">
      <form onSubmit={submit} className="space-y-4">
        {/* ข้อมูลทั่วไป */}
        <div className="grid md:grid-cols-2 gap-3">
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">ผู้ขอเบิก (พิมพ์ชื่อเพื่อค้นหา)</label>
            <input
              list="emp-list-expense"
              value={(() => { const e = employees.find(x => x.id === form.employeeId); return e ? `${e.id} - ${e.firstName} ${e.lastName}` : (form.employeeId || ''); })()}
              onChange={(e) => {
                const val = e.target.value;
                // หาจาก "EMP011 - ชื่อ" หรือพิมพ์ชื่อ/รหัสบางส่วน
                const match = employees.find(emp =>
                  `${emp.id} - ${emp.firstName} ${emp.lastName}` === val ||
                  emp.id.toLowerCase() === val.toLowerCase()
                );
                setForm({ ...form, employeeId: match ? match.id : val });
              }}
              disabled={readOnly || (!canApproveAll && !!myEmp)}
              placeholder="พิมพ์ชื่อหรือรหัสพนักงาน..."
              className="w-full px-3 py-2 rounded-xl border border-ink-200 focus:border-flow-400 focus:ring-2 focus:ring-flow-100 outline-none text-sm"
              required
            />
            <datalist id="emp-list-expense">
              {employees.slice().sort((a,b)=>String(a.id).localeCompare(String(b.id),undefined,{numeric:true})).map(e => (
                <option key={e.id} value={`${e.id} - ${e.firstName} ${e.lastName}`} />
              ))}
            </datalist>
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">ระดับตำแหน่ง (เบี้ยเลี้ยง)</label>
            <Select value={form.level} onChange={(e) => setForm({ ...form, level: Number(e.target.value) })} disabled={readOnly}>
              {Object.entries(PER_DIEM_RATES).map(([lv, r]) => <option key={lv} value={lv}>{r.label} ({r.perDiem}฿/วัน)</option>)}
            </Select>
          </div>
        </div>

        <div className="grid md:grid-cols-2 gap-3">
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">ปลายทาง</label>
            <Input value={form.destination || ''} onChange={(e) => setForm({ ...form, destination: e.target.value })} placeholder="เช่น มหาสารคาม" disabled={readOnly} required />
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">ลักษณะงาน</label>
            <Input value={form.purpose || ''} onChange={(e) => setForm({ ...form, purpose: e.target.value })} placeholder="เช่น ตรวจสต็อกสาขา" disabled={readOnly} />
          </div>
        </div>

        {/* ประเภทการเดินทาง */}
        <div className="bg-brand-50 border border-brand-100 rounded-xl p-4 space-y-3">
          <div className="flex gap-2">
            {[['overnight','ค้างคืน (ต่างจังหวัด)'],['offsite','ไปเช้า-เย็นกลับ (ไม่ค้างคืน)']].map(([v,label]) => (
              <button key={v} type="button" onClick={() => !readOnly && setForm({ ...form, tripType: v })}
                className={cls('flex-1 py-2 rounded-lg text-sm font-medium border transition-colors', form.tripType === v ? 'bg-brand-600 text-white border-brand-600' : 'bg-white text-ink-600 border-ink-200')}>
                {label}
              </button>
            ))}
          </div>

          {form.tripType === 'overnight' ? (
            <div className="grid md:grid-cols-3 gap-3">
              <div>
                <label className="block text-sm font-medium text-ink-700 mb-1.5">วันที่ไป</label>
                <Input type="date" value={form.dateFrom || ''} onChange={(e) => {
                  const dateFrom = e.target.value;
                  // คำนวณจำนวนวันอัตโนมัติ (นับรวมวันไปและวันกลับ)
                  let days = form.days;
                  if (dateFrom && form.dateTo) {
                    const diff = Math.round((new Date(form.dateTo) - new Date(dateFrom)) / 86400000) + 1;
                    if (diff > 0) days = diff;
                  }
                  setForm({ ...form, dateFrom, days });
                }} disabled={readOnly} />
              </div>
              <div>
                <label className="block text-sm font-medium text-ink-700 mb-1.5">วันที่กลับ</label>
                <Input type="date" value={form.dateTo || ''} min={form.dateFrom || ''} onChange={(e) => {
                  const dateTo = e.target.value;
                  let days = form.days;
                  if (form.dateFrom && dateTo) {
                    const diff = Math.round((new Date(dateTo) - new Date(form.dateFrom)) / 86400000) + 1;
                    if (diff > 0) days = diff;
                  }
                  setForm({ ...form, dateTo, days });
                }} disabled={readOnly} />
              </div>
              <div>
                <label className="block text-sm font-medium text-ink-700 mb-1.5">จำนวนวัน</label>
                <Input type="number" min={1} value={form.days || 1} onChange={(e) => setForm({ ...form, days: Number(e.target.value) })} disabled={readOnly} />
                <p className="text-xs text-ink-400 mt-1">คำนวณอัตโนมัติ (แก้ได้)</p>
              </div>
            </div>
          ) : (
            <div className="grid md:grid-cols-2 gap-3">
              <div>
                <label className="block text-sm font-medium text-ink-700 mb-1.5">วันที่</label>
                <Input type="date" value={form.dateFrom || ''} onChange={(e) => setForm({ ...form, dateFrom: e.target.value })} disabled={readOnly} />
              </div>
              <div>
                <label className="block text-sm font-medium text-ink-700 mb-1.5">ชั่วโมงปฏิบัติงานนอกสถานที่</label>
                <Input type="number" min={0} step={0.5} value={form.offsiteHours || 0} onChange={(e) => setForm({ ...form, offsiteHours: Number(e.target.value) })} disabled={readOnly} />
                <p className="text-xs text-ink-400 mt-1">≤4ชม.=ไม่จ่าย · 4-8ชม.=50% · &gt;8ชม.=100%</p>
              </div>
            </div>
          )}
        </div>

        {/* ค่าใช้จ่ายตามจริง */}
        <div className="grid md:grid-cols-2 gap-3">
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">ค่าที่พักจริง (เพดาน {fmtMoney(lodgingCap)})</label>
            <Input type="number" min={0} value={form.lodgingActual || 0} onChange={(e) => setForm({ ...form, lodgingActual: Number(e.target.value) })} disabled={readOnly || form.tripType === 'offsite'} />
            {overLodging && <p className="text-xs text-gold-600 mt-1">⚠ เกินเพดาน จะเบิกได้ {fmtMoney(lodgingCap)}</p>}
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">ระยะทางรถส่วนตัว (กม. ไป-กลับ) × {OWN_CAR_RATE}฿</label>
            <Input type="number" min={0} value={form.carKm || 0} onChange={(e) => setForm({ ...form, carKm: Number(e.target.value) })} disabled={readOnly} />
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">ค่าเดินทางอื่น (ตั๋ว/ทางด่วน/แท็กซี่)</label>
            <Input type="number" min={0} value={form.transportActual || 0} onChange={(e) => setForm({ ...form, transportActual: Number(e.target.value) })} disabled={readOnly} />
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">ค่าใช้จ่ายอื่นๆ</label>
            <Input type="number" min={0} value={form.otherCost || 0} onChange={(e) => setForm({ ...form, otherCost: Number(e.target.value) })} disabled={readOnly} />
          </div>
        </div>

        {/* สรุปยอด */}
        <div className="bg-ink-50 rounded-xl p-4 space-y-1.5 text-sm">
          <div className="flex justify-between"><span className="text-ink-600">เบี้ยเลี้ยง{form.tripType === 'overnight' ? ` (${form.days} วัน × ${rate.perDiem}฿)` : ` (${form.offsiteHours}ชม.)`}</span><span className="font-medium">{fmtMoney(c.perDiemTotal)}</span></div>
          {c.lodging > 0 && <div className="flex justify-between"><span className="text-ink-600">ค่าที่พัก</span><span className="font-medium">{fmtMoney(c.lodging)}</span></div>}
          {c.carCost > 0 && <div className="flex justify-between"><span className="text-ink-600">ค่ารถส่วนตัว ({form.carKm} กม.)</span><span className="font-medium">{fmtMoney(c.carCost)}</span></div>}
          {c.transport > 0 && <div className="flex justify-between"><span className="text-ink-600">ค่าเดินทางอื่น</span><span className="font-medium">{fmtMoney(c.transport)}</span></div>}
          {c.other > 0 && <div className="flex justify-between"><span className="text-ink-600">อื่นๆ</span><span className="font-medium">{fmtMoney(c.other)}</span></div>}
          <div className="flex justify-between pt-2 border-t border-ink-200 text-base"><span className="font-semibold text-ink-800">รวมทั้งสิ้น</span><span className="font-display font-bold text-brand-700">{fmtMoney(c.total)} บาท</span></div>
          {c.perDiemTotal > PER_DIEM_TAX_FREE_CAP * (form.days || 1) && form.tripType === 'overnight' && (
            <p className="text-xs text-gold-600">หมายเหตุ: เบี้ยเลี้ยงเกิน {PER_DIEM_TAX_FREE_CAP}฿/วัน ส่วนเกินต้องมีหลักฐาน</p>
          )}
        </div>

        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">หมายเหตุ</label>
          <Textarea rows={2} value={form.note || ''} onChange={(e) => setForm({ ...form, note: e.target.value })} disabled={readOnly} />
        </div>

        {/* สถานะ (ถ้าอนุมัติแล้ว) */}
        {editing && editing.status !== 'pending' && (
          <div className="text-sm text-ink-500">
            สถานะ: <span className="font-medium">{editing.status === 'approved' ? 'อนุมัติแล้ว' : editing.status === 'paid' ? 'จ่ายแล้ว' : 'ปฏิเสธ'}</span>
            {editing.approvedBy ? ` โดย ${editing.approvedBy}` : ''}
          </div>
        )}

        {/* แนบสลิปโอนเงิน — แสดงเมื่ออนุมัติแล้ว/จ่ายแล้ว */}
        {editing && (form.status === 'approved' || form.status === 'paid') && (
          <div className="bg-emerald-50 border border-emerald-100 rounded-xl p-4">
            <h4 className="font-medium text-ink-800 mb-2 flex items-center gap-2">
              <Icon name="receipt" className="w-4 h-4 text-emerald-600" /> สลิปการโอนเงิน
            </h4>
            {form.slipData ? (
              <div className="space-y-2">
                {form.slipData.startsWith('data:image') ? (
                  <img src={form.slipData} alt="สลิป" className="max-h-64 rounded-lg border border-ink-200" />
                ) : (
                  <div className="flex items-center gap-2 text-sm text-ink-600">
                    <Icon name="file" className="w-4 h-4" /> {form.slipName || 'สลิป.pdf'}
                  </div>
                )}
                <div className="flex gap-2">
                  <button type="button" onClick={() => {
                    const a = document.createElement('a'); a.href = form.slipData;
                    a.download = form.slipName || 'slip'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
                  }} className="text-xs px-3 py-1.5 rounded-lg border border-ink-200 hover:bg-white text-ink-600">ดาวน์โหลด</button>
                  {canApproveAll && (
                    <button type="button" onClick={() => setForm({ ...form, slipData: '', slipName: '' })}
                      className="text-xs px-3 py-1.5 rounded-lg border border-red-200 text-red-600 hover:bg-red-50">ลบสลิป</button>
                  )}
                </div>
              </div>
            ) : canApproveAll ? (
              <div>
                <input type="file" accept="image/*,application/pdf" id="slip-upload" className="hidden" onChange={async (e) => {
                  const file = e.target.files?.[0];
                  if (!file) return;
                  if (file.size > 5 * 1024 * 1024) { alert('ไฟล์ใหญ่เกิน 5MB'); return; }
                  try {
                    if (api.enabled()) {
                      const url = await sbStorage.upload('expense-slips', file);
                      setForm(f => ({ ...f, slipData: url, slipName: file.name }));
                    } else {
                      const reader = new FileReader();
                      reader.onload = () => setForm(f => ({ ...f, slipData: reader.result, slipName: file.name }));
                      reader.readAsDataURL(file);
                    }
                  } catch (err) { alert('อัปโหลดไม่สำเร็จ: ' + err.message); }
                }} />
                <label htmlFor="slip-upload" className="cursor-pointer inline-flex items-center gap-2 px-4 py-2 rounded-xl border border-emerald-300 hover:bg-emerald-100 text-sm font-medium text-emerald-700">
                  <Icon name="upload" className="w-4 h-4" /> แนบสลิปโอนเงิน (รูป/PDF)
                </label>
                <p className="text-xs text-ink-400 mt-1.5">รองรับรูปภาพหรือ PDF ขนาดไม่เกิน 5MB</p>
              </div>
            ) : (
              <p className="text-sm text-ink-400">ยังไม่มีสลิปการโอนเงิน</p>
            )}
          </div>
        )}

        <div className="flex justify-end gap-2 pt-3 border-t border-ink-100">
          <Button type="button" variant="secondary" onClick={onClose}>ปิด</Button>
          {(!readOnly || canApproveAll) && <Button type="submit" icon={editing ? 'check' : 'plus'}>{editing ? 'บันทึก' : 'สร้างใบเบิก'}</Button>}
        </div>
      </form>
    </Modal>
  );
};

/* ═══════════════════════════════════════════════════════════
   POLICIES PAGE — ระเบียบบริษัท (อัปโหลด PDF ให้ดาวน์โหลด/ดู)
═══════════════════════════════════════════════════════════ */
const PoliciesPage = () => {
  const { settings, setSettings, user, addToast } = useApp();
  const [tab, setTab] = useState('news');     // news | docs
  const [uploading, setUploading] = useState(false);
  const fileRef = useRef(null);
  const [pendingFile, setPendingFile] = useState(null);
  const [title, setTitle] = useState('');
  const [category, setCategory] = useState('ระเบียบทั่วไป');

  // ── ข่าวสาร/ประกาศ ──
  const [openNews, setOpenNews] = useState(false);
  const [editNews, setEditNews] = useState(null);

  const canManage = user.role === 'admin' || user.role === 'hr';

  // เก็บใน settings.policies (เอกสาร PDF) + settings.announcements (ข่าวสาร)
  const policies = (settings && settings.policies) || [];
  const announcements = (settings && settings.announcements) || [];

  // เมื่อเปิดแท็บประกาศ → บันทึกเวลาอ่านล่าสุด (เคลียร์แจ้งเตือนกระดิ่ง)
  useEffect(() => {
    if (tab === 'news') {
      try {
        localStorage.setItem('ffc_news_seen', String(Date.now()));
        window.dispatchEvent(new Event('ffc-news-seen'));   // บอก Topbar ให้อัปเดต badge
      } catch {}
    }
  }, [tab]);

  const saveAnnouncements = async (list) => {
    const newSettings = { ...settings, announcements: list };
    setSettings(newSettings);
    if (api.enabled()) {
      try { await api.post('saveSettingsKey', { key: 'announcements', data: list }); }
      catch (err) { addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message); }
    }
  };
  const saveNews = (news) => {
    let list;
    if (announcements.some(a => a.id === news.id)) list = announcements.map(a => a.id === news.id ? news : a);
    else list = [news, ...announcements];
    saveAnnouncements(list);
    addToast('success', editNews ? 'แก้ไขประกาศเรียบร้อย' : 'เผยแพร่ประกาศเรียบร้อย');
    setOpenNews(false); setEditNews(null);
  };
  const deleteNews = (id) => {
    if (!confirm('ลบประกาศนี้?')) return;
    saveAnnouncements(announcements.filter(a => a.id !== id));
    addToast('success', 'ลบเรียบร้อย');
  };

  const savePolicies = async (list) => {
    const newSettings = { ...settings, policies: list };
    setSettings(newSettings);
    if (api.enabled()) {
      try { await api.post('saveSettingsKey', { key: 'policies', data: list }); }
      catch (err) { addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message); }
    }
  };

  const onPickFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.type !== 'application/pdf') { addToast('error', 'รองรับเฉพาะไฟล์ PDF'); return; }
    if (file.size > 10 * 1024 * 1024) { addToast('error', 'ไฟล์ใหญ่เกิน 10MB กรุณาบีบอัดก่อน'); return; }
    setPendingFile(file);
    if (!title) setTitle(file.name.replace(/\.pdf$/i, ''));
  };

  const doUpload = async () => {
    if (!pendingFile) { addToast('error', 'กรุณาเลือกไฟล์ PDF'); return; }
    if (!title.trim()) { addToast('error', 'กรุณาตั้งชื่อเอกสาร'); return; }
    setUploading(true);
    try {
      // อัปโหลดไป Storage (ถ้าเชื่อม Supabase) ไม่งั้น fallback เป็น base64
      let fileData;
      if (api.enabled()) {
        fileData = await sbStorage.upload('policies', pendingFile);
      } else {
        fileData = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(r.result); r.onerror = rej;
          r.readAsDataURL(pendingFile);
        });
      }
      const newDoc = {
        id: `POL${Date.now()}`,
        title: title.trim(),
        category,
        fileName: pendingFile.name,
        fileData,                   // URL จาก Storage (หรือ base64 ถ้า offline)
        size: pendingFile.size,
        uploadedAt: new Date().toISOString(),
        uploadedBy: user.name || user.username,
      };
      await savePolicies([...policies, newDoc]);
      addToast('success', 'อัปโหลดเอกสารเรียบร้อย');
      setPendingFile(null); setTitle(''); setCategory('ระเบียบทั่วไป');
      if (fileRef.current) fileRef.current.value = '';
    } catch (err) {
      addToast('error', 'อัปโหลดไม่สำเร็จ: ' + err.message);
    } finally {
      setUploading(false);
    }
  };

  const deleteDoc = (id) => {
    if (!confirm('ลบเอกสารนี้?')) return;
    savePolicies(policies.filter(p => p.id !== id));
    addToast('success', 'ลบเรียบร้อย');
  };

  const downloadDoc = (doc) => {
    const a = document.createElement('a');
    a.href = doc.fileData;
    a.download = doc.fileName;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };

  const viewDoc = (doc) => {
    // เปิดในแท็บใหม่
    const win = window.open();
    if (win) win.document.write(`<iframe src="${doc.fileData}" style="width:100%;height:100vh;border:none"></iframe>`);
  };

  const fmtSize = (b) => b > 1024 * 1024 ? `${(b / 1024 / 1024).toFixed(1)} MB` : `${Math.round(b / 1024)} KB`;
  const fmtDate = (iso) => { try { const d = new Date(iso); return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()+543}`; } catch { return ''; } };

  // จัดกลุ่มตามหมวด
  const categories = [...new Set(policies.map(p => p.category || 'อื่นๆ'))];

  return (
    <div className="p-8 space-y-6 animate-fade-up">
      <Topbar title="ระเบียบบริษัท" subtitle="ประกาศข่าวสาร เอกสารระเบียบ และข้อบังคับ"
        action={canManage && tab === 'news' && <Button icon="plus" onClick={() => { setEditNews(null); setOpenNews(true); }}>เขียนประกาศ</Button>}
      />

      {/* Tabs */}
      <div className="flex gap-1 bg-ink-100 p-1 rounded-xl w-fit">
        {[['news','ประกาศข่าวสาร'],['docs','เอกสารระเบียบ']].map(([id, label]) => (
          <button key={id} onClick={() => setTab(id)}
            className={cls('px-4 py-2 rounded-lg text-sm font-medium transition-colors', tab === id ? 'bg-white text-brand-700 shadow-soft' : 'text-ink-600 hover:text-ink-900')}>
            {label}
          </button>
        ))}
      </div>

      {/* ── แท็บ ประกาศข่าวสาร ── */}
      {tab === 'news' && (
        announcements.length === 0 ? (
          <Empty icon="bell" title="ยังไม่มีประกาศ" desc={canManage ? 'คลิก "เขียนประกาศ" เพื่อเผยแพร่ข่าวสาร' : 'ยังไม่มีประกาศจากบริษัท'} />
        ) : (
          <div className="space-y-4">
            {announcements.map(news => {
              const typeColor = { 'ทั่วไป': 'flow', 'สำคัญ': 'gold', 'ด่วน': 'red', 'กิจกรรม': 'emerald' }[news.type] || 'flow';
              return (
                <Card key={news.id} className={cls('p-5', news.pinned && 'ring-2 ring-gold-200')}>
                  <div className="flex items-start justify-between gap-3">
                    <div className="flex items-center gap-2 flex-wrap">
                      {news.pinned && <span className="text-gold-500" title="ปักหมุด">📌</span>}
                      <span className={cls('text-xs font-medium px-2 py-0.5 rounded-lg', `bg-${typeColor}-50 text-${typeColor}-700`)}>{news.type || 'ทั่วไป'}</span>
                      <h3 className="font-display font-semibold text-ink-900">{news.title}</h3>
                    </div>
                    {canManage && (
                      <div className="flex items-center gap-1 shrink-0">
                        <button onClick={() => { setEditNews(news); setOpenNews(true); }} className="p-1.5 rounded-lg text-ink-500 hover:bg-flow-50 hover:text-flow-700"><Icon name="edit" className="w-4 h-4" /></button>
                        <button onClick={() => deleteNews(news.id)} className="p-1.5 rounded-lg text-ink-500 hover:bg-red-50 hover:text-red-600"><Icon name="trash" className="w-4 h-4" /></button>
                      </div>
                    )}
                  </div>
                  <div className="text-sm text-ink-700 mt-2 announcement-body" dangerouslySetInnerHTML={{ __html: news.body || '' }} />
                  {news.image && <img src={news.image} alt="" className="mt-3 max-h-72 rounded-lg border border-ink-100" />}
                  <div className="text-xs text-ink-400 mt-3 flex items-center gap-2">
                    <Icon name="clock" className="w-3.5 h-3.5" />
                    {(() => { try { const d = new Date(news.createdAt); return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()+543}`; } catch { return ''; } })()}
                    {news.author ? ` · โดย ${news.author}` : ''}
                  </div>
                </Card>
              );
            })}
          </div>
        )
      )}

      {/* ── แท็บ เอกสารระเบียบ ── */}
      {tab === 'docs' && <>
      {/* อัปโหลด (เฉพาะ admin/hr) */}
      {canManage && (
        <Card className="p-5">
          <h3 className="font-display font-semibold text-ink-900 mb-3 flex items-center gap-2">
            <Icon name="upload" className="w-4 h-4 text-brand-600" /> อัปโหลดเอกสารใหม่
          </h3>
          <div className="grid md:grid-cols-2 gap-3">
            <div>
              <label className="block text-sm font-medium text-ink-700 mb-1.5">ชื่อเอกสาร</label>
              <Input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="เช่น ระเบียบการลา ปี 2569" />
            </div>
            <div>
              <label className="block text-sm font-medium text-ink-700 mb-1.5">หมวดหมู่</label>
              <Select value={category} onChange={(e) => setCategory(e.target.value)}>
                <option value="ระเบียบทั่วไป">ระเบียบทั่วไป</option>
                <option value="การลา/ขาด/สาย">การลา/ขาด/สาย</option>
                <option value="เบี้ยเลี้ยง/ค่าใช้จ่าย">เบี้ยเลี้ยง/ค่าใช้จ่าย</option>
                <option value="ความปลอดภัย">ความปลอดภัย</option>
                <option value="ประกาศ">ประกาศ</option>
                <option value="อื่นๆ">อื่นๆ</option>
              </Select>
            </div>
          </div>
          <div className="mt-3 flex items-center gap-3">
            <input ref={fileRef} type="file" accept="application/pdf" onChange={onPickFile} className="hidden" id="policy-file" />
            <label htmlFor="policy-file" className="cursor-pointer px-4 py-2 rounded-xl border border-ink-200 hover:border-brand-400 hover:bg-brand-50 text-sm font-medium text-ink-700 flex items-center gap-2">
              <Icon name="file" className="w-4 h-4" /> {pendingFile ? pendingFile.name : 'เลือกไฟล์ PDF'}
            </label>
            {pendingFile && <span className="text-xs text-ink-500">{fmtSize(pendingFile.size)}</span>}
            <Button icon="upload" onClick={doUpload} disabled={uploading || !pendingFile} className="ml-auto">
              {uploading ? 'กำลังอัปโหลด...' : 'อัปโหลด'}
            </Button>
          </div>
          <p className="text-xs text-ink-400 mt-2">รองรับ PDF ขนาดไม่เกิน 4MB</p>
        </Card>
      )}

      {/* รายการเอกสาร */}
      {policies.length === 0 ? (
        <Empty icon="book" title="ยังไม่มีเอกสารระเบียบ" desc={canManage ? 'อัปโหลดเอกสาร PDF ด้านบนเพื่อเริ่มต้น' : 'ยังไม่มีเอกสารให้ดาวน์โหลด'} />
      ) : (
        <div className="space-y-5">
          {categories.map(cat => (
            <div key={cat}>
              <h3 className="text-sm font-semibold text-ink-500 mb-2">{cat}</h3>
              <div className="grid md:grid-cols-2 gap-3">
                {policies.filter(p => (p.category || 'อื่นๆ') === cat).map(doc => (
                  <Card key={doc.id} className="p-4 flex items-center gap-3">
                    <div className="w-11 h-11 rounded-xl bg-red-50 text-red-600 flex items-center justify-center shrink-0">
                      <Icon name="file" className="w-5 h-5" />
                    </div>
                    <div className="min-w-0 flex-1">
                      <div className="font-medium text-ink-900 truncate">{doc.title}</div>
                      <div className="text-xs text-ink-400">{fmtSize(doc.size)} · {fmtDate(doc.uploadedAt)}</div>
                    </div>
                    <div className="flex items-center gap-1 shrink-0">
                      <button onClick={() => viewDoc(doc)} className="p-2 rounded-lg text-ink-500 hover:bg-flow-50 hover:text-flow-700" title="ดู"><Icon name="eye" className="w-4 h-4" /></button>
                      <button onClick={() => downloadDoc(doc)} className="p-2 rounded-lg text-ink-500 hover:bg-brand-50 hover:text-brand-700" title="ดาวน์โหลด"><Icon name="download" className="w-4 h-4" /></button>
                      {canManage && <button onClick={() => deleteDoc(doc.id)} className="p-2 rounded-lg text-ink-500 hover:bg-red-50 hover:text-red-600" title="ลบ"><Icon name="trash" className="w-4 h-4" /></button>}
                    </div>
                  </Card>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
      </>}

      {openNews && <AnnouncementModal open={openNews} onClose={() => { setOpenNews(false); setEditNews(null); }} editing={editNews} onSave={saveNews} author={user.name || user.username} />}
    </div>
  );
};

/* ───────────── ANNOUNCEMENT MODAL — เขียน/แก้ประกาศข่าวสาร ───────────── */
const AnnouncementModal = ({ open, onClose, editing, onSave, author }) => {
  const [form, setForm] = useState({});

  useEffect(() => {
    if (editing) setForm(JSON.parse(JSON.stringify(editing)));
    else setForm({ id: '', title: '', body: '', type: 'ทั่วไป', pinned: false, image: '', createdAt: new Date().toISOString(), author });
  }, [editing, open, author]);

  if (!open) return null;

  const submit = (e) => {
    e.preventDefault();
    if (!form.title.trim()) return alert('กรุณากรอกหัวข้อ');
    // ดึงข้อความล้วนเพื่อเช็คว่าว่างไหม (body เป็น HTML)
    const plain = (form.body || '').replace(/<[^>]*>/g, '').replace(/&nbsp;/g, '').trim();
    if (!plain) return alert('กรุณากรอกเนื้อหา');
    onSave({ ...form, id: form.id || `NEWS${Date.now()}` });
  };

  const pickImage = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) { alert('รองรับเฉพาะรูปภาพ'); return; }
    if (file.size > 10 * 1024 * 1024) { alert('รูปใหญ่เกิน 10MB'); return; }
    try {
      if (api.enabled()) {
        const url = await sbStorage.upload('announcements', file);
        setForm(f => ({ ...f, image: url }));
      } else {
        const reader = new FileReader();
        reader.onload = () => setForm(f => ({ ...f, image: reader.result }));
        reader.readAsDataURL(file);
      }
    } catch (err) { alert('อัปโหลดรูปไม่สำเร็จ: ' + err.message); }
  };

  // rich text toolbar — ใช้ execCommand บน contentEditable
  const editorRef = useRef(null);
  const exec = (cmd, val) => { document.execCommand(cmd, false, val); editorRef.current?.focus(); syncBody(); };
  const syncBody = () => { if (editorRef.current) setForm(f => ({ ...f, body: editorRef.current.innerHTML })); };
  // ตั้งค่าเนื้อหาเริ่มต้นใน editor (ครั้งแรกที่เปิด)
  useEffect(() => {
    if (open && editorRef.current) {
      editorRef.current.innerHTML = (editing && editing.body) || '';
    }
  }, [open, editing]);

  return (
    <Modal open={open} onClose={onClose} title={editing ? 'แก้ไขประกาศ' : 'เขียนประกาศใหม่'} size="lg">
      <form onSubmit={submit} className="space-y-4">
        <div className="grid md:grid-cols-3 gap-3">
          <div className="md:col-span-2">
            <label className="block text-sm font-medium text-ink-700 mb-1.5">หัวข้อประกาศ</label>
            <Input value={form.title || ''} onChange={(e) => setForm({ ...form, title: e.target.value })} placeholder="เช่น วันหยุดสงกรานต์ 2569" required />
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">ประเภท</label>
            <Select value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })}>
              <option value="ทั่วไป">ทั่วไป</option>
              <option value="สำคัญ">สำคัญ</option>
              <option value="ด่วน">ด่วน</option>
              <option value="กิจกรรม">กิจกรรม</option>
            </Select>
          </div>
        </div>
        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">เนื้อหา</label>
          {/* Toolbar จัดรูปแบบ */}
          <div className="flex flex-wrap items-center gap-1 mb-2 p-1.5 bg-ink-50 rounded-lg border border-ink-200">
            <button type="button" onClick={() => exec('bold')} className="w-8 h-8 rounded hover:bg-white font-bold text-ink-700" title="ตัวหนา">B</button>
            <button type="button" onClick={() => exec('italic')} className="w-8 h-8 rounded hover:bg-white italic text-ink-700" title="ตัวเอียง">I</button>
            <button type="button" onClick={() => exec('underline')} className="w-8 h-8 rounded hover:bg-white underline text-ink-700" title="ขีดเส้นใต้">U</button>
            <div className="w-px h-6 bg-ink-200 mx-1" />
            {/* ขนาดตัวอักษร */}
            <select onChange={(e) => { exec('fontSize', e.target.value); e.target.value=''; }} defaultValue="" className="h-8 px-2 rounded border border-ink-200 text-sm text-ink-700 bg-white" title="ขนาดตัวอักษร">
              <option value="" disabled>ขนาด</option>
              <option value="1">เล็กมาก</option>
              <option value="2">เล็ก</option>
              <option value="3">ปกติ</option>
              <option value="5">ใหญ่</option>
              <option value="6">ใหญ่มาก</option>
              <option value="7">ใหญ่ที่สุด</option>
            </select>
            <div className="w-px h-6 bg-ink-200 mx-1" />
            {/* สี */}
            <input type="color" onChange={(e) => exec('foreColor', e.target.value)} className="w-8 h-8 rounded cursor-pointer border border-ink-200" title="สีตัวอักษร" defaultValue="#1E293B" />
            <button type="button" onClick={() => exec('insertUnorderedList')} className="w-8 h-8 rounded hover:bg-white text-ink-700" title="รายการ">•</button>
            <div className="w-px h-6 bg-ink-200 mx-1" />
            <button type="button" onClick={() => exec('removeFormat')} className="px-2 h-8 rounded hover:bg-white text-xs text-ink-500" title="ล้างรูปแบบ">ล้าง</button>
          </div>
          {/* พื้นที่พิมพ์ */}
          <div
            ref={editorRef}
            contentEditable
            onInput={syncBody}
            className="min-h-[140px] max-h-[400px] overflow-y-auto px-3 py-2 rounded-xl border border-ink-200 focus:border-flow-400 focus:ring-2 focus:ring-flow-100 outline-none text-sm text-ink-800 leading-relaxed"
            style={{ whiteSpace: 'pre-wrap' }}
            data-placeholder="รายละเอียดประกาศ..."
          />
          <p className="text-xs text-ink-400 mt-1">เลือกข้อความแล้วกดปุ่มด้านบนเพื่อจัดรูปแบบ (ตัวหนา ขนาด สี)</p>
        </div>
        <div className="flex items-center gap-4 flex-wrap">
          <label className="flex items-center gap-2 text-sm cursor-pointer">
            <input type="checkbox" checked={!!form.pinned} onChange={(e) => setForm({ ...form, pinned: e.target.checked })} className="rounded border-ink-300 text-gold-500" />
            📌 ปักหมุดไว้บนสุด
          </label>
          <div>
            <input type="file" accept="image/*" id="news-image" className="hidden" onChange={pickImage} />
            <label htmlFor="news-image" className="cursor-pointer text-sm px-3 py-1.5 rounded-lg border border-ink-200 hover:bg-ink-50 inline-flex items-center gap-2">
              <Icon name="file" className="w-4 h-4" /> {form.image ? 'เปลี่ยนรูป' : 'แนบรูปภาพ'}
            </label>
          </div>
          {form.image && (
            <div className="flex items-center gap-2">
              <img src={form.image} alt="" className="h-12 rounded border border-ink-200" />
              <button type="button" onClick={() => setForm({ ...form, image: '' })} className="text-xs text-red-500 hover:underline">ลบรูป</button>
            </div>
          )}
        </div>
        <div className="flex justify-end gap-2 pt-3 border-t border-ink-100">
          <Button type="button" variant="secondary" onClick={onClose}>ยกเลิก</Button>
          <Button type="submit" icon={editing ? 'check' : 'plus'}>{editing ? 'บันทึก' : 'เผยแพร่'}</Button>
        </div>
      </form>
    </Modal>
  );
};

/* ═══════════════════════════════════════════════════════════
   TEAM CALENDAR — ปฏิทินทีม (ภาพรวมการลารายเดือน)
═══════════════════════════════════════════════════════════ */
const TeamCalendarPage = () => {
  const { leaves, employees, branches, leaveTypes, user } = useApp();
  const [cursor, setCursor] = useState(new Date());   // เดือนที่ดู
  const [selectedDay, setSelectedDay] = useState(null);   // วันที่กดดูรายชื่อทั้งหมด
  const [filterBranch, setFilterBranch] = useState(
    user.role === 'manager' ? (user.branchId || 'all') : 'all'
  );

  const year = cursor.getFullYear();
  const month = cursor.getMonth();   // 0-11

  // พนักงานในขอบเขต
  const scopeEmps = employees.filter(e => {
    if (e.status === 'inactive') return false;
    if (user.role === 'manager' && e.branchId !== user.branchId) return false;
    if (filterBranch !== 'all' && e.branchId !== filterBranch) return false;
    return true;
  });
  const empIds = new Set(scopeEmps.map(e => e.id));

  // การลาที่อนุมัติแล้ว ในเดือนนี้
  const monthLeaves = leaves.filter(l => {
    if (l.status !== 'approved') return false;
    if (!empIds.has(l.employeeId)) return false;
    const s = toYMD(l.startDate), e = toYMD(l.endDate || l.startDate);
    const mStart = `${year}-${String(month+1).padStart(2,'0')}-01`;
    const mEnd = `${year}-${String(month+1).padStart(2,'0')}-${String(new Date(year, month+1, 0).getDate()).padStart(2,'0')}`;
    return s <= mEnd && e >= mStart;   // overlap กับเดือนนี้
  });

  // map วันที่ → รายการลา
  const dayMap = {};
  monthLeaves.forEach(l => {
    const emp = employees.find(e => e.id === l.employeeId);
    const lt = leaveTypes.find(t => t.id === l.type);
    const s = new Date(toYMD(l.startDate) + 'T00:00:00');
    const e = new Date(toYMD(l.endDate || l.startDate) + 'T00:00:00');
    for (let d = new Date(s); d <= e; d.setDate(d.getDate() + 1)) {
      if (d.getFullYear() === year && d.getMonth() === month) {
        const day = d.getDate();
        if (!dayMap[day]) dayMap[day] = [];
        dayMap[day].push({
          name: emp ? `${emp.firstName} ${emp.nickname ? '('+emp.nickname+')' : emp.lastName}` : l.employeeId,
          type: lt?.label || l.type,
          color: lt?.color || 'gray',
          period: l.period,
          photo: emp?.photo || '',
          branchName: emp ? (branches.find(b => b.id === emp.branchId)?.name || '') : '',
        });
      }
    }
  });

  // สร้างตารางปฏิทิน
  const firstDay = new Date(year, month, 1).getDay();   // 0=อา
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const colorClass = {
    red: 'bg-red-100 text-red-700', yellow: 'bg-gold-100 text-gold-700',
    blue: 'bg-brand-100 text-brand-700', green: 'bg-emerald-100 text-emerald-700',
    pink: 'bg-pink-100 text-pink-700', orange: 'bg-orange-100 text-orange-700',
    cyan: 'bg-flow-100 text-flow-700', gray: 'bg-ink-100 text-ink-600',
  };

  const today = new Date();
  const isToday = (d) => d === today.getDate() && month === today.getMonth() && year === today.getFullYear();

  const prevMonth = () => setCursor(new Date(year, month - 1, 1));
  const nextMonth = () => setCursor(new Date(year, month + 1, 1));

  const WEEKDAYS = ['อา','จ','อ','พ','พฤ','ศ','ส'];

  return (
    <div className="p-8 space-y-6 animate-fade-up">
      <Topbar title="ปฏิทินทีม" subtitle="ภาพรวมการลาของทีม วางแผนกำลังคน" />

      {/* ควบคุม */}
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div className="flex items-center gap-2">
          <button onClick={prevMonth} className="w-9 h-9 rounded-lg border border-ink-200 hover:bg-ink-50 flex items-center justify-center">‹</button>
          <div className="font-display text-lg font-bold text-ink-900 min-w-[160px] text-center">{THAI_MONTHS[month]} {year + 543}</div>
          <button onClick={nextMonth} className="w-9 h-9 rounded-lg border border-ink-200 hover:bg-ink-50 flex items-center justify-center">›</button>
          <button onClick={() => setCursor(new Date())} className="ml-2 text-xs px-3 py-1.5 rounded-lg border border-ink-200 hover:bg-ink-50">วันนี้</button>
        </div>
        {user.role !== 'manager' && (
          <Select value={filterBranch} onChange={(e) => setFilterBranch(e.target.value)} className="w-44">
            <option value="all">ทุกสาขา</option>
            {branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
          </Select>
        )}
      </div>

      {/* ปฏิทิน */}
      <Card className="p-4">
        <div className="grid grid-cols-7 gap-1 mb-1">
          {WEEKDAYS.map((w, i) => (
            <div key={w} className={cls('text-center text-xs font-medium py-1', i === 0 ? 'text-red-500' : 'text-ink-500')}>{w}</div>
          ))}
        </div>
        <div className="grid grid-cols-7 gap-1">
          {cells.map((d, i) => {
            const dayItems = d ? (dayMap[d] || []) : [];
            return (
            <div key={i} className={cls(
              'min-h-[88px] rounded-lg border p-1.5 text-left align-top',
              d ? 'border-ink-100' : 'border-transparent',
              d && isToday(d) ? 'ring-2 ring-brand-300 bg-brand-50/30' : 'bg-white',
              d && i % 7 === 0 ? 'bg-red-50/30' : '',
              dayItems.length > 0 ? 'cursor-pointer hover:bg-ink-50/60 transition-colors' : ''
            )}
            onClick={() => { if (dayItems.length > 0) setSelectedDay(d); }}>
              {d && (
                <>
                  <div className={cls('text-xs font-medium mb-1', isToday(d) ? 'text-brand-700' : i % 7 === 0 ? 'text-red-500' : 'text-ink-600')}>{d}</div>
                  <div className="space-y-0.5">
                    {dayItems.slice(0, 3).map((item, j) => (
                      <div key={j} className={cls('text-[10px] leading-tight px-1 py-0.5 rounded truncate', colorClass[item.color] || colorClass.gray)} title={`${item.name} — ${item.type}`}>
                        {item.name}
                      </div>
                    ))}
                    {dayItems.length > 3 && (
                      <div className="text-[10px] text-flow-600 font-medium px-1 hover:underline">+{dayItems.length - 3} คน ดูทั้งหมด</div>
                    )}
                  </div>
                </>
              )}
            </div>
            );
          })}
        </div>
      </Card>

      {/* สรุป + legend */}
      <div className="flex flex-wrap items-center gap-4">
        <div className="text-sm text-ink-600">
          เดือนนี้มีการลารวม <span className="font-semibold text-ink-900">{monthLeaves.length}</span> รายการ
        </div>
        <div className="flex flex-wrap gap-2 text-xs">
          {leaveTypes.filter(t => !['wfh','offsite'].includes(t.id)).map(t => (
            <span key={t.id} className={cls('px-2 py-0.5 rounded', colorClass[t.color] || colorClass.gray)}>{t.label}</span>
          ))}
        </div>
      </div>

      {/* Popup รายชื่อคนลาทั้งหมดในวันที่เลือก */}
      {selectedDay && (
        <Modal open onClose={() => setSelectedDay(null)}
          title={`รายชื่อการลา วันที่ ${selectedDay} ${THAI_MONTHS[month]} ${year + 543}`} size="md">
          <div className="space-y-2">
            <p className="text-sm text-ink-500 mb-3">มีการลาทั้งหมด {(dayMap[selectedDay] || []).length} คน</p>
            <div className="max-h-[60vh] overflow-y-auto space-y-1.5">
              {(dayMap[selectedDay] || []).map((item, j) => (
                <div key={j} className="flex items-center justify-between gap-3 p-2.5 rounded-xl border border-ink-100 hover:bg-ink-50/50">
                  <div className="flex items-center gap-3 min-w-0">
                    <Avatar name={item.name} photo={item.photo} size="sm" />
                    <div className="min-w-0">
                      <div className="text-sm font-medium text-ink-900 truncate">{item.name}</div>
                      {item.branchName && <div className="text-xs text-ink-400">{item.branchName}</div>}
                    </div>
                  </div>
                  <span className={cls('text-xs px-2.5 py-1 rounded-lg shrink-0', colorClass[item.color] || colorClass.gray)}>{item.type}</span>
                </div>
              ))}
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
};

  const salary = baseSalary > 0
    ? `${baseSalary.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${salaryUnit}`
    : '-';
  const branchName = (() => {
    const list = (branches && branches.length) ? branches

    return b ? b.name : (emp.branchId || '-');

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap');
      * { box-sizing: border-box; }
      body { font-family: 'Sarabun','TH Sarabun New',sans-serif; color: #1a1a1a; margin: 0; background: #e5e7eb; font-size: 16px; line-height: 1.85; }
      /* แถบปุ่มด้านบน (ไม่พิมพ์/ไม่อยู่ใน PDF) */
      .toolbar { position: sticky; top: 0; background: #0B2A4A; padding: 12px 20px; display: flex; gap: 10px; justify-content: center; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,.2); }

      .btn-pdf { background: #fff; color: #0B2A4A; }
      .btn-pdf:hover { background: #f1f5f9; }
      .btn-print { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.4) !important; }
      .btn-print:hover { background: rgba(255,255,255,.1); }
      /* กระดาษ A4 พอดี 1 หน้า */

    </style></head><body>
