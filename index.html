        open={openCrit}
        onClose={() => { setOpenCrit(false); setEditingCrit(null); }}
        editing={editingCrit}
        onSave={saveCriteria}
      />
    </div>
  );
};

/* ===== KPI EVAL MODAL — ให้คะแนนพนักงานตามหัวข้อย่อย ===== */
const KpiEvalModal = ({ open, onClose, editing, onSave, employees, criteria, defaultPeriod }) => {
  const [form, setForm] = useState({});
  const [picker, setPicker] = useState(false);

  useEffect(() => {
    if (editing) {
      setForm({ ...editing, criteria: editing.criteria && editing.criteria.length ? editing.criteria : (criteria || []) });
    } else {
      setForm({
        id: '', employeeId: employees[0]?.id || '', period: defaultPeriod,
        criteria: [], scores: {}, note: '', evaluator: '', evalDate: new Date().toISOString().split('T')[0],
      });
    }
    setPicker(false);
  }, [editing, open, defaultPeriod]);

  if (!open) return null;

  const myCriteria = form.criteria || [];

  const setScore = (subId, val) => {
    const v = Math.max(0, Math.min(100, Number(val) || 0));
    setForm(f => ({ ...f, scores: { ...f.scores, [subId]: v } }));
  };
  // เพิ่มหัวข้อใหญ่จากคลัง (พร้อมหัวข้อย่อยทั้งหมด)
  const addCategory = (c) => {
    if (myCriteria.some(x => x.id === c.id)) return;
    setForm(f => ({ ...f, criteria: [...(f.criteria||[]), JSON.parse(JSON.stringify(c))] }));
    setPicker(false);
  };
  const removeCategory = (id) => {
    setForm(f => {
      const cat = f.criteria.find(c => c.id === id);
      const sc = { ...f.scores };
      (cat?.subItems || []).forEach(s => delete sc[s.id]);
      return { ...f, criteria: f.criteria.filter(c => c.id !== id), scores: sc };
    });
  };

  const { pct, items } = calcKpiScore(form);
  const g = kpiGrade(pct);
  const totalWeight = items.reduce((s, it) => s + (Number(it.weight)||0), 0);
  const availableLib = (criteria || []).filter(c => !myCriteria.some(x => x.id === c.id));

  const submit = (e) => {
    e.preventDefault();
    if (!form.employeeId) return alert('กรุณาเลือกพนักงาน');
    if (myCriteria.length === 0) return alert('กรุณาเพิ่มหัวข้อประเมินอย่างน้อย 1 หัวข้อ');
    onSave({ ...form, id: form.id || `KPI${Date.now()}` });
  };

  return (
    <Modal open={open} onClose={onClose} title={editing ? 'แก้ไขผลประเมิน' : 'ประเมินพนักงาน'} size="xl">
      <form onSubmit={submit} className="space-y-4">
        <div className="grid md:grid-cols-3 gap-3">
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">พนักงาน</label>
            <Select value={form.employeeId} onChange={(e) => setForm({ ...form, employeeId: e.target.value })} disabled={!!editing} required>
              {employees.map(e => <option key={e.id} value={e.id}>{e.firstName} {e.lastName} ({e.id})</option>)}
            </Select>
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">รอบประเมิน</label>
            <Input type="month" value={form.period || ''} onChange={(e) => setForm({ ...form, period: e.target.value })} required />
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">ผู้วัดผล / ผู้ประเมิน</label>
            <Input value={form.evaluator || ''} onChange={(e) => setForm({ ...form, evaluator: e.target.value })} placeholder="ชื่อผู้ประเมิน" />
          </div>
        </div>

        {/* เลือกหัวข้อจากคลัง */}
        <div>
          <div className="flex items-center justify-between mb-2">
            <label className="text-sm font-medium text-ink-700">หัวข้อประเมิน (เฉพาะพนักงานคนนี้)</label>
            <span className={cls('text-xs font-medium', totalWeight === 100 ? 'text-emerald-600' : 'text-gold-600')}>น้ำหนักรวม {totalWeight}%</span>
          </div>
          <div className="relative mb-3">
            <Button type="button" variant="outline" size="sm" icon="plus" onClick={() => setPicker(p => !p)}>เพิ่มหัวข้อจากคลัง</Button>
            {picker && (
              <div className="absolute top-10 left-0 z-20 w-72 bg-white rounded-xl shadow-xl border border-ink-100 max-h-60 overflow-y-auto">
                {availableLib.length === 0 ? (
                  <div className="px-3 py-3 text-xs text-ink-400 text-center">ไม่มีหัวข้อในคลัง (เพิ่มได้ที่แท็บ "คลังหัวข้อ")</div>
                ) : availableLib.map(c => (
                  <button key={c.id} type="button" onClick={() => addCategory(c)}
                    className="w-full px-3 py-2 text-left hover:bg-flow-50 text-sm flex items-center justify-between">
                    <span className="text-ink-800">{c.name}</span>
                    <span className="text-xs text-ink-400">{c.weight}% · {(c.subItems||[]).length} ย่อย</span>
                  </button>
                ))}
              </div>
            )}
          </div>

          {myCriteria.length === 0 ? (
            <div className="bg-ink-50 rounded-xl p-4 text-center text-sm text-ink-400">ยังไม่มีหัวข้อ — คลิก "เพิ่มหัวข้อจากคลัง"</div>
          ) : (
            <div className="space-y-4">
              {myCriteria.map((cat) => (
                <div key={cat.id} className="border border-ink-200 rounded-xl overflow-hidden">
                  {/* หัวข้อใหญ่ */}
                  <div className="bg-brand-50 px-4 py-2.5 flex items-center justify-between">
                    <div className="font-medium text-brand-900">{cat.name} <span className="text-xs text-brand-600">({cat.weight}%)</span></div>
                    <button type="button" onClick={() => removeCategory(cat.id)} className="p-1 rounded-lg text-ink-400 hover:bg-red-50 hover:text-red-600"><Icon name="trash" className="w-4 h-4" /></button>
                  </div>
                  {/* หัวข้อย่อย */}
                  <div className="divide-y divide-ink-100">
                    {(cat.subItems || [{ id: cat.id, indicator: cat.name, weight: cat.weight }]).map((s) => {
                      const score = Number(form.scores?.[s.id]) || 0;
                      return (
                        <div key={s.id} className="px-4 py-3">
                          <div className="flex items-start justify-between gap-2 mb-2">
                            <div className="min-w-0">
                              <div className="text-sm font-medium text-ink-900">{s.indicator}</div>
                              <div className="flex flex-wrap gap-x-3 gap-y-0.5 text-xs text-ink-500 mt-0.5">
                                {s.targetType && <span>เป้า: {fmtKpiTarget(s)}</span>}
                                <span>น้ำหนัก {s.weight}%</span>
                                {s.method && <span>วิธีวัด: {s.method}</span>}
                              </div>
                            </div>
                            <span className="font-display font-bold text-brand-700 text-lg shrink-0">{score}</span>
                          </div>
                          <div className="flex items-center gap-3">
                            <input type="range" min={0} max={100} step={5} value={score}
                              onChange={(e) => setScore(s.id, e.target.value)} className="flex-1 accent-brand-600" />
                            <div className="flex gap-1 shrink-0">
                              {[60, 70, 80, 90, 100].map(v => (
                                <button key={v} type="button" onClick={() => setScore(s.id, v)}
                                  className="text-xs px-1.5 py-0.5 rounded border border-ink-200 hover:border-brand-400 hover:bg-brand-50">{v}</button>
                              ))}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* คะแนนรวม */}
        <div className="rounded-xl p-4 flex items-center justify-between text-white" style={{ background: `linear-gradient(135deg, ${g.color}, ${g.color}dd)` }}>
          <div>
            <div className="text-sm opacity-90">คะแนนรวม (ถ่วงน้ำหนัก)</div>
            <div className="font-display text-3xl font-bold">{pct}%</div>
          </div>
          <div className="text-right">
            <div className="font-display text-4xl font-bold">{g.grade}</div>
            <div className="text-sm opacity-90">{g.label}</div>
          </div>
        </div>

        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">ข้อเสนอแนะ</label>
          <Textarea rows={2} value={form.note || ''} onChange={(e) => setForm({ ...form, note: e.target.value })} placeholder="จุดเด่น จุดที่ควรพัฒนา..." />
        </div>

        <div className="flex justify-end gap-2 pt-4 border-t border-ink-100">
          <Button type="button" variant="secondary" onClick={onClose}>ยกเลิก</Button>
          <Button type="submit" icon={editing ? 'check' : 'plus'}>{editing ? 'บันทึก' : 'บันทึกผลประเมิน'}</Button>
        </div>
      </form>
    </Modal>
  );
};

/* ===== KPI CRITERIA MODAL — กำหนดหัวข้องาน ===== */
const KpiCriteriaModal = ({ open, onClose, editing, onSave }) => {
  const [form, setForm] = useState({});
  useEffect(() => {
    if (editing) setForm({ subItems: [], ...editing });
    else setForm({ id: '', name: '', weight: 40, subItems: [] });
  }, [editing, open]);

  if (!open) return null;

  const subItems = form.subItems || [];
  const subTotal = subItems.reduce((s, x) => s + (Number(x.weight) || 0), 0);

  const addSub = () => {
    setForm(f => ({ ...f, subItems: [...(f.subItems||[]), {
      id: `SUB${Date.now()}${Math.floor(Math.random()*1000)}`,
      indicator: '', targetType: 'percent', targetValue: 80, targetUnit: 'month', weight: 0, method: '',
    }]}));
  };
  const updateSub = (id, key, val) => {
    setForm(f => ({ ...f, subItems: f.subItems.map(s => s.id === id
      ? { ...s, [key]: (key==='weight'||key==='targetValue') ? (Number(val)||0) : val } : s) }));
  };
  const removeSub = (id) => setForm(f => ({ ...f, subItems: f.subItems.filter(s => s.id !== id) }));

  const submit = (e) => {
    e.preventDefault();
    if (!form.name.trim()) return alert('กรุณาระบุชื่อหัวข้อใหญ่');
    if (subItems.length === 0) return alert('กรุณาเพิ่มหัวข้อย่อยอย่างน้อย 1 รายการ');
    if (subItems.some(s => !s.indicator.trim())) return alert('กรุณาระบุตัวชี้วัดให้ครบทุกหัวข้อย่อย');
    onSave({ ...form, id: form.id || `CAT${Date.now()}`, name: form.name.trim(), weight: Number(form.weight) || 0 });
  };

  return (
    <Modal open={open} onClose={onClose} title={editing ? 'แก้ไขหัวข้อ KPI' : 'เพิ่มหัวข้อ KPI'} size="xl">
      <form onSubmit={submit} className="space-y-4">
        {/* หัวข้อใหญ่ */}
        <div className="bg-brand-50 border border-brand-100 rounded-xl p-4 grid md:grid-cols-3 gap-3">
          <div className="md:col-span-2">
            <label className="block text-sm font-medium text-ink-700 mb-1.5">ชื่อหัวข้อใหญ่</label>
            <Input value={form.name || ''} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="เช่น ด้านการขาย, ด้านคุณภาพงาน, ด้านพฤติกรรม" required />
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">น้ำหนักใหญ่ (%)</label>
            <Input type="number" min={0} max={100} value={form.weight ?? ''} onChange={(e) => setForm({ ...form, weight: e.target.value })} required />
          </div>
        </div>

        {/* หัวข้อย่อย */}
        <div>
          <div className="flex items-center justify-between mb-2">
            <label className="text-sm font-medium text-ink-700">หัวข้อย่อย / ตัวชี้วัด</label>
            <span className={cls('text-xs font-medium', subTotal === Number(form.weight) ? 'text-emerald-600' : 'text-gold-600')}>
              น้ำหนักย่อยรวม {subTotal}% / {form.weight || 0}%
            </span>
          </div>

          {subItems.length === 0 ? (
            <div className="bg-ink-50 rounded-xl p-4 text-center text-sm text-ink-400">ยังไม่มีหัวข้อย่อย — คลิก "เพิ่มหัวข้อย่อย"</div>
          ) : (
            <div className="space-y-3">
              {subItems.map((s, i) => (
                <div key={s.id} className="border border-ink-200 rounded-xl p-3 space-y-2.5">
                  <div className="flex items-center gap-2">
                    <span className="w-6 h-6 rounded-lg bg-flow-100 text-flow-700 flex items-center justify-center text-xs font-bold shrink-0">{i+1}</span>
                    <Input value={s.indicator} onChange={(e) => updateSub(s.id, 'indicator', e.target.value)} placeholder="ตัวชี้วัด เช่น ยอดขายรายเดือน" className="flex-1 !py-1.5 text-sm" />
                    <button type="button" onClick={() => removeSub(s.id)} className="p-1.5 rounded-lg text-ink-400 hover:bg-red-50 hover:text-red-600 shrink-0"><Icon name="trash" className="w-4 h-4" /></button>
                  </div>
                  <div className="grid md:grid-cols-3 gap-2 pl-8">
                    {/* เป้าหมาย */}
                    <div>
                      <label className="block text-xs text-ink-500 mb-1">เป้าหมาย</label>
                      <div className="flex gap-1">
                        <Select value={s.targetType} onChange={(e) => updateSub(s.id, 'targetType', e.target.value)} className="!py-1.5 text-xs w-24">
                          <option value="percent">≥ %</option>
                          <option value="count">จำนวนครั้ง</option>
                        </Select>
                        <Input type="number" min={0} value={s.targetValue} onChange={(e) => updateSub(s.id, 'targetValue', e.target.value)} className="!py-1.5 text-sm flex-1" />
                        {s.targetType === 'count' && (
                          <Select value={s.targetUnit} onChange={(e) => updateSub(s.id, 'targetUnit', e.target.value)} className="!py-1.5 text-xs w-24">
                            <option value="week">/สัปดาห์</option>
                            <option value="month">/เดือน</option>
                          </Select>
                        )}
                      </div>
                    </div>
                    {/* น้ำหนักย่อย */}
                    <div>
                      <label className="block text-xs text-ink-500 mb-1">น้ำหนักย่อย (%)</label>
                      <Input type="number" min={0} max={100} value={s.weight} onChange={(e) => updateSub(s.id, 'weight', e.target.value)} className="!py-1.5 text-sm" />
                    </div>
                    {/* วิธีวัดผล */}
                    <div>
                      <label className="block text-xs text-ink-500 mb-1">วิธีวัดผล</label>
                      <Input value={s.method} onChange={(e) => updateSub(s.id, 'method', e.target.value)} placeholder="เช่น ยอดจริง÷เป้า" className="!py-1.5 text-sm" />
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
          <Button type="button" variant="outline" size="sm" icon="plus" onClick={addSub} className="mt-3">เพิ่มหัวข้อย่อย</Button>
        </div>

        <div className="flex justify-end gap-2 pt-4 border-t border-ink-100">
          <Button type="button" variant="secondary" onClick={onClose}>ยกเลิก</Button>
          <Button type="submit" icon={editing ? 'check' : 'plus'}>{editing ? 'บันทึก' : 'เพิ่มหัวข้อ'}</Button>
        </div>
      </form>
    </Modal>
  );
};

const ReportsPage = () => {
  const { employees, attendance, leaves, leaveTypes, branches } = useApp();
  const [month, setMonth] = useState(new Date().toISOString().slice(0,7));

  // monthly stats
  const monthRecords = attendance.filter(a => String(a.date || '').startsWith(month));
  const monthLeaves  = leaves.filter(l => String(l.startDate || '').startsWith(month) || String(l.endDate || '').startsWith(month));

  const branchData = branches.map(b => {
    const empsB = employees.filter(e => e.branchId === b.id);
    const attB  = monthRecords.filter(a => empsB.some(e => e.id === a.employeeId));
    const lvB   = monthLeaves.filter(l => empsB.some(e => e.id === l.employeeId) && l.status === 'approved');
    const onTime = attB.filter(a => a.status === 'ontime').length;
    const late = attB.filter(a => a.status === 'late').length;
    return {
      name: b.short,
      ตรงเวลา: onTime,
      มาสาย: late,
      ลา: lvB.length,
      color: b.color,
    };
  });

  const leaveDist = leaveTypes.map(t => ({
    name: t.label,
    count: monthLeaves.filter(l => l.type === t.id && l.status === 'approved').length,
    color: t.color,
  }));

  const exportReport = () => {
    const wb = XLSX.utils.book_new();

    // Sheet 1: monthly summary
    const summary = [
      ['รายงานประจำเดือน', month],
      [],
      ['สาขา', 'มาทำงาน (ตรงเวลา)', 'มาทำงาน (สาย)', 'ลา (อนุมัติ)'],
      ...branchData.map(b => [b.name, b.ตรงเวลา, b.มาสาย, b.ลา]),
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), 'สรุปประจำเดือน');

    // Sheet 2: attendance details
    const attRows = [
      ['รหัสพนักงาน','ชื่อ-นามสกุล','สาขา','วันที่','เข้างาน','ออกงาน','สถานะ'],
      ...monthRecords.map(a => {
        const e = employees.find(x => x.id === a.employeeId);
        const b = e ? branches.find(x => x.id === e.branchId) : null;
        return [a.employeeId, e ? `${e.firstName} ${e.lastName}` : '-', b?.short || '-',
                a.date, a.checkIn || '-', a.checkOut || '-', a.status === 'ontime' ? 'ตรงเวลา' : 'สาย'];
      }),
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(attRows), 'การเข้างาน');

    // Sheet 3: leaves
    const lvRows = [
      ['รหัสพนักงาน','ชื่อ-นามสกุล','ประเภท','วันเริ่ม','วันสิ้นสุด','จำนวนวัน','สถานะ','เหตุผล'],
      ...monthLeaves.map(l => {
        const e = employees.find(x => x.id === l.employeeId);
        const t = leaveTypes.find(x => x.id === l.type);
        return [l.employeeId, e ? `${e.firstName} ${e.lastName}` : '-', t?.label || '-',

  return (
    <div className="p-8 space-y-6 animate-fade-up">
      <Topbar
        title="รายงาน"
        subtitle="สรุปผลการทำงานและการลาของพนักงาน"
        action={
          <div className="flex items-center gap-2">
            <Input type="month" value={month} onChange={(e) => setMonth(e.target.value)} className="w-44" />
            <Button icon="download" variant="gold" onClick={exportReport}>ส่งออก Excel</Button>

      <div className="grid lg:grid-cols-2 gap-6">
        <Card className="p-6">
          <h3 className="font-display text-lg font-semibold text-ink-900 mb-1">การเข้างานแยกตามสาขา</h3>
          <p className="text-xs text-ink-500 mb-4">ภาพรวมการมาทำงานในเดือนที่เลือก</p>
          <div style={{ width: '100%', height: 280 }}>
            <ResponsiveContainer>
              <BarChart data={branchData} margin={{ top: 10, right: 10, left: -10, bottom: 0 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="#ECEEF5" />

/* =============================================================
   SETTINGS PAGE — ตั้งค่าระบบ + จัดการประเภทการลา
   ============================================================= */
const SettingsPage = () => {
  const {
    leaveTypes, setLeaveTypes,
    leaves, employees, settings, setSettings,
    branches, setBranches,
    departments, setDepartments,
    addToast,
  } = useApp();
  const [tab, setTab] = useState('leave-types');
  const [editing, setEditing] = useState(null); // ประเภทที่กำลังแก้ไข
  const [showAdd, setShowAdd] = useState(false);
  const [companyForm, setCompanyForm] = useState(settings);
  const [apiUrlInput, setApiUrlInput] = useState(CONFIG.apiUrl || '');

  // Branch & Department modals
  const [showBranchModal, setShowBranchModal] = useState(false);
  const [editingBranch, setEditingBranch] = useState(null);
  const [showDeptModal, setShowDeptModal] = useState(false);
  const [editingDept, setEditingDept] = useState(null);

  // Sync companyForm กับ settings เมื่อ settings เปลี่ยน
  useEffect(() => { setCompanyForm(settings); }, [settings]);

  const saveCompany = () => {
    setSettings(companyForm);
    addToast('success', 'บันทึกข้อมูลบริษัทเรียบร้อย');
    if (api.enabled()) {
      api.post('saveSettings', { data: companyForm })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
  };

  // === BRANCH handlers ===
  const empCountByBranch = useMemo(() => {
    const m = {};
    employees.forEach(e => { m[e.branchId] = (m[e.branchId] || 0) + 1; });
    return m;
  }, [employees]);

  const saveBranch = (b) => {
    let updated;
    if (editingBranch) {
      updated = branches.map(x => x.id === editingBranch.id ? { ...b, id: editingBranch.id } : x);
      addToast('success', 'บันทึกข้อมูลสาขาเรียบร้อย');
    } else {
      // ตรวจสอบรหัสซ้ำ
      if (branches.some(x => x.id === b.id)) {
        addToast('error', 'รหัสสาขาซ้ำกับที่มีอยู่');
        return;
      }
      updated = [...branches, b];
      addToast('success', 'เพิ่มสาขาใหม่เรียบร้อย');
    }
    setBranches(updated);
    if (api.enabled()) {
      api.post('saveBranches', { data: updated })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
    setEditingBranch(null);
    setShowBranchModal(false);
  };

  const deleteBranch = (b) => {
    const used = empCountByBranch[b.id] || 0;
    if (used > 0) {
      addToast('error', `ไม่สามารถลบได้ มีพนักงาน ${used} คนในสาขานี้ — ย้ายพนักงานก่อน`);
      return;
    }
    if (!confirm(`ยืนยันการลบสาขา "${b.name}"?`)) return;
    const updated = branches.filter(x => x.id !== b.id);
    setBranches(updated);
    addToast('success', 'ลบสาขาเรียบร้อย');
    if (api.enabled()) {
      api.post('saveBranches', { data: updated })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
  };

  // === DEPARTMENT handlers ===
  const empCountByDept = useMemo(() => {
    const m = {};
    employees.forEach(e => { m[e.department] = (m[e.department] || 0) + 1; });
    return m;
  }, [employees]);

  const saveDept = (name, oldName) => {
    let updated;
    if (oldName) {
      // แก้ไข — เปลี่ยนชื่อในรายการ
      if (departments.includes(name) && name !== oldName) {

      addToast('success', 'เพิ่มแผนกใหม่เรียบร้อย');

      api.post('saveDepartments', { data: updated })

    const counts = {};
    leaves.forEach(l => { counts[l.type] = (counts[l.type] || 0) + 1; });
    return counts;
  }, [leaves]);

  const saveType = (type) => {

    if (editing) {
      updated = leaveTypes.map(t => t.id === editing.id ? { ...type, id: editing.id } : t);

    setShowAdd(false);

            </div>

        </div>

          <div className="flex items-start justify-between mb-5">

            <div className="flex items-start gap-3 text-sm">
              <Icon name="info" className="w-5 h-5 text-flow-700 mt-0.5 shrink-0" />
              <div className="text-ink-700">
                <strong className="text-flow-800">หมายเหตุ:</strong> รหัสสาขา (ID) ห้ามใช้ซ้ำและเปลี่ยนไม่ได้หลังสร้างแล้ว เพราะอ้างอิงในข้อมูลพนักงาน

              </div>

          </div>
        </Card>

      {tab === 'departments' && (
        <Card className="p-6">
          <div className="flex items-start justify-between mb-5">
            <div>
              <h3 className="font-display text-lg font-semibold text-ink-900">แผนก / ฝ่าย</h3>
              <p className="text-sm text-ink-500 mt-1">รายการแผนกที่ใช้ในการจัดกลุ่มพนักงาน</p>
            </div>
            <Button icon="plus" onClick={() => { setEditingDept(null); setShowDeptModal(true); }}>
              เพิ่มแผนก
            </Button>
          </div>

            {departments.map(d => {
              const cnt = empCountByDept[d] || 0;
              return (
                <div key={d} className="flex items-center justify-between p-4 rounded-xl border border-ink-100 hover:shadow-soft transition-all">
                  <div className="flex items-center gap-3 min-w-0 flex-1">
                    <div className="w-10 h-10 rounded-xl bg-brand-50 text-brand-700 flex items-center justify-center shrink-0">
                      <Icon name="briefcase" className="w-5 h-5" />

                    <div className="min-w-0 flex-1">
                      <div className="font-medium text-ink-900 truncate">{d}</div>

/* =============================================================
   ROOT APP
   ============================================================= */
const App = () => {
  const [user, setUser]       = useState(() => {
    // คงสถานะล็อกอินไว้เมื่อรีเฟรช
    try {
      const saved = localStorage.getItem('ffc_session_user');
      return saved ? JSON.parse(saved) : null;
    } catch { return null; }
  });
  const [page, setPage]       = useState('dashboard');
  const [employees, setEmployees]     = useState([]);
  const [attendance, setAttendance]   = useState([]);
  const [leaves, setLeaves]           = useState([]);
  const [leaveTypes, setLeaveTypes]   = useState(DEFAULT_LEAVE_TYPES);
  const [branches, setBranches]       = useState(DEFAULT_BRANCHES);
  const [departments, setDepartments] = useState(DEFAULT_DEPARTMENTS);
  const [assets, setAssets]           = useState([]);
  const [payroll, setPayroll]         = useState([]);
  const [kpiCriteria, setKpiCriteria] = useState([]);
  const [kpiRecords, setKpiRecords]   = useState([]);
  const [settings, setSettings]       = useState({
    companyName: 'บริษัท ฟรีด้อมโฟล เทรดดิ้ง จำกัด',
    companyNameEn: 'FREEDOM FLOW TRADING CO., LTD.',
    taxId:       '0-1055-XXXXX-XX-X',
    address:     'เลขที่ 10/95 อาคารเดอะเทรนดี้ ชั้น 6 ซอย 13 แขวงคลองเตยเหนือ เขตวัฒนา กรุงเทพมหานคร 10110',
    phone:       '',
    email:       '',
    workStart:   '08:00',
    workEnd:     '17:00',
    lateMinutes: 5,   // ผ่อนผันได้กี่นาที
  });
  const [toast, setToast]             = useState(null);
  const [loading, setLoading]         = useState(api.enabled());

  // Initialize data — โหลดจาก API หรือใช้ Demo data
  useEffect(() => {
    if (api.enabled()) {
      // ฟังก์ชันใส่ข้อมูลลง state
      const applyData = (data) => {
        setEmployees(data.employees || []);
        setAttendance(data.attendance || []);
        setLeaves(data.leaves || []);
        if (data.leaveTypes && data.leaveTypes.length > 0) setLeaveTypes(data.leaveTypes);
        if (data.branches && data.branches.length > 0) setBranches(data.branches);
        if (data.departments && data.departments.length > 0) setDepartments(data.departments);
        if (data.assets && data.assets.length > 0) setAssets(data.assets);
        if (data.payroll && data.payroll.length > 0) setPayroll(data.payroll);
        if (data.kpiCriteria && data.kpiCriteria.length > 0) setKpiCriteria(data.kpiCriteria);
        if (data.kpiRecords && data.kpiRecords.length > 0) setKpiRecords(data.kpiRecords);
        if (data.settings && Object.keys(data.settings).length > 0) setSettings(s => ({ ...s, ...data.settings }));
      };

      // 1) โหลดจาก cache ก่อน (แสดงทันที ไม่ต้องรอเน็ต)
      let hadCache = false;
      try {
        const cached = localStorage.getItem('ffc_data_cache');
        if (cached) {
          applyData(JSON.parse(cached));
          hadCache = true;
          setLoading(false);  // มี cache แล้ว ไม่ต้องโชว์ loading
        }
      } catch {}

      // 2) ซิงค์ข้อมูลจริงเบื้องหลัง แล้วอัปเดต + cache
      (async () => {
        try {
          const data = await api.get('getAll');
          applyData(data);
          try { localStorage.setItem('ffc_data_cache', JSON.stringify(data)); } catch {}
        } catch (err) {
          if (!hadCache) {
            setToast({ type: 'error', message: 'เชื่อมต่อ Google Sheets ล้มเหลว: ' + err.message });
            const emps = seedEmployees();
            setEmployees(emps);
            setAttendance(seedAttendance(emps));
            setLeaves(seedLeaves(emps));
          }
        } finally {
          setLoading(false);
        }
      })();
    } else {
      // โหมด Demo
      const emps = seedEmployees();
      setEmployees(emps);
      setAttendance(seedAttendance(emps));
      setLeaves(seedLeaves(emps));
    }
  }, []);

  // บันทึก cache อัตโนมัติเมื่อข้อมูลเปลี่ยน (กันข้อมูลหายตอนรีเฟรช)
  useEffect(() => {
    if (!api.enabled() || loading) return;
    try {
      localStorage.setItem('ffc_data_cache', JSON.stringify({
        employees, attendance, leaves, leaveTypes, branches,
        departments, assets, payroll, kpiCriteria, kpiRecords, settings,
      }));
    } catch {}
  }, [employees, attendance, leaves, assets, payroll, kpiCriteria, kpiRecords, leaveTypes, branches, departments, settings, loading]);

  const addToast = (type, message) => setToast({ type, message });

  // ดึงข้อมูลใหม่จาก Sheets แบบไม่ต้องรีเฟรชหน้า (เร็วกว่า + ไม่กระพริบ)
  const [syncing, setSyncing] = useState(false);
  const refreshData = async () => {
    if (!api.enabled() || syncing) return;
    setSyncing(true);
    try {
      const data = await api.get('getAll');
      setEmployees(data.employees || []);
      setAttendance(data.attendance || []);
      setLeaves(data.leaves || []);
      if (data.leaveTypes?.length) setLeaveTypes(data.leaveTypes);
      if (data.branches?.length) setBranches(data.branches);
      if (data.departments?.length) setDepartments(data.departments);
      if (data.assets?.length) setAssets(data.assets);
      if (data.payroll?.length) setPayroll(data.payroll);
      if (data.kpiCriteria?.length) setKpiCriteria(data.kpiCriteria);
      if (data.kpiRecords?.length) setKpiRecords(data.kpiRecords);
      if (data.settings && Object.keys(data.settings).length) setSettings(s => ({ ...s, ...data.settings }));
      try { localStorage.setItem('ffc_data_cache', JSON.stringify(data)); } catch {}
      addToast('success', 'อัปเดตข้อมูลล่าสุดแล้ว');
    } catch (err) {
      addToast('error', 'ซิงค์ไม่สำเร็จ: ' + err.message);
    } finally {
      setSyncing(false);
    }
  };

  // Loading screen ระหว่างเชื่อมต่อ API
  if (loading) {
    return (
      <div className="min-h-screen login-bg flex items-center justify-center">
        <div className="text-center text-white">
          <div className="w-24 h-24 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center mx-auto mb-6 shadow-card animate-pulse-soft p-3">
            <img src={LOGO_EAGLE} alt="FFC" className="w-full h-full object-contain" style={{ filter: 'brightness(1.5)' }} />
          </div>
          <div className="font-display text-2xl font-bold mb-2">กำลังเชื่อมต่อ Google Sheets...</div>
          <div className="text-brand-200/70 text-sm flex items-center gap-2 justify-center">
            <Icon name="refresh" className="w-4 h-4 animate-spin" />
            <span>กรุณารอสักครู่</span>
          </div>
        </div>
      </div>
    );
  }

  if (!user) {
    const handleLogin = (u) => {
      try { localStorage.setItem('ffc_session_user', JSON.stringify(u)); } catch {}
      setUser(u);
    };
    return (
      <>
        <LoginPage onLogin={handleLogin} addToast={addToast} />
        {toast && <Toast toast={toast} onClose={() => setToast(null)} />}
      </>
    );
  }

  const handleLogout = () => {
    try { localStorage.removeItem('ffc_session_user'); } catch {}
    setUser(null);
    setPage('dashboard');
  };

  // attach empId if user is employee (demo)
  const effectiveUser = user.role === 'employee' && !user.empId
    ? { ...user, empId: employees[0]?.id }
    : user;

  return (
    <AppCtx.Provider value={{
      user: effectiveUser, employees, setEmployees,
      attendance, setAttendance, leaves, setLeaves,
      leaveTypes, setLeaveTypes,
      branches, setBranches,
      departments, setDepartments,
      assets, setAssets,
      payroll, setPayroll,
      kpiCriteria, setKpiCriteria,
      kpiRecords, setKpiRecords,
      settings, setSettings,
      page, setPage,
      refreshData, syncing,
      addToast,
    }}>
      <div className="flex min-h-screen bg-ink-50">
        {api.enabled() && (
          <div className="fixed bottom-4 left-4 z-40 bg-emerald-500 text-white text-xs font-medium px-3 py-1.5 rounded-full shadow-soft flex items-center gap-1.5 no-print">
            <span className="w-1.5 h-1.5 bg-white rounded-full animate-pulse" />
            เชื่อมต่อ Google Sheets
          </div>
        )}
        <Sidebar
          current={page}
          onChange={setPage}
          user={effectiveUser}
          onLogout={handleLogout}
        />
        <main className="flex-1 min-w-0">
          {page === 'dashboard'  && <Dashboard />}
          {page === 'employees'  && <EmployeesPage />}
          {page === 'attendance' && <AttendancePage />}
          {page === 'leaves'     && <LeavesPage />}
          {page === 'assets'     && <AssetsPage />}
          {page === 'payroll'    && <PayrollPage />}
          {page === 'kpi'        && <KpiPage />}
          {page === 'reports'    && <ReportsPage />}
          {page === 'branches'   && <BranchesPage />}
          {page === 'settings'   && <SettingsPage />}
        </main>
      </div>
      {toast && <Toast toast={toast} onClose={() => setToast(null)} />}
    </AppCtx.Provider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
