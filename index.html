const AppCtx = createContext(null);
const useApp = () => useContext(AppCtx);

/* =============================================================
   CONFIG — แก้ apiUrl ที่นี่หลังจาก Deploy Apps Script แล้ว
   ============================================================= */
const CONFIG = {
  // วาง Web App URL ของ Google Apps Script ที่นี่ (เชื่อมต่ออัตโนมัติทุกครั้งที่เปิด)
  // ถ้าตั้งผ่านหน้า "ตั้งค่า" ในเว็บ จะใช้ค่าจาก localStorage แทน
  apiUrl: (() => {
    const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbwmPBAlshxd0_vAUSXnnPmV0HDgyQeKd7963005eUaqBroZzQp5ivfLvIwtY5xZS48A/exec';
    try { return localStorage.getItem('ffc_api_url') || DEFAULT_URL; } catch { return DEFAULT_URL; }
  })(),
};

/* =============================================================
   API CLIENT — ติดต่อ Google Apps Script
   ใช้ body แบบ text/plain เพื่อหลีกเลี่ยง CORS preflight
   ============================================================= */
const api = {
  enabled: () => !!CONFIG.apiUrl,

  async get(action, params = {}) {
    if (!api.enabled()) throw new Error('API not configured');
    const url = new URL(CONFIG.apiUrl);
    url.searchParams.set('action', action);
    Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
    const res = await fetch(url.toString());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'Unknown error');
    return json.data;
  },

  async post(action, data = {}) {
    if (!api.enabled()) throw new Error('API not configured');
    const res = await fetch(CONFIG.apiUrl, {
      method: 'POST',
      // ใช้ text/plain เพื่อไม่ trigger CORS preflight (Apps Script ไม่รองรับ)
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...data }),
      redirect: 'follow',
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'Unknown error');
    return json.data;
  },
};

const ASSET_CODE_MAP = (() => {
  const m = {};
  ASSET_CATEGORIES.forEach(g => g.codes.forEach(c => { m[c.code] = { ...c, group: g.group, groupTh: g.groupTh }; }));
  return m;
})();

// ฟังก์ชั่นคำนวณโควต้าที่ใช้ไปและคงเหลือของพนักงาน
// remaining ติดลบได้: ถ้าลาเกิน หรือ ไม่ได้กำหนดสิทธิ์ (max=0) แต่มีการลา
const calcQuota = (employee, leaveTypes, leaves, year) => {
  return leaveTypes.map(t => {
    const overrideRaw = employee?.leaveQuotaOverride?.[t.id];
    // ตรวจว่า override เป็น "-" หรือไม่ใช่ตัวเลข → ไม่กำหนดสิทธิ์ (max=0)
    const overrideStr = String(overrideRaw ?? '').trim();
    const isNoQuota = overrideStr === '-' || overrideStr === 'ไม่มี';
    let max;
    let customized = false;
    if (isNoQuota) {
      max = 0;
      customized = true;
    } else if (overrideRaw !== undefined && overrideRaw !== null && overrideStr !== '' && !isNaN(Number(overrideRaw))) {
      max = Number(overrideRaw);
      customized = true;
    } else {
      max = t.max;
    }
    const used = leaves
      .filter(l => {
        const sd = String(l.startDate || '');
        return l.employeeId === employee.id && l.type === t.id
          && l.status === 'approved' && sd.startsWith(year);
      })
      .reduce((sum, l) => sum + (Number(l.days) || 0), 0);
    return {
      ...t, max, used,
      remaining: max - used,  // ติดลบได้
      customized,
      noQuota: isNoQuota,
    };
  });
};

        status: hour > 8 ? 'late' : 'ontime',
      });
    }
  });
  return records;
};

};

// แปลงวันที่ทุกรูปแบบ (Date object, ISO string, "2026-01-15") เป็น 'YYYY-MM-DD'
// สำคัญมากเมื่อข้อมูลมาจาก Google Sheets ที่ส่ง Date object กลับมา
const toYMD = (v) => {
  if (v === null || v === undefined || v === '') return '';
  if (v instanceof Date && !isNaN(v)) {
    const y = v.getFullYear();
    const m = String(v.getMonth() + 1).padStart(2, '0');
    const d = String(v.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }
  const s = String(v).trim();
  // ISO หรือ YYYY-MM-DD อยู่แล้ว → เอา 10 ตัวแรก
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  // ตัวเลขล้วน (Excel serial) — ไม่ควร parse ด้วย new Date ที่นี่ คืนค่าเดิม
  if (/^\d+(\.\d+)?$/.test(s)) return s;
  // ลอง parse เป็น Date
  const d = new Date(s);
  if (!isNaN(d)) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${dd}`;
  }
  return s;
};

// แปลงสถานะการเข้างาน → label + สี Badge (รองรับ leave/absent ด้วย)
// leaveTypes ใช้หาชื่อประเภทการลา; opts = { leavePeriod, leaveHours } สำหรับลาบางส่วน
const attStatusInfo = (status, leaveType, leaveTypes, opts) => {
  const leaveLabel = () => ((leaveTypes || []).find(x => x.id === leaveType)?.label) || 'ลางาน';
  const periodText = () => {
    const p = opts?.leavePeriod;
    if (p === 'morning') return ' (ครึ่งเช้า)';
    if (p === 'afternoon') return ' (ครึ่งบ่าย)';
    if (p === 'hours') return opts?.leaveHours ? ` (${opts.leaveHours} ชม.)` : ' (รายชั่วโมง)';
    return '';
  };
  switch (status) {
    case 'ontime': return { label: 'ตรงเวลา', color: 'green' };
    case 'late':   return { label: 'มาสาย',   color: 'yellow' };
    case 'absent': return { label: 'ขาดงาน',  color: 'red' };
    case 'holiday': return { label: 'วันหยุด', color: 'gray' };
    case 'nocheckout': return { label: 'ไม่สแกนออก', color: 'orange' };
    case 'partial': return { label: `มาทำงาน + ${leaveLabel()}${periodText()}`, color: 'cyan' };
    case 'wfh': {
      const t = (leaveTypes || []).find(x => x.id === leaveType);
      return { label: t ? t.label : 'WFH', color: 'green' };
    }
    case 'leave': {
      const t = (leaveTypes || []).find(x => x.id === leaveType);
      return { label: (t ? t.label : 'ลางาน') + periodText(), color: 'blue' };
    }
    default: return { label: status || '-', color: 'gray' };
  }
};

const fmtMoney = (n) => Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

// คำนวณค่าปรับมาสายจากนาทีที่สาย (คิดเรทเดียวตามช่วง ไม่บวกสะสม)
// ≤5 นาที = 0 (ผ่อนผัน) · 6-15 นาที = 20 บาท · เกิน 15 นาที = 50 บาท/ชั่วโมง (สูงสุด 3 ชม. = 150)
const calcLateFine = (lateMinutes) => {
  const m = Number(lateMinutes) || 0;
  if (m <= 5) return 0;            // ไม่เกิน 5 นาที (ผ่อนผัน) ไม่ปรับ
  if (m <= 15) return 20;          // 6-15 นาที = 20 บาท
  // เกิน 15 นาที = 50 บาท/ชั่วโมง (ปัดขึ้นทุกชั่วโมง) สูงสุด 3 ชั่วโมง — ไม่บวก 20 จากช่วงก่อน
  const hours = Math.min(3, Math.ceil(m / 60));
  return hours * 50;
};

// คำนวณนาทีที่สายจากเวลาเข้างาน เทียบ workStart + ผ่อนผัน
// ดึงเฉพาะเวลา HH:MM จากค่าที่อาจเพี้ยน (เช่น "1899-12-30T08:00:00" หรือ ISO datetime)
const normTime = (v) => {
  if (v == null || v === '') return '';
  const s = String(v).trim();
  // ถ้ามีรูปแบบ datetime ISO หรือ 1899-12-30T... → ดึงเวลาหลัง T
  const tMatch = s.match(/T(\d{2}:\d{2})/);
  if (tMatch) return tMatch[1];
  // ถ้าเป็น HH:MM หรือ HH:MM:SS อยู่แล้ว
  const hm = s.match(/^(\d{1,2}):(\d{2})/);
  if (hm) return `${hm[1].padStart(2,'0')}:${hm[2]}`;
  return s;
};

// ===== เวลาทำงานมาตรฐาน (ตรึงค่าไว้) =====
// เข้างาน 08:00 · ออกงาน 17:00 · ผ่อนผันสายได้ 5 นาที (เข้าได้ถึง 08:05)
const WORK_HOURS = { start: '08:00', end: '17:00', lateGrace: 5 };

const lateMinutesOf = (checkIn) => {
  const ci = normTime(checkIn);
  if (!ci) return 0;
  const [wsH, wsM] = WORK_HOURS.start.split(':').map(Number);
  const allowed = (wsH*60+wsM) + WORK_HOURS.lateGrace;
  const [ciH, ciM] = ci.split(':').map(Number);
  const ciMin = (ciH||0)*60 + (ciM||0);
  return Math.max(0, ciMin - allowed);
};

const Topbar = ({ title, subtitle, action }) => {
  const { leaves, assets, employees, user, setPage, refreshData, syncing, addToast } = useApp();
  const [open, setOpen] = useState(false);

  // สร้างรายการแจ้งเตือนจากข้อมูลจริง
  const notifications = useMemo(() => {
    const list = [];
    const myEmp = employees.find(e => e.id === user.empId);
    const scope = myEmp?.approvalScope || (myEmp?.canApprove ? 'manager' : 'none');
    const canApprove = user.role === 'admin' || user.role === 'hr' || user.role === 'manager' || scope !== 'none';

    // คำขอลารออนุมัติ
    if (canApprove) {
      let pending = leaves.filter(l => l.status === 'pending');
      if (scope === 'regional' && myEmp) {
        pending = pending.filter(l => {
          const e = employees.find(x => x.id === l.employeeId);
          return e && e.branchId === myEmp.branchId;
        });
      } else if (user.role === 'manager' && user.branchId) {
        pending = pending.filter(l => {
          const e = employees.find(x => x.id === l.employeeId);
          return e && e.branchId === user.branchId;
        });
      }
      if (pending.length > 0) {
        list.push({
          id: 'leave-pending', icon: 'calendar', color: 'gold',
          title: `มีคำขอลารออนุมัติ ${pending.length} รายการ`,
          desc: 'คลิกเพื่อไปหน้าการลา', page: 'leaves',
        });
      }
    }

    // ทรัพย์สินชำรุด/รอซ่อม
    if (['admin','hr','manager'].includes(user.role)) {
      const broken = assets.filter(a => a.status === 'ชำรุด/รอซ่อม'

          id: 'asset-broken', icon: 'wrench', color: 'red',
          title: `ทรัพย์สินชำรุด/รอซ่อม ${broken.length} รายการ`,

        </div>
        <div className="flex items-center gap-3">
          {action}
          <button

            disabled={syncing}
            title={api.enabled() ? 'ซิงค์ข้อมูลล่าสุด' : 'ยังไม่ได้เชื่อมต่อ Google Sheets'}
            className={cls(
              'w-10 h-10 rounded-xl border flex items-center justify-center transition-colors disabled:opacity-50',
              api.enabled() ? 'border-ink-200 hover:bg-ink-50 text-ink-600' : 'border-gold-300 bg-gold-50 text-gold-600 hover:bg-gold-100',

          </button>
          <div className="relative">
            <button

              className="relative w-10 h-10 rounded-xl border border-ink-200 hover:bg-ink-50 flex items-center justify-center text-ink-600 transition-colors">

const Dashboard = ({ }) => {
  const { employees, attendance, leaves, leaveTypes, branches, user, refreshData, syncing } = useApp();
  const today = new Date().toISOString().split('T')[0];
  const [selectedDate, setSelectedDate] = useState(today);  // วันที่ที่เลือกดูรายละเอียด
  const [detailTab, setDetailTab] = useState('leave');       // leave / absent / late / wfh

  // Filter by branch if manager
  const scopedEmps = useMemo(() => {
    if (user.role === 'manager' && user.branchId) {
      return employees.filter(e => e.branchId === user.branchId);
    }
    return employees;
  }, [employees, user]);

  const scopedEmpIds = useMemo(() => new Set(scopedEmps.map(e => e.id)), [scopedEmps]);
  const todayAtt = attendance.filter(a => a.date === today && scopedEmpIds.has(a.employeeId));
  const todayLeaves = leaves.filter(l =>
    l.status === 'approved' &&
    toYMD(l.startDate) <= today && toYMD(l.endDate) >= today &&
    scopedEmpIds.has(l.employeeId)
  );
  const pendingLeaves = leaves.filter(l => l.status === 'pending' && scopedEmpIds.has(l.employeeId));
  const lateCount = todayAtt.filter(a => a.status === 'late').length;

  // นับเฉพาะพนักงานที่ยังทำงานอยู่ (active)
  const activeEmps = scopedEmps.filter(e => e.status !== 'inactive');
  const leaveEmpIds = new Set(todayLeaves.map(l => l.employeeId));

  // มาทำงาน = พนักงาน active ทั้งหมด - คนลา
  // (ถ้ามีข้อมูลสแกนนิ้ว = ใช้ตัวเลขจริง, ถ้าไม่มี = สมมติว่ามาทำงาน)
  const hasAttendanceData = todayAtt.length > 0;
  const presentCount = hasAttendanceData
    ? todayAtt.length
    : activeEmps.filter(e => !leaveEmpIds.has(e.id)).length;
  const absentCount = hasAttendanceData
    ? Math.max(0, activeEmps.length - presentCount - todayLeaves.length)
    : 0;

  // ===== รายละเอียดของวันที่เลือก (filter รายวัน) =====
  const dayDetail = useMemo(() => {
    const empById = new Map(scopedEmps.map(e => [e.id, e]));
    // คนลาในวันที่เลือก (แยกตาม WFH/offsite vs ลาจริง)
    const dayLeaves = leaves.filter(l =>
      l.status === 'approved' &&
      toYMD(l.startDate) <= selectedDate &&
      toYMD(l.endDate) >= selectedDate &&
      scopedEmpIds.has(l.employeeId)
    );
    const wfhTypes = new Set(['wfh', 'offsite']);
    const onLeave = dayLeaves.filter(l => !wfhTypes.has(l.type) && l.type !== 'absent');
    const onWfh   = dayLeaves.filter(l => wfhTypes.has(l.type));
    const onAbsentLeave = dayLeaves.filter(l => l.type === 'absent');

    // การเข้างานในวันที่เลือก
    const dayAtt = attendance.filter(a => a.date === selectedDate && scopedEmpIds.has(a.employeeId));
    const lateList = dayAtt.filter(a => a.status === 'late');
    const dayAttEmpIds = new Set(dayAtt.map(a => a.employeeId));
    const dayLeaveEmpIds = new Set(dayLeaves.map(l => l.employeeId));

    // ขาดงาน = มีข้อมูลสแกน แต่ไม่มา + ไม่ลา (หรือ มี leave type absent)
    let absentList = [];
    if (dayAtt.length > 0) {
      absentList = activeEmps.filter(e =>
        !dayAttEmpIds.has(e.id) && !dayLeaveEmpIds.has(e.id)
      ).map(e => ({ employeeId: e.id, type: 'absent' }));
    }
    // รวม leave type = absent ด้วย
    absentList = absentList.concat(onAbsentLeave.map(l => ({ employeeId: l.employeeId, type: 'absent', ...l })));

    const enrich = (item) => {
      const emp = empById.get(item.employeeId);
      return { ...item, emp };
    };

    return {
      leave:  onLeave.map(enrich),
      absent: absentList.map(enrich),
      late:   lateList.map(enrich),
      wfh:    onWfh.map(enrich),
      hasAtt: dayAtt.length > 0,
    };
  }, [selectedDate, leaves, attendance, scopedEmps, scopedEmpIds, activeEmps]);

  // ===== Top 3 (ทั้งปี) =====
  const year = String(new Date().getFullYear());
  const topRankings = useMemo(() => {
    const empById = new Map(scopedEmps.map(e => [e.id, e]));
    // นับจำนวนวันของแต่ละพนักงาน แยกหมวด
    const absentDays = {};   // ขาดงาน
    const leaveDays  = {};   // ลาป่วย + ลากิจ + ลาไม่รับเงินเดือน
    const lateDays   = {};   // มาสาย

    const leaveCountTypes = new Set(['sick', 'personal', 'unpaid']);

    leaves.forEach(l => {
      if (l.status !== 'approved') return;
      if (!scopedEmpIds.has(l.employeeId)) return;
      if (!String(l.startDate || '').startsWith(year)) return;
      const d = Number(l.days) || 0;
      if (l.type === 'absent') {
        absentDays[l.employeeId] = (absentDays[l.employeeId] || 0) + d;
      } else if (leaveCountTypes.has(l.type)) {
        leaveDays[l.employeeId] = (leaveDays[l.employeeId] || 0) + d;
      }
    });

    attendance.forEach(a => {
      if (!scopedEmpIds.has(a.employeeId)) return;
      if (!String(a.date || '').startsWith(year)) return;
      if (a.status === 'late') {
        lateDays[a.employeeId] = (lateDays[a.employeeId] || 0) + 1;
      }
    });

    const toTop3 = (obj, unit) => Object.entries(obj)
      .map(([id, val]) => ({ emp: empById.get(id), val, unit }))
      .filter(x => x.emp && x.val > 0)
      .sort((a, b) => b.val - a.val)
      .slice(0, 3);

    return {
      absent: toTop3(absentDays, 'วัน'),
      leave:  toTop3(leaveDays, 'วัน'),
      late:   toTop3(lateDays, 'ครั้ง'),
    };
  }, [leaves, attendance, scopedEmps, scopedEmpIds, year]);

  // Chart: by branch
  const byBranch = branches.map(b => {
    const empsInB = activeEmps.filter(e => e.branchId === b.id);
    const leaveInB = todayLeaves.filter(l => empsInB.some(e => e.id === l.employeeId)).length;
    const attendedInB = todayAtt.filter(a => empsInB.some(e => e.id === a.employeeId)).length;
    const hasDataB = attendedInB > 0;
    const presentInB = hasDataB
      ? attendedInB
      : empsInB.filter(e => !leaveEmpIds.has(e.id)).length;
    return {
      name: b.short,
      มาทำงาน: presentInB,
      ลา: leaveInB,
      ขาดงาน: hasDataB ? Math.max(0, empsInB.length - presentInB - leaveInB) : 0,
      color: b.color,
    };
  });

  // Trend: last 7 days
  const trend = Array.from({ length: 7 }, (_, i) => {
    const d = new Date();
    d.setDate(d.getDate() - (6 - i));
    const ds = d.toISOString().split('T')[0];
    const dayAtt = attendance.filter(a => a.date === ds && scopedEmpIds.has(a.employeeId)).length;
    const dayLeavesList = leaves.filter(l => l.status === 'approved' && toYMD(l.startDate) <= ds && toYMD(l.endDate) >= ds && scopedEmpIds.has(l.employeeId));
    const dayLeaveIds = new Set(dayLeavesList.map(l => l.employeeId));
    const dayPresent = dayAtt > 0 ? dayAtt : activeEmps.filter(e => !dayLeaveIds.has(e.id)).length;
    return {
      date: d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' }),
      มาทำงาน: dayPresent,
      ลา: dayLeavesList.length,
    };
  });

  // Leave types pie
  const leaveByType = leaveTypes.map(t => {
    const count = leaves.filter(l => l.type === t.id && scopedEmpIds.has(l.employeeId)).length;
    return { name: t.label, value: count, color: t.color };
  }).filter(t => t.value > 0);

  return (
    <div className="p-8 space-y-6 animate-fade-up">
      {/* Hi-tech Hero banner */}
      <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-[#0B1020] via-[#15103A] to-[#0E2A4A] text-white p-8">
        {/* Animated grid */}
        <div className="absolute inset-0 tech-grid opacity-60" />
        {/* Glowing orbs */}
        <div className="orb w-72 h-72 bg-flow-500/30 -right-16 -top-20" />
        <div className="orb w-56 h-56 bg-brand-500/30 right-1/3 -bottom-16" style={{ animationDelay: '4s' }} />
        <div className="orb w-40 h-40 bg-gold-500/20 left-10 top-10" style={{ animationDelay: '8s' }} />

        <div className="relative grid lg:grid-cols-2 gap-6 items-center">
          {api.enabled() && (
            <button
              onClick={refreshData}
              disabled={syncing}
              title="ซิงค์ข้อมูลล่าสุด"
              className="absolute top-0 right-0 z-10 inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/10 border border-white/20 backdrop-blur-sm text-white/90 text-xs hover:bg-white/20 transition-colors disabled:opacity-50">
              <Icon name="refresh" className={cls('w-3.5 h-3.5', syncing && 'animate-spin')} />
              {syncing ? 'กำลังซิงค์...' : 'ซิงค์ข้อมูล'}
            </button>
          )}
          <div>
            <div className="flex items-center gap-2 mb-3">
              <span className="live-dot" />
              <span className="text-flow-200/90 text-[11px] uppercase tracking-[0.2em] font-medium">
                ระบบออนไลน์ · {fmtThaiDate(new Date())}
              </span>
            </div>
            <h2 className="font-display text-3xl lg:text-4xl font-bold mb-3 tracking-tight">
              สวัสดี, {user.name}
            </h2>
            <p className="text-flow-100/70 max-w-md leading-relaxed">
              วันนี้มีพนักงานมาทำงาน <strong className="text-flow-300">{presentCount} คน</strong> จากทั้งหมด {activeEmps.length} คน
              {pendingLeaves.length > 0 && <> · มีคำขอลารออนุมัติ <strong className="text-gold-300">{pendingLeaves.length} รายการ</strong></>}
            </p>

            {/* Mini metric chips */}
            <div className="flex flex-wrap gap-2 mt-5">
              <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/5 border border-white/10 backdrop-blur-sm">
                <Icon name="check" className="w-3.5 h-3.5 text-emerald-400" />
                <span className="text-xs text-white/80">ตรงเวลา {hasAttendanceData ? presentCount - lateCount : presentCount}</span>
              </div>
              <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/5 border border-white/10 backdrop-blur-sm">
                <Icon name="clock" className="w-3.5 h-3.5 text-gold-400" />

              </div>
              <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/5 border border-white/10 backdrop-blur-sm">
                <Icon name="calendar" className="w-3.5 h-3.5 text-flow-400" />
                <span className="text-xs text-white/80">ลา {todayLeaves.length}</span>
              </div>
            </div>
          </div>

          {/* Attendance ring */}
          <div className="flex items-center justify-center lg:justify-end gap-6">

              <svg className="w-full h-full ring-progress" viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="10" />

                />

                    <stop offset="0%" stopColor="#22D3EE" />

              <div className="absolute inset-0 flex flex-col items-center justify-center">

                  {activeEmps.length > 0 ? Math.round((presentCount / activeEmps.length) * 100) : 0}%

          { icon: 'calendar',    label: 'ลางานวันนี้',     value: todayLeaves.length,   sub: `รออนุมัติ ${pendingLeaves.length}`, color: 'gold' },
          { icon: 'x',           label: 'ขาดงานวันนี้',    value: Math.max(0, absentCount), sub: hasAttendanceData ? 'ไม่ได้ลาและไม่มา' : 'รอข้อมูลสแกน',                   color: 'red' },

              </div>
            </div>
            <div className="mt-4">
              <div className="text-sm text-ink-500">{s.label}</div>
              <div className="font-display text-3xl font-bold text-ink-900 mt-1 count-up">{s.value}</div>
              <div className="text-xs text-ink-400 mt-1">{s.sub}</div>
            </div>
          </Card>
        ))}
      </div>

      {/* Charts row */}
      <div className="grid lg:grid-cols-3 gap-6">
        {/* Attendance trend */}
        <Card className="lg:col-span-2 p-6">
          <div className="flex items-center justify-between mb-4">
            <div>
              <h3 className="font-display text-lg font-semibold text-ink-900">แนวโน้มการเข้างาน 7 วันล่าสุด</h3>
              <p className="text-xs text-ink-500">เปรียบเทียบจำนวนคนมาทำงานและลางาน</p>
            </div>
            <Badge color="blue"><span className="w-1.5 h-1.5 bg-flow-500 rounded-full" /> เรียลไทม์</Badge>
          </div>
          <div style={{ width: '100%', height: 280 }}>
            <ResponsiveContainer>
              <AreaChart data={trend} margin={{ top: 10, right: 10, left: -10, bottom: 0 }}>
                <defs>
                  <linearGradient id="gFlow" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="#06B6D4" stopOpacity={0.4} />
                    <stop offset="100%" stopColor="#06B6D4" stopOpacity={0} />
                  </linearGradient>
                  <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="#F59E0B" stopOpacity={0.4} />
                    <stop offset="100%" stopColor="#F59E0B" stopOpacity={0} />
                  </linearGradient>
                </defs>
                <CartesianGrid strokeDasharray="3 3" stroke="#ECEEF5" />
                <XAxis dataKey="date" stroke="#7E8AA5" fontSize={12} />
                <YAxis stroke="#7E8AA5" fontSize={12} />
                <Tooltip
                  contentStyle={{
                    background: '#fff', border: '1px solid #ECEEF5', borderRadius: 12,
                    boxShadow: '0 8px 32px -12px rgba(14,19,36,0.18)', fontFamily: 'Sarabun',
                  }}
                />
                <Legend wrapperStyle={{ fontFamily: 'Sarabun', fontSize: 12 }} />
                <Area type="monotone" dataKey="มาทำงาน" stroke="#06B6D4" strokeWidth={2.5} fill="url(#gFlow)" />
                <Area type="monotone" dataKey="ลา"      stroke="#F59E0B" strokeWidth={2.5} fill="url(#gGold)" />
              </AreaChart>
            </ResponsiveContainer>
          </div>
        </Card>

        {/* By branch */}
        <Card className="p-6">
          <h3 className="font-display text-lg font-semibold text-ink-900">สรุปตามสาขา</h3>
          <p className="text-xs text-ink-500 mb-4">สถานะปัจจุบันของแต่ละสาขา</p>
          <div className="space-y-4">
            {byBranch.map((b) => {
              const total = b.มาทำงาน + b.ลา + b.ขาดงาน;
              const pct = total ? Math.round((b.มาทำงาน / total) * 100) : 0;
              return (
                <div key={b.name}>
                  <div className="flex items-center justify-between mb-1.5">
                    <div className="flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full" style={{ background: b.color }} />
                      <span className="text-sm font-medium text-ink-800">{b.name}</span>
                    </div>
                    <span className="text-xs text-ink-500">{b.มาทำงาน}/{total} ({pct}%)</span>
                  </div>
                  <div className="w-full h-2.5 bg-ink-100 rounded-full overflow-hidden flex">
                    <div className="h-full transition-all" style={{ width: `${(b.มาทำงาน / Math.max(1, total)) * 100}%`, background: b.color }} />
                    <div className="h-full bg-gold-400 transition-all" style={{ width: `${(b.ลา / Math.max(1, total)) * 100}%` }} />
                    <div className="h-full bg-ink-300 transition-all" style={{ width: `${(b.ขาดงาน / Math.max(1, total)) * 100}%` }} />
                  </div>
                </div>
              );
            })}
          </div>
          <div className="flex items-center gap-4 mt-5 text-xs text-ink-500">
            <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-flow-500" />มาทำงาน</span>
            <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-gold-400" />ลา</span>
            <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-ink-300" />ขาด</span>
          </div>
        </Card>
      </div>

      {/* Bottom row */}
      <div className="grid lg:grid-cols-3 gap-6">
        {/* Pending leaves */}
        <Card className="lg:col-span-2 p-6">
          <div className="flex items-center justify-between mb-4">
            <h3 className="font-display text-lg font-semibold text-ink-900">คำขอลาที่รออนุมัติ</h3>
            <Badge color="yellow">{pendingLeaves.length} รายการ</Badge>
          </div>
          {pendingLeaves.length === 0 ? (
            <Empty icon="check" title="ไม่มีคำขอที่รอ" desc="คำขอลาทั้งหมดได้รับการดำเนินการแล้ว" />
          ) : (
            <div className="divide-y divide-ink-100">
              {pendingLeaves.slice(0, 5).map((l) => {
                const emp = employees.find(e => e.id === l.employeeId);
                const type = leaveTypes.find(t => t.id === l.type);
                if (!emp || !type) return null;
                return (
                  <div key={l.id} className="py-3 flex items-center gap-3">
                    <Avatar name={`${emp.firstName} ${emp.lastName}`} photo={emp.photo} />
                    <div className="flex-1 min-w-0">
                      <div className="font-medium text-sm text-ink-900">{emp.firstName} {emp.lastName}</div>
                      <div className="text-xs text-ink-500 truncate">{l.reason}</div>
                    </div>
                    <div className="text-right">
                      <Badge color={type.id === 'sick' ? 'red' : type.id === 'vacation' ? 'blue' : 'yellow'}>
                        {type.label}
                      </Badge>
                      <div className="text-xs text-ink-500 mt-1">{l.days} วัน</div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </Card>

        {/* Leave by type */}
        <Card className="p-6">
          <h3 className="font-display text-lg font-semibold text-ink-900">สัดส่วนประเภทการลา</h3>
          <p className="text-xs text-ink-500 mb-3">รายการลาทั้งหมดในระบบ</p>
          {leaveByType.length === 0 ? (
            <Empty icon="calendar" title="ยังไม่มีข้อมูล" desc="" />
          ) : (
            <div style={{ width: '100%', height: 220 }}>
              <ResponsiveContainer>
                <PieChart>
                  <Pie
                    data={leaveByType}
                    cx="50%" cy="50%"
                    innerRadius={50} outerRadius={80}
                    paddingAngle={3}
                    dataKey="value"
                  >
                    {leaveByType.map((entry, idx) => (
                      <Cell key={idx} fill={entry.color} />
                    ))}
                  </Pie>
                  <Tooltip
                    contentStyle={{
                      background: '#fff', border: '1px solid #ECEEF5', borderRadius: 12,
                      boxShadow: '0 8px 32px -12px rgba(14,19,36,0.18)', fontFamily: 'Sarabun',
                    }}
                  />
                </PieChart>
              </ResponsiveContainer>
            </div>
          )}
          <div className="grid grid-cols-2 gap-2 mt-3 text-xs">
            {leaveByType.map((t) => (
              <div key={t.name} className="flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full" style={{ background: t.color }} />
                <span className="text-ink-600">{t.name}</span>
                <span className="text-ink-400 ml-auto">{t.value}</span>
              </div>
            ))}
          </div>
        </Card>
      </div>

      {/* ===== Filter รายวัน: ดูรายชื่อคนลา/ขาด/สาย/WFH ===== */}
      <Card className="p-6">
        <div className="flex flex-wrap items-center justify-between gap-3 mb-5">
          <div>
            <h3 className="font-display text-lg font-semibold text-ink-900">รายละเอียดรายวัน</h3>
            <p className="text-sm text-ink-500 mt-0.5">เลือกวันที่เพื่อดูรายชื่อพนักงาน</p>
          </div>
          <Input
            type="date"
            value={selectedDate}
            onChange={(e) => setSelectedDate(e.target.value)}
            className="w-auto"
          />
        </div>

        {/* Tabs */}
        <div className="flex flex-wrap items-center gap-2 mb-4">
          {[
            { id: 'leave',  label: 'ลางาน',   icon: 'calendar',    count: dayDetail.leave.length,  color: 'gold' },
            { id: 'absent', label: 'ขาดงาน',  icon: 'x',           count: dayDetail.absent.length, color: 'red' },
            { id: 'late',   label: 'มาสาย',   icon: 'refresh',     count: dayDetail.late.length,   color: 'gold' },
            { id: 'wfh',    label: 'WFH/นอกสถานที่', icon: 'building', count: dayDetail.wfh.length, color: 'green' },
          ].map(t => (
            <button
              key={t.id}
              onClick={() => setDetailTab(t.id)}
              className={cls(
                'inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium transition-all border',
                detailTab === t.id
                  ? 'bg-flow-600 text-white border-flow-600 shadow-soft'
                  : 'bg-white text-ink-600 border-ink-200 hover:border-ink-300',
              )}
            >
              <Icon name={t.icon} className="w-4 h-4" />
              {t.label}
              <span className={cls(
                'min-w-[20px] px-1.5 py-0.5 rounded-full text-[11px] font-bold',
                detailTab === t.id ? 'bg-white/20' : 'bg-ink-100 text-ink-600',
              )}>
                {t.count}
              </span>
            </button>
          ))}
        </div>

        {/* รายชื่อ */}
        {(() => {
          const list = dayDetail[detailTab] || [];
          if (detailTab === 'absent' && !dayDetail.hasAtt && list.length === 0) {
            return <Empty icon="info" title="ยังไม่มีข้อมูลการสแกนนิ้ว" desc="ต้องอัปโหลดข้อมูลการเข้างานก่อนจึงจะคำนวณคนขาดงานได้" />;
          }
          if (list.length === 0) {
            const labels = { leave: 'ไม่มีคนลา', absent: 'ไม่มีคนขาดงาน', late: 'ไม่มีคนมาสาย', wfh: 'ไม่มีคน WFH' };
            return <Empty icon="check" title={labels[detailTab]} desc={`วันที่ ${fmtDate(selectedDate)}`} />;
          }
          return (
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
              {list.map((item, i) => {
                const emp = item.emp;
                if (!emp) return null;
                const branch = branches.find(b => b.id === emp.branchId);
                const type = leaveTypes.find(t => t.id === item.type);
                return (
                  <div key={i} className="flex items-center gap-3 p-3 rounded-xl border border-ink-100 hover:shadow-soft transition-all">
                    <Avatar name={`${emp.firstName} ${emp.lastName}`} photo={emp.photo} size="sm" />
                    <div className="min-w-0 flex-1">
                      <div className="font-medium text-ink-900 text-sm truncate">{emp.firstName} {emp.lastName}</div>
                      <div className="text-xs text-ink-500 flex items-center gap-1.5">
                        <span>{branch?.short || '-'}</span>
                        {detailTab === 'late' && item.checkIn && (
                          <><span>·</span><span className="text-gold-600">เข้า {item.checkIn}</span></>
                        )}
                        {(detailTab === 'leave' || detailTab === 'wfh') && type && (
                          <><span>·</span><span style={{ color: type.color }}>{type.label}</span></>
                        )}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          );
        })()}
      </Card>

      {/* ===== Top 3 Rankings (ทั้งปี) ===== */}
      <div className="grid lg:grid-cols-3 gap-5">
        {[
          { key: 'absent', title: 'ขาดงานมากที่สุด', icon: 'x',       color: '#EF4444', bg: 'bg-red-50',  desc: 'รวมทั้งปี' },
          { key: 'leave',  title: 'ลางานมากที่สุด',   icon: 'calendar', color: '#F59E0B', bg: 'bg-gold-50', desc: 'ป่วย+กิจ+ไม่รับเงินเดือน' },
          { key: 'late',   title: 'มาสายมากที่สุด',   icon: 'refresh',  color: '#F97316', bg: 'bg-orange-50', desc: 'รวมทั้งปี' },
        ].map(rank => {
          const list = topRankings[rank.key];
          const medals = ['🥇', '🥈', '🥉'];
          return (
            <Card key={rank.key} className="p-5">
              <div className="flex items-center gap-2 mb-4">
                <div className="w-9 h-9 rounded-xl flex items-center justify-center" style={{ background: rank.color + '22', color: rank.color }}>
                  <Icon name={rank.icon} className="w-4.5 h-4.5" />
                </div>
                <div>
                  <h4 className="font-display font-semibold text-ink-900 text-sm">{rank.title}</h4>
                  <div className="text-[11px] text-ink-500">{rank.desc}</div>
                </div>
              </div>
              {list.length === 0 ? (
                <div className="text-center py-6 text-sm text-ink-400">ยังไม่มีข้อมูล</div>
              ) : (
                <div className="space-y-2">
                  {list.map((item, i) => (
                    <div key={i} className="flex items-center gap-3 p-2.5 rounded-xl hover:bg-ink-50 transition-colors">
                      <span className="text-lg w-6 text-center">{medals[i]}</span>
                      <Avatar name={`${item.emp.firstName} ${item.emp.lastName}`} photo={item.emp.photo} size="sm" />
                      <div className="min-w-0 flex-1">
                        <div className="font-medium text-ink-900 text-sm truncate">{item.emp.firstName} {item.emp.lastName}</div>
                        <div className="text-[11px] text-ink-500">{item.emp.id}</div>
                      </div>
                      <div className="text-right">
                        <span className="font-display font-bold text-lg" style={{ color: rank.color }}>{item.val}</span>
                        <span className="text-xs text-ink-500 ml-1">{item.unit}</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </Card>
          );
        })}
      </div>
    </div>
  );
};

/* =============================================================
   EMPLOYEES PAGE
   ============================================================= */
const EmployeesPage = () => {
  const { employees, setEmployees, branches, departments, attendance, leaves, setLeaves, leaveTypes, addToast, user } = useApp();
  const [search, setSearch]   = useState('');
  const [filterBranch, setFilterBranch] = useState('all');
  const [filterDep, setFilterDep] = useState('all');
  const [openAdd, setOpenAdd] = useState(false);
  const [editing, setEditing] = useState(null);
  const [viewing, setViewing] = useState(null); // พนักงานที่กำลังดูประวัติ
  const [showImport, setShowImport] = useState(false);

  const filtered = useMemo(() => {
    return employees.filter(e => {
      if (user.role === 'manager' && e.branchId !== user.branchId) return false;
      if (filterBranch !== 'all' && e.branchId !== filterBranch) return false;
      if (filterDep    !== 'all' && e.department !== filterDep) return false;
      if (search) {
        const q = search.toLowerCase();
        return (e.firstName + e.lastName + e.id + e.email + e.phone).toLowerCase().includes(q);
      }
      return true;
    });
  }, [employees, search, filterBranch, filterDep, user]);

  const deleteEmp = (id) => {
    if (!confirm('ยืนยันการลบพนักงานคนนี้?')) return;
    setEmployees(employees.filter(e => e.id !== id));
    addToast('success', 'ลบพนักงานเรียบร้อย');
    if (api.enabled()) {
      api.post('deleteEmployee', { id })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
  };

  return (
    <div className="p-8 space-y-6 animate-fade-up">
      <Topbar
        title="พนักงาน"
        subtitle={`ทั้งหมด ${filtered.length} คน`}
        action={
          (user.role === 'admin' || user.role === 'hr') && (
            <div className="flex gap-2">
              <Button variant="outline" icon="upload" onClick={() => setShowImport(true)}>
                นำเข้า Excel
              </Button>
              <Button icon="plus" onClick={() => { setEditing(null); setOpenAdd(true); }}>
                เพิ่มพนักงาน
              </Button>
            </div>
          )
        }
      />

      <Card className="p-4">
        <div className="grid md:grid-cols-4 gap-3">
          <div className="md:col-span-2">
            <Input icon="search" placeholder="ค้นหาชื่อ, รหัสพนักงาน, อีเมล..." value={search} onChange={(e) => setSearch(e.target.value)} />
          </div>
          <Select value={filterBranch} onChange={(e) => setFilterBranch(e.target.value)}>
            <option value="all">ทุกสาขา</option>
            {branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
          </Select>
          <Select value={filterDep} onChange={(e) => setFilterDep(e.target.value)}>
            <option value="all">ทุกฝ่าย</option>
            {departments.map(d => <option key={d} value={d}>{d}</option>)}
          </Select>
        </div>
      </Card>

      <Card className="overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-ink-50 text-ink-600">
              <tr>
                <th className="text-left px-5 py-3 font-medium">พนักงาน</th>
                <th className="text-left px-5 py-3 font-medium">รหัส</th>
                <th className="text-left px-5 py-3 font-medium">สาขา / ฝ่าย</th>
                <th className="text-left px-5 py-3 font-medium">ติดต่อ</th>
                <th className="text-left px-5 py-3 font-medium">วันเริ่มงาน</th>
                <th className="text-left px-5 py-3 font-medium">สถานะ</th>
                <th className="text-right px-5 py-3 font-medium">จัดการ</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-ink-100">
              {filtered.map(emp => {
                const branch = branches.find(b => b.id === emp.branchId);
                return (
                  <tr key={emp.id} className="hover:bg-flow-50/40 transition-colors cursor-pointer" onClick={() => setViewing(emp)}>
                    <td className="px-5 py-3">
                      <div className="flex items-center gap-3">
                        <Avatar name={`${emp.firstName} ${emp.lastName}`} photo={emp.photo} />
                        <div>
                          <div className="font-medium text-ink-900 hover:text-flow-700 transition-colors">{emp.firstName} {emp.lastName}{emp.nickname ? ` (${emp.nickname})` : ''}</div>
                          <div className="text-xs text-ink-500">{emp.position}</div>
                        </div>
                      </div>
                    </td>
                    <td className="px-5 py-3 font-mono text-xs">{emp.id}</td>
                    <td className="px-5 py-3">
                      <Badge color="blue">{branch?.short || '-'}</Badge>
                      <div className="text-xs text-ink-500 mt-1">{emp.department}</div>
                    </td>
                    <td className="px-5 py-3">
                      <div className="text-xs text-ink-700">{emp.email}</div>
                      <div className="text-xs text-ink-500">{emp.phone}</div>
                    </td>
                    <td className="px-5 py-3 text-ink-600 text-xs">{fmtDate(emp.startDate)}</td>
                    <td className="px-5 py-3">
                      <div className="flex items-center gap-1.5 flex-wrap">
                        <Badge color={emp.status === 'active' ? 'green' : 'gray'}>
                          {emp.status === 'active' ? 'ปฏิบัติงาน' : 'พ้นสภาพ'}
                        </Badge>
                        {emp.canApprove && (
                          <Badge color="green" title="มีสิทธิ์อนุมัติวันลา">
                            <Icon name="check" className="w-3 h-3" />ผู้อนุมัติ
                          </Badge>
                        )}
                        {emp.leaveQuotaOverride && Object.keys(emp.leaveQuotaOverride).length > 0 && (
                          <Badge color="yellow" title="มีสิทธิ์การลาเฉพาะบุคคล">
                            <Icon name="sparkle" className="w-3 h-3" />สิทธิ์เฉพาะ
                          </Badge>
                        )}
                      </div>
                    </td>
                    <td className="px-5 py-3 text-right" onClick={(e) => e.stopPropagation()}>
                      <div className="inline-flex gap-1">
                        <button onClick={() => setViewing(emp)} className="p-1.5 rounded-lg text-ink-500 hover:bg-flow-50 hover:text-flow-700" title="ดูประวัติ">
                          <Icon name="eye" className="w-4 h-4" />
                        </button>
                        {(user.role === 'admin' || user.role === 'hr') && (
                          <>
                            <button onClick={() => { setEditing(emp); setOpenAdd(true); }} className="p-1.5 rounded-lg text-ink-500 hover:bg-flow-50 hover:text-flow-700" title="แก้ไข">
                              <Icon name="edit" className="w-4 h-4" />
                            </button>
                            <button onClick={() => deleteEmp(emp.id)} className="p-1.5 rounded-lg text-ink-500 hover:bg-red-50 hover:text-red-600" title="ลบ">
                              <Icon name="trash" className="w-4 h-4" />
                            </button>
                          </>
                        )}
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          {filtered.length === 0 && (
            <Empty icon="users" title="ไม่พบพนักงาน" desc="ลองเปลี่ยนเงื่อนไขการค้นหา" />
          )}
        </div>
      </Card>

      <EmployeeFormModal
        open={openAdd}
        onClose={() => setOpenAdd(false)}
        editing={editing}
        onSave={(emp) => {
          if (editing) {
            setEmployees(employees.map(e => e.id === emp.id ? emp : e));
            addToast('success', 'บันทึกข้อมูลเรียบร้อย');
          } else {
            setEmployees([...employees, emp]);
            addToast('success', 'เพิ่มพนักงานเรียบร้อย');
          }
          if (api.enabled()) {
            api.post('saveEmployee', { data: emp })
              .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
          }
          setOpenAdd(false);
        }}
        existingIds={employees.map(e => e.id)}
      />

      <EmployeeProfileModal
        employee={viewing}
        onClose={() => setViewing(null)}
        attendance={attendance}
        leaves={leaves}
        leaveTypes={leaveTypes}
        branches={branches}
        onEdit={(emp) => { setViewing(null); setEditing(emp); setOpenAdd(true); }}
        canEdit={user.role === 'admin' || user.role === 'hr'}
      />

      <ImportEmployeesModal
        open={showImport}
        onClose={() => setShowImport(false)}
        existingEmployees={employees}
        branches={branches}
        leaveTypes={leaveTypes}
        onImport={(newEmps, newLeaves) => {
          // Merge พนักงาน (อัปเดตถ้ามีรหัสเดิม / เพิ่มถ้าใหม่)
          const empMap = new Map(employees.map(e => [e.id, e]));
          newEmps.forEach(e => empMap.set(e.id, { ...empMap.get(e.id), ...e }));
          const merged = Array.from(empMap.values());
          setEmployees(merged);

          // เพิ่มประวัติการลา (ถ้ามี)
          if (newLeaves && newLeaves.length > 0) {
            // Merge ตาม ID (ป้องกันซ้ำ)
            const lvMap = new Map(leaves.map(l => [l.id, l]));
            newLeaves.forEach(l => lvMap.set(l.id, l));
            setLeaves(Array.from(lvMap.values()));
          }

          addToast('success', `นำเข้าพนักงาน ${newEmps.length} คนสำเร็จ${newLeaves?.length ? ` พร้อมประวัติการลา ${newLeaves.length} รายการ` : ''}`);

          if (api.enabled()) {
            // บันทึกพนักงานทีละคน (Apps Script จะ upsert)
            (async () => {
              for (const e of newEmps) {
                try { await api.post('saveEmployee', { data: e }); } catch (err) {}
              }
              if (newLeaves && newLeaves.length > 0) {
                for (const lv of newLeaves) {
                  try { await api.post('saveLeave', { data: lv }); } catch (err) {}
                }
              }
            })();
          }
          setShowImport(false);
        }}
      />
    </div>
  );
};

/* =============================================================
   EMPLOYEE PROFILE MODAL — ดูประวัติการมาทำงาน + การลา
   ============================================================= */
const EmployeeProfileModal = ({ employee, onClose, attendance, leaves, leaveTypes, branches, onEdit, canEdit }) => {
  const { kpiRecords, kpiCriteria } = useApp();
  const [tab, setTab] = useState('overview');
  const [showExport, setShowExport] = useState(false);

  // คำนวณสถิติทั้งหมด (hooks ต้องอยู่ก่อน early return)
  const stats = useMemo(() => {
    if (!employee) return null;
    const emp = employee;
    const year = String(new Date().getFullYear());

    // ประวัติการเข้างาน (เรียงใหม่→เก่า)
    const myAtt = attendance
      .filter(a => a.employeeId === emp.id)
      .sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));

    // ประวัติการลา
    const myLeaves = leaves
      .filter(l => l.employeeId === emp.id)
      .sort((a, b) => String(b.startDate || '').localeCompare(String(a.startDate || '')));

    // สถิติการเข้างาน — มาทำงานจริง = ontime + late + wfh (WFH ถือว่ามาทำงาน)
    const workDays   = myAtt.filter(a => a.status === 'ontime' || a.status === 'late' || a.status === 'wfh');
    const totalDays  = workDays.length;
    const lateDays   = myAtt.filter(a => a.status === 'late').length;
    const onTimeDays = myAtt.filter(a => a.status === 'ontime').length;
    const wfhDays    = myAtt.filter(a => a.status === 'wfh').length;
    const absentDays = myAtt.filter(a => a.status === 'absent').length;
    // อัตราตรงเวลา = (ตรงเวลา + wfh) / วันทำงาน
    const onTimeRate = totalDays > 0 ? Math.round(((onTimeDays + wfhDays) / totalDays) * 100) : 0;

    // โควต้าการลา
    const quota = calcQuota(emp, leaveTypes, leaves, year);
    const totalLeaveUsed = quota.reduce((s, q) => s + q.used, 0);
    const approvedLeaves = myLeaves.filter(l => l.status === 'approved').length;
    const pendingLeaves  = myLeaves.filter(l => l.status === 'pending').length;

    return { myAtt, myLeaves, totalDays, lateDays, onTimeDays, wfhDays, absentDays, onTimeRate, quota, totalLeaveUsed, approvedLeaves, pendingLeaves };
  }, [employee, attendance, leaves, leaveTypes]);

  if (!employee) return null;
  const emp = employee;
  const branch = branches.find(b => b.id === emp.branchId);
  const fullName = `${emp.firstName} ${emp.lastName}`;

  const calcHours = (att) => {
    if (!att.checkIn || !att.checkOut) return null;
    const [h1, m1] = String(att.checkIn).split(':').map(Number);
    const [h2, m2] = String(att.checkOut).split(':').map(Number);
    const diff = (h2 * 60 + m2) - (h1 * 60 + m1);
    if (isNaN(diff) || diff <= 0) return null;
    return `${Math.floor(diff / 60)}.${String(diff % 60).padStart(2, '0')}`;
  };

  return (
    <>
    <Modal open={!!employee} onClose={onClose} title="ประวัติพนักงาน" size="xl">
      {/* Header card */}
      <div className="flex items-start gap-4 pb-5 border-b border-ink-100">
        <Avatar name={fullName} photo={emp.photo} size="xl" />
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2 flex-wrap">
            <h2 className="font-display text-2xl font-bold text-ink-900">{fullName}</h2>
            {emp.nickname && <span className="text-ink-500 text-lg">({emp.nickname})</span>}
            <Badge color={emp.status === 'active' ? 'green' : 'gray'}>
              {emp.status === 'active' ? 'ปฏิบัติงาน' : 'พ้นสภาพ'}
            </Badge>
          </div>
          <div className="text-ink-500 mt-0.5">{emp.position}</div>
          <div className="flex flex-wrap gap-x-5 gap-y-1 mt-3 text-sm">
            <span className="flex items-center gap-1.5 text-ink-600"><Icon name="user" className="w-4 h-4 text-ink-400" />{emp.id}</span>
            <span className="flex items-center gap-1.5 text-ink-600"><Icon name="building" className="w-4 h-4 text-ink-400" />{branch?.name || '-'}</span>
            <span className="flex items-center gap-1.5 text-ink-600"><Icon name="briefcase" className="w-4 h-4 text-ink-400" />{emp.department}</span>
          </div>
          <div className="flex flex-wrap gap-x-5 gap-y-1 mt-1 text-sm">
            {emp.email && <span className="flex items-center gap-1.5 text-ink-600"><Icon name="mail" className="w-4 h-4 text-ink-400" />{emp.email}</span>}
            {emp.phone && <span className="flex items-center gap-1.5 text-ink-600"><Icon name="phone" className="w-4 h-4 text-ink-400" />{emp.phone}</span>}
            <span className="flex items-center gap-1.5 text-ink-600"><Icon name="calendar" className="w-4 h-4 text-ink-400" />เริ่มงาน {fmtDate(emp.startDate)}</span>
          </div>
        </div>
        <div className="flex gap-2">
          <Button variant="outline" size="sm" icon="download" onClick={() => setShowExport(true)}>Export</Button>
          {canEdit && (
            <Button variant="outline" size="sm" icon="edit" onClick={() => onEdit(emp)}>แก้ไข</Button>
          )}
        </div>
      </div>

      {/* Stat cards */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mt-5">
        <div className="rounded-2xl bg-flow-50 border border-flow-100 p-4">
          <div className="text-xs text-ink-500 mb-1">มาทำงานทั้งหมด</div>
          <div className="font-display text-2xl font-bold text-flow-700">{stats.totalDays} <span className="text-sm font-normal text-ink-500">วัน</span></div>
        </div>
        <div className="rounded-2xl bg-emerald-50 border border-emerald-100 p-4">
          <div className="text-xs text-ink-500 mb-1">อัตราตรงเวลา</div>
          <div className="font-display text-2xl font-bold text-emerald-600">{stats.onTimeRate}%</div>
        </div>
        <div className="rounded-2xl bg-gold-50 border border-gold-100 p-4">
          <div className="text-xs text-ink-500 mb-1">มาสาย</div>
          <div className="font-display text-2xl font-bold text-gold-600">{stats.lateDays} <span className="text-sm font-normal text-ink-500">ครั้ง</span></div>
        </div>
        <div className="rounded-2xl bg-purple-50 border border-purple-100 p-4">
          <div className="text-xs text-ink-500 mb-1">ลาไปแล้วปีนี้</div>
          <div className="font-display text-2xl font-bold text-purple-600">{stats.totalLeaveUsed} <span className="text-sm font-normal text-ink-500">วัน</span></div>
        </div>
      </div>

      {/* Tabs */}
      <div className="flex items-center gap-2 bg-ink-50 p-1.5 rounded-xl w-fit mt-5">
        {[
          { id: 'overview',   label: 'ภาพรวม',         icon: 'chart' },
          { id: 'attendance', label: 'ประวัติเข้างาน', icon: 'fingerprint' },
          { id: 'leaves',     label: 'ประวัติการลา',   icon: 'calendar' },
          { id: 'kpi',        label: 'ผลประเมิน KPI',  icon: 'target' },
        ].map(t => (
          <button
            key={t.id}
            onClick={() => setTab(t.id)}
            className={cls(
              'inline-flex items-center gap-2 px-4 py-1.5 rounded-lg text-sm font-medium transition-all',
              tab === t.id ? 'bg-white text-flow-700 shadow-soft' : 'text-ink-600 hover:text-ink-900',
            )}
          >
            <Icon name={t.icon} className="w-4 h-4" />
            {t.label}
          </button>
        ))}
      </div>

      <div className="mt-4">
        {/* TAB: Overview — โควต้าการลา */}
        {tab === 'overview' && (
          <div className="space-y-4">
            <h4 className="font-display font-semibold text-ink-900">สิทธิ์การลาคงเหลือ (ปี {new Date().getFullYear()})</h4>
            <div className="grid sm:grid-cols-2 gap-3">
              {stats.quota.map(q => {
                const pct = q.max > 0 ? Math.round((q.used / q.max) * 100) : 0;
                const isNegative = q.remaining < 0;
                const isNoQuota = q.noQuota;
                return (
                  <div key={q.id} className={cls(
                    'rounded-xl border p-4',
                    isNegative ? 'border-red-200 bg-red-50/30' : 'border-ink-100'
                  )}>
                    <div className="flex items-center justify-between mb-2">
                      <div className="flex items-center gap-2">
                        <span className="w-2.5 h-2.5 rounded-full" style={{ background: q.color }} />
                        <span className="font-medium text-ink-900 text-sm">{q.label}</span>
                        {q.customized && !isNoQuota && <span className="text-[9px] px-1.5 py-0.5 bg-gold-100 text-gold-700 rounded font-semibold">เฉพาะ</span>}
                        {isNoQuota && <span className="text-[9px] px-1.5 py-0.5 bg-red-100 text-red-700 rounded font-semibold">ไม่มีสิทธิ์</span>}
                      </div>
                      <span className="text-xs text-ink-500">ใช้ {q.used}/{q.max} วัน</span>
                    </div>
                    <div className="w-full h-2 bg-ink-100 rounded-full overflow-hidden">
                      <div
                        className={cls('h-full transition-all', isNegative && 'bg-red-500')}
                        style={isNegative ? { width: '100%' } : { width: `${Math.min(100, pct)}%`, background: q.color }}
                      />
                    </div>
                    <div className="text-xs text-ink-500 mt-1.5">
                      คงเหลือ{' '}
                      <strong className={isNegative ? 'text-red-600' : q.remaining === 0 ? 'text-gold-600' : 'text-emerald-600'}>
                        {q.remaining}
                      </strong> วัน
                      {isNegative && <span className="text-red-600 font-semibold ml-1">(เกิน {Math.abs(q.remaining)})</span>}
                    </div>
                  </div>
                );
              })}
            </div>

            <div className="grid grid-cols-3 gap-3 pt-2">
              <div className="text-center p-3 rounded-xl bg-ink-50">
                <div className="font-display text-xl font-bold text-emerald-600">{stats.approvedLeaves}</div>
                <div className="text-xs text-ink-500">ลาอนุมัติแล้ว</div>
              </div>
              <div className="text-center p-3 rounded-xl bg-ink-50">
                <div className="font-display text-xl font-bold text-gold-600">{stats.pendingLeaves}</div>
                <div className="text-xs text-ink-500">รออนุมัติ</div>
              </div>
              <div className="text-center p-3 rounded-xl bg-ink-50">
                <div className="font-display text-xl font-bold text-flow-700">{stats.onTimeDays}</div>
                <div className="text-xs text-ink-500">มาตรงเวลา</div>
              </div>
            </div>
          </div>
        )}

        {/* TAB: Attendance history */}
        {tab === 'attendance' && (
          <div className="border border-ink-100 rounded-xl overflow-hidden max-h-96 overflow-y-auto">
            {stats.myAtt.length === 0 ? (
              <Empty icon="fingerprint" title="ยังไม่มีประวัติการเข้างาน" desc="เมื่ออัปโหลดข้อมูลจากเครื่องสแกนแล้วจะแสดงที่นี่" />
            ) : (
              <table className="w-full text-sm">
                <thead className="bg-ink-50 text-ink-600 sticky top-0">
                  <tr>
                    <th className="text-left px-4 py-2.5 font-medium">วันที่</th>
                    <th className="text-left px-4 py-2.5 font-medium">เข้างาน</th>
                    <th className="text-left px-4 py-2.5 font-medium">ออกงาน</th>
                    <th className="text-left px-4 py-2.5 font-medium">ชั่วโมง</th>
                    <th className="text-left px-4 py-2.5 font-medium">สถานะ</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-ink-100">
                  {stats.myAtt.map(att => {
                    const hours = calcHours(att);
                    const info = attStatusInfo(att.status, att.leaveType, leaveTypes, { leavePeriod: att.leavePeriod, leaveHours: att.leaveHours });
                    const noWork = att.status === 'leave' || att.status === 'absent' || att.status === 'wfh';
                    return (
                      <tr key={att.id} className="hover:bg-ink-50/50">
                        <td className="px-4 py-2.5 text-ink-700">{fmtDate(att.date)}</td>
                        <td className="px-4 py-2.5 font-mono text-ink-800">{normTime(att.checkIn) || '-'}</td>
                        <td className="px-4 py-2.5 font-mono text-ink-800">{normTime(att.checkOut) || (noWork ? '-' : <span className="text-gold-600 text-xs">ยังไม่ออก</span>)}</td>

                        <td className="px-4 py-2.5">

                        </td>

                    );
                  })}

        )}

        {/* TAB: Leave history */}
        {tab === 'leaves' && (
          <div className="space-y-3 max-h-96 overflow-y-auto">
            {stats.myLeaves.length === 0 ? (
              <Empty icon="calendar" title="ยังไม่มีประวัติการลา" desc="เมื่อมีการขอลาจะแสดงที่นี่" />
            ) : (
              stats.myLeaves.map(l => {
                const type = leaveTypes.find(t => t.id === l.type);
                return (
                  <div key={l.id} className="rounded-xl border border-ink-100 p-4">
                    <div className="flex items-start justify-between mb-2">
                      <div className="flex items-center gap-2">
                        <span className="w-2.5 h-2.5 rounded-full" style={{ background: type?.color || '#999' }} />
                        <span className="font-medium text-ink-900">{type?.label || l.type}</span>
                        <span className="text-ink-400">·</span>
                        <span className="text-sm text-ink-600">{l.days} วัน</span>
                      </div>
                      <Badge color={l.status === 'approved' ? 'green' : l.status === 'rejected' ? 'red' : 'yellow'}>
                        {l.status === 'approved' ? 'อนุมัติแล้ว' : l.status === 'rejected' ? 'ปฏิเสธ' : 'รออนุมัติ'}
                      </Badge>
                    </div>
                    <div className="flex items-center gap-2 text-xs text-ink-500 mb-2">
                      <Icon name="calendar" className="w-3.5 h-3.5" />
                      {fmtDate(l.startDate)} → {fmtDate(l.endDate)}
                    </div>
                    {l.reason && (
                      <div className="text-sm text-ink-700 bg-ink-50 rounded-lg p-2.5">{l.reason}</div>
                    )}
                  </div>
                );
              })
            )}
          </div>
        )}

        {tab === 'kpi' && (
          <div className="space-y-3 max-h-96 overflow-y-auto">
            {(() => {
              const myKpi = (kpiRecords || [])
                .filter(r => r.employeeId === emp.id)
                .sort((a, b) => String(b.period || '').localeCompare(String(a.period || '')));
              if (myKpi.length === 0) {
                return <Empty icon="target" title="ยังไม่มีผลประเมิน KPI" desc="เมื่อมีการประเมินจะแสดงที่นี่" />;
              }
              return myKpi.map(r => {
                const { pct, items } = calcKpiScore(r, kpiCriteria);
                const g = kpiGrade(pct);
                const [ry, rm] = (r.period || '').split('-');
                const periodLabel = rm ? `${THAI_MONTHS[parseInt(rm,10)-1]} ${parseInt(ry,10)+543}` : r.period;
                return (
                  <div key={r.id} className="rounded-xl border border-ink-100 p-4">
                    <div className="flex items-center justify-between mb-3">
                      <div className="flex items-center gap-2">
                        <Icon name="calendar" className="w-4 h-4 text-ink-400" />
                        <span className="font-medium text-ink-900">{periodLabel}</span>
                        {r.evaluator && <span className="text-xs text-ink-400">· ผู้วัดผล: {r.evaluator}</span>}
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="font-display font-bold text-lg" style={{ color: g.color }}>{pct}%</span>
                        <span className="w-7 h-7 rounded-lg flex items-center justify-center font-display font-bold text-white text-sm" style={{ background: g.color }}>{g.grade}</span>
                      </div>
                    </div>
                    {/* รายละเอียดตัวชี้วัด */}
                    <div className="space-y-1.5">
                      {(items || []).map(it => {
                        const sc = Number(r.scores?.[it.id]) || 0;
                        return (
                          <div key={it.id} className="flex items-center gap-2 text-sm">
                            <span className="text-ink-600 flex-1 truncate">{it.indicator} <span className="text-ink-400 text-xs">({it.weight}%{it.targetType ? ` · เป้า ${fmtKpiTarget(it)}` : ''})</span></span>
                            <div className="w-24 h-1.5 bg-ink-100 rounded-full overflow-hidden">
                              <div className="h-full rounded-full" style={{ width: `${sc}%`, background: g.color }} />
                            </div>
                            <span className="font-medium text-ink-700 w-8 text-right">{sc}</span>
                          </div>
                        );
                      })}
                    </div>
                    {r.note && <div className="text-sm text-ink-700 bg-ink-50 rounded-lg p-2.5 mt-3"><span className="text-xs text-ink-400">ข้อเสนอแนะ: </span>{r.note}</div>}
                  </div>
                );
              });
            })()}
          </div>
        )}
      </div>
    </Modal>

    <ExportWorkModal
      open={showExport}
      onClose={() => setShowExport(false)}
      employee={emp}
      attendance={stats.myAtt}
      leaves={stats.myLeaves}
      leaveTypes={leaveTypes}
      branches={branches}
    />
    </>
  );
};

/* =============================================================
   EXPORT WORK MODAL — Export การทำงานรายบุคคล (เลือกช่วงวันที่)
   ============================================================= */
const ExportWorkModal = ({ open, onClose, employee, attendance, leaves, leaveTypes, branches }) => {
  const today = new Date().toISOString().split('T')[0];
  const firstOfMonth = today.slice(0, 8) + '01';
  const [from, setFrom] = useState(firstOfMonth);
  const [to, setTo] = useState(today);
  const [exporting, setExporting] = useState(false);

  if (!open || !employee) return null;

  const doExport = async () => {
    setExporting(true);
    try {
      // กรองข้อมูลตามช่วงวันที่
      const attInRange = (attendance || []).filter(a => {
        const d = toYMD(a.date);
        return d >= from && d <= to;
      }).sort((a, b) => toYMD(a.date).localeCompare(toYMD(b.date)));

      const leavesInRange = (leaves || []).filter(l => {
        const s = toYMD(l.startDate);
        return s >= from && s <= to;
      }).sort((a, b) => toYMD(a.startDate).localeCompare(toYMD(b.startDate)));

      const branch = branches.find(b => b.id === employee.branchId);
      const XLSXlib = window.XLSX;
      const wb = XLSXlib.utils.book_new();

      // Sheet 1: ข้อมูลพนักงาน + สรุป
      const workDays = attInRange.filter(a => ['ontime', 'late', 'wfh', 'partial', 'nocheckout'].includes(a.status));
      const summary = [
        ['รายงานการทำงานรายบุคคล'],
        [],
        ['ชื่อ-นามสกุล', `${employee.firstName} ${employee.lastName}`],
        ['รหัสพนักงาน', employee.id],
        ['สาขา', branch?.name || '-'],
        ['แผนก', employee.department || '-'],
        ['ตำแหน่ง', employee.position || '-'],
        ['ช่วงวันที่', `${from} ถึง ${to}`],
        [],
        ['สรุป'],
        ['มาทำงาน (วัน)', workDays.length],
        ['ตรงเวลา (วัน)', attInRange.filter(a => a.status === 'ontime').length],
        ['มาสาย (ครั้ง)', attInRange.filter(a => a.status === 'late').length],
        ['WFH/นอกสถานที่ (วัน)', attInRange.filter(a => a.status === 'wfh').length],
        ['ขาดงาน (วัน)', attInRange.filter(a => a.status === 'absent').length],
        ['ลางาน (ครั้ง)', leavesInRange.length],
      ];
      const ws1 = XLSXlib.utils.aoa_to_sheet(summary);
      ws1['!cols'] = [{ wch: 22 }, { wch: 30 }];
      XLSXlib.utils.book_append_sheet(wb, ws1, 'สรุป');

      // Sheet 2: ประวัติการเข้างาน
      const attHeader = ['วันที่', 'เข้างาน', 'ออกงาน', 'สถานะ', 'หมายเหตุ'];
      const attRows = attInRange.map(a => {
        const info = attStatusInfo(a.status, a.leaveType, leaveTypes, { leavePeriod: a.leavePeriod, leaveHours: a.leaveHours });
        return [toYMD(a.date), a.checkIn || '-', a.checkOut || '-', info.label, a.leaveType ? (leaveTypes.find(t => t.id === a.leaveType)?.label || '') : ''];
      });
      const ws2 = XLSXlib.utils.aoa_to_sheet([attHeader, ...attRows]);
      ws2['!cols'] = [{ wch: 14 }, { wch: 10 }, { wch: 10 }, { wch: 14 }, { wch: 20 }];
      XLSXlib.utils.book_append_sheet(wb, ws2, 'การเข้างาน');

      // Sheet 3: ประวัติการลา
      const lvHeader = ['ประเภท', 'วันเริ่ม', 'วันสิ้นสุด', 'จำนวนวัน', 'สถานะ', 'เหตุผล'];
      const lvRows = leavesInRange.map(l => {
        const t = leaveTypes.find(x => x.id === l.type);
        const st = l.status === 'approved' ? 'อนุมัติ' : l.status === 'rejected' ? 'ปฏิเสธ' : 'รออนุมัติ';
        return [t?.label || l.type, toYMD(l.startDate), toYMD(l.endDate), l.days, st, l.reason || ''];
      });
      const ws3 = XLSXlib.utils.aoa_to_sheet([lvHeader, ...lvRows]);
      ws3['!cols'] = [{ wch: 16 }, { wch: 12 }, { wch: 12 }, { wch: 10 }, { wch: 12 }, { wch: 30 }];
      XLSXlib.utils.book_append_sheet(wb, ws3, 'การลา');

      const fname = `รายงาน_${employee.firstName}_${employee.id}_${from}_${to}.xlsx`;
      XLSXlib.writeFile(wb, fname);
    } catch (err) {
      alert('Export ไม่สำเร็จ: ' + err.message);
    } finally {
      setExporting(false);
    }
  };

  // นับ preview
  const attCount = (attendance || []).filter(a => { const d = toYMD(a.date); return d >= from && d <= to; }).length;
  const lvCount = (leaves || []).filter(l => { const s = toYMD(l.startDate); return s >= from && s <= to; }).length;

  // quick presets
  const setPreset = (preset) => {
    const now = new Date();
    if (preset === 'thisMonth') {
      setFrom(now.toISOString().slice(0, 8) + '01');
      setTo(today);
    } else if (preset === 'lastMonth') {
      const lm = new Date(now.getFullYear(), now.getMonth() - 1, 1);
      const lmEnd = new Date(now.getFullYear(), now.getMonth(), 0);
      setFrom(lm.toISOString().split('T')[0]);
      setTo(lmEnd.toISOString().split('T')[0]);
    } else if (preset === 'thisYear') {
      setFrom(now.getFullYear() + '-01-01');
      setTo(today);
    } else if (preset === 'last30') {
      const d = new Date(); d.setDate(d.getDate() - 30);
      setFrom(d.toISOString().split('T')[0]);
      setTo(today);
    }
  };

  return (
    <Modal open={open} onClose={onClose} title="Export รายงานการทำงาน" size="md">
      <div className="space-y-4">
        <div className="bg-flow-50 border border-flow-100 rounded-xl p-3 flex items-center gap-3">
          <Avatar name={`${employee.firstName} ${employee.lastName}`} photo={employee.photo} size="sm" />
          <div>
            <div className="font-medium text-ink-900 text-sm">{employee.firstName} {employee.lastName}</div>
            <div className="text-xs text-ink-500">{employee.id}</div>
          </div>
        </div>

        {/* Quick presets */}
        <div>
          <label className="block text-sm font-medium text-ink-700 mb-2">ช่วงเวลาด่วน</label>
          <div className="grid grid-cols-4 gap-2">
            {[
              { id: 'thisMonth', label: 'เดือนนี้' },
              { id: 'lastMonth', label: 'เดือนก่อน' },
              { id: 'last30',    label: '30 วัน' },
              { id: 'thisYear',  label: 'ปีนี้' },
            ].map(p => (
              <button key={p.id} type="button" onClick={() => setPreset(p.id)}
                className="px-2 py-1.5 rounded-lg border border-ink-200 text-xs hover:border-flow-400 hover:bg-flow-50 transition-colors">
                {p.label}
              </button>
            ))}
          </div>
        </div>

        {/* Date range */}
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">ตั้งแต่วันที่</label>
            <Input type="date" value={from} onChange={(e) => setFrom(e.target.value)} max={to} />
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">ถึงวันที่</label>
            <Input type="date" value={to} onChange={(e) => setTo(e.target.value)} min={from} max={today} />
          </div>
        </div>

        {/* Preview count */}
        <div className="grid grid-cols-2 gap-3">
          <div className="bg-ink-50 rounded-xl p-3 text-center">
            <div className="font-display text-2xl font-bold text-flow-700">{attCount}</div>
            <div className="text-xs text-ink-500">บันทึกการเข้างาน</div>
          </div>
          <div className="bg-ink-50 rounded-xl p-3 text-center">
            <div className="font-display text-2xl font-bold text-gold-600">{lvCount}</div>
            <div className="text-xs text-ink-500">รายการลา</div>
          </div>
        </div>

        <div className="bg-flow-50 border border-flow-100 rounded-xl p-3 text-xs text-ink-700">
          <Icon name="info" className="w-4 h-4 text-flow-700 inline mr-1" />
          ไฟล์ Excel จะมี 3 ชีต: สรุป · การเข้างาน · การลา
        </div>

        <div className="flex justify-end gap-2 pt-4 border-t border-ink-100">
          <Button variant="secondary" onClick={onClose}>ยกเลิก</Button>
          <Button icon="download" onClick={doExport} disabled={exporting || from > to}>
            {exporting ? 'กำลัง Export...' : 'ดาวน์โหลด Excel'}
          </Button>
        </div>
      </div>
    </Modal>
  );
};

  });

  useEffect(() => {

      setForm({ leaveQuotaOverride: {}, photo: '', ...editing });
      setShowQuota(editing.leaveQuotaOverride && Object.keys(editing.leaveQuotaOverride).length > 0);
    } else {
      // generate next id
      const maxId = existingIds.reduce((max, id) => {
        const n = parseInt(id.replace('EMP', ''), 10);
        return isNaN(n) ? max : Math.max(max, n);
      }, 1000);
      setForm(f => ({ ...f, id: `EMP${maxId + 1}`, firstName: '', lastName: '', email: '', phone: '', leaveQuotaOverride: {}, photo: '' }));
      setShowQuota(false);
    }
  }, [editing, open]);

  if (!open) return null;

  const handlePhotoChange = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      addToast?.('error', 'กรุณาเลือกไฟล์รูปภาพเท่านั้น');
      return;
    }
    if (file.size > 5 * 1024 * 1024) {
      addToast?.('error', 'ขนาดไฟล์ต้องไม่เกิน 5 MB');
      return;
    }
    // อ่านรูป → resize เป็น 256x256 → แปลงเป็น base64
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const size = 256;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        // Center-crop ให้เป็น square
        const minDim = Math.min(img.width, img.height);
        const sx = (img.width  - minDim) / 2;
        const sy = (img.height - minDim) / 2;
        ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, size, size);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        setForm(f => ({ ...f, photo: dataUrl }));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  const removePhoto = () => {
    setForm(f => ({ ...f, photo: '' }));
    if (photoInputRef.current) photoInputRef.current.value = '';
  };

  const submit = (e) => {

    // ลบ field ที่ว่างออกจาก override

        cleanOverride[k] = Number(v);
      }
    });
    onSave({ ...form, leaveQuotaOverride: cleanOverride });
  };

  };

      <form onSubmit={submit} className="space-y-5">

                src={form.photo}
                alt={form.firstName}
                className="w-24 h-24 rounded-2xl object-cover border-2 border-ink-100 shadow-soft"
              />
            ) : (
              <div className="w-24 h-24 rounded-2xl bg-gradient-to-br from-brand-100 to-brand-200 flex items-center justify-center border-2 border-ink-100">
                <Icon name="user" className="w-10 h-10 text-brand-400" />
              </div>
            )}
            {form.photo && (
              <button
                type="button"
                onClick={removePhoto}

              >
                <Icon name="x" className="w-3.5 h-3.5" />
              </button>

                      </div>
                      <div className="flex items-center gap-2">
                        <Input
                          type="number"
                          min={0}
                          max={365}
                          placeholder={`เริ่มต้น ${t.max} วัน`}
                          value={overrideVal ?? ''}
                          onChange={(e) => updateQuota(t.id, e.target.value)}
                          className="flex-1"
                        />
                        {hasOverride && (
                          <button
                            type="button"
                            onClick={() => updateQuota(t.id, '')}
                            className="px-2 py-2 text-xs text-ink-500 hover:text-red-600"
                            title="คืนค่าเริ่มต้น"
                          >
                            <Icon name="x" className="w-4 h-4" />
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
        <div className="flex justify-end gap-2 pt-4 border-t border-ink-100">
          <Button type="button" variant="secondary" onClick={onClose}>ยกเลิก</Button>
          <Button type="submit" icon={editing ? 'check' : 'plus'}>{editing ? 'บันทึกการแก้ไข' : 'เพิ่มพนักงาน'}</Button>
        </div>
      </form>
    </Modal>
  );
};

const AttendancePage = () => {

  const myEmp = employees.find(e => e.id === user.empId);
  const myScope = myEmp?.approvalScope || (myEmp?.canApprove ? 'manager' : 'none');
  const isRegional = myScope === 'regional';
  const lockedBranch = (user.role === 'manager' || isRegional) ? (user.branchId || myEmp?.branchId) : null;

  useEffect(() => {
    if (lockedBranch) setFilterBranch(lockedBranch);
  }, [lockedBranch]);

      if (lockedBranch && emp.branchId !== lockedBranch) return false;
      if (filterBranch !== 'all' && emp.branchId !== filterBranch) return false;
