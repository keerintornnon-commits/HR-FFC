<style>
  html, body { font-family: 'Sarabun', system-ui, sans-serif; }
  h1, h2, h3, h4, .font-display { font-family: 'Prompt', system-ui, sans-serif; }

  /* contentEditable placeholder */
  [contentEditable][data-placeholder]:empty:before {
    content: attr(data-placeholder);
    color: #94A3B8;
    pointer-events: none;
  }
  /* ประกาศข่าวสาร — รองรับ rich text */
  .announcement-body ul { list-style: disc; padding-left: 1.5rem; margin: 0.25rem 0; }
  .announcement-body ol { list-style: decimal; padding-left: 1.5rem; margin: 0.25rem 0; }
  .announcement-body b, .announcement-body strong { font-weight: 700; }
  .announcement-body a { color: #2563EB; text-decoration: underline; }
  .announcement-body font[size="1"] { font-size: 0.75rem; }
  .announcement-body font[size="2"] { font-size: 0.875rem; }
  .announcement-body font[size="3"] { font-size: 1rem; }
  .announcement-body font[size="5"] { font-size: 1.25rem; }
  .announcement-body font[size="6"] { font-size: 1.5rem; }
  .announcement-body font[size="7"] { font-size: 2rem; }

  /* Smooth scroll */
  html { scroll-behavior: smooth; }

  /* Custom scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #F6F7FB; }
  ::-webkit-scrollbar-thumb { background: #AFB6C9; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #7E8AA5; }

  /* Login background pattern */
  .login-bg {
    background:
      radial-gradient(at 15% 10%, rgba(99, 102, 241, 0.35) 0px, transparent 50%),
      radial-gradient(at 85% 90%, rgba(6, 182, 212, 0.20) 0px, transparent 50%),
      radial-gradient(at 50% 50%, rgba(30, 27, 75, 0.15) 0px, transparent 50%),
      linear-gradient(135deg, #15103A 0%, #1E1B4B 35%, #3730A3 70%, #1E40AF 100%);
  }

  /* Animated gradient glow for login */
  .login-glow::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 24px;
    background: linear-gradient(135deg, #6366F1, #06B6D4, #F59E0B, #6366F1);
    background-size: 300% 300%;
    animation: gradientMove 8s ease infinite;
    z-index: -1;
    opacity: 0.6;
    filter: blur(8px);
  }
  @keyframes gradientMove {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  /* Eagle floating animation */
  .eagle-float {
    animation: eagleFloat 6s ease-in-out infinite;
  }
  @keyframes eagleFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-8px) rotate(-1deg); }
  }

  .grid-pattern {
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* Glass card */
  .glass {
    background: rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.12);
  }

  /* Number input cleanup */
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  /* Subtle hover lift */
  .lift { transition: transform 0.2s ease, box-shadow 0.2s ease; }
  .lift:hover { transform: translateY(-2px); box-shadow: 0 12px 36px -12px rgba(14, 19, 36, 0.24); }

  /* Status dot pulse */
  .dot-live::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 9999px;
    background: currentColor;
    opacity: 0.35;
    animation: pulseRing 1.6s ease-out infinite;
  }
  @keyframes pulseRing {
    0% { transform: scale(0.8); opacity: 0.6; }
    100% { transform: scale(1.8); opacity: 0; }
  }

  /* Sidebar active indicator */
  .nav-active {
    background: linear-gradient(90deg, rgba(6, 182, 212, 0.12), rgba(6, 182, 212, 0));
    color: #0E7490;
    border-left: 3px solid #06B6D4;
  }
  .nav-link {
    border-left: 3px solid transparent;
  }

  /* Print mode for reports */
  @media print {
    .no-print { display: none !important; }
  }

  /* Loading skeleton shimmer */
  .skeleton {
    background: linear-gradient(90deg, #ECEEF5 0%, #F6F7FB 50%, #ECEEF5 100%);
    background-size: 200% 100%;
    animation: shimmer 1.4s ease-in-out infinite;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ===== HI-TECH DASHBOARD STYLES ===== */

  /* Animated grid background for hero */
  .tech-grid {
    background-image:
      linear-gradient(rgba(99,102,241,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99,102,241,0.07) 1px, transparent 1px);
    background-size: 32px 32px;
    animation: gridFloat 20s linear infinite;
  }
  @keyframes gridFloat {
    0% { background-position: 0 0; }
    100% { background-position: 32px 32px; }
  }

  /* Glowing orb */
  .orb {
    position: absolute;
    border-radius: 9999px;
    filter: blur(60px);
    animation: orbFloat 12s ease-in-out infinite;
  }
  @keyframes orbFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -20px) scale(1.1); }
    66% { transform: translate(-20px, 20px) scale(0.95); }
  }

  /* Animated counter underline sweep */
  .stat-glow { position: relative; overflow: hidden; }
  .stat-glow::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(99,102,241,0.08), transparent);
    transition: left 0.6s ease;
  }
  .stat-glow:hover::before { left: 100%; }

  /* Gradient border card */
  .gradient-border {
    position: relative;
    background: #fff;
    border-radius: 1.5rem;
  }
  .gradient-border::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.5px;
    background: linear-gradient(135deg, rgba(99,102,241,0.5), rgba(6,182,212,0.3), transparent 60%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  /* Number ticker */
  @keyframes countUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .count-up { animation: countUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }

  /* Live pulse dot */
  .live-dot {
    position: relative;
    display: inline-flex;
    width: 8px; height: 8px;
    border-radius: 9999px;
    background: #10B981;
  }
  .live-dot::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: #10B981;
    animation: livePulse 1.8s ease-out infinite;
  }
  @keyframes livePulse {
    0% { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(3); opacity: 0; }
  }

  /* Shimmer sweep on hero number */
  .hero-num {
    background: linear-gradient(120deg, #fff 30%, #BAE6FD 50%, #fff 70%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: heroShine 4s linear infinite;
  }
  @keyframes heroShine {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* Icon container glow on hover */
  .icon-glow { transition: all 0.3s ease; }
  .lift:hover .icon-glow {
    transform: scale(1.1) rotate(-3deg);
    box-shadow: 0 8px 24px -8px currentColor;
  }

  /* Ring progress */
  .ring-progress { transform: rotate(-90deg); transition: stroke-dashoffset 1s cubic-bezier(0.16,1,0.3,1); }
</style>
</head>

// ช่องที่ต้องเป็นตัวเลข (NUMERIC) — ค่าว่าง/ตัวอักษรปน → ดึงเฉพาะเลข หรือ null
const NUMERIC_COLS = new Set([
  'base_salary', 'special_allowance', 'purchase_price', 'useful_life', 'current_value',
  'days', 'hours', 'leave_hours', 'max', 'overtime', 'transport', 'bonus',
  'other_earn', 'sso', 'tax', 'absence_deduct', 'gyos', 'other_deduct',
  'lat', 'lng', 'radius',
]);
// ช่องที่ต้องเป็นวันที่ (DATE) — รูปแบบไม่ถูก → null
const DATE_COLS = new Set([
  'start_date', 'end_date', 'date', 'purchase_date', 'last_check',
  'period_from', 'period_to', 'pay_date', 'eval_date',
]);

const cleanNum = (v) => {
  if (v === '' || v == null) return null;
  if (typeof v === 'number') return v;
  const m = String(v).replace(/,/g, '').match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
};
const cleanDateVal = (v) => {
  if (v === '' || v == null) return null;
  const s = String(v).slice(0, 10);
  return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : null;
};

// แปลง object: camelCase → snake_case (สำหรับเขียนลง DB)
const toDb = (table, obj) => {
  const map = FIELD_MAP[table] || {};
  const out = {};
  Object.entries(obj || {}).forEach(([k, v]) => {
    const col = map[k] || k;
    if (NUMERIC_COLS.has(col))      out[col] = cleanNum(v);
    else if (DATE_COLS.has(col))    out[col] = cleanDateVal(v);
    else                            out[col] = (v === '') ? null : v;
  });
  return out;
};
// แปลง object: snake_case → camelCase (สำหรับอ่านจาก DB)
const fromDb = (table, row) => {
  const map = FIELD_MAP[table] || {};
  const rev = Object.fromEntries(Object.entries(map).map(([c, s]) => [s, c]));
  const out = {};
  Object.entries(row || {}).forEach(([k, v]) => {
    if (k === 'created_at' || k === 'updated_at') return;  // ข้าม timestamp ภายใน
    // normalize วันที่ → YYYY-MM-DD เสมอ (กัน DB คืน format มีเวลา/timezone/ไม่ zero-pad)
    if (DATE_COLS.has(k) && v != null && v !== '') {
      out[rev[k] || k] = toYMD(v);
    } else {
      out[rev[k] || k] = v;
    }
  });
  return out;
};

/* ── 3. Supabase REST helper (ผ่าน PostgREST — ไม่ต้องโหลด SDK) ── */
const sb = {
  async request(method, path, body, extraHeaders = {}) {
    const c = getSupabaseConfig();
    const res = await fetch(`${c.url}/rest/v1/${path}`, {
      method,
      headers: {
        'apikey': c.anonKey,
        'Authorization': `Bearer ${c.anonKey}`,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=representation',
        ...extraHeaders,
      },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) {
      const txt = await res.text();
      throw new Error(`Supabase ${res.status}: ${txt.slice(0, 200)}`);
    }
    const txt = await res.text();
    return txt ? JSON.parse(txt) : null;
  },
  // ดึงครบทุกแถว — แก้ปัญหา PostgREST limit 1000 แถว (วนขอทีละ 1000 จนหมด)
  async select(table, query = '') {
    const c = getSupabaseConfig();
    const PAGE = 1000;
    let from = 0;
    let all = [];
    while (true) {
      const to = from + PAGE - 1;
      const res = await fetch(`${c.url}/rest/v1/${table}?select=*${query}`, {
        headers: {
          'apikey': c.anonKey,
          'Authorization': `Bearer ${c.anonKey}`,
          'Range-Unit': 'items',
          'Range': `${from}-${to}`,
        },
      });
      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`Supabase ${res.status}: ${txt.slice(0, 200)}`);
      }
      const txt = await res.text();
      const chunk = txt ? JSON.parse(txt) : [];
      all = all.concat(chunk);
      // ถ้าได้น้อยกว่า 1 หน้า = หมดแล้ว
      if (chunk.length < PAGE) break;
      from += PAGE;
      // กันลูปไม่รู้จบ (สูงสุด 50,000 แถว)
      if (from > 50000) break;
    }
    return all;
  },
  upsert: (table, rows) => sb.request('POST', table, rows),
  remove: (table, col, val) => sb.request('DELETE', `${table}?${col}=eq.${encodeURIComponent(val)}`),
};

/* ── Storage helper — อัปโหลดไฟล์ไป Supabase Storage แทนเก็บ base64 ── */
const STORAGE_BUCKET = 'ffc-files';
const sbStorage = {
  // อัปโหลด File/Blob → คืน public URL
  async upload(folder, file) {
    const c = getSupabaseConfig();
    const ext = (file.name && file.name.includes('.')) ? file.name.split('.').pop() : 'bin';
    const safe = `${folder}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const res = await fetch(`${c.url}/storage/v1/object/${STORAGE_BUCKET}/${safe}`, {
      method: 'POST',
      headers: {
        'apikey': c.anonKey,
        'Authorization': `Bearer ${c.anonKey}`,
        'Content-Type': file.type || 'application/octet-stream',
        'x-upsert': 'true',
      },
      body: file,
    });
    if (!res.ok) {
      const txt = await res.text();
      throw new Error(`Storage ${res.status}: ${txt.slice(0, 200)}`);
    }
    // public URL (bucket ต้องตั้งเป็น public)
    return `${c.url}/storage/v1/object/public/${STORAGE_BUCKET}/${safe}`;
  },
  // ลบไฟล์จาก URL (ถ้าเป็นไฟล์ใน Storage ของเรา)
  async removeByUrl(url) {
    try {
      const c = getSupabaseConfig();
      const marker = `/object/public/${STORAGE_BUCKET}/`;
      const idx = url.indexOf(marker);
      if (idx === -1) return; // ไม่ใช่ไฟล์ใน Storage เรา (อาจเป็น base64 เก่า)
      const path = url.slice(idx + marker.length);
      await fetch(`${c.url}/storage/v1/object/${STORAGE_BUCKET}/${path}`, {
        method: 'DELETE',
        headers: { 'apikey': c.anonKey, 'Authorization': `Bearer ${c.anonKey}` },
      });
    } catch (e) { /* เงียบ — ลบไม่ได้ไม่เป็นไร */ }
  },
  // helper: ถ้าค่าเป็น base64 → อัปโหลดเป็นไฟล์, ถ้าเป็น URL อยู่แล้ว → คืนเดิม
  isDataUrl: (v) => typeof v === 'string' && v.startsWith('data:'),
};

// แปลง dataURL (base64) → Blob เพื่ออัปโหลด
const dataUrlToBlob = (dataUrl) => {
  const [head, b64] = dataUrl.split(',');
  const mime = (head.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream';
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const blob = new Blob([arr], { type: mime });
  blob.name = `file.${(mime.split('/')[1] || 'bin').split('+')[0]}`;
  return blob;
};

/* ── 4. api object — interface เดิม (get/post/enabled) ── */
const api = {
  enabled: () => !!CONFIG.apiUrl,

  async get(action, params = {}) {
    if (!api.enabled()) throw new Error('Supabase ยังไม่ได้ตั้งค่า');

    if (action === 'getAll') {
      // ── ปรับ performance: ดึงข้อมูลที่โตเร็ว (attendance/leaves/payroll) เฉพาะช่วงล่าสุด ──
      // ข้อมูลเก่ากว่านี้โหลดเพิ่มได้ผ่าน action 'getRange' เมื่อต้องใช้ (export/รายงานย้อนหลัง)
      const monthsBack = (n) => {
        const d = new Date();
        d.setMonth(d.getMonth() - n);
        return d.toISOString().slice(0, 10);   // YYYY-MM-DD
      };
      const attFrom = params.attFrom || monthsBack(3);    // attendance 3 เดือนล่าสุด
      const leaveFrom = params.leaveFrom || monthsBack(13); // leaves ~1 ปีกว่า (ครอบคลุมโควต้าปีนี้)
      const payFrom = params.payFrom || monthsBack(6);     // payroll 6 เดือนล่าสุด

      // ดึงทุกตารางขนาน → map กลับเป็น camelCase
      const [employees, attendance, leaves, leaveTypes, branches, departments,
             assets, payroll, kpiCriteria, kpiRecords, settingsRows] = await Promise.all([
        sb.select('employees'),
        sb.select('attendance', `&date=gte.${attFrom}`),     // filter ตามวันที่
        sb.select('leaves', `&or=(start_date.gte.${leaveFrom},start_date.is.null)`),
        sb.select('leave_types'), sb.select('branches'), sb.select('departments'),
        sb.select('assets'),
        sb.select('payroll', `&or=(period_from.gte.${payFrom},period_from.is.null)`),
        sb.select('kpi_criteria'),
        sb.select('kpi_records'), sb.select('settings'),
      ]);
      // settings: key-value → object
      const settings = {};
      (settingsRows || []).forEach(r => { settings[r.key] = r.value; });
      const company = settings.company || {};
      // รวม key แยก (เก็บแยกเพื่อเลี่ยง row ใหญ่) กลับเข้า settings object
      const mergedSettings = {
        ...company,
        expenses:      settings.expenses || company.expenses || [],
        policies:      settings.policies || company.policies || [],
        announcements: settings.announcements || company.announcements || [],
        certRequests:  settings.certRequests || company.certRequests || [],
        otRequests:    settings.otRequests || company.otRequests || [],
        warnings:      settings.warnings || company.warnings || [],
        warningConfig: settings.warningConfig || company.warningConfig || { lateThreshold: 6 },
      };
      return {
        employees:   (employees || []).map(r => fromDb('employees', r)),
        attendance:  (attendance || []).map(r => fromDb('attendance', r)),
        leaves:      (leaves || []).map(r => fromDb('leaves', r)),
        leaveTypes:  leaveTypes || [],
        branches:    branches || [],
        departments: (departments || []).map(r => r.name),
        assets:      (assets || []).map(r => fromDb('assets', r)),
        payroll:     (payroll || []).map(r => fromDb('payroll', r)),
        kpiCriteria: (kpiCriteria || []).map(r => fromDb('kpi_criteria', r)),
        kpiRecords:  (kpiRecords || []).map(r => fromDb('kpi_records', r)),
        settings:    mergedSettings,
        _partial:    { attFrom, leaveFrom, payFrom },   // บอก client ว่าข้อมูลถูก filter ช่วงไหน
      };
    }

    // ── โหลดข้อมูลย้อนหลังเพิ่มเฉพาะกิจ (สำหรับ export/รายงานเก่า) ──
    if (action === 'getRange') {
      const { table, from, to } = params;   // table: attendance | leaves | payroll
      const dateCol = { attendance: 'date', leaves: 'start_date', payroll: 'period_from' }[table] || 'date';
      let q = `&${dateCol}=gte.${from}`;
      if (to) q += `&${dateCol}=lte.${to}`;
      const rows = await sb.select(table, q);
      return (rows || []).map(r => fromDb(table, r));
    }

    if (action === 'login') {
      // ── ลองใช้ RPC function (เช็ค password hash ฝั่ง server) ก่อน ──
      const c = getSupabaseConfig();
      try {
        const res = await fetch(`${c.url}/rest/v1/rpc/verify_login`, {
          method: 'POST',
          headers: {
            'apikey': c.anonKey, 'Authorization': `Bearer ${c.anonKey}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ p_username: params.username, p_password: params.password }),
        });
        if (res.ok) {
          const out = await res.text();
          const arr = out ? JSON.parse(out) : null;
          const u = Array.isArray(arr) ? arr[0] : arr;
          if (u && u.username) {
            return { username: u.username, role: u.role, name: u.name, branchId: u.branch_id, empId: u.emp_id };
          }
          throw new Error('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
        }
        // ถ้า RPC ยังไม่ได้ติดตั้ง (404) → fallback แบบเก่า
      } catch (e) {
        if (e.message && e.message.includes('ไม่ถูกต้อง')) throw e;
        // อื่นๆ → fallback
      }
      // ── Fallback: วิธีเดิม (plaintext) สำหรับระบบที่ยังไม่ได้ติดตั้ง RPC ──
      const rows = await sb.select('app_users', `&username=eq.${encodeURIComponent(params.username)}`);
      const u = (rows || [])[0];
      if (!u) throw new Error('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
      // รองรับทั้ง password เก่า (plaintext) — ถ้าตรงก็ผ่าน
      if (u.password !== params.password) throw new Error('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
      return { username: u.username, role: u.role, name: u.name, branchId: u.branch_id, empId: u.emp_id };
    }

    if (action === 'changePassword') {
      // เปลี่ยนรหัสผ่านผ่าน RPC (hash ฝั่ง server)
      const c = getSupabaseConfig();
      const res = await fetch(`${c.url}/rest/v1/rpc/change_password`, {
        method: 'POST',
        headers: {
          'apikey': c.anonKey, 'Authorization': `Bearer ${c.anonKey}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ p_username: params.username, p_old: params.oldPassword, p_new: params.newPassword }),
      });
      if (!res.ok) { const t = await res.text(); throw new Error('เปลี่ยนรหัสไม่สำเร็จ: ' + t.slice(0, 120)); }
      const out = await res.text();
      const ok = out ? JSON.parse(out) : false;
      if (!ok) throw new Error('รหัสผ่านเดิมไม่ถูกต้อง');
      return true;
    }

    if (action === 'getUsers') {
      // อ่านรายชื่อ user (ไม่ดึง password/password_hash)
      const rows = await sb.request('GET', 'app_users?select=username,role,name,branch_id,emp_id,created_at');
      return (rows || []).map(r => ({
        username: r.username, role: r.role, name: r.name,
        branchId: r.branch_id, empId: r.emp_id, createdAt: r.created_at,
      }));
    }

    throw new Error('Unknown GET action: ' + action);
  },

  async post(action, payload = {}) {
    if (!api.enabled()) throw new Error('Supabase ยังไม่ได้ตั้งค่า');
    const d = payload.data;

    switch (action) {
      // ── บันทึกเดี่ยว (upsert) ──
      case 'saveEmployee':  return sb.upsert('employees',  toDb('employees', d));
      case 'saveLeave':     return sb.upsert('leaves',     toDb('leaves', d));
      case 'saveAsset':     return sb.upsert('assets',     toDb('assets', d));
      case 'savePayroll':   return sb.upsert('payroll',    toDb('payroll', d));
      case 'savePayrollBatch':
        return sb.upsert('payroll', (d || []).map(r => toDb('payroll', r)));
      case 'saveKpiRecord': return sb.upsert('kpi_records', toDb('kpi_records', d));
      case 'saveAttendance': return sb.upsert('attendance', toDb('attendance', d));

      // ── บันทึกเป็นชุด ──
      case 'saveAttendanceBatch': {
        const all = (d || []).map(r => toDb('attendance', r));
        // แบ่งส่งทีละ 500 แถว กัน payload ใหญ่เกิน / timeout
        const CHUNK = 500;
        let last = null;
        for (let i = 0; i < all.length; i += CHUNK) {
          last = await sb.upsert('attendance', all.slice(i, i + CHUNK));
        }
        return last;
      }
      case 'saveKpiCriteria':
        // แทนที่ทั้งตาราง: ลบเก่า + ใส่ใหม่
        await sb.request('DELETE', 'kpi_criteria?id=neq.__none__');
        return (d && d.length) ? sb.upsert('kpi_criteria', d.map(r => toDb('kpi_criteria', r))) : null;
      case 'saveLeaveTypes':
        await sb.request('DELETE', 'leave_types?id=neq.__none__');
        return (d && d.length) ? sb.upsert('leave_types', d) : null;
      case 'saveBranches':
        await sb.request('DELETE', 'branches?id=neq.__none__');
        return (d && d.length) ? sb.upsert('branches', d) : null;
      case 'saveDepartments':
        await sb.request('DELETE', 'departments?name=neq.__none__');
        return (d && d.length) ? sb.upsert('departments', d.map(name => ({ name }))) : null;
      case 'saveSettings':
        // settings เป็น key-value: เก็บทั้งก้อนใน key 'company'
        return sb.upsert('settings', { key: 'company', value: d });

      case 'saveSettingsKey':
        // บันทึกเฉพาะ key เดียว (เช่น expenses, policies, announcements) — เลี่ยง row ใหญ่เกิน
        return sb.upsert('settings', { key: payload.key, value: d });

      // ── ลบ ──
      case 'deleteEmployee':  return sb.remove('employees',   'id', payload.id);
      case 'deleteAsset':     return sb.remove('assets',      'id', payload.id);
      case 'deletePayroll':   return sb.remove('payroll',     'id', payload.id);
      case 'deleteLeave':     return sb.remove('leaves',      'id', payload.id);
      case 'deleteKpiRecord': return sb.remove('kpi_records', 'id', payload.id);

      // ── จัดการผู้ใช้งาน (admin) ──
      case 'saveUser': {
        // สร้าง/แก้ user ผ่าน RPC (hash password ฝั่ง server)
        const c = getSupabaseConfig();
        const res = await fetch(`${c.url}/rest/v1/rpc/upsert_user`, {
          method: 'POST',
          headers: { 'apikey': c.anonKey, 'Authorization': `Bearer ${c.anonKey}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            p_username: d.username, p_password: d.password || null,
            p_role: d.role, p_name: d.name,
            p_branch_id: d.branchId || null, p_emp_id: d.empId || null,
          }),
        });
        if (!res.ok) { const t = await res.text(); throw new Error('บันทึกผู้ใช้ไม่สำเร็จ: ' + t.slice(0, 150)); }
        return true;
      }
      case 'resetPassword': {
        const c = getSupabaseConfig();
        const res = await fetch(`${c.url}/rest/v1/rpc/admin_reset_password`, {
          method: 'POST',
          headers: { 'apikey': c.anonKey, 'Authorization': `Bearer ${c.anonKey}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ p_username: payload.username, p_new: payload.newPassword }),
        });
        if (!res.ok) { const t = await res.text(); throw new Error('รีเซ็ตรหัสไม่สำเร็จ: ' + t.slice(0, 150)); }
        return true;
      }
      case 'deleteUser':
        return sb.remove('app_users', 'username', payload.username);

      default: throw new Error('Unknown POST action: ' + action);
    }
  },
};


// ค่าเริ่มต้นของสาขา — แก้ไขผ่านหน้า "ตั้งค่า → สาขา" ได้
// คำนวณระยะทางระหว่าง 2 พิกัด (เมตร) — Haversine formula
const distanceMeters = (lat1, lng1, lat2, lng2) => {
  const R = 6371000;  // รัศมีโลก (เมตร)
  const toRad = (d) => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2) ** 2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
};

// ฟังก์ชั่นคำนวณโควต้าที่ใช้ไปและคงเหลือของพนักงาน
// remaining ติดลบได้: ถ้าลาเกิน หรือ ไม่ได้กำหนดสิทธิ์ (max=0) แต่มีการลา
const calcQuota = (employee, leaveTypes, leaves, year) => {
  return leaveTypes.map(t => {
    const overrideRaw = employee?.leaveQuotaOverride?.[t.id];
    // ตรวจว่า override เป็น "-" หรือไม่ใช่ตัวเลข → ไม่กำหนดสิทธิ์ (max=0)
    const overrideStr = String(overrideRaw ?? '').trim();
    const isNoQuota = overrideStr === '-' || overrideStr === 'ไม่มี';
    let max;
    let customized = false;
    if (isNoQuota) {
      max = 0;
      customized = true;
    } else if (overrideRaw !== undefined && overrideRaw !== null && overrideStr !== '' && !isNaN(Number(overrideRaw))) {
      max = Number(overrideRaw);
      customized = true;
    } else {
      max = t.max;
    }
    const used = leaves
      .filter(l => {
        const sd = String(l.startDate || '');
        return l.employeeId === employee.id && l.type === t.id
          && l.status === 'approved' && sd.startsWith(year);
      })
      .reduce((sum, l) => sum + (Number(l.days) || 0), 0);
    return {
      ...t, max, used,
      remaining: max - used,  // ติดลบได้
      customized,
      noQuota: isNoQuota,
    };
  });
};

  const today = new Date().toISOString().split('T')[0];

    // 80% checked in today
    if (idx % 5 !== 0) {
      const hour = 7 + (idx % 3);
      const min  = (idx * 7) % 60;
      records.push({
        id: `ATT${Date.now()}-${idx}`,
        employeeId: emp.id,
        date: today,
        checkIn:  `${String(hour).padStart(2,'0')}:${String(min).padStart(2,'0')}`,
        checkOut: idx % 4 === 0 ? null : `${String(17 + (idx%2)).padStart(2,'0')}:${String((min+10)%60).padStart(2,'0')}`,
        source: 'fingerprint',
        status: hour > 8 ? 'late' : 'ontime',
      });
    }
  });
  return records;
};

const fmtDate = (d, opts = {}) => {
  if (!d) return '-';
  const date = typeof d === 'string' ? new Date(d) : d;
  return date.toLocaleDateString('th-TH', {
    year: 'numeric', month: 'short', day: 'numeric', ...opts,
  });
};
const fmtTime = (d) => {
  if (!d) return '-';
  const date = typeof d === 'string' ? new Date(d) : d;
  return date.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
};
const fmtThaiDate = (d) => {

  return date.toLocaleDateString('th-TH', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
  });
};
const cls = (...xs) => xs.filter(Boolean).join(' ');

// แปลงวันที่ทุกรูปแบบ (Date object, ISO string, "2026-01-15") เป็น 'YYYY-MM-DD'
// สำคัญมากเมื่อข้อมูลมาจาก Google Sheets ที่ส่ง Date object กลับมา
const toYMD = (v) => {
  if (v === null || v === undefined || v === '') return '';
  if (v instanceof Date && !isNaN(v)) {
    const y = v.getFullYear();
    const m = String(v.getMonth() + 1).padStart(2, '0');
    const d = String(v.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }
  const s = String(v).trim();
  // ISO หรือ YYYY-MM-DD อยู่แล้ว → เอา 10 ตัวแรก
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  // YYYY-M-D หรือ YYYY-MM-D (ไม่มี zero-pad) → เติม 0
  const ymd = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (ymd) return `${ymd[1]}-${ymd[2].padStart(2,'0')}-${ymd[3].padStart(2,'0')}`;
  // ตัวเลขล้วน (Excel serial) — ไม่ควร parse ด้วย new Date ที่นี่ คืนค่าเดิม
  if (/^\d+(\.\d+)?$/.test(s)) return s;
  // ลอง parse เป็น Date
  const d = new Date(s);
  if (!isNaN(d)) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${dd}`;
  }
  return s;
};

// แปลงสถานะการเข้างาน → label + สี Badge (รองรับ leave/absent ด้วย)
// leaveTypes ใช้หาชื่อประเภทการลา; opts = { leavePeriod, leaveHours } สำหรับลาบางส่วน
const attStatusInfo = (status, leaveType, leaveTypes, opts) => {
  const leaveLabel = () => ((leaveTypes || []).find(x => x.id === leaveType)?.label) || 'ลางาน';
  const periodText = () => {
    const p = opts?.leavePeriod;
    if (p === 'morning') return ' (ครึ่งเช้า)';
    if (p === 'afternoon') return ' (ครึ่งบ่าย)';
    if (p === 'hours') return opts?.leaveHours ? ` (${opts.leaveHours} ชม.)` : ' (รายชั่วโมง)';
    return '';
  };
  switch (status) {
    case 'ontime': return { label: 'ตรงเวลา', color: 'green' };
    case 'late':   return { label: 'มาสาย',   color: 'yellow' };
    case 'absent': return { label: 'ขาดงาน',  color: 'red' };
    case 'holiday': return { label: 'วันหยุด', color: 'gray' };
    case 'nocheckout': return { label: 'ไม่สแกนออก', color: 'orange' };
    case 'partial': return { label: `มาทำงาน + ${leaveLabel()}${periodText()}`, color: 'cyan' };
    case 'wfh': {
      const t = (leaveTypes || []).find(x => x.id === leaveType);
      return { label: t ? t.label : 'WFH', color: 'green' };
    }
    case 'leave': {
      const t = (leaveTypes || []).find(x => x.id === leaveType);
      return { label: (t ? t.label : 'ลางาน') + periodText(), color: 'blue' };
    }
    default: return { label: status || '-', color: 'gray' };
  }
};

// ===== เงินเดือน: helper ส่วนกลาง =====
const THAI_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const fmtMoney = (n) => Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

// คำนวณค่าปรับมาสายตามช่วงเวลาเข้างานจริง (ไม่บวกสะสม — แต่ละช่วงคิดเรทเดียว)
// 08:06-08:15 = 20 · 08:16-09:00 = 50 · 09:01-10:00 = 100 · 10:01-11:00 = 150 · หลัง 11:00 = 150 (เพดาน)
// รับค่าได้ทั้งเวลาเข้างาน (HH:MM) หรือ นาทีที่สายจาก 08:00 (ตัวเลข)
const calcLateFine = (input) => {
  // แปลง input → นาทีนับจาก 08:00
  let minFromStart;
  if (typeof input === 'number') {
    // เดิมส่งเป็น "นาทีสายจาก 08:05" → บวก 5 กลับเป็นนาทีจาก 08:00
    minFromStart = input > 0 ? input + 5 : 0;
  } else {
    const ci = normTime(input);
    if (!ci) return 0;
    const [h, m] = ci.split(':').map(Number);
    minFromStart = (h * 60 + m) - (8 * 60);   // นาทีหลัง 08:00
  }
  if (minFromStart <= 5) return 0;             // เข้าก่อน/ทัน 08:05 = ไม่สาย
  if (minFromStart <= 15) return 20;           // 08:06 - 08:15
  if (minFromStart <= 60) return 50;           // 08:16 - 09:00
  if (minFromStart <= 120) return 100;         // 09:01 - 10:00
  return 150;                                  // 10:01 เป็นต้นไป (เพดาน)
};

// คำนวณยอดหักของ attendance หนึ่งแถว (สาย/ลา/ขาด) เพื่อแสดงในตาราง + export
// emp = พนักงาน, a = attendance record, leaves = การลาทั้งหมด
// คืน { amount, label } — amount = ยอดหัก (บาท), label = ข้อความ เช่น "หัก 50฿" หรือ "-"
const recordDeduct = (emp, a, leaves, leaveTypes) => {
  if (!emp) return { amount: 0, label: '-' };
  const salaryType = emp.salaryType || 'monthly';
  const base = Number(emp.baseSalary) || 0;
  const perDay = salaryType === 'daily' ? base : salaryType === 'weekly' ? base / 6 : base / 30;
  const perHour = perDay / 8;
  const dYMD = toYMD(a.date);

  // 1) มาสาย → ค่าปรับตามช่วงนาที
  if (a.status === 'late' && a.checkIn) {
    const fine = calcLateFine(a.checkIn);
    return fine > 0 ? { amount: fine, label: `หัก ${fmtMoney(fine)}฿` } : { amount: 0, label: '-' };
  }

  // 2) ลา / ขาด → หาการลาที่ครอบวันนี้
  if (a.status === 'leave' || a.status === 'partial' || a.status === 'absent') {
    // ขาดงาน (ไม่มี leave record) → หักเต็มวัน
    if (a.status === 'absent') {
      const amt = Math.round(perDay * 100) / 100;
      return amt > 0 ? { amount: amt, label: `หัก ${fmtMoney(amt)}฿` } : { amount: 0, label: '-' };
    }
    // หา leave record ที่ครอบวันนี้
    const lv = (leaves || []).find(l => l.employeeId === emp.id && l.status === 'approved' &&
      toYMD(l.startDate) <= dYMD && dYMD <= toYMD(l.endDate));
    if (!lv) return { amount: 0, label: '-' };
    const type = lv.type;
    const isHalf = lv.period === 'morning' || lv.period === 'afternoon';
    const dayUnit = isHalf ? 0.5 : 1;

    // WFH/นอกสถานที่ = ไม่หัก
    if (type === 'wfh' || type === 'offsite') return { amount: 0, label: '-' };

    if (salaryType === 'daily' || salaryType === 'weekly') {
      // รายวัน/รายสัปดาห์: ลาทุกประเภท = หักตามวัน/ชั่วโมง
      let amt = (lv.period === 'hours' && lv.hours) ? perHour * Number(lv.hours) : perDay * dayUnit;
      amt = Math.round(amt * 100) / 100;
      return amt > 0 ? { amount: amt, label: `หัก ${fmtMoney(amt)}฿` } : { amount: 0, label: '-' };
    }
    // รายเดือน
    if (type === 'sick') {
      if (lv.medicalCert) return { amount: 0, label: 'มีใบรับรอง — ไม่หัก' };
      const amt = Math.round(perDay * dayUnit * 100) / 100;
      return { amount: amt, label: `หัก ${fmtMoney(amt)}฿` };
    }
    if (type === 'personal' || type === 'vacation') {
      // ในโควต้า = ไม่หัก (แสดง - เพราะเช็คโควต้าละเอียดต้องใช้ทั้งเดือน)
      return { amount: 0, label: 'ในโควต้า — ไม่หัก' };
    }
    if (type === 'unpaid') {
      let amt = (lv.period === 'hours' && lv.hours) ? perHour * Number(lv.hours) : perDay * dayUnit;
      amt = Math.round(amt * 100) / 100;
      return { amount: amt, label: `หัก ${fmtMoney(amt)}฿` };
    }
    // ประเภทอื่น
    return { amount: 0, label: '-' };
  }

  // ตรงเวลา / วันหยุด / อื่นๆ = ไม่หัก
  return { amount: 0, label: '-' };
};

// คำนวณนาทีที่สายจากเวลาเข้างาน เทียบ workStart + ผ่อนผัน
// ดึงเฉพาะเวลา HH:MM จากค่าที่อาจเพี้ยน (เช่น "1899-12-30T08:00:00" หรือ ISO datetime)
const normTime = (v) => {
  if (v == null || v === '') return '';
  const s = String(v).trim();
  // ถ้ามีรูปแบบ datetime ISO หรือ 1899-12-30T... → ดึงเวลาหลัง T
  const tMatch = s.match(/T(\d{2}:\d{2})/);
  if (tMatch) return tMatch[1];
  // ถ้าเป็น HH:MM หรือ HH:MM:SS อยู่แล้ว
  const hm = s.match(/^(\d{1,2}):(\d{2})/);
  if (hm) return `${hm[1].padStart(2,'0')}:${hm[2]}`;
  return s;
};

// ===== เวลาทำงานมาตรฐาน (ตรึงค่าไว้) =====
// เข้างาน 08:00 · ออกงาน 17:00 · ผ่อนผันสายได้ 5 นาที (เข้าได้ถึง 08:05)
const WORK_HOURS = { start: '08:00', end: '17:00', lateGrace: 5 };

const lateMinutesOf = (checkIn) => {
  const ci = normTime(checkIn);
  if (!ci) return 0;
  const [wsH, wsM] = WORK_HOURS.start.split(':').map(Number);
  const allowed = (wsH*60+wsM) + WORK_HOURS.lateGrace;
  const [ciH, ciM] = ci.split(':').map(Number);
  const ciMin = (ciH||0)*60 + (ciM||0);
  return Math.max(0, ciMin - allowed);
};

const Toast = ({ toast, onClose }) => {
  useEffect(() => {
    const t = setTimeout(onClose, 3500);
    return () => clearTimeout(t);
  }, [onClose]);
  const colors = {
    success: 'bg-emerald-500',
    error:   'bg-red-500',
    info:    'bg-flow-600',
    warning: 'bg-gold-500',
  };
  const icons = { success: 'check', error: 'x', info: 'info', warning: 'info' };
  return (
    <div className="fixed bottom-6 right-6 z-[100] animate-fade-up">
      <div className={cls('flex items-center gap-3 px-5 py-3.5 rounded-xl shadow-card text-white font-medium', colors[toast.type])}>
        <Icon name={icons[toast.type]} className="w-5 h-5" />
        <span>{toast.message}</span>
      </div>
    </div>
  );
};

/* ── เปลี่ยนรหัสผ่าน (ผ่าน RPC — hash ฝั่ง server) ── */
const ChangePasswordModal = ({ username, onClose }) => {
  const { addToast } = useApp();
  const [oldPw, setOldPw] = useState('');
  const [newPw, setNewPw] = useState('');
  const [confirm, setConfirm] = useState('');
  const [saving, setSaving] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    if (newPw.length < 6) return addToast('error', 'รหัสใหม่ต้องยาวอย่างน้อย 6 ตัว');
    if (newPw !== confirm) return addToast('error', 'รหัสใหม่ทั้งสองช่องไม่ตรงกัน');
    setSaving(true);
    try {
      await api.get('changePassword', { username, oldPassword: oldPw, newPassword: newPw });
      addToast('success', 'เปลี่ยนรหัสผ่านเรียบร้อย');
      onClose();
    } catch (err) {
      addToast('error', err.message);
    } finally { setSaving(false); }
  };

  return (
    <Modal open onClose={onClose} title="เปลี่ยนรหัสผ่าน" size="sm">
      <form onSubmit={submit} className="space-y-3">
        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">รหัสผ่านเดิม</label>
          <Input type="password" value={oldPw} onChange={(e) => setOldPw(e.target.value)} required />
        </div>
        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">รหัสผ่านใหม่</label>
          <Input type="password" value={newPw} onChange={(e) => setNewPw(e.target.value)} placeholder="อย่างน้อย 6 ตัว" required />
        </div>
        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">ยืนยันรหัสผ่านใหม่</label>
          <Input type="password" value={confirm} onChange={(e) => setConfirm(e.target.value)} required />
        </div>
        <div className="flex justify-end gap-2 pt-2">
          <Button type="button" variant="secondary" onClick={onClose}>ยกเลิก</Button>
          <Button type="submit" icon="check" disabled={saving}>{saving ? 'กำลังบันทึก...' : 'เปลี่ยนรหัส'}</Button>
        </div>
      </form>
    </Modal>
  );
};

const Topbar = ({ title, subtitle, action }) => {
  const { leaves, assets, employees, user, setPage, refreshData, syncing, addToast, settings, attendance } = useApp();
  const [open, setOpen] = useState(false);
  const [notifTick, setNotifTick] = useState(0);   // บังคับคำนวณแจ้งเตือนใหม่เมื่ออ่านประกาศ

  // ฟังการเปลี่ยน "ประกาศที่อ่านแล้ว" เพื่ออัปเดต badge ทันที
  useEffect(() => {
    const onSeen = () => setNotifTick(t => t + 1);
    window.addEventListener('ffc-news-seen', onSeen);
    window.addEventListener('storage', onSeen);
    return () => {
      window.removeEventListener('ffc-news-seen', onSeen);
      window.removeEventListener('storage', onSeen);
    };
  }, []);

  // สร้างรายการแจ้งเตือนจากข้อมูลจริง
  const notifications = useMemo(() => {
    const list = [];
    const myEmp = employees.find(e => e.id === user.empId);
    const scope = myEmp?.approvalScope || (myEmp?.canApprove ? 'manager' : 'none');
    const canApprove = user.role === 'admin' || user.role === 'hr' || user.role === 'manager' || scope !== 'none';

    // คำขอลารออนุมัติ
    if (canApprove) {
      let pending = leaves.filter(l => l.status === 'pending');
      if (scope === 'regional' && myEmp) {
        pending = pending.filter(l => {
          const e = employees.find(x => x.id === l.employeeId);
          return e && e.branchId === myEmp.branchId;
        });
      } else if (user.role === 'manager' && user.branchId) {
        pending = pending.filter(l => {
          const e = employees.find(x => x.id === l.employeeId);
          return e && e.branchId === user.branchId;
        });
      }
      if (pending.length > 0) {
        list.push({
          id: 'leave-pending', icon: 'calendar', color: 'gold',
          title: `มีคำขอลารออนุมัติ ${pending.length} รายการ`,
          desc: 'คลิกเพื่อไปหน้าการลา', page: 'leaves',
        });
      }
    }

    // ทรัพย์สินชำรุด/รอซ่อม
    if (['admin','hr','manager'].includes(user.role)) {
      const broken = assets.filter(a => a.status === 'ชำรุด/รอซ่อม'
        && (user.role !== 'manager' || a.branchId === user.branchId));
      if (broken.length > 0) {
        list.push({
          id: 'asset-broken', icon: 'wrench', color: 'red',
          title: `ทรัพย์สินชำรุด/รอซ่อม ${broken.length} รายการ`,
          desc: 'คลิกเพื่อดูทรัพย์สิน', page: 'assets',
        });
      }
    }

    // ทรัพย์สินค้างอยู่กับพนักงานที่ลาออกแล้ว (ต้องติดตามรับคืน)
    if (['admin','hr','manager'].includes(user.role)) {
      const inactiveIds = new Set(employees.filter(e => e.status === 'inactive').map(e => e.id));
      const unreturdefine = assets.filter(a => a.assignedTo && inactiveIds.has(a.assignedTo)
        && (user.role !== 'manager' || a.branchId === user.branchId));
      if (unreturdefine.length > 0) {
        list.push({
          id: 'asset-unreturned', icon: 'box', color: 'red',
          title: `ทรัพย์สินค้างกับพนักงานที่ลาออก ${unreturdefine.length} รายการ`,
          desc: 'คลิกเพื่อติดตามรับคืน', page: 'assets',
        });
      }
    }

    // ใบเบิกค่าใช้จ่ายรออนุมัติ (admin/hr อนุมัติได้ทั้งหมด)
    if (user.role === 'admin' || user.role === 'hr') {
      const expenses = (settings && settings.expenses) || [];
      const pendingExp = expenses.filter(e => e.status === 'pending');
      if (pendingExp.length > 0) {
        list.push({
          id: 'expense-pending', icon: 'receipt', color: 'gold',
          title: `มีใบเบิกค่าใช้จ่ายรออนุมัติ ${pendingExp.length} รายการ`,
          desc: 'คลิกเพื่อไปหน้าเบิกค่าใช้จ่าย', page: 'expenses',
        });
      }
    }

    // ประกาศข่าวสารใหม่ (ทุกคนเห็น) — เทียบกับเวลาที่เปิดอ่านล่าสุด
    const announcements = (settings && settings.announcements) || [];
    if (announcements.length > 0) {
      let lastSeen = 0;
      try { lastSeen = Number(localStorage.getItem('ffc_news_seen') || 0); } catch {}
      const unread = announcements.filter(a => {
        const t = a.createdAt ? new Date(a.createdAt).getTime() : 0;
        return t > lastSeen;
      });
      if (unread.length > 0) {
        const pinned = unread.find(a => a.pinned);
        list.push({
          id: 'news-new', icon: 'megaphone', color: 'flow',
          title: `มีประกาศข่าวสารใหม่ ${unread.length} รายการ`,
          desc: (pinned ? '📌 ' : '') + (unread[0].title || 'คลิกเพื่ออ่าน'),
          page: 'policies',
        });
      }
    }

    // คำขอใบรับรองรออนุมัติ (เฉพาะ hr/admin)
    if (user.role === 'admin' || user.role === 'hr') {
      const pendingCerts = ((settings && settings.certRequests) || []).filter(r => r.status === 'pending');
      if (pendingCerts.length > 0) {
        list.push({
          id: 'cert-pending', icon: 'file', color: 'gold',
          title: `คำขอใบรับรอง ${pendingCerts.length} รายการ`,
          desc: 'รอการอนุมัติจากฝ่ายบุคคล',
          page: 'settings', tab: 'certs',
        });
      }
    }

    // ใบเตือน: พนักงานมาสายเกินเกณฑ์ (แจ้งผู้จัดการภาค/hr/admin)
    if (canApprove) {
      const threshold = (settings && settings.warningConfig && settings.warningConfig.lateThreshold) || 6;
      const warnings = (settings && settings.warnings) || [];
      const thisMonth = new Date().toISOString().slice(0, 7);
      const canAll = user.role === 'admin' || user.role === 'hr';
      const myBranch = user.branchId || myEmp?.branchId;
      // พนักงานในขอบเขต
      const scopeEmps = employees.filter(e => {
        if (e.status === 'inactive') return false;
        if (canAll) return true;
        return e.branchId === myBranch;
      });
      const entered = scopeEmps.filter(e => {
        const lateCount = (attendance || []).filter(a =>
          a.employeeId === e.id && a.status === 'late' && toYMD(a.date).startsWith(thisMonth)
        ).length;
        if (lateCount < threshold) return false;
        // ยังไม่ออกใบเตือนของเดือนนี้
        return !warnings.some(w => w.employeeId === e.id && w.month === thisMonth);
      });
      if (entered.length > 0) {
        list.push({
          id: 'warning-alert', icon: 'info', color: 'red',
          title: `มีพนักงานเข้าเกณฑ์ใบเตือน ${entered.length} คน`,
          desc: `มาสายตั้งแต่ ${threshold} ครั้ง/เดือน — คลิกเพื่อดู`,
          page: 'warnings',
        });
      }
    }

    return list;
  }, [leaves, assets, employees, user, settings, attendance, notifTick]);

  return (
    <header className="bg-white border-b border-ink-100 sticky top-0 z-30">
      <div className="px-8 py-5 flex items-center justify-between">
        <div>
          <h1 className="font-display text-2xl font-bold text-ink-900">{title}</h1>
          {subtitle && <p className="text-sm text-ink-500 mt-0.5">{subtitle}</p>}
        </div>
        <div className="flex items-center gap-3">
          {action}
          <button
            onClick={() => api.enabled() ? refreshData() : addToast('info', 'ยังไม่ได้เชื่อมต่อ Supabase — ไปที่ ตั้งค่า › ฐานข้อมูล เพื่อกรอก URL + Key')}
            disabled={syncing}
            title={api.enabled() ? 'ซิงค์ข้อมูลล่าสุด' : 'ยังไม่ได้เชื่อมต่อ Supabase'}
            className={cls(
              'w-10 h-10 rounded-xl border flex items-center justify-center transition-colors disabled:opacity-50',
              api.enabled() ? 'border-ink-200 hover:bg-ink-50 text-ink-600' : 'border-gold-300 bg-gold-50 text-gold-600 hover:bg-gold-100',
            )}>
            <Icon name="refresh" className={cls('w-5 h-5', syncing && 'animate-spin')} />
          </button>
          <div className="relative">
            <button
              onClick={() => setOpen(o => !o)}
              className="relative w-10 h-10 rounded-xl border border-ink-200 hover:bg-ink-50 flex items-center justify-center text-ink-600 transition-colors">
              <Icon name="bell" className="w-5 h-5" />
              {notifications.length > 0 && (
                <span className="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 bg-red-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center">
                  {notifications.length}
                </span>
              )}
            </button>

            {open && (
              <>
                <div className="fixed inset-0 z-40" onClick={() => setOpen(false)} />
                <div className="absolute right-0 mt-2 w-80 bg-white rounded-2xl shadow-xl border border-ink-100 z-50 overflow-hidden">
                  <div className="px-4 py-3 border-b border-ink-100 flex items-center justify-between">
                    <span className="font-display font-semibold text-ink-900">การแจ้งเตือน</span>
                    <Badge color={notifications.length > 0 ? 'red' : 'gray'}>{notifications.length}</Badge>
                  </div>
                  {notifications.length === 0 ? (
                    <div className="px-4 py-8 text-center text-sm text-ink-400">
                      <Icon name="check" className="w-8 h-8 mx-auto mb-2 text-emerald-400" />
                      ไม่มีการแจ้งเตือนใหม่
                    </div>
                  ) : (
                    <div className="max-h-80 overflow-y-auto divide-y divide-ink-50">
                      {notifications.map(n => (
                        <button key={n.id}
                          onClick={() => {
                            if (n.tab) { try { window.__ffcGoTab = n.tab; } catch {} }
                            setPage(n.page); setOpen(false);
                            if (n.tab) window.dispatchEvent(new Event('ffc-go-tab'));
                          }}
                          className="w-full px-4 py-3 flex items-start gap-3 hover:bg-ink-50 transition-colors text-left">
                          <div className={cls('w-9 h-9 rounded-xl flex items-center justify-center shrink-0',
                            n.color === 'gold' && 'bg-gold-100 text-gold-700',
                            n.color === 'red' && 'bg-red-100 text-red-600',
                            n.color === 'flow' && 'bg-flow-100 text-flow-700',
                          )}>
                            <Icon name={n.icon} className="w-4 h-4" />
                          </div>
                          <div className="min-w-0">
                            <div className="text-sm font-medium text-ink-900">{n.title}</div>
                            <div className="text-xs text-ink-500 mt-0.5">{n.desc}</div>
                          </div>
                        </button>
                      ))}
                    </div>
                  )}
                </div>
              </>
            )}
          </div>
        </div>
      </div>
    </header>
  );
};

/* =============================================================
   DASHBOARD PAGE
   ============================================================= */
const Dashboard = ({ }) => {
  const { employees, attendance, leaves, leaveTypes, branches, user, refreshData, syncing } = useApp();
  const today = new Date().toISOString().split('T')[0];
  const [selectedDate, setSelectedDate] = useState(today);  // วันที่ที่เลือกดูรายละเอียด
  const [detailTab, setDetailTab] = useState('leave');       // leave / absent / late / wfh

  // Filter by branch if manager
  const scopedEmps = useMemo(() => {
    if (user.role === 'manager' && user.branchId) {
      return employees.filter(e => e.branchId === user.branchId);
    }
    return employees;
  }, [employees, user]);

  const scopedEmpIds = useMemo(() => new Set(scopedEmps.map(e => e.id)), [scopedEmps]);
  const todayAtt = attendance.filter(a => a.date === today && scopedEmpIds.has(a.employeeId));
  const todayLeaves = leaves.filter(l =>
    l.status === 'approved' &&
    toYMD(l.startDate) <= today && toYMD(l.endDate) >= today &&
    scopedEmpIds.has(l.employeeId)
  );
  const pendingLeaves = leaves.filter(l => l.status === 'pending' && scopedEmpIds.has(l.employeeId));
  const lateCount = todayAtt.filter(a => a.status === 'late').length;

  // นับเฉพาะพนักงานที่ยังทำงานอยู่ (active)
  const activeEmps = scopedEmps.filter(e => e.status !== 'inactive');
  const leaveEmpIds = new Set(todayLeaves.map(l => l.employeeId));

  // มาทำงาน = พนักงาน active ทั้งหมด - คนลา
  // (ถ้ามีข้อมูลสแกนนิ้ว = ใช้ตัวเลขจริง, ถ้าไม่มี = สมมติว่ามาทำงาน)
  const hasAttendanceData = todayAtt.length > 0;
  const presentCount = hasAttendanceData
    ? todayAtt.length
    : activeEmps.filter(e => !leaveEmpIds.has(e.id)).length;
  const absentCount = hasAttendanceData
    ? Math.max(0, activeEmps.length - presentCount - todayLeaves.length)
    : 0;

  // ===== รายละเอียดของวันที่เลือก (filter รายวัน) =====
  const dayDetail = useMemo(() => {
    const empById = new Map(scopedEmps.map(e => [e.id, e]));
    // คนลาในวันที่เลือก (แยกตาม WFH/offsite vs ลาจริง)
    const dayLeaves = leaves.filter(l =>
      l.status === 'approved' &&
      toYMD(l.startDate) <= selectedDate &&
      toYMD(l.endDate) >= selectedDate &&
      scopedEmpIds.has(l.employeeId)
    );
    const wfhTypes = new Set(['wfh', 'offsite']);
    const onLeave = dayLeaves.filter(l => !wfhTypes.has(l.type) && l.type !== 'absent');
    const onWfh   = dayLeaves.filter(l => wfhTypes.has(l.type));
    const onAbsentLeave = dayLeaves.filter(l => l.type === 'absent');

    // การเข้างานในวันที่เลือก
    const dayAtt = attendance.filter(a => a.date === selectedDate && scopedEmpIds.has(a.employeeId));
    const lateList = dayAtt.filter(a => a.status === 'late');
    const dayAttEmpIds = new Set(dayAtt.map(a => a.employeeId));
    const dayLeaveEmpIds = new Set(dayLeaves.map(l => l.employeeId));

    // ขาดงาน = มีข้อมูลสแกน แต่ไม่มา + ไม่ลา (หรือ มี leave type absent)
    let absentList = [];
    if (dayAtt.length > 0) {
      absentList = activeEmps.filter(e =>
        !dayAttEmpIds.has(e.id) && !dayLeaveEmpIds.has(e.id)
      ).map(e => ({ employeeId: e.id, type: 'absent' }));
    }
    // รวม leave type = absent ด้วย
    absentList = absentList.concat(onAbsentLeave.map(l => ({ employeeId: l.employeeId, type: 'absent', ...l })));

    const enrich = (item) => {
      const emp = empById.get(item.employeeId);
      return { ...item, emp };
    };

    return {
      leave:  onLeave.map(enrich),
      absent: absentList.map(enrich),
      late:   lateList.map(enrich),
      wfh:    onWfh.map(enrich),
      hasAtt: dayAtt.length > 0,
    };
  }, [selectedDate, leaves, attendance, scopedEmps, scopedEmpIds, activeEmps]);

  // ===== Top 3 (ทั้งปี) =====
  const year = String(new Date().getFullYear());
  const topRankings = useMemo(() => {
    const empById = new Map(scopedEmps.map(e => [e.id, e]));
    // นับจำนวนวันของแต่ละพนักงาน แยกหมวด
    const absentDays = {};   // ขาดงาน
    const leaveDays  = {};   // ลาป่วย + ลากิจ + ลาไม่รับเงินเดือน
    const lateDays   = {};   // มาสาย

    const leaveCountTypes = new Set(['sick', 'personal', 'unpaid']);

    leaves.forEach(l => {
      if (l.status !== 'approved') return;
      if (!scopedEmpIds.has(l.employeeId)) return;
      if (!String(l.startDate || '').startsWith(year)) return;
      const d = Number(l.days) || 0;
      if (l.type === 'absent') {
        absentDays[l.employeeId] = (absentDays[l.employeeId] || 0) + d;
      } else if (leaveCountTypes.has(l.type)) {
        leaveDays[l.employeeId] = (leaveDays[l.employeeId] || 0) + d;
      }
    });

    attendance.forEach(a => {
      if (!scopedEmpIds.has(a.employeeId)) return;
      if (!String(a.date || '').startsWith(year)) return;
      if (a.status === 'late') {
        lateDays[a.employeeId] = (lateDays[a.employeeId] || 0) + 1;
      }
    });

    const toTop3 = (obj, unit) => Object.entries(obj)
      .map(([id, val]) => ({ emp: empById.get(id), val, unit }))
      .filter(x => x.emp && x.val > 0)
      .sort((a, b) => b.val - a.val)
      .slice(0, 3);

    return {
      absent: toTop3(absentDays, 'วัน'),
      leave:  toTop3(leaveDays, 'วัน'),
      late:   toTop3(lateDays, 'ครั้ง'),
    };
  }, [leaves, attendance, scopedEmps, scopedEmpIds, year]);

  // Chart: by branch
  const byBranch = branches.map(b => {
    const empsInB = activeEmps.filter(e => e.branchId === b.id);
    const leaveInB = todayLeaves.filter(l => empsInB.some(e => e.id === l.employeeId)).length;
    const attendedInB = todayAtt.filter(a => empsInB.some(e => e.id === a.employeeId)).length;
    const hasDataB = attendedInB > 0;
    const presentInB = hasDataB
      ? attendedInB
      : empsInB.filter(e => !leaveEmpIds.has(e.id)).length;
    return {
      name: b.short,
      มาทำงาน: presentInB,
      ลา: leaveInB,
      ขาดงาน: hasDataB ? Math.max(0, empsInB.length - presentInB - leaveInB) : 0,
      color: b.color,
    };
  });

  // Trend: last 7 days
  const trend = Array.from({ length: 7 }, (_, i) => {
    const d = new Date();
    d.setDate(d.getDate() - (6 - i));
    const ds = d.toISOString().split('T')[0];
    const dayAtt = attendance.filter(a => a.date === ds && scopedEmpIds.has(a.employeeId)).length;
    const dayLeavesList = leaves.filter(l => l.status === 'approved' && toYMD(l.startDate) <= ds && toYMD(l.endDate) >= ds && scopedEmpIds.has(l.employeeId));
    const dayLeaveIds = new Set(dayLeavesList.map(l => l.employeeId));
    const dayPresent = dayAtt > 0 ? dayAtt : activeEmps.filter(e => !dayLeaveIds.has(e.id)).length;
    return {
      date: d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' }),
      มาทำงาน: dayPresent,
      ลา: dayLeavesList.length,
    };
  });

  // Leave types pie
  const leaveByType = leaveTypes.map(t => {
    const count = leaves.filter(l => l.type === t.id && scopedEmpIds.has(l.employeeId)).length;
    return { name: t.label, value: count, color: t.color };
  }).filter(t => t.value > 0);

  return (
    <div className="p-8 space-y-6 animate-fade-up">
      {/* Hi-tech Hero banner */}
      <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-[#0B1020] via-[#15103A] to-[#0E2A4A] text-white p-8">
        {/* Animated grid */}
        <div className="absolute inset-0 tech-grid opacity-60" />
        {/* Glowing orbs */}
        <div className="orb w-72 h-72 bg-flow-500/30 -right-16 -top-20" />
        <div className="orb w-56 h-56 bg-brand-500/30 right-1/3 -bottom-16" style={{ animationDelay: '4s' }} />
        <div className="orb w-40 h-40 bg-gold-500/20 left-10 top-10" style={{ animationDelay: '8s' }} />

        <div className="relative grid lg:grid-cols-2 gap-6 items-center">
          {api.enabled() && (
            <button
              onClick={refreshData}
              disabled={syncing}
              title="ซิงค์ข้อมูลล่าสุด"
              className="absolute top-0 right-0 z-10 inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/10 border border-white/20 backdrop-blur-sm text-white/90 text-xs hover:bg-white/20 transition-colors disabled:opacity-50">
              <Icon name="refresh" className={cls('w-3.5 h-3.5', syncing && 'animate-spin')} />
              {syncing ? 'กำลังซิงค์...' : 'ซิงค์ข้อมูล'}
            </button>
          )}
          <div>
            <div className="flex items-center gap-2 mb-3">
              <span className="live-dot" />
              <span className="text-flow-200/90 text-[11px] uppercase tracking-[0.2em] font-medium">
                ระบบออนไลน์ · {fmtThaiDate(new Date())}
              </span>
            </div>
            <h2 className="font-display text-3xl lg:text-4xl font-bold mb-3 tracking-tight">
              สวัสดี, {user.name}
            </h2>
            <p className="text-flow-100/70 max-w-md leading-relaxed">
              วันนี้มีพนักงานมาทำงาน <strong className="text-flow-300">{presentCount} คน</strong> จากทั้งหมด {activeEmps.length} คน
              {pendingLeaves.length > 0 && <> · มีคำขอลารออนุมัติ <strong className="text-gold-300">{pendingLeaves.length} รายการ</strong></>}
            </p>

            {/* Mini metric chips */}
            <div className="flex flex-wrap gap-2 mt-5">
              <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/5 border border-white/10 backdrop-blur-sm">
                <Icon name="check" className="w-3.5 h-3.5 text-emerald-400" />
                <span className="text-xs text-white/80">ตรงเวลา {hasAttendanceData ? presentCount - lateCount : presentCount}</span>
              </div>
              <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/5 border border-white/10 backdrop-blur-sm">
                <Icon name="clock" className="w-3.5 h-3.5 text-gold-400" />
                <span className="text-xs text-white/80">สาย {lateCount}</span>
              </div>
              <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/5 border border-white/10 backdrop-blur-sm">
                <Icon name="calendar" className="w-3.5 h-3.5 text-flow-400" />
                <span className="text-xs text-white/80">ลา {todayLeaves.length}</span>
              </div>
            </div>
          </div>

          {/* Attendance ring */}
          <div className="flex items-center justify-center lg:justify-end gap-6">
            <div className="relative w-44 h-44">
              <svg className="w-full h-full ring-progress" viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="10" />
                <circle
                  cx="60" cy="60" r="52" fill="none"
                  stroke="url(#ringGrad)" strokeWidth="10" strokeLinecap="round"
                  strokeDasharray={2 * Math.PI * 52}
                  strokeDashoffset={2 * Math.PI * 52 * (1 - (activeEmps.length > 0 ? presentCount / activeEmps.length : 0))}
                />
                <defs>
                  <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stopColor="#22D3EE" />
                    <stop offset="100%" stopColor="#6366F1" />
                  </linearGradient>
                </defs>
              </svg>
              <div className="absolute inset-0 flex flex-col items-center justify-center">
                <div className="hero-num font-display text-4xl font-bold">
                  {activeEmps.length > 0 ? Math.round((presentCount / activeEmps.length) * 100) : 0}%
                </div>
                <div className="text-[10px] uppercase tracking-widest text-flow-200/60 mt-1">อัตราเข้างาน</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* Stat cards */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        {[
          { icon: 'users',       label: 'พนักงานทั้งหมด', value: activeEmps.length,    sub: `จาก ${branches.length} สาขา`,      color: 'flow' },
          { icon: 'check',       label: 'มาทำงานวันนี้',   value: presentCount,         sub: hasAttendanceData ? (lateCount > 0 ? `สาย ${lateCount} คน` : 'ตรงเวลาทุกคน') : 'ตามทะเบียน (ยังไม่สแกน)', color: 'green' },
          { icon: 'calendar',    label: 'ลางานวันนี้',     value: todayLeaves.length,   sub: `รออนุมัติ ${pendingLeaves.length}`, color: 'gold' },

            { id: 'absent', label: 'ขาดงาน',  icon: 'x',           count: dayDetail.absent.length, color: 'red' },

          return (
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
              {list.map((item, i) => {
                const emp = item.emp;
                if (!emp) return null;
                const branch = branches.find(b => b.id === emp.branchId);

                return (
                  <div key={i} className="flex items-center gap-3 p-3 rounded-xl border border-ink-100 hover:shadow-soft transition-all">
                    <Avatar name={`${emp.firstName} ${emp.lastName}`} photo={emp.photo} size="sm" />
                    <div className="min-w-0 flex-1">

      {/* ===== Top 3 Rankings (ทั้งปี) ===== */}
      <div className="grid lg:grid-cols-3 gap-5">
        {[
          { key: 'absent', title: 'ขาดงานมากที่สุด', icon: 'x',       color: '#EF4444', bg: 'bg-red-50',  desc: 'รวมทั้งปี' },
          { key: 'leave',  title: 'ลางานมากที่สุด',   icon: 'calendar', color: '#F59E0B', bg: 'bg-gold-50', desc: 'ป่วย+กิจ+ไม่รับเงินเดือน' },
          { key: 'late',   title: 'มาสายมากที่สุด',   icon: 'refresh',  color: '#F97316', bg: 'bg-orange-50', desc: 'รวมทั้งปี' },
        ].map(rank => {
          const list = topRankings[rank.key];

          return (

/* =============================================================
   EMPLOYEES PAGE
   ============================================================= */
const EmployeesPage = () => {
  const { employees, setEmployees, branches, departments, attendance, leaves, setLeaves, leaveTypes, addToast, user } = useApp();
  const [search, setSearch]   = useState('');
  const [filterBranch, setFilterBranch] = useState('all');
  const [filterDep, setFilterDep] = useState('all');
  const [filterStatus, setFilterStatus] = useState('all');   // all | active | inactive
  const [openAdd, setOpenAdd] = useState(false);
  const [editing, setEditing] = useState(null);
  const [viewing, setViewing] = useState(null); // พนักงานที่กำลังดูประวัติ
  const [showImport, setShowImport] = useState(false);

  const filtered = useMemo(() => {
    return employees.filter(e => {
      if (user.role === 'manager' && e.branchId !== user.branchId) return false;
      if (filterBranch !== 'all' && e.branchId !== filterBranch) return false;
      if (filterDep    !== 'all' && e.department !== filterDep) return false;
      if (filterStatus === 'active'   && e.status === 'inactive') return false;
      if (filterStatus === 'inactive' && e.status !== 'inactive') return false;
      if (search) {
        const q = search.toLowerCase();
        return (e.firstName + e.lastName + e.id + e.email + e.phone).toLowerCase().includes(q);
      }
      return true;
    }).sort((a, b) => String(a.id || '').localeCompare(String(b.id || ''), undefined, { numeric: true }));
  }, [employees, search, filterBranch, filterDep, filterStatus, user]);

  // Export ข้อมูลพนักงานตาม filter ปัจจุบัน
  const exportEmployees = () => {
    if (filtered.length === 0) { addToast('error', 'ไม่มีพนักงานให้ส่งออก'); return; }
    const bName = (id) => (branches.find(b => b.id === id)?.name || id || '-');
    const salaryTypeLabel = (t) => t === 'daily' ? 'รายวัน' : t === 'weekly' ? 'รายสัปดาห์' : 'รายเดือน';
    const header = ['รหัส','ชื่อ','นามสกุล','ชื่อเล่น','สถานะ','ตำแหน่ง','ฝ่าย','สาขา','เบอร์โทร','อีเมล','เลขบัตรประชาชน','วันเริ่มงาน','ประเภทเงินเดือน','ฐานเงินเดือน','เงินพิเศษ','ประกันสังคม','กยศ','ธนาคาร','เลขบัญชี','ชื่อบัญชี'];
    const rows = filtered.map(e => [
      e.id, e.firstName, e.lastName, e.nickname || '',
      e.status === 'inactive' ? 'พ้นสภาพ' : 'ปฏิบัติงาน',
      e.position || '', e.department || '', bName(e.branchId),
      e.phone || '', e.email || '', e.nationalId || '',
      e.startDate || e.hireDate || '',
      salaryTypeLabel(e.salaryType),
      e.baseSalary || '', e.specialAllowance || '',
      e.ssoAmount || '', e.gyosAmount || '',
      e.bankName || '', e.bankAccount || '', e.bankAccountName || '',
    ]);
    const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
    ws['!cols'] = [{wch:10},{wch:14},{wch:14},{wch:10},{wch:10},{wch:16},{wch:16},{wch:16},{wch:12},{wch:22},{wch:16},{wch:12},{wch:12},{wch:12},{wch:10},{wch:10},{wch:10},{wch:16},{wch:14},{wch:18}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'พนักงาน');
    const parts = [];
    if (filterBranch !== 'all') parts.push(bName(filterBranch));
    if (filterStatus === 'active') parts.push('ปฏิบัติงาน');
    if (filterStatus === 'inactive') parts.push('พ้นสภาพ');
    const suffix = parts.length ? '_' + parts.join('_') : '';
    XLSX.writeFile(wb, `รายชื่อพนักงาน${suffix}_${new Date().toISOString().slice(0,10)}.xlsx`);
    addToast('success', `ส่งออก ${filtered.length} คนเรียบร้อย`);
  };

  const deleteEmp = (id) => {
    if (!confirm('ยืนยันการลบพนักงานคนนี้?')) return;
    setEmployees(employees.filter(e => e.id !== id));
    addToast('success', 'ลบพนักงานเรียบร้อย');
    if (api.enabled()) {
      api.post('deleteEmployee', { id })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
  };

  return (
    <div className="p-8 space-y-6 animate-fade-up">
      <Topbar
        title="พนักงาน"
        subtitle={`ทั้งหมด ${filtered.length} คน`}
        action={
          (user.role === 'admin' || user.role === 'hr') && (
            <div className="flex gap-2">
              <Button variant="outline" icon="download" onClick={exportEmployees}>
                Export
              </Button>
              <Button variant="outline" icon="upload" onClick={() => setShowImport(true)}>
                นำเข้า Excel
              </Button>
              <Button icon="plus" onClick={() => { setEditing(null); setOpenAdd(true); }}>
                เพิ่มพนักงาน
              </Button>
            </div>
          )
        }
      />

      <Card className="p-4">
        <div className="grid md:grid-cols-5 gap-3">
          <div className="md:col-span-2">
            <Input icon="search" placeholder="ค้นหาชื่อ, รหัสพนักงาน, อีเมล..." value={search} onChange={(e) => setSearch(e.target.value)} />
          </div>
          <Select value={filterBranch} onChange={(e) => setFilterBranch(e.target.value)}>
            <option value="all">ทุกสาขา</option>
            {branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
          </Select>
          <Select value={filterDep} onChange={(e) => setFilterDep(e.target.value)}>
            <option value="all">ทุกฝ่าย</option>
            {departments.map(d => <option key={d} value={d}>{d}</option>)}
          </Select>
          <Select value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)}>
            <option value="all">ทุกสถานะ</option>
            <option value="active">ปฏิบัติงาน</option>
            <option value="inactive">พ้นสภาพ</option>
          </Select>
        </div>
      </Card>

      <Card className="overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-ink-50 text-ink-600">
              <tr>
                <th className="text-left px-5 py-3 font-medium">พนักงาน</th>
                <th className="text-left px-5 py-3 font-medium">รหัส</th>
                <th className="text-left px-5 py-3 font-medium">สาขา / ฝ่าย</th>
                <th className="text-left px-5 py-3 font-medium">ติดต่อ</th>

                    <td className="px-5 py-3 font-mono text-xs">{emp.id}</td>
                    <td className="px-5 py-3">
                      <Badge color="blue">{branch?.short || '-'}</Badge>
