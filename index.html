/* ===== IMPORT ASSETS MODAL ===== */
const ImportAssetsModal = ({ open, onClose, existingAssets, branches, onImport }) => {
  const fileRef = useRef(null);
  const [preview, setPreview] = useState(null);
  const [errors, setErrors] = useState([]);

  // map ชื่อภาค → branchId
  const regionMap = { 'ภาคกลาง': 'LLK', 'ภาคอีสาน': 'ISN', 'ภาคเหนือ': 'NRT', 'กลาง': 'LLK', 'อีสาน': 'ISN', 'เหนือ': 'NRT' };

  const reset = () => { setPreview(null); setErrors([]); if (fileRef.current) fileRef.current.value = ''; };
  const close = () => { reset(); onClose(); };

  const handleFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type: 'binary', cellDates: true });
        const assets = [];
        const errs = [];

        // วนทุกชีตที่เป็นภาค
        wb.SheetNames.forEach(sheetName => {
          const branchId = regionMap[sheetName.trim()];
          if (!branchId) return; // ข้ามชีตที่ไม่ใช่ภาค (สรุปรวม, ประวัติซ่อม, การตั้งรหัส)

          const ws = wb.Sheets[sheetName];
          const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false });

          // หาแถว header (มีคำว่า "รหัสทรัพย์สิน")
          let headerIdx = -1;
          for (let i = 0; i < Math.min(rows.length, 15); i++) {
            if (rows[i].some(c => String(c).includes('รหัสทรัพย์สิน'))) { headerIdx = i; break; }
          }
          if (headerIdx === -1) return;

          const headers = rows[headerIdx].map(h => String(h).trim());
          const col = (name) => headers.findIndex(h => h.includes(name));
          const idxCode = col('รหัสทรัพย์สิน');
          const idxName = col('ชื่อทรัพย์สิน');
          const idxType = col('ประเภท');
          const idxBrand = col('ยี่ห้อ');
          const idxSerial = col('Serial');
          const idxDept = col('แผนก');
          const idxOwner = col('ผู้ดูแล');
          const idxBuyDate = col('วันที่ซื้อ');
          const idxPrice = col('ราคาซื้อ');
          const idxLife = col('อายุการใช้งาน');
          const idxCond = col('สภาพ');
          const idxStatus = col('สถานะ');
          const idxNote = col('หมายเหตุ');

          let lastCode = '';
          let subCounter = 0;  // นับรายการย่อยใต้รหัสเดียวกัน (-A, -B, ...)
          for (let i = headerIdx + 1; i < rows.length; i++) {
            const r = rows[i];
            const name = String(r[idxName] || '').trim();
            if (!name) continue; // ข้ามแถวว่าง

            // ถ้ามีรหัส ใช้รหัสนั้น ถ้าไม่มี (เป็นรายการย่อยใต้รหัสเดียวกัน) สืบทอดรหัสล่าสุด
            let code = String(r[idxCode] || '').trim();
            let hasOwnCode = !!code;
            if (code) { lastCode = code; subCounter = 0; }  // เจอรหัสใหม่ → reset ตัวนับย่อย

            const toDate = (v) => {
              if (v instanceof Date) return v.toISOString().split('T')[0];
              if (typeof v === 'string' && v.trim()) {
                const d = new Date(v); if (!isNaN(d)) return d.toISOString().split('T')[0];
              }
              return '';
            };

            // แปลงตัวเลข — ลบ comma และอักษรที่ไม่ใช่ตัวเลขออกก่อน (เช่น "15,990.00" → 15990)
            const parseNum = (v) => {
              if (v == null || v === '') return 0;
              if (typeof v === 'number') return v;
              const cleaned = String(v).replace(/[^0-9.-]/g, '');
              const n = parseFloat(cleaned);
              return isNaN(n) ? 0 : n;
            };

            // map ประเภท → category code: ดึงจากรหัส (ของตัวเอง หรือ รหัสล่าสุดที่สืบทอด)
            let category = 'OF-ACC';
            const codeForCat = code || lastCode;
            if (codeForCat) {
              const m = codeForCat.match(/FFC-[A-Z]+-([A-Z]+-[A-Z]+)-/);
              if (m) category = m[1];
            }

            // รหัสที่แสดง: ถ้ามีรหัสของตัวเอง ใช้เลย / ถ้าเป็นรายการย่อย ใส่ -A, -B ต่อท้าย
            let displayCode;
            if (hasOwnCode) {
              displayCode = code;
            } else if (lastCode) {
              subCounter++;
              displayCode = `${lastCode}-${String.fromCharCode(64 + subCounter)}`; // -A, -B, -C
            } else {
              displayCode = '';  // ไม่มีรหัสเลย — จะสร้างทีหลังได้
            }

            assets.push({
              id: `AST_IMP_${branchId}_${i}`,
              code: displayCode,
              name,
              category,
              branchId,
              brand: String(r[idxBrand] || '').trim(),
              serialNo: String(r[idxSerial] || '').trim(),
              department: String(r[idxDept] || '').trim(),
              owner: String(r[idxOwner] || '').trim(),
              purchaseDate: toDate(r[idxBuyDate]),
              purchasePrice: parseNum(r[idxPrice]),
              usefulLife: String(r[idxLife] || '').trim(),
              currentValue: null,
              condition: String(r[idxCond] || 'ดี').trim(),
              status: String(r[idxStatus] || 'ใช้งานได้').trim(),
              lastCheck: '',
              note: String(r[idxNote] || '').trim(),
            });
          }
        });

        if (assets.length === 0) errs.push('ไม่พบข้อมูลทรัพย์สิน (ต้องมีชีตชื่อ ภาคกลาง/ภาคอีสาน/ภาคเหนือ)');
        setPreview({ assets });
        setErrors(errs);
      } catch (err) {
        setErrors([`อ่านไฟล์ไม่สำเร็จ: ${err.message}`]);
      }
    };
    reader.readAsBinaryString(file);
  };

  if (!open) return null;
  const fmtBaht = (n) => Number(n || 0).toLocaleString('th-TH', { maximumFractionDigits: 0 });

  return (
    <Modal open={open} onClose={close} title="นำเข้าทรัพย์สินจาก Excel" size="xl">
      {!preview ? (
        <div className="space-y-5">
          <div className="bg-flow-50 border border-flow-200 rounded-xl p-4 text-sm text-ink-700">
            <Icon name="info" className="w-4 h-4 text-flow-700 inline mr-1" />
            รองรับไฟล์ที่มีชีต <strong>ภาคกลาง / ภาคอีสาน / ภาคเหนือ</strong> โดยแต่ละชีตมีคอลัมน์: รหัสทรัพย์สิน, ชื่อทรัพย์สิน, ยี่ห้อ, Serial No., แผนก, ผู้ดูแล, ราคาซื้อ ฯลฯ
          </div>
          <label className="block">
            <div className="border-2 border-dashed border-ink-200 hover:border-brand-400 hover:bg-brand-50/30 rounded-2xl p-10 text-center cursor-pointer transition-colors">
              <div className="w-16 h-16 mx-auto rounded-2xl bg-brand-100 text-brand-700 flex items-center justify-center mb-3"><Icon name="upload" className="w-7 h-7" /></div>
              <div className="font-display font-semibold text-ink-900 mb-1">ลากไฟล์มาที่นี่ หรือคลิกเพื่อเลือก</div>
              <div className="text-sm text-ink-500">รองรับ .xlsx, .xls</div>
              <input ref={fileRef} type="file" accept=".xlsx,.xls" onChange={handleFile} className="hidden" />
            </div>
          </label>
          {errors.length > 0 && (
            <div className="bg-red-50 border border-red-200 rounded-xl p-4 text-sm text-red-600">
              {errors.map((e, i) => <div key={i}>• {e}</div>)}
            </div>
          )}
        </div>
      ) : (
        <div className="space-y-4">
          <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4 flex items-center gap-3">
            <div className="w-10 h-10 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center"><Icon name="box" className="w-5 h-5" /></div>
            <div>
              <div className="font-display text-2xl font-bold text-emerald-700">{preview.assets.length}</div>
              <div className="text-xs text-ink-600">ทรัพย์สินที่จะนำเข้า</div>
            </div>
          </div>
          {errors.length > 0 && (
            <div className="bg-gold-50 border border-gold-200 rounded-xl p-3 text-xs text-ink-700">
              {errors.map((e, i) => <div key={i}>• {e}</div>)}
            </div>
          )}
          <div className="border border-ink-100 rounded-xl overflow-hidden max-h-80 overflow-y-auto">
            <table className="w-full text-xs">
              <thead className="bg-ink-50 text-ink-600 sticky top-0">
                <tr>
                  <th className="text-left px-3 py-2">รหัส</th>
                  <th className="text-left px-3 py-2">ชื่อ</th>
                  <th className="text-left px-3 py-2">สาขา</th>
                  <th className="text-left px-3 py-2">ผู้ดูแล</th>
                  <th className="text-right px-3 py-2">ราคา</th>
                  <th className="text-left px-3 py-2">สถานะ</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-ink-100">
                {preview.assets.slice(0, 40).map((a, i) => {
                  const branch = branches.find(b => b.id === a.branchId);
                  return (
                    <tr key={i}>
                      <td className="px-3 py-2 font-mono text-[10px]">{a.code}</td>
                      <td className="px-3 py-2">{a.name}</td>
                      <td className="px-3 py-2"><Badge color="blue">{branch?.short || a.branchId}</Badge></td>
                      <td className="px-3 py-2 text-ink-600">{a.owner || '-'}</td>
                      <td className="px-3 py-2 text-right">{fmtBaht(a.purchasePrice)}</td>
                      <td className="px-3 py-2">
                        <Badge color={a.status === 'ใช้งานได้' ? 'green' : 'red'}>{a.status}</Badge>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            {preview.assets.length > 40 && (
              <div className="px-3 py-2 text-center text-xs text-ink-500 bg-ink-50">แสดง 40 จาก {preview.assets.length} รายการ</div>
            )}
          </div>
          <div className="flex justify-end gap-2 pt-4 border-t border-ink-100">
            <Button variant="secondary" onClick={reset}>ยกเลิก</Button>
            <Button icon="check" onClick={() => { onImport(preview.assets); reset(); }}>นำเข้าข้อมูล</Button>
          </div>
        </div>
      )}
    </Modal>
  );
};

/* =============================================================
   PAYROLL — เงินเดือน + สลิปเงินเดือน
   ============================================================= */
const calcPayroll = (p) => {
  const earnings = (Number(p.baseSalary)||0) + (Number(p.overtime)||0) + (Number(p.transport)||0) + (Number(p.bonus)||0) + (Number(p.otherEarn)||0);
  const deductions = (Number(p.sso)||0) + (Number(p.tax)||0) + (Number(p.absenceDeduct)||0) + (Number(p.gyos)||0) + (Number(p.otherDeduct)||0);
  return { earnings, deductions, net: earnings - deductions };
};

// คำนวณเงินเดือน + การหักอัตโนมัติ จากข้อมูลพนักงาน + การเข้างาน + การลา ของเดือนนั้น
// period = 'YYYY-MM'
const computeAutoPayroll = (emp, range, attendance, leaves, leaveTypes, settings) => {
  // range = { from: 'YYYY-MM-DD', to: 'YYYY-MM-DD' }  หรือ string 'YYYY-MM' (รองรับแบบเก่า)
  let from, to;
  if (typeof range === 'string') {
    // แบบเก่า: ทั้งเดือน
    from = range + '-01';
    const [y, m] = range.split('-').map(Number);
    to = `${range}-${String(new Date(y, m, 0).getDate()).padStart(2, '0')}`;
  } else {
    from = range.from; to = range.to;
  }

  const salaryType = emp.salaryType || 'monthly';
  const base = Number(emp.baseSalary) || 0;
  const special = Number(emp.specialAllowance) || 0;

  // นับจำนวนวันในรอบ (ไม่รวมอาทิตย์) เพื่อ prorate เงินเดือนรายเดือน
  const countWorkdays = (f, t) => {
    let n = 0;
    const d = new Date(f + 'T00:00:00'), end = new Date(t + 'T00:00:00');
    while (d <= end) { if (d.getDay() !== 0) n++; d.setDate(d.getDate() + 1); }
    return n;
  };
  const rangeDays = countWorkdays(from, to);

  // เงินเดือน/วัน: รายเดือน = ฐาน/30, รายวัน = ฐาน (ต่อวันอยู่แล้ว)
  const perDay = salaryType === 'daily' ? base : base / 30;
  const perHour = perDay / 8;

  // เช็ควันอาทิตย์ (getDay()===0) — วันทำงานคือ จันทร์-เสาร์
  const isSunday = (ymd) => {
    const d = new Date(ymd + 'T00:00:00');
    return !isNaN(d) && d.getDay() === 0;
  };
  const inRange = (ymd) => ymd >= from && ymd <= to;

  // กรองข้อมูลในช่วงวันที่ (ตัดวันอาทิตย์ออก — ไม่นับวันทำงาน/ไม่หัก)
  const monthAtt = attendance.filter(a => a.employeeId === emp.id && inRange(toYMD(a.date)) && !isSunday(toYMD(a.date)));
  const monthLeaves = leaves.filter(l => l.employeeId === emp.id && l.status === 'approved' && inRange(toYMD(l.startDate)) && !isSunday(toYMD(l.startDate)));

  // ===== รายได้พื้นฐาน =====
  // นับวันมาทำงานจริง (ทุกประเภทเงินเดือน) — มาทำงาน/สาย/WFH/มาบางส่วน/ไม่สแกนออก
  // ไม่นับวันอาทิตย์ (กรองออกแล้ว) และไม่นับวันลาเต็มวัน
  const attendedDays = monthAtt.filter(a => ['ontime','late','wfh','partial','nocheckout'].includes(a.status)).length;
  let baseSalary, workedDays = 0;
  if (salaryType === 'daily') {
    // รายวัน: จ่ายตามวันที่มาทำงานจริง
    workedDays = attendedDays;
    baseSalary = perDay * workedDays;
  } else {
    // รายเดือน: ถ้ารอบเต็มเดือน = ฐานเต็ม, ถ้ารอบสั้นกว่า = prorate ตามจำนวนวัน
    workedDays = attendedDays;
    baseSalary = rangeDays >= 26 ? base : perDay * rangeDays;
  }

  // ===== หักมาสาย =====
  let lateFine = 0;
  const lateDetails = [];
  monthAtt.forEach(a => {
    if (a.status === 'late') {
      const lm = lateMinutesOf(a.checkIn);
      const fine = calcLateFine(lm);
      if (fine > 0) { lateFine += fine; lateDetails.push({ date: toYMD(a.date), minutes: lm, fine }); }
    }
  });

  // ===== หักขาดงาน (จากบันทึกการเข้างาน status='absent') =====
  // วันที่ขาดงานจริงจากการสแกนนิ้ว (ไม่นับวันอาทิตย์ — กรองไว้แล้วตอนสร้าง monthAtt)
  const absentAttDays = monthAtt.filter(a => a.status === 'absent').length;
  const absentAttFine = perDay * absentAttDays;

  // ===== หักการลา =====
  let leaveDeduct = 0;
  const leaveDetails = [];
  // คำนวณโควต้าที่ใช้ไป (เพื่อเช็คว่าเกินหรือไม่)
  const year = from.slice(0, 4);
  const quota = calcQuota(emp, leaveTypes, leaves, year);
  const quotaMap = {};
  quota.forEach(q => { quotaMap[q.id] = q; });

  // จัดกลุ่มการลาตามประเภท เพื่อเช็คเกินโควต้าแบบสะสม
  monthLeaves.forEach(l => {
    const days = Number(l.days) || 0;
    const type = l.type;
    let deduct = 0, reason = '';

    if (type === 'wfh' || type === 'offsite') {
      // WFH / นอกสถานที่ — ไม่หัก
      reason = 'ไม่หัก (ทำงานนอกสถานที่)';
    } else if (type === 'sick') {
      // ลาป่วย
      if (salaryType === 'daily') {
        deduct = perDay * days; reason = 'รายวัน หักเต็มวัน';
      } else {
        // รายเดือน: มีใบรับรองแพทย์ = ไม่หัก, ไม่มี = หักเต็มวัน
        if (l.medicalCert) { reason = 'มีใบรับรองแพทย์ — ไม่หัก'; }
        else { deduct = perDay * days; reason = 'ไม่มีใบรับรองแพทย์ — หักเต็มวัน'; }
      }
    } else if (type === 'personal' || type === 'vacation') {
      // ลากิจ / ลาพักร้อน — ไม่หักถ้าอยู่ในโควต้า, เกินโควต้าหักเต็มวัน
      const q = quotaMap[type];
      if (q && q.remaining < 0) {
        // เกินโควต้า — หักเฉพาะส่วนที่เกิน (สูงสุดเท่ากับวันลานี้)
        const over = Math.min(days, Math.abs(q.remaining));
        deduct = perDay * over;
        reason = over >= days ? 'เกินโควต้า — หักเต็มวัน' : `เกินโควต้า ${over} วัน`;
      } else {
        reason = 'อยู่ในโควต้า — ไม่หัก';
      }
    } else if (type === 'unpaid') {
      // ลาไม่รับเงินเดือน: รายชั่วโมง = perHour × ชม., รายวัน = perDay × วัน
      if (l.period === 'hours' && l.hours) {
        deduct = perHour * Number(l.hours); reason = `รายชั่วโมง ${l.hours} ชม.`;
      } else {
        deduct = perDay * days; reason = 'หักเต็มวัน';
      }
    } else if (type === 'absent') {
      // ขาดงาน — หักเต็มวัน
      deduct = perDay * days; reason = 'ขาดงาน — หักเต็มวัน';
    }

    if (deduct > 0 || reason) {
      // เพิ่มข้อมูลช่วงลา (ครึ่งวัน/ชั่วโมง) ในป้ายกำกับ
      let periodNote = '';
      if (l.period === 'morning') periodNote = ' (ครึ่งเช้า)';
      else if (l.period === 'afternoon') periodNote = ' (ครึ่งบ่าย)';
      else if (l.period === 'hours' && l.hours) periodNote = ` (${l.hours} ชม.)`;
      leaveDetails.push({
        type, label: (leaveTypes.find(t => t.id===type)?.label || type) + periodNote,
        days, deduct, reason, period: l.period || 'full', hours: l.hours || null,
        date: toYMD(l.startDate), endDate: toYMD(l.endDate),
      });
    }
    leaveDeduct += deduct;
  });

  // เพิ่มขาดงานจากการสแกนนิ้ว (status='absent') เข้าในรายการหัก
  if (absentAttDays > 0) {
    leaveDetails.push({ type: 'absent', label: 'ขาดงาน', days: absentAttDays, deduct: absentAttFine, reason: 'ขาดงาน (จากบันทึกเข้างาน) — หักเต็มวัน' });
    leaveDeduct += absentAttFine;
  }

  // รวมวันลาทั้งหมด (เต็มวัน) เพื่อแสดงในสลิป
  const fullLeaveDates = monthLeaves
    .filter(l => (l.period || 'full') === 'full' && l.type !== 'wfh' && l.type !== 'offsite')
    .map(l => toYMD(l.startDate));

  return {
    salaryType, perDay, perHour, workedDays,
    attendedDays,        // วันมาทำงานจริง (ไม่นับอาทิตย์/ลาเต็มวัน)
    rangeDays,           // วันทำงานทั้งหมดในรอบ (ไม่นับอาทิตย์)
    baseSalary: Math.round(baseSalary * 100) / 100,
    special,
    lateFine: Math.round(lateFine * 100) / 100,
    lateDetails,         // [{date, minutes, fine}]
    leaveDeduct: Math.round(leaveDeduct * 100) / 100,
    leaveDetails,        // [{label, days, deduct, reason, date, ...}]
    absentDays: absentAttDays,
    fullLeaveDates,
  };
};

const PayrollPage = () => {

  const [search, setSearch] = useState('');
  const [openForm, setOpenForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [slip, setSlip] = useState(null);
  const [selected, setSelected] = useState([]);   // id ที่เลือกพิมพ์รวม
  const [showSummary, setShowSummary] = useState(false);  // modal export สรุป

  const myEmp = employees.find(e => e.id === user.empId);
  const hasPayrollAccess = user.role === 'admin' || user.role === 'hr' || !!myEmp?.canPayroll;
  const canEdit = hasPayrollAccess;

  // payroll ของเดือนที่เลือก (กรองด้วยเดือนของรอบ — รองรับทั้ง period เดิม และ periodFrom ใหม่)
  const monthRecords = useMemo(() => {
    return payroll.filter(p => {
      const pMonth = p.periodFrom ? String(p.periodFrom).slice(0, 7) : p.period;
      if (pMonth !== month) return false;
      if (user.role === 'manager') {
        const emp = employees.find(e => e.id === p.employeeId);
        if (!emp || emp.branchId !== user.branchId) return false;
      }
      if (search) {
        const emp = employees.find(e => e.id === p.employeeId);
        const q = search.toLowerCase();
        return emp && (`${emp.firstName} ${emp.lastName}`.toLowerCase().includes(q) || emp.id.toLowerCase().includes(q));
      }
      return true;
    });
  }, [payroll, month, search, employees, user]);

  const stats = useMemo(() => {
    let totalNet = 0, totalEarn = 0, totalDeduct = 0;
    monthRecords.forEach(p => {
      const c = calcPayroll(p);
      totalNet += c.net; totalEarn += c.earnings; totalDeduct += c.deductions;
    });
    return { count: monthRecords.length, totalNet, totalEarn, totalDeduct };
  }, [monthRecords]);

  const savePayroll = (p) => {
    let updated;
    if (editing) {
      updated = payroll.map(x => x.id === p.id ? p : x);
      addToast('success', 'บันทึกข้อมูลเงินเดือนเรียบร้อย');
    } else {
      updated = [...payroll, p];
      addToast('success', 'เพิ่มข้อมูลเงินเดือนเรียบร้อย');
    }
    setPayroll(updated);
    if (api.enabled()) {
      api.post('savePayroll', { data: p }).catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
    setOpenForm(false);
    setEditing(null);
  };

  const deletePayroll = (id) => {
    if (!confirm('ยืนยันการลบข้อมูลเงินเดือนรายการนี้?')) return;
    setPayroll(payroll.filter(p => p.id !== id));
    addToast('success', 'ลบเรียบร้อย');
    if (api.enabled()) api.post('deletePayroll', { id }).catch(() => {});
  };

  // เลือก/ยกเลิกเลือกพิมพ์
  const toggleSelect = (id) => setSelected(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  const allSelected = monthRecords.length > 0 && selected.length === monthRecords.length;
  const toggleSelectAll = () => setSelected(allSelected ? [] : monthRecords.map(p => p.id));
  const printSelected = () => {
    const recs = monthRecords.filter(p => selected.includes(p.id));
    if (recs.length === 0) { addToast('error', 'กรุณาเลือกพนักงานที่ต้องการพิมพ์'); return; }
    printManySlips(recs, employees, branches, settings);
  };

  const [my, mm] = month.split('-');
  const monthLabel = `${THAI_MONTHS[parseInt(mm,10)-1]} ${parseInt(my,10)+543}`;

  return (
    <div className="p-8 space-y-6 animate-fade-up">
      <Topbar
        title="เงินเดือน"
        subtitle={`รอบ ${monthLabel} · ${stats.count} รายการ`}
        action={canEdit && (
          <div className="flex gap-2">
            <Button variant="outline" icon="download" onClick={() => setShowSummary(true)}>Export สรุป</Button>
            <Button icon="plus" onClick={() => { setEditing(null); setOpenForm(true); }}>เพิ่มเงินเดือน</Button>
          </div>
        )}

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        {[
          { label: 'จำนวนพนักงาน', value: stats.count, suffix: 'คน', color: 'flow', icon: 'users' },
          { label: 'รวมรายได้', value: fmtMoney(stats.totalEarn), suffix: 'บาท', color: 'green', icon: 'tag' },
          { label: 'รวมรายการหัก', value: fmtMoney(stats.totalDeduct), suffix: 'บาท', color: 'red', icon: 'x' },
          { label: 'รวมจ่ายสุทธิ', value: fmtMoney(stats.totalNet), suffix: 'บาท', color: 'gold', icon: 'check' },
        ].map(s => (
          <Card key={s.label} className="p-5 lift">
            <div className="flex items-center gap-3">
              <div className={cls('w-11 h-11 rounded-xl flex items-center justify-center shrink-0',
                s.color === 'flow' && 'bg-flow-100 text-flow-700',
                s.color === 'green' && 'bg-emerald-100 text-emerald-700',
                s.color === 'red' && 'bg-red-100 text-red-600',
                s.color === 'gold' && 'bg-gold-100 text-gold-700',
              )}>
                <Icon name={s.icon} className="w-5 h-5" />
              </div>
              <div className="min-w-0">
                <div className="text-xs text-ink-500">{s.label}</div>
                <div className="font-display text-xl font-bold text-ink-900 truncate">{s.value}</div>
                <div className="text-[10px] text-ink-400">{s.suffix}</div>
              </div>
            </div>
          </Card>
        ))}
      </div>

      {/* Filter */}
      <Card className="p-4">
        <div className="grid md:grid-cols-3 gap-3">
          <div>
            <label className="block text-xs text-ink-500 mb-1">รอบเดือน</label>
            <Input type="month" value={month} onChange={(e) => setMonth(e.target.value)} />
          </div>
          <div className="md:col-span-2">
            <label className="block text-xs text-ink-500 mb-1">ค้นหา</label>
            <Input icon="search" placeholder="ชื่อ หรือ รหัสพนักงาน..." value={search} onChange={(e) => setSearch(e.target.value)} />
          </div>
        </div>
      </Card>

      {/* Table */}
      <Card className="overflow-hidden">
        {monthRecords.length === 0 ? (
          <Empty icon="tag" title="ยังไม่มีข้อมูลเงินเดือน" desc={`รอบ ${monthLabel} — คลิก "เพิ่มเงินเดือน" เพื่อเริ่มต้น`} />
        ) : (
          <div className="overflow-x-auto">
            {/* แถบเลือกพิมพ์รวม */}
            <div className="flex items-center justify-between px-5 py-2.5 bg-flow-50/60 border-b border-flow-100">
              <div className="text-sm text-ink-600">
                {selected.length > 0 ? <span className="font-medium text-flow-700">เลือก {selected.length} คน</span> : 'เลือกพนักงานเพื่อพิมพ์สลิปหลายคนพร้อมกัน'}
              </div>
              <Button size="sm" icon="download" onClick={printSelected} disabled={selected.length === 0}>
                พิมพ์สลิป {selected.length > 0 ? `(${selected.length})` : 'ที่เลือก'}
              </Button>
            </div>
            <table className="w-full text-sm">
              <thead className="bg-ink-50 text-ink-600 text-left">
                <tr>
                  <th className="px-5 py-3 w-10">
                    <input type="checkbox" checked={allSelected} onChange={toggleSelectAll}
                      className="rounded border-ink-300 text-flow-600 focus:ring-flow-500 cursor-pointer" />
                  </th>
                  <th className="px-5 py-3 font-medium">พนักงาน</th>
                  <th className="px-5 py-3 font-medium text-right">รายได้รวม</th>
                  <th className="px-5 py-3 font-medium text-right">รายการหัก</th>
                  <th className="px-5 py-3 font-medium text-right">เงินรับสุทธิ</th>
                  <th className="px-5 py-3 font-medium text-right">จัดการ</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-ink-100">
                {monthRecords.map(p => {
                  const emp = employees.find(e => e.id === p.employeeId);
                  if (!emp) return null;
                  const c = calcPayroll(p);
                  const isChecked = selected.includes(p.id);
                  return (
                    <tr key={p.id} className={cls('hover:bg-flow-50/40 transition-colors', isChecked && 'bg-flow-50/50')}>
                      <td className="px-5 py-3" onClick={(e) => e.stopPropagation()}>
                        <input type="checkbox" checked={isChecked} onChange={() => toggleSelect(p.id)}
                          className="rounded border-ink-300 text-flow-600 focus:ring-flow-500 cursor-pointer" />
                      </td>
                      <td className="px-5 py-3 cursor-pointer" onClick={() => setSlip(p)}>
                        <div className="flex items-center gap-3">
                          <Avatar name={`${emp.firstName} ${emp.lastName}`} photo={emp.photo} size="sm" />
                          <div>
                            <div className="font-medium text-ink-900">{emp.firstName} {emp.lastName}</div>
                            <div className="text-xs text-ink-500">{emp.id} · {emp.position}</div>
                          </div>
                        </div>
                      </td>
                      <td className="px-5 py-3 text-right text-emerald-700 cursor-pointer" onClick={() => setSlip(p)}>{fmtMoney(c.earnings)}</td>
                      <td className="px-5 py-3 text-right text-red-600 cursor-pointer" onClick={() => setSlip(p)}>{fmtMoney(c.deductions)}</td>
                      <td className="px-5 py-3 text-right font-display font-bold text-ink-900 cursor-pointer" onClick={() => setSlip(p)}>{fmtMoney(c.net)}</td>
                      <td className="px-5 py-3 text-right">
                        <div className="inline-flex gap-1">
                          <button onClick={() => setSlip(p)} className="p-1.5 rounded-lg text-ink-500 hover:bg-flow-50 hover:text-flow-700" title="ดูสลิป">
                            <Icon name="eye" className="w-4 h-4" />
                          </button>
                          {canEdit && (
                            <>
                              <button onClick={() => { setEditing(p); setOpenForm(true); }} className="p-1.5 rounded-lg text-ink-500 hover:bg-flow-50 hover:text-flow-700" title="แก้ไข">
                                <Icon name="edit" className="w-4 h-4" />
                              </button>
                              <button onClick={() => deletePayroll(p.id)} className="p-1.5 rounded-lg text-ink-500 hover:bg-red-50 hover:text-red-600" title="ลบ">
                                <Icon name="trash" className="w-4 h-4" />
                              </button>
                            </>
                          )}

                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      <PayrollFormModal
        open={openForm}

        attendance={attendance}

        leaveTypes={leaveTypes}

      />

      <PayslipModal
        record={slip}
        onClose={() => setSlip(null)}
        employees={employees}
        branches={branches}
        settings={settings}
      />

      <ExportPayrollSummaryModal
        open={showSummary}
        onClose={() => setShowSummary(false)}
        payroll={payroll}
        employees={employees}
        branches={branches}
        defaultMonth={month}
        lockedBranch={user.role === 'manager' ? user.branchId : null}
      />
    </div>
  );
};

/* ===== EXPORT PAYROLL SUMMARY MODAL — ส่งออกสรุปเงินเดือนรายคน ===== */
const ExportPayrollSummaryModal = ({ open, onClose, payroll, employees, branches, defaultMonth, lockedBranch }) => {
  const [month, setMonth] = useState(defaultMonth);
  const [branch, setBranch] = useState(lockedBranch || 'all');
  const [selected, setSelected] = useState([]);
  const [search, setSearch] = useState('');

  useEffect(() => { setMonth(defaultMonth); }, [defaultMonth, open]);
  useEffect(() => { if (lockedBranch) setBranch(lockedBranch); }, [lockedBranch]);

  if (!open) return null;

  // record เงินเดือนของเดือนที่เลือก (ตาม branch)
  const monthRecs = payroll.filter(p => {
    const pMonth = p.periodFrom ? String(p.periodFrom).slice(0, 7) : p.period;
    if (pMonth !== month) return false;
    const emp = employees.find(e => e.id === p.employeeId);
    if (!emp) return false;
    if (branch !== 'all' && emp.branchId !== branch) return false;
    return true;
  });

  const visibleRecs = monthRecs.filter(p => {
    if (!search) return true;
    const emp = employees.find(e => e.id === p.employeeId);
    const q = search.toLowerCase();
    return emp && (`${emp.firstName} ${emp.lastName}`.toLowerCase().includes(q) || emp.id.toLowerCase().includes(q));
  });

  const toggle = (id) => setSelected(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  const allSel = visibleRecs.length > 0 && visibleRecs.every(p => selected.includes(p.id));
  const toggleAll = () => setSelected(allSel ? selected.filter(id => !visibleRecs.some(p => p.id === id)) : [...new Set([...selected, ...visibleRecs.map(p => p.id)])]);

  const doExport = () => {
    const targetRecs = selected.length > 0 ? monthRecs.filter(p => selected.includes(p.id)) : monthRecs;
    if (targetRecs.length === 0) { alert('ไม่มีข้อมูลเงินเดือนให้ส่งออก'); return; }

    const XLSXlib = window.XLSX;
    const header = ['รหัส', 'ชื่อ-นามสกุล', 'สาขา', 'รอบ', 'รายได้รวม', 'รายการหัก', 'เงินรับสุทธิ'];
    let totalEarn = 0, totalDeduct = 0, totalNet = 0;
    const rows = targetRecs.map(p => {
      const emp = employees.find(e => e.id === p.employeeId);
      const br = branches.find(b => b.id === emp?.branchId);
      const c = calcPayroll(p);
      totalEarn += c.earnings; totalDeduct += c.deductions; totalNet += c.net;
      const periodLabel = (p.periodFrom && p.periodTo) ? `${p.periodFrom} ถึง ${p.periodTo}` : p.period;
      return [emp?.id || p.employeeId, emp ? `${emp.firstName} ${emp.lastName}` : '-', br?.name || '-', periodLabel,
        c.earnings, c.deductions, c.net];
    });
    // แถวรวม
    rows.push(['', '', '', 'รวมทั้งหมด', totalEarn, totalDeduct, totalNet]);

    const ws = XLSXlib.utils.aoa_to_sheet([header, ...rows]);
    ws['!cols'] = [{wch:10},{wch:24},{wch:16},{wch:22},{wch:14},{wch:14},{wch:14}];
    const wb = XLSXlib.utils.book_new();
    XLSXlib.utils.book_append_sheet(wb, ws, 'สรุปเงินเดือน');
    const brName = branch === 'all' ? 'ทุกสาขา' : (branches.find(b => b.id === branch)?.name || branch);
    XLSXlib.writeFile(wb, `สรุปเงินเดือน_${brName}_${month}.xlsx`);
    onClose();
  };

  const summary = visibleRecs.reduce((acc, p) => {
    const c = calcPayroll(p);
    acc.net += c.net; return acc;
  }, { net: 0 });

  return (
    <Modal open={open} onClose={onClose} title="ส่งออกสรุปเงินเดือน" size="lg">
      <div className="space-y-4">
        <div className="grid md:grid-cols-2 gap-3">
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">เดือน</label>
            <Input type="month" value={month} onChange={(e) => { setMonth(e.target.value); setSelected([]); }} />
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">สาขา</label>
            <Select value={branch} onChange={(e) => { setBranch(e.target.value); setSelected([]); }} disabled={!!lockedBranch}>
              {!lockedBranch && <option value="all">ทุกสาขา</option>}
              {branches.filter(b => !lockedBranch || b.id === lockedBranch).map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
            </Select>
          </div>
        </div>

        {monthRecs.length === 0 ? (
          <div className="bg-ink-50 rounded-xl p-6 text-center text-sm text-ink-400">ไม่มีข้อมูลเงินเดือนในเดือน/สาขานี้</div>
        ) : (
          <>
            <div className="border border-ink-200 rounded-xl overflow-hidden">
              <div className="flex items-center justify-between px-3 py-2 bg-ink-50 border-b border-ink-100">
                <label className="flex items-center gap-2 text-sm font-medium cursor-pointer">
                  <input type="checkbox" checked={allSel} onChange={toggleAll} className="rounded border-ink-300 text-flow-600" />
                  เลือกทั้งหมด ({visibleRecs.length})
                </label>
                <span className="text-xs text-ink-500">{selected.length > 0 ? `เลือก ${selected.length} คน` : 'ไม่เลือก = ทุกคน'}</span>
              </div>
              <div className="p-2">
                <Input icon="search" placeholder="ค้นหาพนักงาน..." value={search} onChange={(e) => setSearch(e.target.value)} className="mb-2 !py-1.5 text-sm" />
                <div className="max-h-52 overflow-y-auto space-y-0.5">
                  {visibleRecs.map(p => {
                    const emp = employees.find(e => e.id === p.employeeId);
                    if (!emp) return null;
                    const c = calcPayroll(p);
                    return (
                      <label key={p.id} className="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-ink-50 cursor-pointer text-sm">
                        <input type="checkbox" checked={selected.includes(p.id)} onChange={() => toggle(p.id)} className="rounded border-ink-300 text-flow-600" />
                        <span className="text-ink-800">{emp.firstName} {emp.lastName}</span>
                        <span className="ml-auto font-display font-semibold text-ink-900">{fmtMoney(c.net)}</span>
                      </label>
                    );
                  })}
                </div>
              </div>
            </div>

            <div className="bg-brand-50 border border-brand-100 rounded-xl p-3 flex justify-between items-center">
              <span className="text-sm text-ink-700">ยอดสุทธิรวม ({visibleRecs.length} คน)</span>
              <span className="font-display text-xl font-bold text-brand-700">{fmtMoney(summary.net)} ฿</span>
            </div>
          </>
        )}

        <div className="flex justify-end gap-2 pt-2 border-t border-ink-100">
          <Button variant="secondary" onClick={onClose}>ยกเลิก</Button>
          <Button icon="download" onClick={doExport} disabled={monthRecs.length === 0}>ส่งออก Excel</Button>
        </div>
      </div>
    </Modal>
  );
};
const PayrollFormModal = ({ open, onClose, editing, onSave, employees, defaultPeriod, attendance, leaves, leaveTypes, settings }) => {
  const [form, setForm] = useState({});
  const [autoInfo, setAutoInfo] = useState(null);  // ผลการคำนวณอัตโนมัติ

  useEffect(() => {
    if (editing) {
      // เติม periodFrom/To ถ้า record เก่ามีแค่ period
      const ed = { ...editing };
      if (!ed.periodFrom && ed.period) {
        ed.periodFrom = ed.period + '-01';
        const [y, m] = ed.period.split('-').map(Number);
        ed.periodTo = `${ed.period}-${String(new Date(y, m, 0).getDate()).padStart(2, '0')}`;
      }
      setForm(ed);
    } else {
      // ค่าเริ่มต้น: เดือนปัจจุบันเต็มเดือน
      const dp = defaultPeriod || new Date().toISOString().slice(0, 7);
      const [y, m] = dp.split('-').map(Number);
      setForm({
        id: '', employeeId: employees[0]?.id || '',
        period: dp,
        periodFrom: dp + '-01',
        periodTo: `${dp}-${String(new Date(y, m, 0).getDate()).padStart(2, '0')}`,
        baseSalary: '', overtime: '', transport: '', bonus: '', otherEarn: '',
        sso: '', tax: '', absenceDeduct: '', gyos: '', otherDeduct: '',
        payDate: new Date().toISOString().split('T')[0], note: '',
      });
    }
    setAutoInfo(null);
  }, [editing, open, defaultPeriod]);

  if (!open) return null;

  const c = calcPayroll(form);
  const selectedEmp = employees.find(e => e.id === form.employeeId);

  // preset ช่วงวันที่
  const setRangePreset = (preset) => {
    const today = new Date();
    let from, to;
    if (preset === 'thisMonth') {
      const y = today.getFullYear(), m = today.getMonth();
      from = new Date(y, m, 1); to = new Date(y, m + 1, 0);
    } else if (preset === 'week') {
      to = new Date(today); from = new Date(today); from.setDate(from.getDate() - 6);
    } else if (preset === 'half1') {
      from = new Date(today.getFullYear(), today.getMonth(), 1);
      to = new Date(today.getFullYear(), today.getMonth(), 15);
    } else if (preset === 'half2') {
      from = new Date(today.getFullYear(), today.getMonth(), 16);
      to = new Date(today.getFullYear(), today.getMonth() + 1, 0);
    }
    const fStr = from.toISOString().split('T')[0], tStr = to.toISOString().split('T')[0];
    setForm(f => ({ ...f, periodFrom: fStr, periodTo: tStr, period: fStr.slice(0, 7) }));
  };

  // คำนวณอัตโนมัติจากข้อมูลพนักงาน + การเข้างาน + การลา
  const runAutoCalc = () => {
    if (!selectedEmp) return alert('กรุณาเลือกพนักงานก่อน');
    if (!form.periodFrom || !form.periodTo) return alert('กรุณาเลือกช่วงวันที่');
    if (form.periodFrom > form.periodTo) return alert('วันเริ่มต้องไม่เกินวันสิ้นสุด');
    const r = computeAutoPayroll(selectedEmp, { from: form.periodFrom, to: form.periodTo }, attendance || [], leaves || [], leaveTypes || [], settings || {});
    setAutoInfo(r);
    // เติมค่าลงฟอร์มอัตโนมัติ
    setForm(f => ({
      ...f,
      baseSalary: r.baseSalary,
      otherEarn: r.special || '',
      absenceDeduct: Math.round((r.lateFine + r.leaveDeduct) * 100) / 100,
      // เก็บรายละเอียดไว้แสดงในสลิป
      breakdown: {
        salaryType: r.salaryType, perDay: r.perDay, workedDays: r.workedDays,
        attendedDays: r.attendedDays, rangeDays: r.rangeDays,
        lateFine: r.lateFine, lateDetails: r.lateDetails,
        leaveDeduct: r.leaveDeduct, leaveDetails: r.leaveDetails,
        fullLeaveDates: r.fullLeaveDates, absentDays: r.absentDays,
      },
    }));
  };

  const submit = (e) => {
    e.preventDefault();
    if (!form.employeeId) return alert('กรุณาเลือกพนักงาน');
    if (!form.periodFrom || !form.periodTo) return alert('กรุณาเลือกช่วงวันที่ของรอบ');
    if (form.periodFrom > form.periodTo) return alert('วันเริ่มต้องไม่เกินวันสิ้นสุด');
    onSave({ ...form, id: form.id || `PAY${Date.now()}`, period: form.periodFrom.slice(0, 7) });
  };

  const earnFields = [
    ['baseSalary', 'เงินเดือนพื้นฐาน'],
    ['overtime', 'ค่าล่วงเวลา (OT)'],
    ['transport', 'ค่าพาหนะ'],
    ['bonus', 'ค่าอาหารกลางวัน'],
    ['otherEarn', 'รายได้อื่นๆ'],
  ];
  const deductFields = [
    ['sso', 'ประกันสังคม'],
    ['tax', 'ภาษี ณ ที่จ่าย'],
    ['absenceDeduct', 'หักขาดงาน/มาสาย/ลา'],
    ['gyos', 'หัก กยศ.'],
    ['otherDeduct', 'รายการหักอื่นๆ'],
  ];

  return (
    <Modal open={open} onClose={onClose} title={editing ? 'แก้ไขเงินเดือน' : 'เพิ่มข้อมูลเงินเดือน'} size="lg">
      <form onSubmit={submit} className="space-y-4">
        <div className="space-y-3">
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">พนักงาน</label>
            <Select value={form.employeeId} onChange={(e) => setForm({ ...form, employeeId: e.target.value })} disabled={!!editing} required>
              {employees.map(e => <option key={e.id} value={e.id}>{e.firstName} {e.lastName} ({e.id})</option>)}
            </Select>
          </div>

          {/* รอบจ่ายเงิน - ช่วงวันที่ */}
          <div className="bg-ink-50 rounded-xl p-3">
            <label className="block text-sm font-medium text-ink-700 mb-2">รอบจ่ายเงิน (เลือกช่วงวันที่)</label>
            <div className="flex flex-wrap gap-1.5 mb-2">
              {[
                { id: 'thisMonth', label: 'ทั้งเดือน' },
                { id: 'half1', label: 'วันที่ 1-15' },
                { id: 'half2', label: 'วันที่ 16-สิ้นเดือน' },
                { id: 'week', label: '7 วันล่าสุด' },
              ].map(p => (
                <button key={p.id} type="button" onClick={() => setRangePreset(p.id)}
                  className="text-xs px-2.5 py-1 rounded-lg border border-ink-200 hover:border-flow-400 hover:bg-flow-50 transition-colors">{p.label}</button>
              ))}
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="block text-xs text-ink-500 mb-1">ตั้งแต่วันที่</label>
                <Input type="date" value={form.periodFrom || ''} max={form.periodTo} onChange={(e) => setForm({ ...form, periodFrom: e.target.value, period: e.target.value.slice(0,7) })} required />
              </div>
              <div>
                <label className="block text-xs text-ink-500 mb-1">ถึงวันที่</label>
                <Input type="date" value={form.periodTo || ''} min={form.periodFrom} onChange={(e) => setForm({ ...form, periodTo: e.target.value })} required />
              </div>
            </div>
          </div>

          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">วันที่จ่ายเงิน</label>
            <Input type="date" value={form.payDate || ''} onChange={(e) => setForm({ ...form, payDate: e.target.value })} />
          </div>
        </div>

        {/* คำนวณอัตโนมัติ */}
        <div className="bg-flow-50 border border-flow-200 rounded-xl p-4">
          <div className="flex items-center justify-between gap-3">
            <div className="text-sm text-ink-700">
              <div className="font-medium text-flow-800">คำนวณอัตโนมัติจากการเข้างาน + การลา</div>
              <div className="text-xs text-ink-600 mt-0.5">
                {selectedEmp ? (
                  <>ประเภท: <strong>{selectedEmp.salaryType === 'daily' ? 'รายวัน' : 'รายเดือน'}</strong>
                  {' '}· ฐาน {fmtMoney(selectedEmp.baseSalary)} บาท</>
                ) : 'เลือกพนักงานก่อน'}
              </div>
            </div>
            <Button type="button" variant="outline" size="sm" icon="refresh" onClick={runAutoCalc}>คำนวณ</Button>
          </div>

          {autoInfo && (
            <div className="mt-3 pt-3 border-t border-flow-200 space-y-1.5 text-xs">
              <div className="flex justify-between"><span className="text-ink-600">เงินเดือน/วัน</span><span className="font-medium">{fmtMoney(autoInfo.perDay)} บาท</span></div>
              {autoInfo.salaryType === 'daily' && (
                <div className="flex justify-between"><span className="text-ink-600">วันทำงาน</span><span className="font-medium">{autoInfo.workedDays} วัน</span></div>
              )}
              <div className="flex justify-between"><span className="text-ink-600">ฐานเงินเดือน</span><span className="font-medium text-emerald-700">{fmtMoney(autoInfo.baseSalary)} บาท</span></div>
              {autoInfo.special > 0 && <div className="flex justify-between"><span className="text-ink-600">เงินพิเศษ</span><span className="font-medium text-emerald-700">{fmtMoney(autoInfo.special)} บาท</span></div>}
              {autoInfo.lateFine > 0 && (
                <div className="flex justify-between"><span className="text-ink-600">หักมาสาย ({autoInfo.lateDetails.length} ครั้ง)</span><span className="font-medium text-red-600">-{fmtMoney(autoInfo.lateFine)} บาท</span></div>
              )}
              {autoInfo.leaveDeduct > 0 && (
                <div className="flex justify-between"><span className="text-ink-600">หักการลา</span><span className="font-medium text-red-600">-{fmtMoney(autoInfo.leaveDeduct)} บาท</span></div>
              )}
              {autoInfo.leaveDetails.length > 0 && (
                <div className="bg-white/60 rounded-lg p-2 mt-1 space-y-0.5">
                  {autoInfo.leaveDetails.map((d, i) => (
                    <div key={i} className="flex justify-between text-[11px]">
                      <span className="text-ink-500">{d.label} ({d.days} วัน) — {d.reason}</span>
                      <span className={d.deduct > 0 ? 'text-red-500' : 'text-emerald-600'}>{d.deduct > 0 ? `-${fmtMoney(d.deduct)}` : 'ไม่หัก'}</span>
                    </div>
                  ))}

              )}
              <div className="text-[11px] text-ink-500 pt-1">* ค่าถูกเติมลงในช่องด้านล่างแล้ว (หักมาสาย+หักลา รวมอยู่ใน "หักขาดงาน") ปรับแก้ได้</div>

        </div>

        <div className="grid md:grid-cols-2 gap-4">
          {/* Earnings */}
          <div className="bg-emerald-50/50 border border-emerald-100 rounded-xl p-4">
            <h4 className="font-display font-semibold text-emerald-700 mb-3 flex items-center gap-2">
              <Icon name="tag" className="w-4 h-4" /> รายได้

            <div className="space-y-2.5">
              {earnFields.map(([key, label]) => (

          {/* Deductions */}

                <div key={key} className="flex items-center gap-2">
                  <label className="text-xs text-ink-600 flex-1">{label}</label>
                  <Input type="number" step="0.01" className="w-32 text-right" value={form[key] || ''} onChange={(e) => setForm({ ...form, [key]: e.target.value })} />

          <span className="font-display font-semibold">เงินรับสุทธิ (NET PAY)</span>
          <span className="font-display text-2xl font-bold">{fmtMoney(c.net)} บาท</span>

        <div className="flex justify-end gap-2 pt-4 border-t border-ink-100">
          <Button type="button" variant="secondary" onClick={onClose}>ยกเลิก</Button>
          <Button type="submit" icon={editing ? 'check' : 'plus'}>{editing ? 'บันทึก' : 'เพิ่มเงินเดือน'}</Button>
        </div>
      </form>
    </Modal>
  );
};

/* ===== PAYSLIP MODAL — สลิปเงินเดือน (ปรินได้) ===== */
// สร้าง HTML เนื้อหาสลิป 1 ใบ (ใช้ทั้งพิมพ์เดี่ยวและพิมพ์หลายคน)
const buildSlipInner = (record, employees, branches, settings) => {
  const emp = employees.find(e => e.id === record.employeeId);
  if (!emp) return '';
  const branch = branches.find(b => b.id === emp.branchId);
  const c = calcPayroll(record);
  const [py, pm] = (record.period || '').split('-');
  const monthLabel = pm ? `${THAI_MONTHS[parseInt(pm,10)-1]} ${parseInt(py,10)+543}` : record.period;
  const periodLabel = (record.periodFrom && record.periodTo)
    ? `${fmtDate(record.periodFrom)} - ${fmtDate(record.periodTo)}` : monthLabel;
  const payDateLabel = record.payDate ? fmtDate(record.payDate) : '-';

  const earnRows = [
    ['เงินเดือนพื้นฐาน', 'BASIC SALARY', record.baseSalary],
    ['ค่าล่วงเวลา', 'OVERTIME', record.overtime],
    ['ค่าพาหนะ', 'TRANSPORT', record.transport],
    ['ค่าอาหารกลางวัน', 'LUNCH ALLOWANCE', record.bonus],
    ['รายได้อื่นๆ', 'OTHER', record.otherEarn],
  ].filter(r => Number(r[2]) > 0);

  const bd = record.breakdown;
  let deductRows = [];
  deductRows.push(['ประกันสังคม', 'SSO', record.sso]);
  deductRows.push(['ภาษี ณ ที่จ่าย', 'WITHHOLDING TAX', record.tax]);
  if (bd && (bd.lateFine > 0 || (bd.leaveDetails && bd.leaveDetails.some(d => d.deduct > 0)))) {
    if (bd.lateFine > 0) deductRows.push(['หักมาสาย', `LATE (${bd.lateDetails.length} ครั้ง)`, bd.lateFine]);
    (bd.leaveDetails || []).forEach(d => { if (d.deduct > 0) deductRows.push([`หัก${d.label}`, `${d.days} วัน`, d.deduct]); });
  } else if (Number(record.absenceDeduct) > 0) {
    deductRows.push(['หักขาดงาน/มาสาย/ลา', 'ABSENCE/LATE/LEAVE', record.absenceDeduct]);
  }
  deductRows.push(['หัก กยศ.', 'STUDENT LOAN', record.gyos]);
  deductRows.push(['รายการหักอื่นๆ', 'OTHER', record.otherDeduct]);
  deductRows = deductRows.filter(r => Number(r[2]) > 0);

  const row = (th, en, val, isDeduct) =>
    `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #E2E8F0">
      <div><div style="font-size:12px;color:#1E293B">${th}</div><div style="font-size:8px;color:#94A3B8">${en}</div></div>
      <div style="font-size:12px;font-weight:600;${isDeduct?'color:#DC2626':''}">${isDeduct?'-':''}${fmtMoney(val)}</div>
    </div>`;

  // แถบสรุปการมาทำงาน (วันมาทำงาน + รายการวันลา/มาสาย พร้อมวันที่)
  const dShort = (ymd) => { const d = new Date(ymd + 'T00:00:00'); return isNaN(d) ? ymd : `${d.getDate()}/${d.getMonth()+1}`; };
  let workSummary = '';
  if (bd) {
    const lateList = (bd.lateDetails || []).map(x => dShort(x.date)).join(', ');
    const leaveList = (bd.leaveDetails || []).filter(d => d.type !== 'absent').map(d => `${dShort(d.date)}${d.label.includes('(')?d.label.slice(d.label.indexOf('(')):''}`).join(', ');
    const absentList = (bd.leaveDetails || []).filter(d => d.type === 'absent' && d.date).map(d => dShort(d.date)).join(', ');
    workSummary = `
      <div style="padding:5px 14px;border-top:1px solid #E2E8F0;background:#F8FAFC">
        <div style="display:flex;gap:16px;font-size:10px;color:#1E293B;flex-wrap:wrap">
          <span><strong style="color:#1E3A8A">มาทำงาน:</strong> ${bd.attendedDays ?? '-'} วัน</span>
          ${bd.rangeDays != null ? `<span><strong>วันทำงานในรอบ:</strong> ${bd.rangeDays} วัน (ไม่นับอาทิตย์)</span>` : ''}
        </div>
        ${lateList ? `<div style="font-size:9px;color:#B45309;margin-top:2px">มาสาย (${(bd.lateDetails||[]).length} วัน): ${lateList}</div>` : ''}
        ${leaveList ? `<div style="font-size:9px;color:#1D4ED8;margin-top:2px">ลางาน: ${leaveList}</div>` : ''}
        ${absentList ? `<div style="font-size:9px;color:#DC2626;margin-top:2px">ขาดงาน: ${absentList}</div>` : ''}
      </div>`;
  }

  return `
    <div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:2px solid #1E3A8A">
      <img src="${LOGO_EAGLE}" style="width:52px;height:auto" />
      <div style="flex:1">
        <div class="font-display" style="font-size:17px;font-weight:700;color:#1E3A8A;line-height:1.2">${settings.companyName||''}</div>
        <div class="font-display" style="font-size:11px;font-weight:600;color:#3B82F6">${settings.companyNameEn||'FREEDOM FLOW TRADING CO., LTD.'}</div>
        <div style="font-size:9px;color:#64748B;margin-top:2px">${settings.address||''}</div>
      </div>
      <div style="text-align:center;padding-left:12px;border-left:2px solid #E2E8F0">
        <div class="font-display" style="font-size:18px;font-weight:700;color:#1E3A8A;white-space:nowrap">สลิปเงินเดือน</div>
        <div style="font-size:10px;color:#64748B;letter-spacing:1px">PAYSLIP</div>
      </div>

/* =============================================================
   KPI — ประเมินผลงานพนักงาน
   ============================================================= */
// แปลงคะแนน % เป็นเกรด
const kpiGrade = (pct) => {
  if (pct >= 90) return { grade: 'A', label: 'ดีเยี่ยม', color: '#10B981' };
  if (pct >= 80) return { grade: 'B', label: 'ดี', color: '#06B6D4' };
  if (pct >= 70) return { grade: 'C', label: 'พอใช้', color: '#F59E0B' };
  if (pct >= 60) return { grade: 'D', label: 'ต้องปรับปรุง', color: '#F97316' };
  return { grade: 'F', label: 'ไม่ผ่าน', color: '#EF4444' };
};

// คำนวณคะแนนรวมของ record (ถ่วงน้ำหนัก) — ใช้หัวข้อที่เก็บอยู่ใน record เอง
// รองรับ record เก่าที่ยังไม่มี criteria (fallback ไปใช้ criteria ที่ส่งเข้ามา)
// flatten หัวข้อ KPI → รายการตัวชี้วัดที่ให้คะแนนได้ (รองรับทั้งแบบ 2 ระดับ และแบบเก่า)
const flattenKpi = (criteria) => {
  const items = [];
  (criteria || []).forEach(cat => {
    if (cat.subItems && cat.subItems.length > 0) {
      cat.subItems.forEach(s => items.push({ ...s, catId: cat.id, catName: cat.name, catWeight: cat.weight }));
    } else {
      // แบบเก่า: หัวข้อเดียวไม่มีย่อย
      items.push({ id: cat.id, weight: cat.weight, indicator: cat.name, catId: cat.id, catName: cat.name, catWeight: cat.weight });
    }
  });
  return items;
};

// แสดงเป้าหมายเป็นข้อความ
const fmtKpiTarget = (s) => {
  if (!s) return '';
  if (s.targetType === 'count') {
    const unit = s.targetUnit === 'week' ? 'สัปดาห์' : 'เดือน';
    return `${s.targetValue} ครั้ง/${unit}`;
  }
  if (s.targetType === 'percent') return `≥ ${s.targetValue}%`;
  return '';
};

const calcKpiScore = (record, fallbackCriteria) => {
  const criteria = (record.criteria && record.criteria.length > 0) ? record.criteria : (fallbackCriteria || []);
  const items = flattenKpi(criteria);
  let totalWeight = 0, weightedScore = 0;
  items.forEach(it => {
    const score = Number(record.scores?.[it.id]) || 0;  // 0-100
    const weight = Number(it.weight) || 0;
    totalWeight += weight;
    weightedScore += (score * weight) / 100;
  });
  const pct = totalWeight > 0 ? Math.round((weightedScore / totalWeight) * 100) : 0;
  return { pct, totalWeight, criteria, items };
};

const KpiPage = () => {
  const { kpiCriteria, setKpiCriteria, kpiRecords, setKpiRecords, employees, branches, user, addToast } = useApp();
  const [tab, setTab] = useState('eval');   // eval / criteria
  const [period, setPeriod] = useState(new Date().toISOString().slice(0, 7));

  const [editingEval, setEditingEval] = useState(null);
  const [openCrit, setOpenCrit] = useState(false);
  const [editingCrit, setEditingCrit] = useState(null);

  const canEdit = user.role === 'admin' || user.role === 'hr' || user.role === 'manager';

  const myEmp = employees.find(e => e.id === user.empId);
  const myScope = myEmp?.approvalScope || (myEmp?.canApprove ? 'manager' : 'none');
  const isRegional = myScope === 'regional';
  const lockedBranch = (user.role === 'manager' || isRegional) ? (user.branchId || myEmp?.branchId) : null;
  const canEvaluate = canEdit || isRegional;

    return kpiRecords.filter(r => {
      if (r.period !== period) return false;

      if (lockedBranch && emp.branchId !== lockedBranch) return false;
      if (search) {
        const q = search.toLowerCase();
        return `${emp.firstName} ${emp.lastName}`.toLowerCase().includes(q) || emp.id.toLowerCase().includes(q);
      }
      return true;
    });
  }, [kpiRecords, period, search, employees, user, lockedBranch]);

  const totalWeight = kpiCriteria.reduce((s, c) => s + (Number(c.weight) || 0), 0);

  // ===== จัดการหัวข้อ KPI =====
  const saveCriteria = (c) => {
    let updated;
    if (editingCrit) {
      updated = kpiCriteria.map(x => x.id === c.id ? c : x);
      addToast('success', 'บันทึกหัวข้อเรียบร้อย');
    } else {
      updated = [...kpiCriteria, c];
      addToast('success', 'เพิ่มหัวข้อเรียบร้อย');
    }
    setKpiCriteria(updated);
    if (api.enabled()) api.post('saveKpiCriteria', { data: updated }).catch(e => addToast('error', 'บันทึกไม่สำเร็จ'));
    setOpenCrit(false); setEditingCrit(null);
  };
  const deleteCriteria = (id) => {
    if (!confirm('ลบหัวข้อนี้? (ผลประเมินเดิมจะยังเก็บคะแนนไว้)')) return;
    const updated = kpiCriteria.filter(c => c.id !== id);
    setKpiCriteria(updated);
    if (api.enabled()) api.post('saveKpiCriteria', { data: updated }).catch(() => {});
  };

  // ===== จัดการผลประเมิน =====
  const saveEval = (rec) => {
    let updated;
    if (editingEval) {
      updated = kpiRecords.map(x => x.id === rec.id ? rec : x);
      addToast('success', 'บันทึกผลประเมินเรียบร้อย');
    } else {
      const dup = kpiRecords.find(x => x.employeeId === rec.employeeId && x.period === rec.period);
      if (dup) { addToast('error', 'มีผลประเมินของพนักงานคนนี้ในรอบนี้แล้ว'); return; }
      updated = [...kpiRecords, rec];
      addToast('success', 'เพิ่มผลประเมินเรียบร้อย');
    }
    setKpiRecords(updated);
    if (api.enabled()) api.post('saveKpiRecord', { data: rec }).catch(e => addToast('error', 'บันทึกไม่สำเร็จ'));
    setOpenEval(false); setEditingEval(null);
  };
  const deleteEval = (id) => {
    if (!confirm('ยืนยันการลบผลประเมินนี้?')) return;
    setKpiRecords(kpiRecords.filter(r => r.id !== id));
    if (api.enabled()) api.post('deleteKpiRecord', { id }).catch(() => {});
    addToast('success', 'ลบเรียบร้อย');
  };

  // สถิติรอบนี้
  const stats = useMemo(() => {
    if (periodRecords.length === 0) return { count: 0, avg: 0, top: null };
    let sum = 0, top = null, topScore = -1;
    periodRecords.forEach(r => {
      const { pct } = calcKpiScore(r, kpiCriteria);
      sum += pct;
      if (pct > topScore) { topScore = pct; top = { r, pct }; }
    });
    return { count: periodRecords.length, avg: Math.round(sum / periodRecords.length), top };
  }, [periodRecords, kpiCriteria]);

        action={canEvaluate && tab === 'eval' && (
          <Button icon="plus" onClick={() => { setEditingEval(null); setOpenEval(true); }}>
            ประเมินพนักงาน
          </Button>
        )}
      />

      {/* Tabs */}
      <div className="flex items-center gap-2 bg-ink-100 p-1 rounded-xl w-fit">
        {[
          { id: 'eval', label: 'ผลการประเมิน', icon: 'target' },
          { id: 'criteria', label: 'คลังหัวข้อ', icon: 'settings' },
        ].map(t => (

            className={cls('inline-flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all',
              tab === t.id ? 'bg-white text-brand-700 shadow-soft' : 'text-ink-600')}>
            <Icon name={t.icon} className="w-4 h-4" /> {t.label}
          </button>
        ))}
      </div>

      {tab === 'eval' ? (
        <>
          <>
            <>
              {/* Stats */}
              <div className="grid grid-cols-2 lg:grid-cols-3 gap-4">
                <Card className="p-5 lift">
                  <div className="flex items-center gap-3">
                    <div className="w-11 h-11 rounded-xl bg-flow-100 text-flow-700 flex items-center justify-center"><Icon name="users" className="w-5 h-5" /></div>
                    <div><div className="text-xs text-ink-500">ประเมินแล้ว</div><div className="font-display text-2xl font-bold text-ink-900">{stats.count} คน</div></div>
                  </div>
                </Card>
                <Card className="p-5 lift">
                  <div className="flex items-center gap-3">
                    <div className="w-11 h-11 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center"><Icon name="chart" className="w-5 h-5" /></div>
                    <div><div className="text-xs text-ink-500">คะแนนเฉลี่ย</div><div className="font-display text-2xl font-bold text-ink-900">{stats.avg}%</div></div>
                  </div>
                </Card>
                <Card className="p-5 lift">
                  <div className="flex items-center gap-3">
                    <div className="w-11 h-11 rounded-xl bg-gold-100 text-gold-700 flex items-center justify-center"><Icon name="target" className="w-5 h-5" /></div>
                    <div>
                      <div className="text-xs text-ink-500">คะแนนสูงสุด</div>
                      <div className="font-display text-2xl font-bold text-ink-900">{stats.top ? `${stats.top.pct}%` : '-'}</div>
                    </div>
                  </div>
                </Card>
              </div>

              {/* Filter */}
              <Card className="p-4">
                <div className="grid md:grid-cols-3 gap-3">
                  <div>
                    <label className="block text-xs text-ink-500 mb-1">รอบประเมิน</label>
                    <Input type="month" value={period} onChange={(e) => setPeriod(e.target.value)} />
                  </div>
                  <div className="md:col-span-2">
                    <label className="block text-xs text-ink-500 mb-1">ค้นหา</label>

                  </div>
                </div>
              </Card>

              {/* Records */}
              <Card className="overflow-hidden">
                {periodRecords.length === 0 ? (
                  <Empty icon="target" title="ยังไม่มีผลประเมิน" desc={`รอบ ${periodLabel} — คลิก "ประเมินพนักงาน"`} />
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-sm">
                      <thead className="bg-ink-50 text-ink-600 text-left">
                        <tr>
                          <th className="px-5 py-3 font-medium">พนักงาน</th>
                          <th className="px-5 py-3 font-medium">คะแนนรวม</th>
                          <th className="px-5 py-3 font-medium">เกรด</th>
                          <th className="px-5 py-3 font-medium text-right">จัดการ</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-ink-100">
                        {periodRecords.sort((a,b) => calcKpiScore(b,kpiCriteria).pct - calcKpiScore(a,kpiCriteria).pct).map(r => {
                          const emp = employees.find(e => e.id === r.employeeId);
                          if (!emp) return null;
                          const { pct } = calcKpiScore(r, kpiCriteria);
                          const g = kpiGrade(pct);
                          return (
                            <tr key={r.id} className="hover:bg-flow-50/40 transition-colors">
                              <td className="px-5 py-3">
                                <div className="flex items-center gap-3">
                                  <Avatar name={`${emp.firstName} ${emp.lastName}`} photo={emp.photo} size="sm" />

                                    <div className="font-medium text-ink-900">{emp.firstName} {emp.lastName}</div>
                                    <div className="text-xs text-ink-500">{emp.id} · {emp.position}</div>

                              <td className="px-5 py-3">

                                <span className="inline-flex items-center gap-1.5">

                                    <>

              {totalWeight !== 100 && <span className="text-xs text-gold-600 ml-2">(แนะนำให้รวมเป็น 100%)</span>}

            {canEdit && <Button icon="plus" size="sm" onClick={() => { setEditingCrit(null); setOpenCrit(true); }}>เพิ่มหัวข้อ</Button>}
          </Card>

          {kpiCriteria.length === 0 ? (
            <Card className="p-8"><Empty icon="target" title="ยังไม่มีหัวข้อประเมิน" desc="คลิก 'เพิ่มหัวข้อ' เพื่อกำหนดหัวข้องานที่ต้องการวัด" /></Card>
          ) : (
            <div className="grid md:grid-cols-2 gap-4">
              {kpiCriteria.map((c, i) => (
                <Card key={c.id} className="p-5">
                  <div className="flex items-start justify-between gap-3">
                    <div className="flex items-start gap-3 min-w-0">
                      <div className="w-9 h-9 rounded-xl bg-brand-100 text-brand-700 flex items-center justify-center font-display font-bold shrink-0">{i+1}</div>
                      <div className="min-w-0">
                        <div className="font-medium text-ink-900">{c.name}</div>
                        <div className="inline-flex items-center gap-1 mt-1 px-2 py-0.5 bg-flow-50 text-flow-700 rounded-lg text-xs font-medium">น้ำหนัก {c.weight}%</div>
                      </div>
                    </div>
                    {canEdit && (
                      <div className="flex gap-1 shrink-0">
                        <button onClick={() => { setEditingCrit(c); setOpenCrit(true); }} className="p-1.5 rounded-lg text-ink-500 hover:bg-flow-50 hover:text-flow-700"><Icon name="edit" className="w-4 h-4" /></button>
                        <button onClick={() => deleteCriteria(c.id)} className="p-1.5 rounded-lg text-ink-500 hover:bg-red-50 hover:text-red-600"><Icon name="trash" className="w-4 h-4" /></button>
                      </div>
                    )}

                  {/* หัวข้อย่อย */}
                  {(c.subItems || []).length > 0 && (
                    <div className="mt-3 pl-12 space-y-1.5">
                      {c.subItems.map((s, si) => (
                        <div key={s.id} className="text-xs border-l-2 border-ink-100 pl-3 py-0.5">
                          <div className="font-medium text-ink-700">{si+1}. {s.indicator} <span className="text-ink-400">({s.weight}%)</span></div>
                          <div className="text-ink-500 flex flex-wrap gap-x-3">
                            {s.targetType && <span>เป้า: {fmtKpiTarget(s)}</span>}

                          </div>

                      ))}
                    </div>
                  )}
                </Card>
              ))}
            </div>
          )}
        </>
      )}

      <KpiEvalModal
        open={openEval}

        defaultPeriod={period}
      />
