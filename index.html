const WarningPage = () => {
  const { employees, settings, setSettings, branches, user, attendance, addToast } = useApp();
  const [tab, setTab] = useState('alerts');   // alerts | issued
  const [openCustom, setOpenCustom] = useState(false);

  const me = employees.find(e => e.id === user.empId);
  const myScope = me?.approvalScope || (me?.canApprove ? 'manager' : 'none');
  const canApproveAll = user.role === 'admin' || user.role === 'hr';
  const approverBranch = user.branchId || me?.branchId;

  const threshold = (settings && settings.warningConfig && settings.warningConfig.lateThreshold) || 6;
  const warnings = (settings && settings.warnings) || [];

  // เดือนปัจจุบัน
  const thisMonth = new Date().toISOString().slice(0, 7);
  const [checkMonth, setCheckMonth] = useState(thisMonth);

  // ตัวเลือกเดือน (ปัจจุบัน + ย้อนหลัง 3)
  const monthOptions = (() => {
    const opts = [];
    const now = new Date();
    for (let i = 0; i < 4; i++) {
      const dt = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const val = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}`;
      opts.push({ value: val, label: `${THAI_MONTHS[dt.getMonth()]} ${dt.getFullYear() + 543}` });
    }
    return opts;
  })();

  // พนักงานในขอบเขตที่ดูแล
  const scopeEmps = employees.filter(e => {
    if (e.status === 'inactive') return false;
    if (canApproveAll) return true;
    return e.branchId === approverBranch;
  });

  // ตรวจว่าใครเข้าเกณฑ์ในเดือนที่เลือก (มาสาย >= threshold) และยังไม่ออกใบเตือนของเดือนนั้น
  const alerts = scopeEmps.map(e => {
    const lateCount = countLateInMonth(e.id, checkMonth, attendance);
    const alreadyIssued = warnings.some(w => w.employeeId === e.id && w.month === checkMonth);
    return { emp: e, lateCount, alreadyIssued };
  }).filter(x => x.lateCount >= threshold)
    .sort((a, b) => b.lateCount - a.lateCount);

  // ใบเตือนที่ออกแล้ว (ในขอบเขต)
  const issuedList = warnings.filter(w => {
    if (canApproveAll) return true;
    const e = employees.find(x => x.id === w.employeeId);
    return e && e.branchId === approverBranch;
  }).sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));

  const saveList = async (list) => {
    setSettings({ ...settings, warnings: list });
    if (api.enabled()) {
      try { await api.post('saveSettingsKey', { key: 'warnings', data: list }); }
      catch (err) { addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message); }
    }
  };

  // ออกใบเตือน (จาก alert)
  const issueWarning = async (alert) => {
    if (!confirm(`ออกใบเตือนให้ ${alert.emp.firstName} ${alert.emp.lastName}?\n(มาสาย ${alert.lateCount} ครั้ง ในเดือนที่เลือก)`)) return;
    const w = {
      id: `WARN${Date.now()}`,
      employeeId: alert.emp.id,
      employeeName: `${alert.emp.firstName} ${alert.emp.lastName}`,
      branchId: alert.emp.branchId,
      month: checkMonth,
      lateCount: alert.lateCount,
      threshold,
      reason: 'มาปฏิบัติงานสายเกินเกณฑ์',
      note: '',
      status: 'issued',
      createdAt: new Date().toISOString(),
      approvedAt: new Date().toISOString(),
      approvedBy: me ? `${me.firstName} ${me.lastName}` : user.username,
    };
    await saveList([...warnings, w]);
    addToast('success', 'ออกใบเตือนแล้ว — พนักงานจะเห็นในระบบของตนเอง');
  };

  // สร้างใบเตือนเอง (กรณีอื่นนอกจากมาสาย)
  const issueCustomWarning = async (data) => {
    const emp = employees.find(e => e.id === data.employeeId);
    if (!emp) { addToast('error', 'ไม่พบพนักงาน'); return; }
    // ใช้วันที่ที่กรอก (ย้อนหลังได้) ถ้าไม่กรอกใช้วันนี้
    const issueISO = data.issueDate
      ? new Date(data.issueDate + 'T09:00:00').toISOString()
      : new Date().toISOString();
    const w = {
      id: `WARN${Date.now()}`,
      type: 'custom',
      employeeId: emp.id,
      employeeName: `${emp.firstName} ${emp.lastName}`,
      branchId: emp.branchId,
      subject: data.subject,
      detail: data.detail || '',
      reason: data.subject,
      note: data.note || '',
      status: 'issued',
      createdAt: issueISO,
      approvedAt: issueISO,
      approvedBy: me ? `${me.firstName} ${me.lastName}` : user.username,
    };
    await saveList([...warnings, w]);
    setOpenCustom(false);
    addToast('success', 'ออกใบเตือนแล้ว — พนักงานจะเห็นในระบบของตนเอง');
  };

  const deleteWarning = async (id) => {
    if (!confirm('ลบใบเตือนนี้?')) return;
    await saveList(warnings.filter(w => w.id !== id));
    addToast('success', 'ลบแล้ว');
  };

  return (
    <div className="p-8 space-y-6 animate-fade-up">
      <Topbar
        title="ใบเตือน / จัดการวินัย"
        subtitle={`ระบบแจ้งเตือนอัตโนมัติเมื่อพนักงานมาสายตั้งแต่ ${threshold} ครั้ง/เดือน`}
        action={<Button icon="plus" onClick={() => setOpenCustom(true)}>สร้างใบเตือนเอง</Button>}
      />

      {/* แท็บ */}
      <div className="flex gap-1 bg-ink-100 p-1 rounded-lg text-sm w-fit">
        {[['alerts', `⚠️ เข้าเกณฑ์ (${alerts.filter(a => !a.alreadyIssued).length})`], ['issued', `📄 ใบเตือนที่ออกแล้ว (${issuedList.length})`]].map(([v, l]) => (
          <button key={v} onClick={() => setTab(v)}
            className={cls('px-4 py-1.5 rounded-md', tab === v ? 'bg-white text-brand-700 shadow-soft' : 'text-ink-600')}>{l}</button>
        ))}
      </div>

      {tab === 'alerts' && (
        <>
          <Card className="p-4">
            <div className="flex items-center gap-3 flex-wrap">
              <span className="text-sm font-medium text-ink-700">ตรวจสอบเดือน:</span>
              {monthOptions.map(o => (
                <button key={o.value} onClick={() => setCheckMonth(o.value)}
                  className={cls('px-3 py-1.5 rounded-lg text-sm', checkMonth === o.value ? 'bg-brand-600 text-white' : 'bg-ink-50 text-ink-600 hover:bg-ink-100')}>
                  {o.label}
                </button>
              ))}
            </div>
          </Card>

          <Card className="overflow-hidden">
            {alerts.length === 0 ? (
              <Empty icon="check" title="ไม่มีพนักงานเข้าเกณฑ์" desc={`ไม่มีใครมาสายถึง ${threshold} ครั้งในเดือนที่เลือก`} />
            ) : (
              <div className="divide-y divide-ink-100">
                {alerts.map(a => (
                  <div key={a.emp.id} className="p-5 flex items-center justify-between hover:bg-ink-50/50">
                    <div className="flex items-center gap-4">
                      <div className="w-11 h-11 rounded-full bg-red-100 text-red-700 flex items-center justify-center font-bold">
                        {a.lateCount}
                      </div>
                      <div>
                        <div className="font-medium text-ink-900">{a.emp.firstName} {a.emp.lastName}</div>
                        <div className="text-xs text-ink-500">
                          {a.emp.id} · {branches.find(b => b.id === a.emp.branchId)?.name || ''} · มาสาย {a.lateCount} ครั้ง
                        </div>
                      </div>
                    </div>
                    <div>
                      {a.alreadyIssued ? (
                        <span className="text-xs px-3 py-1.5 rounded-lg bg-emerald-50 text-emerald-700">ออกใบเตือนแล้ว</span>
                      ) : (
                        <Button icon="file" onClick={() => issueWarning(a)}>ออกใบเตือน</Button>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </Card>
        </>
      )}

      {tab === 'issued' && (
        <Card className="overflow-hidden">
          {issuedList.length === 0 ? (
            <Empty icon="file" title="ยังไม่มีใบเตือน" desc="ใบเตือนที่ออกแล้วจะแสดงที่นี่" />
          ) : (
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead className="bg-ink-50 text-ink-600 text-left text-xs">
                  <tr>
                    <th className="px-5 py-3 font-medium">พนักงาน</th>
                    <th className="px-5 py-3 font-medium">เดือน</th>
                    <th className="px-5 py-3 font-medium text-center">มาสาย</th>
                    <th className="px-5 py-3 font-medium">วันที่ออก</th>
                    <th className="px-5 py-3 font-medium">ออกโดย</th>
                    <th className="px-5 py-3 font-medium text-right">จัดการ</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-ink-100">
                  {issuedList.map(w => {
                    const emp = employees.find(e => e.id === w.employeeId);
                    const [y, m] = (w.month || '').split('-');
                    return (
                      <tr key={w.id} className="hover:bg-ink-50/50">
                        <td className="px-5 py-3">
                          <div className="font-medium text-ink-900">{w.employeeName}</div>
                          <div className="text-xs text-ink-400">{w.employeeId}</div>
                        </td>
                        <td className="px-5 py-3 text-ink-700">{THAI_MONTHS[Number(m) - 1] || ''} {Number(y) + 543}</td>
                        <td className="px-5 py-3 text-center"><span className="text-red-600 font-semibold">{w.lateCount}</span> ครั้ง</td>
                        <td className="px-5 py-3 text-ink-600">{fmtDate(w.createdAt)}</td>
                        <td className="px-5 py-3 text-ink-500 text-xs">{w.approvedBy || '-'}</td>
                        <td className="px-5 py-3">
                          <div className="flex items-center justify-end gap-1.5">
                            <button onClick={() => emp && printWarning(emp, w, settings, branches)}
                              className="px-3 py-1.5 rounded-lg bg-brand-600 text-white text-xs hover:bg-brand-700">พิมพ์</button>
                            {canApproveAll && (
                              <button onClick={() => deleteWarning(w.id)} className="p-1.5 rounded-lg text-ink-400 hover:bg-red-50 hover:text-red-600" title="ลบ">
                                <Icon name="trash" className="w-4 h-4" />
                              </button>
                            )}
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </Card>
      )}

      <CustomWarningModal
        open={openCustom}
        onClose={() => setOpenCustom(false)}
        onSave={issueCustomWarning}
        employees={scopeEmps}
        branches={branches}
      />
    </div>
  );
};

// Modal สร้างใบเตือนเอง (กรณีอื่นนอกจากมาสาย)
const CustomWarningModal = ({ open, onClose, onSave, employees, branches }) => {
  const [employeeId, setEmployeeId] = useState('');
  const [branchFilter, setBranchFilter] = useState('all');
  const [subject, setSubject] = useState('');
  const [detail, setDetail] = useState('');
  const [note, setNote] = useState('');
  const [issueDate, setIssueDate] = useState('');

  // reset เมื่อเปิด (วันที่ตั้งเป็นวันนี้เป็นค่าเริ่มต้น)
  useEffect(() => {
    if (open) {
      setEmployeeId(''); setBranchFilter('all'); setSubject(''); setDetail(''); setNote('');
      setIssueDate(new Date().toISOString().slice(0, 10));
    }
  }, [open]);

  const empOptions = employees.filter(e =>
    branchFilter === 'all' || e.branchId === branchFilter
  ).sort((a, b) => String(a.id).localeCompare(String(b.id)));

  // หัวข้อสำเร็จรูปให้เลือกเร็ว
  const presets = [
    'ขาดงานโดยไม่แจ้งล่วงหน้า',
    'ละทิ้งหน้าที่ระหว่างเวลางาน',
    'ไม่ปฏิบัติตามระเบียบบริษัท',
    'ประพฤติตนไม่เหมาะสม',
    'ทำงานผิดพลาด/บกพร่องต่อหน้าที่',
  ];

  const handleSave = () => {
    if (!employeeId) { alert('กรุณาเลือกพนักงาน'); return; }
    if (!subject.trim()) { alert('กรุณาระบุเรื่อง/สาเหตุ'); return; }
    onSave({ employeeId, subject: subject.trim(), detail: detail.trim(), note: note.trim(), issueDate });
  };

  return (
    <Modal open={open} onClose={onClose} title="สร้างใบเตือนเอง">
      <div className="space-y-4">
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">สาขา</label>
            <Select value={branchFilter} onChange={(e) => { setBranchFilter(e.target.value); setEmployeeId(''); }}>
              <option value="all">ทุกสาขา</option>
              {branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
            </Select>
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">พนักงาน <span className="text-red-500">*</span></label>
            <Select value={employeeId} onChange={(e) => setEmployeeId(e.target.value)}>
              <option value="">— เลือก —</option>
              {empOptions.map(e => (
                <option key={e.id} value={e.id}>{e.id} · {e.firstName} {e.lastName}</option>
              ))}
            </Select>
          </div>
        </div>

        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">วันที่ออกใบเตือน <span className="text-red-500">*</span></label>
          <Input type="date" value={issueDate} onChange={(e) => setIssueDate(e.target.value)} />
          <p className="text-xs text-ink-400 mt-1.5">เลือกวันย้อนหลังได้ สำหรับบันทึกใบเตือนที่เคยออกไปแล้ว</p>
        </div>

        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">เรื่อง / สาเหตุ <span className="text-red-500">*</span></label>
          <Input value={subject} onChange={(e) => setSubject(e.target.value)} placeholder="เช่น ขาดงานโดยไม่แจ้งล่วงหน้า" />
          <div className="flex flex-wrap gap-1.5 mt-2">
            {presets.map(p => (
              <button key={p} onClick={() => setSubject(p)}
                className="text-xs px-2.5 py-1 rounded-full bg-ink-50 text-ink-600 hover:bg-flow-50 hover:text-flow-700 border border-ink-100">
                {p}
              </button>
            ))}
          </div>
        </div>

        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">รายละเอียดเพิ่มเติม</label>
          <Textarea value={detail} onChange={(e) => setDetail(e.target.value)} rows={3}
            placeholder="อธิบายเหตุการณ์/พฤติกรรมที่พบ (ไม่บังคับ)" />
        </div>

        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">หมายเหตุ</label>
          <Input value={note} onChange={(e) => setNote(e.target.value)} placeholder="หมายเหตุเพิ่มเติม (ไม่บังคับ)" />
        </div>

        <div className="flex gap-2 pt-2">
          <Button variant="outline" onClick={onClose} className="flex-1">ยกเลิก</Button>
          <Button icon="file" onClick={handleSave} className="flex-1">ออกใบเตือน</Button>
        </div>
      </div>
    </Modal>
  );
};

const OTPage = () => {
  const { employees, settings, setSettings, branches, user, addToast } = useApp();
  const [showForm, setShowForm] = useState(false);
  const [filterStatus, setFilterStatus] = useState('all');   // all | pending | approved | rejected

  const me = employees.find(e => e.id === user.empId);
  const myScope = me?.approvalScope || (me?.canApprove ? 'manager' : 'none');
  const isApprover = user.role === 'admin' || user.role === 'hr' || user.role === 'manager' || myScope !== 'none';
  const canApproveAll = user.role === 'admin' || user.role === 'hr';
  const approverBranch = user.branchId || me?.branchId;   // สาขาที่ผู้จัดการภาคดูแล

  const otList = ((settings && settings.otRequests) || []).slice()
    .sort((a, b) => String(b.requestedAt || '').localeCompare(String(a.requestedAt || '')));

  // รายการที่ผู้ใช้เห็น: ตัวเอง หรือ (ถ้าเป็นผู้อนุมัติ) ในขอบเขตที่อนุมัติได้
  const visible = otList.filter(r => {
    if (r.employeeId === user.empId) return true;
    if (!isApprover) return false;
    if (canApproveAll) return true;
    // manager/regional เห็นเฉพาะสาขาตัวเอง
    const emp = employees.find(e => e.id === r.employeeId);
    return emp && emp.branchId === approverBranch;
  }).filter(r => filterStatus === 'all' ? true : r.status === filterStatus);

  const saveList = async (list) => {
    setSettings({ ...settings, otRequests: list });
    if (api.enabled()) {
      try { await api.post('saveSettingsKey', { key: 'otRequests', data: list }); }
      catch (err) { addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message); }
    }
  };

  const updateStatus = async (id, status) => {
    const list = ((settings && settings.otRequests) || []).map(r =>
      r.id === id ? { ...r, status, approvedAt: new Date().toISOString(), approvedBy: me ? `${me.firstName} ${me.lastName}` : user.username } : r);
    await saveList(list);
    addToast('success', status === 'approved' ? 'อนุมัติ OT แล้ว' : 'ปฏิเสธคำขอแล้ว');
  };

  const deleteReq = async (id) => {
    if (!confirm('ลบคำขอ OT นี้?')) return;
    await saveList(((settings && settings.otRequests) || []).filter(r => r.id !== id));
    addToast('success', 'ลบแล้ว');
  };

  const statusBadge = (s) => s === 'approved'
    ? <span className="text-xs px-2 py-0.5 rounded bg-emerald-50 text-emerald-700">อนุมัติแล้ว</span>
    : s === 'rejected'
    ? <span className="text-xs px-2 py-0.5 rounded bg-red-50 text-red-700">ไม่อนุมัติ</span>
    : <span className="text-xs px-2 py-0.5 rounded bg-gold-50 text-gold-700">รออนุมัติ</span>;

  return (
    <div className="p-8 space-y-6 animate-fade-up">
      <Topbar
        title="ขอทำงานล่วงเวลา (OT)"
        subtitle="ยื่นคำขอ OT ระบุจำนวนเงิน · เมื่ออนุมัติจะรวมเข้าค่าล่วงเวลาในเงินเดือน"
        action={<Button icon="plus" onClick={() => setShowForm(true)}>ขอ OT</Button>}
      />

      {/* filter สถานะ */}
      <div className="flex gap-1 bg-ink-100 p-1 rounded-lg text-sm w-fit">
        {[['all','ทั้งหมด'],['pending','รออนุมัติ'],['approved','อนุมัติแล้ว'],['rejected','ไม่อนุมัติ']].map(([v,l]) => (
          <button key={v} onClick={() => setFilterStatus(v)}
            className={cls('px-3 py-1.5 rounded-md', filterStatus === v ? 'bg-white text-brand-700 shadow-soft' : 'text-ink-600')}>{l}</button>
        ))}
      </div>

      <Card className="overflow-hidden">
        {visible.length === 0 ? (
          <Empty icon="clock" title="ไม่มีคำขอ OT" desc="กดปุ่ม 'ขอ OT' เพื่อยื่นคำขอ" />
        ) : (
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead className="bg-ink-50 text-ink-600 text-left text-xs">
                <tr>
                  <th className="px-5 py-3 font-medium">พนักงาน</th>
                  <th className="px-5 py-3 font-medium">วันที่ทำ OT</th>
                  <th className="px-5 py-3 font-medium">รายละเอียด</th>
                  <th className="px-5 py-3 font-medium text-right">จำนวนเงิน</th>
                  <th className="px-5 py-3 font-medium">สถานะ</th>
                  <th className="px-5 py-3 font-medium text-right">จัดการ</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-ink-100">
                {visible.map(r => {
                  const emp = employees.find(e => e.id === r.employeeId);
                  const canManage = isApprover && (canApproveAll || (emp && emp.branchId === approverBranch)) && r.employeeId !== user.empId;
                  return (
                    <tr key={r.id} className="hover:bg-ink-50/50">
                      <td className="px-5 py-3">
                        <div className="font-medium text-ink-900">{r.employeeName || (emp ? `${emp.firstName} ${emp.lastName}` : r.employeeId)}</div>
                        <div className="text-xs text-ink-400">{r.employeeId}{emp ? ` · ${branches.find(b => b.id === emp.branchId)?.name || ''}` : ''}</div>
                      </td>
                      <td className="px-5 py-3 text-ink-700">{fmtDate(r.otDate)}</td>
                      <td className="px-5 py-3 text-ink-600 max-w-xs">
                        {r.startTime && r.endTime && (
                          <div className="text-xs text-ink-500 mb-0.5">
                            {r.startTime}–{r.endTime} · <span className="font-medium text-flow-700">{r.hours || '-'} ชม.</span>
                          </div>
                        )}
                        {r.detail || '-'}
                      </td>
                      <td className="px-5 py-3 text-right font-semibold text-ink-900">{fmtMoney(r.amount)} ฿</td>
                      <td className="px-5 py-3">{statusBadge(r.status)}</td>
                      <td className="px-5 py-3">
                        <div className="flex items-center justify-end gap-1.5">
                          {canManage && r.status === 'pending' ? (
                            <>
                              <button onClick={() => updateStatus(r.id, 'approved')} className="px-3 py-1.5 rounded-lg bg-emerald-600 text-white text-xs hover:bg-emerald-700">อนุมัติ</button>
                              <button onClick={() => updateStatus(r.id, 'rejected')} className="px-3 py-1.5 rounded-lg border border-red-200 text-red-600 text-xs hover:bg-red-50">ปฏิเสธ</button>
                            </>
                          ) : (
                            <span className="text-xs text-ink-400">{r.approvedBy || ''}</span>
                          )}
                          {(canApproveAll || (r.employeeId === user.empId && r.status === 'pending')) && (
                            <button onClick={() => deleteReq(r.id)} className="p-1.5 rounded-lg text-ink-400 hover:bg-red-50 hover:text-red-600" title="ลบ">
                              <Icon name="trash" className="w-4 h-4" />
                            </button>
                          )}
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      {showForm && (
        <OTFormModal
          open={showForm}
          onClose={() => setShowForm(false)}
          employees={employees}
          me={me}
          user={user}
          canChooseOther={isApprover}
          approverBranch={canApproveAll ? null : approverBranch}
          onSave={async (req) => {
            const list = [...((settings && settings.otRequests) || []), req];
            await saveList(list);
            addToast('success', 'ส่งคำขอ OT แล้ว รออนุมัติ');
            setShowForm(false);
          }}
        />
      )}
    </div>
  );
};

/* ===== OT FORM MODAL ===== */
const OTFormModal = ({ open, onClose, employees, me, user, canChooseOther, approverBranch, onSave }) => {
  const [employeeId, setEmployeeId] = useState(user.empId || '');
  const [otDate, setOtDate] = useState(new Date().toISOString().slice(0, 10));
  const [startTime, setStartTime] = useState('18:00');
  const [endTime, setEndTime] = useState('21:00');
  const [amount, setAmount] = useState('');
  const [detail, setDetail] = useState('');

  // คำนวณจำนวนชั่วโมงจากเวลาเริ่ม-สิ้นสุด (รองรับข้ามเที่ยงคืน)
  const otHours = (() => {
    if (!startTime || !endTime) return 0;
    const [h1, m1] = startTime.split(':').map(Number);
    const [h2, m2] = endTime.split(':').map(Number);
    let mins = (h2 * 60 + m2) - (h1 * 60 + m1);
    if (mins < 0) mins += 24 * 60;   // ข้ามเที่ยงคืน
    return Math.round((mins / 60) * 100) / 100;
  })();

  // รายชื่อที่เลือกได้
  const selectable = (() => {
    if (!canChooseOther) return employees.filter(e => e.id === user.empId);
    let list = employees.filter(e => e.status !== 'inactive');
    if (approverBranch) list = list.filter(e => e.branchId === approverBranch);   // manager เห็นเฉพาะสาขาตน
    return list.sort((a, b) => String(a.id).localeCompare(String(b.id), undefined, { numeric: true }));
  })();

  const submit = () => {
    if (!employeeId) { alert('กรุณาเลือกพนักงาน'); return; }
    if (!otDate) { alert('กรุณาเลือกวันที่'); return; }
    if (!startTime || !endTime) { alert('กรุณาระบุเวลาเริ่ม-สิ้นสุด'); return; }
    if (otHours <= 0) { alert('เวลาสิ้นสุดต้องมากกว่าเวลาเริ่ม'); return; }
    const amt = Number(amount);
    if (!amt || amt <= 0) { alert('กรุณาระบุจำนวนเงินให้ถูกต้อง'); return; }
    const emp = employees.find(e => e.id === employeeId);
    onSave({
      id: `OT${Date.now()}`,
      employeeId,
      employeeName: emp ? `${emp.firstName} ${emp.lastName}` : employeeId,
      otDate,
      startTime,
      endTime,
      hours: otHours,
      amount: amt,
      detail: detail.trim(),
      status: 'pending',
      requestedAt: new Date().toISOString(),
    });
  };

  if (!open) return null;
  return (
    <Modal open onClose={onClose} title="ขอทำงานล่วงเวลา (OT)" size="md">
      <div className="space-y-4">
        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">พนักงาน</label>
          <Select value={employeeId} onChange={(e) => setEmployeeId(e.target.value)} disabled={!canChooseOther}>
            {selectable.map(e => <option key={e.id} value={e.id}>{e.firstName} {e.lastName} ({e.id})</option>)}
          </Select>
        </div>
        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">วันที่ทำ OT</label>
          <Input type="date" value={otDate} onChange={(e) => setOtDate(e.target.value)} />
        </div>
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">เวลาเริ่ม</label>
            <Input type="time" value={startTime} onChange={(e) => setStartTime(e.target.value)} />
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">เวลาสิ้นสุด</label>
            <Input type="time" value={endTime} onChange={(e) => setEndTime(e.target.value)} />
          </div>
        </div>
        {otHours > 0 && (
          <div className="bg-flow-50 border border-flow-100 rounded-xl px-4 py-2.5 text-sm flex items-center justify-between">
            <span className="text-ink-600">รวมเวลา OT</span>
            <span className="font-bold text-flow-700">{otHours} ชั่วโมง</span>
          </div>
        )}
        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">จำนวนเงิน (บาท)</label>
          <Input type="number" min={0} step="0.01" value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="เช่น 300" />
        </div>
        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">รายละเอียด / เหตุผล</label>
          <textarea value={detail} onChange={(e) => setDetail(e.target.value)} rows={3}
            className="w-full rounded-xl border border-ink-200 px-3 py-2 text-sm focus:border-flow-400 focus:ring-2 focus:ring-flow-100 outline-none"
            placeholder="เช่น ทำงานเพิ่มปิดยอดสิ้นเดือน" />
        </div>
        <div className="flex justify-end gap-2 pt-2 border-t border-ink-100">
          <Button variant="secondary" onClick={onClose}>ยกเลิก</Button>
          <Button icon="check" onClick={submit}>ส่งคำขอ</Button>
        </div>
      </div>
    </Modal>
  );
};

const LeavesPage = () => {
  const { employees, leaves, setLeaves, leaveTypes, branches, user, addToast } = useApp();
  const [filter, setFilter] = useState('all');
  const [filterBranch, setFilterBranch] = useState('all');
  const [openRequest, setOpenRequest] = useState(false);
  const [openExport, setOpenExport] = useState(false);

  // สิทธิ์อนุมัติ: admin/hr อนุมัติได้ทุกคน, พนักงานตาม approvalScope
  const currentEmp = employees.find(e => e.id === user.empId);
  const approvalScope = currentEmp?.approvalScope || (currentEmp?.canApprove ? 'manager' : 'none');
  // ระดับสิทธิ์รวม login role
  const isFullApprover = user.role === 'admin' || user.role === 'hr' || user.role === 'manager' || approvalScope === 'manager';
  const isRegionalApprover = approvalScope === 'regional';
  const canApproveLeaves = isFullApprover || isRegionalApprover;

  // เช็คว่าอนุมัติคำขอของพนักงานคนนี้ได้ไหม
  const canApproveLeaveOf = (emp) => {
    if (!emp) return false;
    if (isFullApprover) return true;
    // ผู้จัดการภาค: อนุมัติเฉพาะคนในภาคตัวเอง (และไม่ใช่ตัวเอง)
    if (isRegionalApprover) {
      return emp.branchId === currentEmp.branchId && emp.id !== currentEmp.id;
    }
    return false;
  };

  const visible = useMemo(() => {
    return leaves.filter(l => {
      if (filter !== 'all' && l.status !== filter) return false;
      const emp = employees.find(e => e.id === l.employeeId);
      if (!emp) return false;
      if (user.role === 'manager' && emp.branchId !== user.branchId) return false;
      if (user.role === 'employee' && emp.id !== user.empId) return false;
      // กรองตามสาขา (admin/hr)
      if (filterBranch !== 'all' && emp.branchId !== filterBranch) return false;
      return true;
    }).sort((a,b) => {
      // เรียงตามวันที่ลา (ใหม่สุดก่อน) — ถ้าเท่ากันใช้ createdAt
      const da = toYMD(a.startDate), db = toYMD(b.startDate);
      if (da !== db) return db.localeCompare(da);
      return String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
    });
  }, [leaves, filter, filterBranch, employees, user]);

  const updateStatus = (id, status) => {
    const updated = leaves.find(l => l.id === id);
    if (!updated) return;
    const newLeave = { ...updated, status };
    setLeaves(leaves.map(l => l.id === id ? newLeave : l));
    addToast('success', status === 'approved' ? 'อนุมัติคำขอลาแล้ว' : 'ปฏิเสธคำขอลาแล้ว');
    if (api.enabled()) {
      api.post('saveLeave', { data: newLeave })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
  };

  return (
    <div className="p-8 space-y-6 animate-fade-up">
      <Topbar
        title="การลา"
        subtitle="จัดการคำขอลาของพนักงาน"
        action={
          <div className="flex items-center gap-2">
            {(user.role === 'admin' || user.role === 'hr' || user.role === 'manager' || approvalScope === 'regional') && (
              <Button variant="outline" icon="download" onClick={() => setOpenExport(true)}>Export</Button>
            )}
            <Button icon="plus" onClick={() => setOpenRequest(true)}>ขอลา</Button>
          </div>
        }
      />

      {/* Filter tabs + สาขา */}
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div className="flex items-center gap-2 bg-white border border-ink-100 p-1.5 rounded-xl w-fit">
          {[
            { id: 'all',      label: 'ทั้งหมด' },
            { id: 'pending',  label: 'รออนุมัติ' },
            { id: 'approved', label: 'อนุมัติแล้ว' },
            { id: 'rejected', label: 'ปฏิเสธ' },
          ].map(t => (
            <button
              key={t.id}
              onClick={() => setFilter(t.id)}
              className={cls(
                'px-4 py-1.5 rounded-lg text-sm font-medium transition-all',
                filter === t.id ? 'bg-flow-600 text-white shadow-soft' : 'text-ink-600 hover:text-ink-900',
              )}
            >
              {t.label}
              <span className="ml-2 text-xs opacity-75">
                {t.id === 'all' ? leaves.length : leaves.filter(l => l.status === t.id).length}
              </span>
            </button>
          ))}
        </div>
        {/* กรองสาขา — เฉพาะ admin/hr (manager/employee ถูกล็อกสาขาอยู่แล้ว) */}
        {(user.role === 'admin' || user.role === 'hr') && (
          <Select value={filterBranch} onChange={(e) => setFilterBranch(e.target.value)} className="w-44">
            <option value="all">ทุกสาขา</option>
            {branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
          </Select>
        )}
      </div>

      <div className="grid lg:grid-cols-2 gap-4">
        {visible.map(l => {
          const emp = employees.find(e => e.id === l.employeeId);
          const type = leaveTypes.find(t => t.id === l.type);
          const branch = emp ? branches.find(b => b.id === emp.branchId) : null;
          if (!emp || !type) return null;

          return (
            <Card key={l.id} className="p-5 lift">
              <div className="flex items-start justify-between mb-3">
                <div className="flex items-center gap-3">
                  <Avatar name={`${emp.firstName} ${emp.lastName}`} photo={emp.photo} />
                  <div>
                    <div className="font-medium text-ink-900">{emp.firstName} {emp.lastName}</div>
                    <div className="text-xs text-ink-500">{emp.id} · {branch?.short}</div>
                  </div>
                </div>
                <Badge color={
                  l.status === 'approved' ? 'green' :
                  l.status === 'rejected' ? 'red' : 'yellow'
                }>
                  {l.status === 'approved' ? 'อนุมัติแล้ว' :
                   l.status === 'rejected' ? 'ปฏิเสธ' : 'รออนุมัติ'}
                </Badge>
              </div>

              <div className="space-y-2.5 text-sm">
                <div className="flex items-center gap-2">
                  <span
                    className="inline-block w-2 h-2 rounded-full"
                    style={{ background: type.color }}
                  />
                  <span className="font-medium text-ink-900">{type.label}</span>
                  <span className="text-ink-400">·</span>
                  <span className="text-ink-600">{l.days} วัน</span>
                  {l.type === 'sick' && l.medicalCert && (
                    <span className="inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-100">
                      <Icon name="file" className="w-3 h-3" /> มีใบรับรองแพทย์
                    </span>
                  )}
                </div>
                <div className="flex items-center gap-2 text-ink-600">
                  <Icon name="calendar" className="w-4 h-4 text-ink-400" />
                  <span className="text-xs">{fmtDate(l.startDate)} → {fmtDate(l.endDate)}</span>
                </div>
                <div className="text-sm text-ink-700 bg-ink-50 rounded-lg p-3">
                  <div className="text-xs text-ink-500 mb-0.5">เหตุผล:</div>
                  {l.reason}
                </div>
              </div>

              {l.status === 'pending' && canApproveLeaveOf(emp) && (
                <div className="flex gap-2 mt-4 pt-4 border-t border-ink-100">
                  <Button variant="success" size="sm" icon="check" className="flex-1" onClick={() => updateStatus(l.id, 'approved')}>
                    อนุมัติ
                  </Button>
                  <Button variant="danger" size="sm" icon="x" className="flex-1" onClick={() => updateStatus(l.id, 'rejected')}>
                    ปฏิเสธ
                  </Button>
                </div>
              )}
            </Card>
          );
        })}
        {visible.length === 0 && (
          <Card className="lg:col-span-2">
            <Empty icon="calendar" title="ไม่มีคำขอลา" desc="ยังไม่มีคำขอที่ตรงกับเงื่อนไข" />
          </Card>
        )}
      </div>

      <LeaveRequestModal
        open={openRequest}
        onClose={() => setOpenRequest(false)}
        onSave={(req) => {
          setLeaves([...leaves, req]);
          addToast('success', 'ส่งคำขอลาเรียบร้อย รอการอนุมัติ');
          if (api.enabled()) {
            api.post('saveLeave', { data: req })
              .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
          }
          setOpenRequest(false);
        }}
        employees={employees}
        leaves={leaves}
        leaveTypes={leaveTypes}
        user={user}
      />

      <LeaveExportModal
        open={openExport}
        onClose={() => setOpenExport(false)}
        employees={employees}
        leaves={leaves}
        leaveTypes={leaveTypes}
        branches={branches}
        user={user}
        addToast={addToast}
      />
    </div>
  );
};

const LeaveExportModal = ({ open, onClose, employees, leaves, leaveTypes, branches, user, addToast }) => {
  const [scope, setScope] = useState('branch');   // branch | person
  const [branchId, setBranchId] = useState('all');
  const [empId, setEmpId] = useState('');
  const [fromDate, setFromDate] = useState('');
  const [toDate, setToDate] = useState('');
  const [statusFilter, setStatusFilter] = useState('all'); // all | approved | pending | rejected

  // ขอบเขตสิทธิ์: manager/regional เห็นเฉพาะสาขาตัวเอง
  const me = employees.find(e => e.id === user.empId);
  const canAll = user.role === 'admin' || user.role === 'hr';
  const lockedBranch = !canAll ? (user.branchId || me?.branchId) : null;

  // สาขาที่เลือกได้
  const branchOptions = canAll ? branches : branches.filter(b => b.id === lockedBranch);

  // รายชื่อพนักงานสำหรับ dropdown (ตามสาขาที่เลือก)
  const empOptions = employees.filter(e => {
    if (!canAll && e.branchId !== lockedBranch) return false;
    if (scope === 'person' && branchId !== 'all' && e.branchId !== branchId) return false;
    return true;
  }).sort((a, b) => String(a.id).localeCompare(String(b.id)));

  const leaveLabel = (id) => (leaveTypes.find(t => t.id === id)?.label) || 'ลางาน';
  const bName = (id) => (branches.find(b => b.id === id)?.name || id || '-');
  const statusLabel = (s) => s === 'approved' ? 'อนุมัติแล้ว' : s === 'rejected' ? 'ปฏิเสธ' : 'รออนุมัติ';
  const periodLabel = (l) => {
    if (l.leavePeriod === 'morning') return 'ครึ่งเช้า';
    if (l.leavePeriod === 'afternoon') return 'ครึ่งบ่าย';
    if (l.leavePeriod === 'hours') return l.leaveHours ? `${l.leaveHours} ชม.` : 'รายชั่วโมง';
    return 'เต็มวัน';
  };

  const doExport = () => {
    // กรองข้อมูล
    let rows = leaves.filter(l => {
      const emp = employees.find(e => e.id === l.employeeId);
      if (!emp) return false;
      // สิทธิ์
      if (!canAll && emp.branchId !== lockedBranch) return false;
      // ขอบเขต
      if (scope === 'person') {
        if (!empId) return false;
        if (l.employeeId !== empId) return false;
      } else {
        if (branchId !== 'all' && emp.branchId !== branchId) return false;
      }
      // สถานะ
      if (statusFilter !== 'all' && l.status !== statusFilter) return false;
      // ช่วงวันที่ (ใช้ startDate)
      const sd = toYMD(l.startDate);
      if (fromDate && sd < fromDate) return false;
      if (toDate && sd > toDate) return false;
      return true;
    }).sort((a, b) => toYMD(a.startDate).localeCompare(toYMD(b.startDate)));

    if (rows.length === 0) { addToast('error', 'ไม่มีข้อมูลการลาตามเงื่อนไขที่เลือก'); return; }

    const header = ['รหัส', 'ชื่อ-นามสกุล', 'สาขา', 'ประเภทการลา', 'วันเริ่ม', 'วันสิ้นสุด', 'ช่วง', 'จำนวนวัน', 'เหตุผล', 'สถานะ', 'วันที่ยื่น'];
    const data = rows.map(l => {
      const emp = employees.find(e => e.id === l.employeeId) || {};
      return [
        emp.id || l.employeeId,
        `${emp.firstName || ''} ${emp.lastName || ''}`.trim(),
        bName(emp.branchId),
        leaveLabel(l.leaveType),
        toYMD(l.startDate),
        toYMD(l.endDate),
        periodLabel(l),
        Number(l.days) || 0,
        l.reason || '',
        statusLabel(l.status),
        l.createdAt ? toYMD(l.createdAt) : '',
      ];
    });

    // สรุปยอดรวมวันลาตามประเภท (เฉพาะอนุมัติแล้ว)
    const approvedRows = rows.filter(l => l.status === 'approved');
    const sumByType = {};
    approvedRows.forEach(l => {
      const k = leaveLabel(l.leaveType);
      sumByType[k] = (sumByType[k] || 0) + (Number(l.days) || 0);
    });

    const ws = XLSX.utils.aoa_to_sheet([header, ...data]);
    ws['!cols'] = [{ wch: 10 }, { wch: 20 }, { wch: 16 }, { wch: 14 }, { wch: 12 }, { wch: 12 }, { wch: 10 }, { wch: 9 }, { wch: 24 }, { wch: 12 }, { wch: 12 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'รายการลา');

    // ชีตสรุป
    if (Object.keys(sumByType).length > 0) {
      const sumHeader = ['ประเภทการลา', 'รวมจำนวนวัน (อนุมัติแล้ว)'];
      const sumData = Object.entries(sumByType).map(([k, v]) => [k, v]);
      sumData.push(['รวมทั้งหมด', approvedRows.reduce((s, l) => s + (Number(l.days) || 0), 0)]);
      const ws2 = XLSX.utils.aoa_to_sheet([sumHeader, ...sumData]);
      ws2['!cols'] = [{ wch: 20 }, { wch: 24 }];
      XLSX.utils.book_append_sheet(wb, ws2, 'สรุป');
    }

    // ตั้งชื่อไฟล์
    const parts = ['รายงานการลา'];
    if (scope === 'person' && empId) {
      const e = employees.find(x => x.id === empId);
      parts.push(e ? `${e.firstName}${e.lastName}` : empId);
    } else if (branchId !== 'all') {
      parts.push(bName(branchId));
    } else if (!canAll) {
      parts.push(bName(lockedBranch));
    }
    if (fromDate || toDate) parts.push(`${fromDate || 'เริ่มต้น'}_ถึง_${toDate || 'ล่าสุด'}`);
    const fname = parts.join('_') + '.xlsx';

    XLSX.writeFile(wb, fname);
    addToast('success', `ส่งออก ${rows.length} รายการเรียบร้อย`);
    onClose();
  };

  return (
    <Modal open={open} onClose={onClose} title="ส่งออกข้อมูลการลา">
      <div className="space-y-4">
        {/* เลือกขอบเขต */}
        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">ส่งออกแบบ</label>
          <div className="flex gap-2">
            <button
              onClick={() => setScope('branch')}
              className={cls('flex-1 px-4 py-2.5 rounded-lg text-sm font-medium border transition-all',
                scope === 'branch' ? 'bg-flow-600 text-white border-flow-600' : 'bg-white text-ink-600 border-ink-200 hover:border-flow-300')}>
              ตามภาค / สาขา
            </button>
            <button
              onClick={() => setScope('person')}
              className={cls('flex-1 px-4 py-2.5 rounded-lg text-sm font-medium border transition-all',
                scope === 'person' ? 'bg-flow-600 text-white border-flow-600' : 'bg-white text-ink-600 border-ink-200 hover:border-flow-300')}>
              รายบุคคล
            </button>
          </div>
        </div>

        {/* เลือกสาขา */}
        {scope === 'branch' && (
          <div>

const LeaveRequestModal = ({ open, onClose, onSave, employees, leaves, leaveTypes, user }) => {
  const [form, setForm] = useState({
    employeeId: '', type: leaveTypes[0]?.id || 'sick',
    startDate: new Date().toISOString().split('T')[0],
    endDate:   new Date().toISOString().split('T')[0],
    period: 'full',          // full / morning / afternoon / hours
    hours: 2,                // ถ้า period = 'hours'
    medicalCert: false,      // มีใบรับรองแพทย์ (สำหรับลาป่วย)
    reason: '',
  });

  useEffect(() => {
    if (open) {
      setForm(f => ({
        ...f,
        employeeId: user.empId || employees[0]?.id || '',
        type: leaveTypes[0]?.id || 'sick',
        period: 'full',
        hours: 2,
      }));
    }
  }, [open]);

  // เมื่อเปลี่ยนช่วงเวลาเป็นครึ่งวัน/ชั่วโมง → ตั้ง endDate = startDate (เพราะลาวันเดียว)
  useEffect(() => {
    if (form.period !== 'full' && form.startDate !== form.endDate) {
      setForm(f => ({ ...f, endDate: f.startDate }));
    }
  }, [form.period]);

  // คำนวณจำนวนวัน (รองรับครึ่งวัน + ชั่วโมง)
  const days = useMemo(() => {
    if (!form.startDate || !form.endDate) return 0;
    const s = new Date(form.startDate); const e = new Date(form.endDate);
    if (isNaN(s) || isNaN(e)) return 0;
    const dayCount = Math.floor((e - s) / (1000 * 60 * 60 * 24)) + 1;
    if (dayCount < 1) return 0;

    // ครึ่งวัน (เช้า/บ่าย) = 0.5
    if (form.period === 'morning' || form.period === 'afternoon') {
      return 0.5;
    }
    // ชั่วโมง: 8 ชั่วโมง = 1 วัน (ปัดเป็นทศนิยม 2 ตำแหน่ง)
    if (form.period === 'hours') {
      const h = Number(form.hours) || 0;
      return Math.round((h / 8) * 100) / 100;
    }
    return dayCount;
  }, [form.startDate, form.endDate, form.period, form.hours]);

  // คำนวณโควต้าของพนักงานที่เลือก ในปีปัจจุบัน
  const currentEmp = employees.find(e => e.id === form.employeeId);
  const year = String(new Date().getFullYear());
  const quota = currentEmp ? calcQuota(currentEmp, leaveTypes, leaves, year) : [];
  const selectedQuota = quota.find(q => q.id === form.type);
  // ติดลบได้ — เตือนถ้าเกิน แต่ยังส่งได้
  const exceedsQuota = selectedQuota && (selectedQuota.remaining - days) < 0;
  const selectedType = leaveTypes.find(t => t.id === form.type);
  // ขาดงาน / ลาไม่รับเงินเดือน — ไม่ต้องเช็คโควต้า (max=0 อยู่แล้ว)
  const skipQuotaCheck = selectedType && (selectedType.id === 'absent' || selectedType.id === 'unpaid' || selectedQuota?.max === 0);

  // early return ต้องอยู่ "หลัง" hooks ทั้งหมด (กฎ React Hooks)
  if (!open) return null;

  const periodLabel = {
    full: 'เต็มวัน',
    morning: 'ครึ่งวันเช้า',
    afternoon: 'ครึ่งวันบ่าย',
    hours: `${form.hours} ชั่วโมง`,
  }[form.period];

  const submit = (e) => {
    e.preventDefault();
    if (days <= 0) return alert('จำนวนวันลาไม่ถูกต้อง');
    if (form.period === 'hours' && (!form.hours || form.hours < 0.5)) {
      return alert('กรุณาระบุจำนวนชั่วโมง (อย่างน้อย 0.5 ชั่วโมง)');
    }
    onSave({
      id: `LV${Date.now()}`,
      employeeId: form.employeeId,
      type: form.type,
      startDate: form.startDate,
      endDate: form.endDate,
      days,
      period: form.period,
      hours: form.period === 'hours' ? Number(form.hours) : null,
      medicalCert: form.type === 'sick' ? !!form.medicalCert : false,
      reason: form.reason + (form.period !== 'full' ? ` [${periodLabel}]` : ''),
      status: 'pending',
      createdAt: new Date().toISOString(),
    });
  };

  return (
    <Modal open={open} onClose={onClose} title="คำขอลา" size="md">
      <form onSubmit={submit} className="space-y-4">
        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">พนักงาน</label>
          {(() => {
            // ตรวจสิทธิ์: employee ธรรมดา (ไม่มีสิทธิ์อนุมัติ) → ขอลาได้แค่ตัวเอง
            // ผู้จัดการภาค (regional) / ผู้มีสิทธิ์อนุมัติ → ขอแทนคนในขอบเขตได้
            const myEmp = employees.find(e => e.id === user.empId);
            const scope = myEmp?.approvalScope || (myEmp?.canApprove ? 'manager' : 'none');
            const isApprover = user.role === 'admin' || user.role === 'hr' || user.role === 'manager'
              || scope === 'regional' || scope === 'manager';
            const lockToSelf = !isApprover && !!user.empId;
            // รายชื่อที่เลือกได้
            let selectable;
            if (lockToSelf) {
              selectable = employees.filter(e => e.id === user.empId);
            } else if (user.role === 'manager' || scope === 'regional' || scope === 'manager') {
              // จำกัดเฉพาะสาขาตัวเอง
              const branchId = user.branchId || myEmp?.branchId;
              selectable = employees.filter(e => e.branchId === branchId);
            } else {
              selectable = employees;   // admin/hr เห็นทุกคน
            }
            return (
              <Select
                value={form.employeeId}
                onChange={(e) => setForm({ ...form, employeeId: e.target.value })}
                disabled={lockToSelf}
                required
              >
                {selectable.slice().sort((a,b)=>String(a.id).localeCompare(String(b.id),undefined,{numeric:true})).map(e => (
                  <option key={e.id} value={e.id}>{e.firstName} {e.lastName} ({e.id})</option>
                ))}
              </Select>
            );
          })()}
          {user.role === 'employee' && user.empId && !(employees.find(e => e.id === user.empId)?.approvalScope) && !(employees.find(e => e.id === user.empId)?.canApprove) && (
            <p className="text-xs text-ink-400 mt-1">คุณสามารถขอลาได้เฉพาะของตัวเอง</p>
          )}
        </div>

        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">ประเภทการลา</label>
          <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
            {leaveTypes.map(t => {
              const q = quota.find(x => x.id === t.id);
              const isNoQuotaType = t.id === 'absent' || t.id === 'unpaid' || t.max === 0;
              return (
                <button
                  key={t.id} type="button"
                  onClick={() => setForm({ ...form, type: t.id })}
                  className={cls(
                    'p-3 rounded-xl border text-sm font-medium text-left transition-all',
                    form.type === t.id
                      ? 'border-flow-500 bg-flow-50 ring-2 ring-flow-100'
                      : 'border-ink-200 hover:border-ink-300',
                  )}
                >
                  <div className="flex items-center gap-2 mb-0.5">
                    <span className="w-2 h-2 rounded-full" style={{ background: t.color }} />
                    <span className="text-ink-900">{t.label}</span>
                    {q?.customized && !q?.noQuota && (
                      <span className="text-[9px] px-1.5 py-0.5 bg-gold-100 text-gold-700 rounded font-semibold">เฉพาะ</span>
                    )}
                    {q?.noQuota && (
                      <span className="text-[9px] px-1.5 py-0.5 bg-red-100 text-red-700 rounded font-semibold">ไม่มีสิทธิ์</span>
                    )}
                  </div>
                  <div className="text-[11px] text-ink-500">
                    {isNoQuotaType ? (
                      <span className="text-ink-500">ไม่นับโควต้า</span>
                    ) : q?.noQuota ? (
                      <span className="text-red-600">ลาแล้วติดลบ ({q.used} วัน)</span>
                    ) : (
                      <>คงเหลือ <strong className={q?.remaining < 0 ? 'text-red-500' : q?.remaining === 0 ? 'text-gold-600' : 'text-emerald-600'}>{q?.remaining ?? t.max}</strong>/{q?.max ?? t.max} วัน</>
                    )}
                  </div>
                </button>
              );
            })}
          </div>
        </div>

        {/* แสดงโควต้าของประเภทที่เลือก */}
        {selectedQuota && currentEmp && !skipQuotaCheck && (
          <div className={cls(
            'border rounded-xl p-3',
            selectedQuota.remaining < 0 ? 'bg-red-50 border-red-200' : 'bg-ink-50 border-ink-100'
          )}>
            <div className="flex items-center justify-between text-xs text-ink-600 mb-1.5">
              <span>โควต้าปี {year}: <strong className="text-ink-900">{selectedQuota.label}</strong></span>
              <span>
                ใช้ไป {selectedQuota.used}/{selectedQuota.max} วัน
                {selectedQuota.remaining < 0 && (
                  <span className="ml-2 text-red-600 font-semibold">เกิน {Math.abs(selectedQuota.remaining)} วัน</span>
                )}
              </span>
            </div>
            <div className="w-full h-2 bg-ink-200 rounded-full overflow-hidden">
              <div
                className={cls('h-full transition-all', selectedQuota.remaining < 0 && 'bg-red-500')}
                style={selectedQuota.remaining >= 0 ? {
                  width: `${Math.min(100, (selectedQuota.used / Math.max(1, selectedQuota.max)) * 100)}%`,
                  background: selectedQuota.color,
                } : { width: '100%' }}
              />
            </div>
          </div>
        )}

        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">วันที่เริ่ม</label>
            <Input type="date" value={form.startDate} onChange={(e) => setForm({ ...form, startDate: e.target.value })} required />
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">วันที่สิ้นสุด</label>
            <Input
              type="date"
              value={form.endDate}
              onChange={(e) => setForm({ ...form, endDate: e.target.value })}
              disabled={form.period !== 'full'}
              required
            />
          </div>
        </div>

        {/* ช่วงเวลา */}
        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">ช่วงเวลา</label>
          <div className="grid grid-cols-4 gap-2">
            {[
              { id: 'full',      label: 'เต็มวัน',   sub: '1 วัน',    icon: 'calendar' },
              { id: 'morning',   label: 'ครึ่งวันเช้า',  sub: '0.5 วัน', icon: 'sparkle' },
              { id: 'afternoon', label: 'ครึ่งวันบ่าย',  sub: '0.5 วัน', icon: 'sparkle' },
              { id: 'hours',     label: 'รายชั่วโมง', sub: 'กำหนดเอง', icon: 'refresh' },
            ].map(p => (
              <button
                key={p.id} type="button"

                <div className="text-[10px] text-ink-500 mt-0.5">{p.sub}</div>
              </button>
            ))}
          </div>
        </div>

        {/* ระบุชั่วโมง (เฉพาะกรณี period=hours) */}
        {form.period === 'hours' && (
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">จำนวนชั่วโมง</label>
            <div className="flex items-center gap-2">
              <Input
                type="number"
                min={0.5} max={8} step={0.5}
                value={form.hours}
                onChange={(e) => setForm({ ...form, hours: Number(e.target.value) })}

                className="flex-1"
              />
              <span className="text-sm text-ink-500">ชั่วโมง</span>
              <span className="text-xs text-ink-400 ml-2">(8 ชม. = 1 วัน)</span>

                  {(selectedQuota.remaining - days) < 0 && <span className="text-red-600 font-semibold"> (ติดลบ)</span>}
                </>
              )}
              {skipQuotaCheck && (
                <span className="text-ink-500"> (ไม่นับโควต้า)</span>
              )}
            </span>
          </div>
        )}

        {/* ใบรับรองแพทย์ — เฉพาะลาป่วย */}
        {form.type === 'sick' && (
          <button
            type="button"
            onClick={() => setForm({ ...form, medicalCert: !form.medicalCert })}

            )}
          >
            <div className="flex items-center gap-2">
              <div className={cls('w-8 h-8 rounded-lg flex items-center justify-center',
                form.medicalCert ? 'bg-emerald-200 text-emerald-700' : 'bg-ink-200 text-ink-500')}>
                <Icon name="check" className="w-4 h-4" />

              <div className="text-left">

                <div className="text-xs text-ink-600">พนักงานรายเดือนที่มีใบรับรองแพทย์จะไม่ถูกหักเงิน</div>
              </div>
            </div>
            <div className={cls('relative w-11 h-6 rounded-full transition-colors shrink-0',
              form.medicalCert ? 'bg-emerald-500' : 'bg-ink-300')}>
              <div className={cls('absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform',
                form.medicalCert ? 'translate-x-[22px]' : 'translate-x-0.5')} />

          <Button type="submit" icon="check">
            {exceedsQuota && !skipQuotaCheck ? 'ส่งคำขอ (เกินโควต้า)' : 'ส่งคำขอ'}
          </Button>
        </div>
      </form>
    </Modal>
  );
};

// สร้างรหัสทรัพย์สินถัดไป: FFC-{ภาค}-{หมวด}-{รันนิ่ง4หลัก}
const genAssetCode = (branchId, catCode, existingAssets) => {
  const brCode = ASSET_BRANCH_CODE[branchId] || branchId;
  const prefix = `FFC-${brCode}-${catCode}-`;
  // หาเลขรันนิ่งสูงสุดที่มีอยู่
  let maxNum = 0;
  existingAssets.forEach(a => {
    if (a.code && a.code.startsWith(prefix)) {
      const num = parseInt(a.code.slice(prefix.length), 10);
      if (!isNaN(num) && num > maxNum) maxNum = num;
    }
  });
  return prefix + String(maxNum + 1).padStart(4, '0');
};

const AssetsPage = () => {
  const { assets, setAssets, branches, employees, departments, user, addToast } = useApp();
  const [search, setSearch] = useState('');
  const [filterBranch, setFilterBranch] = useState('all');
  const [filterCat, setFilterCat] = useState('all');
  const [filterStatus, setFilterStatus] = useState('all');
  const [openForm, setOpenForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [viewing, setViewing] = useState(null);
  const [showImport, setShowImport] = useState(false);
  const [showScanner, setShowScanner] = useState(false);

  const canEdit = user.role === 'admin' || user.role === 'hr';

  const filtered = useMemo(() => {
    return assets.filter(a => {
      if (user.role === 'manager' && a.branchId !== user.branchId) return false;
      if (filterBranch !== 'all' && a.branchId !== filterBranch) return false;
      if (filterCat !== 'all' && a.category !== filterCat) return false;
      if (filterStatus !== 'all' && a.status !== filterStatus) return false;
      if (search) {
        const q = search.toLowerCase();
        return [a.code, a.name, a.brand, a.serialNo, a.owner]
          .some(v => String(v || '').toLowerCase().includes(q));
      }
      return true;
    });
  }, [assets, filterBranch, filterCat, filterStatus, search, user]);

  // สถิติ
  const stats = useMemo(() => {
    const scoped = assets.filter(a => user.role !== 'manager' || a.branchId === user.branchId);
    const totalValue = scoped.reduce((s, a) => s + (Number(a.purchasePrice) || 0), 0);
    return {
      total: scoped.length,
      working: scoped.filter(a => a.status === 'ใช้งานได้').length,
      broken: scoped.filter(a => a.status === 'ชำรุด/รอซ่อม').length,
      totalValue,
    };
  }, [assets, user]);

  const deleteAsset = (id) => {
    if (!confirm('ยืนยันการลบทรัพย์สินรายการนี้?')) return;
    const updated = assets.filter(a => a.id !== id);
    setAssets(updated);
    addToast('success', 'ลบทรัพย์สินเรียบร้อย');
    if (api.enabled()) {
      api.post('deleteAsset', { id }).catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
  };

  const saveAsset = (asset) => {
    let updated;
    if (editing) {
      updated = assets.map(a => a.id === asset.id ? asset : a);
      addToast('success', 'บันทึกข้อมูลทรัพย์สินเรียบร้อย');
    } else {
      updated = [...assets, asset];
      addToast('success', 'เพิ่มทรัพย์สินเรียบร้อย');
    }
    setAssets(updated);
    if (api.enabled()) {
      api.post('saveAsset', { data: asset }).catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
    setOpenForm(false);
    setEditing(null);
  };

  const fmtBaht = (n) => Number(n || 0).toLocaleString('th-TH', { maximumFractionDigits: 0 });

  return (
    <div className="p-8 space-y-6 animate-fade-up">

            <Button variant="outline" icon="target" onClick={() => setShowScanner(true)}>สแกน QR</Button>
            {canEdit && <>
              <Button variant="outline" icon="upload" onClick={() => setShowImport(true)}>นำเข้า Excel</Button>
              <Button icon="plus" onClick={() => { setEditing(null); setOpenForm(true); }}>เพิ่มทรัพย์สิน</Button></>}
          </div>
        }
      />

      {/* Stat cards */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        {[
          { label: 'ทรัพย์สินทั้งหมด', value: stats.total,    color: 'flow',  icon: 'box',   suffix: 'รายการ' },
          { label: 'ใช้งานได้',        value: stats.working,  color: 'green', icon: 'check', suffix: 'รายการ' },
          { label: 'ชำรุด/รอซ่อม',     value: stats.broken,   color: 'red',   icon: 'wrench',suffix: 'รายการ' },
          { label: 'มูลค่าสินค้ารวม',  value: fmtBaht(stats.totalValue),  color: 'gold', icon: 'tag', suffix: 'บาท' },
        ].map(s => (
          <Card key={s.label} className="p-5 lift">
            <div className="flex items-center gap-3">
              <div className={cls('w-11 h-11 rounded-xl flex items-center justify-center shrink-0',
                s.color === 'flow'  && 'bg-flow-100 text-flow-700',
                s.color === 'green' && 'bg-emerald-100 text-emerald-700',
                s.color === 'red'   && 'bg-red-100 text-red-600',
                s.color === 'gold'  && 'bg-gold-100 text-gold-700',
                s.color === 'blue'  && 'bg-brand-100 text-brand-700',
              )}>
                <Icon name={s.icon} className="w-5 h-5" />
              </div>
              <div className="min-w-0">
                <div className="text-xs text-ink-500">{s.label}</div>
                <div className="font-display text-xl font-bold text-ink-900 truncate">{s.value}</div>
                <div className="text-[10px] text-ink-400">{s.suffix}</div>
              </div>
            </div>
          </Card>
        ))}
      </div>

      {/* Filters */}
      <Card className="p-4">
        <div className="grid md:grid-cols-4 gap-3">
          <div className="md:col-span-1">
            <Input icon="search" placeholder="ค้นหา รหัส/ชื่อ/ยี่ห้อ..." value={search} onChange={(e) => setSearch(e.target.value)} />
          </div>
          {user.role !== 'manager' && (
            <Select value={filterBranch} onChange={(e) => setFilterBranch(e.target.value)}>
              <option value="all">ทุกสาขา</option>
              {branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
            </Select>
          )}
          <Select value={filterCat} onChange={(e) => setFilterCat(e.target.value)}>
            <option value="all">ทุกหมวด</option>

              <optgroup key={g.group} label={g.groupTh}>
                {g.codes.map(c => <option key={c.code} value={c.code}>{c.name}</option>)}
              </optgroup>
            ))}
          </Select>
          <Select value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)}>
            <option value="all">ทุกสถานะ</option>
            {ASSET_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
          </Select>
        </div>
      </Card>

      {/* Table */}
      <Card className="overflow-hidden">
        {filtered.length === 0 ? (
          <Empty icon="box" title="ยังไม่มีทรัพย์สิน" desc="คลิก 'เพิ่มทรัพย์สิน' หรือ 'นำเข้า Excel' เพื่อเริ่มต้น" />
        ) : (
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead className="bg-ink-50 text-ink-600 text-left">
                <tr>
                  <th className="px-5 py-3 font-medium">รหัสทรัพย์สิน</th>
                  <th className="px-5 py-3 font-medium">ชื่อ / ยี่ห้อ</th>
                  <th className="px-5 py-3 font-medium">หมวด</th>
                  <th className="px-5 py-3 font-medium">สาขา</th>
                  <th className="px-5 py-3 font-medium">ผู้ดูแล</th>
                  <th className="px-5 py-3 font-medium text-right">มูลค่า</th>
                  <th className="px-5 py-3 font-medium">สถานะ</th>
                  <th className="px-5 py-3 font-medium text-right">จัดการ</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-ink-100">
                {filtered.map(a => {
                  const branch = branches.find(b => b.id === a.branchId);
                  const cat = ASSET_CODE_MAP[a.category];
                  return (
                    <tr key={a.id} className="hover:bg-flow-50/40 transition-colors cursor-pointer" onClick={() => setViewing(a)}>
                      <td className="px-5 py-3"><code className="text-xs font-mono text-brand-700 bg-brand-50 px-1.5 py-0.5 rounded">{a.code || '-'}</code></td>
                      <td className="px-5 py-3">
                        <div className="font-medium text-ink-900">{a.name}</div>
                        {a.brand && <div className="text-xs text-ink-500">{a.brand}</div>}
                      </td>
                      <td className="px-5 py-3 text-xs text-ink-600">{cat?.name || a.category || '-'}</td>
                      <td className="px-5 py-3"><Badge color="blue">{branch?.short || '-'}</Badge></td>
                      <td className="px-5 py-3 text-xs text-ink-600">{a.owner || '-'}</td>
                      <td className="px-5 py-3 text-right text-xs">
                        <div className="text-ink-900">{fmtBaht(a.purchasePrice)}</div>
                      </td>
                      <td className="px-5 py-3">
                        <Badge color={a.status === 'ใช้งานได้' ? 'green' : a.status === 'ชำรุด/รอซ่อม' ? 'red' : 'gray'}>
                          {a.status || '-'}
                        </Badge>
                      </td>
                      <td className="px-5 py-3 text-right" onClick={(e) => e.stopPropagation()}>
                        <div className="inline-flex gap-1">
                          <button onClick={() => setViewing(a)} className="p-1.5 rounded-lg text-ink-500 hover:bg-flow-50 hover:text-flow-700" title="ดู">
                            <Icon name="eye" className="w-4 h-4" />
                          </button>
                          {canEdit && (
                            <>
                              <button onClick={() => { setEditing(a); setOpenForm(true); }} className="p-1.5 rounded-lg text-ink-500 hover:bg-flow-50 hover:text-flow-700" title="แก้ไข">
                                <Icon name="edit" className="w-4 h-4" />
                              </button>
                              <button onClick={() => deleteAsset(a.id)} className="p-1.5 rounded-lg text-ink-500 hover:bg-red-50 hover:text-red-600" title="ลบ">
                                <Icon name="trash" className="w-4 h-4" />
                              </button>
                            </>
                          )}
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      <AssetFormModal
        open={openForm}
        onClose={() => { setOpenForm(false); setEditing(null); }}
        editing={editing}
        onSave={saveAsset}
        assets={assets}
        branches={branches}
        departments={departments}
        employees={employees}
      />

      <AssetProfileModal
        asset={viewing}
        onClose={() => setViewing(null)}
        branches={branches}
        employees={employees}
        onEdit={(a) => { setViewing(null); setEditing(a); setOpenForm(true); }}
        canEdit={canEdit}
        onReturn={(a) => {
          if (!confirm(`ยืนยันรับคืน "${a.name}" จากผู้ครอบครอง?`)) return;
          const updated = { ...a, assignedTo: '', assignedDate: '', assignedNote: '', lastCheck: new Date().toISOString().split('T')[0] };
          setAssets(assets.map(x => x.id === a.id ? updated : x));
          if (api.enabled()) api.post('saveAsset', { data: updated }).catch(err => addToast('error', 'บันทึกไม่สำเร็จ'));
          addToast('success', 'รับคืนทรัพย์สินเรียบร้อย');
          setViewing(updated);
        }}
      />

      <AssetScannerModal
        open={showScanner}
        onClose={() => setShowScanner(false)}
        assets={assets}
        onFound={(a) => { setShowScanner(false); setViewing(a); }}
      />

      <ImportAssetsModal
        open={showImport}
        onClose={() => setShowImport(false)}
        existingAssets={assets}
        branches={branches}
        onImport={(newAssets) => {
          // merge ด้วย id (unique เสมอ) — code อาจซ้ำกันได้ในไฟล์
          const map = new Map(assets.map(a => [a.id, a]));
          newAssets.forEach(a => map.set(a.id, a));
          const merged = Array.from(map.values());
          setAssets(merged);
          addToast('success', `นำเข้าทรัพย์สิน ${newAssets.length} รายการสำเร็จ`);
          if (api.enabled()) {
            (async () => {
              for (const a of newAssets) {
                try { await api.post('saveAsset', { data: a }); } catch (e) {}
              }
            })();
          }
          setShowImport(false);
        }}
      />
    </div>
  );
};

/* ===== ASSET PROFILE MODAL ===== */
const AssetProfileModal = ({ asset, onClose, branches, onEdit, canEdit, employees, onReturn }) => {
  const qrRef = useRef(null);
  useEffect(() => {
    if (asset && qrRef.current && window.QRCode) {
      window.QRCode.toCanvas(qrRef.current, asset.code || asset.id, { width: 120, margin: 1 }, () => {});
    }
  }, [asset]);
  if (!asset) return null;
  const branch = branches.find(b => b.id === asset.branchId);
  const cat = ASSET_CODE_MAP[asset.category];
  const fmtBaht = (n) => Number(n || 0).toLocaleString('th-TH', { maximumFractionDigits: 2 });
  const assignedEmp = (employees || []).find(e => e.id === asset.assignedTo);
  const assignedInactive = assignedEmp && assignedEmp.status === 'inactive';

  const rows = [
    ['ยี่ห้อ / รุ่น', asset.brand],
    ['Serial No.', asset.serialNo],
    ['หมวดทรัพย์สิน', cat ? `${cat.name} (${asset.category})` : asset.category],
    ['สาขา', branch?.name],
    ['แผนก / ฝ่าย', asset.department],
    ['ผู้ดูแล', asset.owner],
    ['วันที่ซื้อ', asset.purchaseDate ? fmtDate(asset.purchaseDate) : null],
    ['ราคาซื้อ', asset.purchasePrice != null ? `${fmtBaht(asset.purchasePrice)} บาท` : null],
    ['อายุการใช้งาน', asset.usefulLife],
    ['สภาพ', asset.condition],
    ['ตรวจสอบล่าสุด', asset.lastCheck ? fmtDate(asset.lastCheck) : null],
  ].filter(([, v]) => v != null && v !== '');

  // สร้าง barcode (Code128-like) จาก code — ใช้ SVG เส้นง่ายๆ จาก hash
  const renderBarcode = (text) => {
    if (!text) return null;
    // สร้างแถบจากรหัสอักขระ (เลียนแบบ barcode — สแกนไม่ได้จริง แต่ใช้ดู/อ้างอิง)
    let bars = [];
    let x = 0;
    for (let i = 0; i < text.length; i++) {
      const code = text.charCodeAt(i);
      for (let b = 0; b < 8; b++) {
        const w = ((code >> b) & 1) ? 2.5 : 1.2;
        if (b % 2 === 0) { bars.push(<rect key={`${i}-${b}`} x={x} y={0} width={w} height={40} fill="#1E293B" />); }
        x += w;
      }
    }
    return (
      <svg width={x} height={40} viewBox={`0 0 ${x} 40`} className="max-w-full">{bars}</svg>
    );
  };

  const printTag = async () => {
    // สร้าง QR เป็น dataURL
    let qrImg = '';
    try {
      if (window.QRCode) qrImg = await window.QRCode.toDataURL(asset.code || asset.id, { width: 160, margin: 1 });
    } catch (e) {}
    const win = window.open('', '_blank');
    if (!win) return;
    const S = 'scr' + 'ipt';
    win.document.write(`
      <html><head><title>Asset Tag ${asset.code}</title>
      <style>
        body{font-family:'Sarabun',sans-serif;padding:20px;text-align:center}
        .tag{border:2px solid #1E293B;border-radius:8px;padding:16px;display:inline-block;min-width:240px}
        .name{font-size:18px;font-weight:bold;margin-bottom:4px}
