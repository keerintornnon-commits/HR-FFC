            </thead>
            <tbody className="divide-y divide-ink-100">
              {filtered.map(att => {
                const emp = employees.find(e => e.id === att.employeeId);
                if (!emp) return null;
                const branch = branches.find(b => b.id === emp.branchId);
                let hours = '-';
                if (att.checkIn && att.checkOut) {
                  const [h1, m1] = String(att.checkIn).split(':').map(Number);
                  const [h2, m2] = String(att.checkOut).split(':').map(Number);
                  const diff = (h2 * 60 + m2) - (h1 * 60 + m1);
                  if (!isNaN(diff) && diff > 0) {
                    hours = `${Math.floor(diff / 60)}.${String(diff % 60).padStart(2,'0')} ชม.`;
                  }
                }
                const info = attStatusInfo(att.status, att.leaveType, leaveTypes, { leavePeriod: att.leavePeriod, leaveHours: att.leaveHours });
                const isLeaveOrAbsent = att.status === 'leave' || att.status === 'absent';
                const isWfh = att.status === 'wfh';
                const noTime = isLeaveOrAbsent || isWfh;  // ไม่มีเวลาเข้า-ออก
                return (
                  <tr key={att.id} className="hover:bg-ink-50/50 transition-colors">
                    <td className="px-5 py-3">
                      <div className="flex items-center gap-3">
                        <Avatar name={`${emp.firstName} ${emp.lastName}`} photo={emp.photo} size="sm" />
                        <div>
                          <div className="font-medium text-ink-900 text-sm">{emp.firstName} {emp.lastName}</div>
                          <div className="text-xs text-ink-500">{emp.id}</div>
                        </div>
                      </div>
                    </td>
                    <td className="px-5 py-3"><Badge color="blue">{branch?.short}</Badge></td>
                    <td className="px-5 py-3 font-mono text-ink-800">{normTime(att.checkIn) || '-'}</td>
                    <td className="px-5 py-3 font-mono text-ink-800">
                      {normTime(att.checkOut) || (noTime ? '-' : <Badge color="yellow">กำลังทำงาน</Badge>)}
                    </td>
                    <td className="px-5 py-3 text-ink-700">{hours}</td>
                    <td className="px-5 py-3">
                      <Badge color={info.color}>{info.label}</Badge>
                    </td>
                    <td className="px-5 py-3">
                      <span className="inline-flex items-center gap-1.5 text-xs text-ink-500">
                        <Icon name={noTime ? (isWfh ? 'building' : 'calendar') : 'fingerprint'} className="w-3.5 h-3.5" />
                        {isWfh ? 'ทำงานนอกออฟฟิศ' : isLeaveOrAbsent ? 'เทียบจากการลา' : (att.source === 'fingerprint' ? 'สแกนนิ้วมือ' : att.source)}
                      </span>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          {filtered.length === 0 && (
            <Empty
              icon="fingerprint"
              title="ไม่มีบันทึกการเข้างาน"
              desc="ยังไม่มีข้อมูลในวันที่เลือก หรืออัปโหลดไฟล์จากเครื่องสแกนลายนิ้วมือเพื่อเริ่มต้น"
              action={
                (user.role === 'admin' || user.role === 'hr') && (
                  <Button icon="upload" onClick={() => setShowUpload(true)}>อัปโหลด Excel</Button>
                )
              }
            />
          )}
        </div>
      </Card>

      <UploadAttendanceModal
        open={showUpload}
        onClose={() => setShowUpload(false)}
        onImport={(records) => {
          setAttendance([...attendance, ...records]);
          if (api.enabled()) {
            api.post('saveAttendanceBatch', { data: records })
              .then(() => addToast('success', `นำเข้าและบันทึก ${records.length} รายการสำเร็จ`))
              .catch(err => {
                console.error('saveAttendanceBatch error:', err);
                addToast('error', 'บันทึกลงฐานข้อมูลไม่สำเร็จ: ' + (err.message || err));
              });
          } else {
            addToast('success', `นำเข้าข้อมูล ${records.length} รายการ (โหมดออฟไลน์)`);
          }
          setShowUpload(false);
        }}
        employees={employees}
        settings={settings}
        leaves={leaves}
        leaveTypes={leaveTypes}
      />

      <ExportAttendanceModal
        open={showExport}
        onClose={() => setShowExport(false)}
        attendance={attendance}
        employees={employees.filter(e => !lockedBranch || e.branchId === lockedBranch)}
        branches={branches}
        leaveTypes={leaveTypes}
        leaves={leaves}
        lockedBranch={lockedBranch}
      />

      <BlankFormModal
        open={showBlankForm}
        onClose={() => setShowBlankForm(false)}
        employees={employees}
        branches={branches}
        lockedBranch={lockedBranch}
      />
    </div>
  );
};


/* ===== BLANK FORM MODAL — สร้างฟอร์มเปล่าให้กรอกเวลาสแกนนิ้ว ===== */
const BlankFormModal = ({ open, onClose, employees, branches, lockedBranch }) => {
  const [branchId, setBranchId] = useState(lockedBranch || 'all');
  const today = new Date().toISOString().slice(0, 10);
  const [fromDate, setFromDate] = useState(today);
  const [toDate, setToDate] = useState(today);

  useEffect(() => {
    if (lockedBranch) setBranchId(lockedBranch);
  }, [lockedBranch, open]);

  // นับจำนวนคน + วัน
  const branchEmps = useMemo(() => {
    let list = employees.filter(e => e.status !== 'inactive' && e.status !== 'ลาออก');
    if (branchId !== 'all') list = list.filter(e => e.branchId === branchId);
    return list.slice().sort((a, b) => String(a.id).localeCompare(String(b.id), undefined, { numeric: true }));
  }, [employees, branchId]);

  const dayList = useMemo(() => {
    const days = [];
    if (!fromDate || !toDate || fromDate > toDate) return days;
    let d = new Date(fromDate);
    const end = new Date(toDate);
    let guard = 0;
    while (d <= end && guard < 366) {
      days.push(d.toISOString().slice(0, 10));
      d.setDate(d.getDate() + 1);
      guard++;
    }
    return days;
  }, [fromDate, toDate]);

  const totalRows = branchEmps.length * dayList.length;

  const generate = () => {
    if (branchEmps.length === 0) { alert('ไม่มีพนักงานในสาขาที่เลือก'); return; }
    if (dayList.length === 0) { alert('กรุณาเลือกช่วงวันที่ให้ถูกต้อง'); return; }
    if (totalRows > 10000) { alert('ข้อมูลมากเกินไป (เกิน 10,000 แถว) กรุณาลดช่วงวันหรือเลือกสาขา'); return; }

    // หัวตาราง + ข้อมูล: เรียงตามคน → ทุกวันของคนนั้น (EMP001 ครบทุกวัน แล้วค่อย EMP002)
    const rows = [['employee_id', 'name', 'date', 'check_in', 'check_out']];
    branchEmps.forEach(emp => {
      dayList.forEach(date => {
        rows.push([emp.id, `${emp.firstName} ${emp.lastName}`, date, '', '']);  // เว้นช่องเวลา
      });
    });

    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{ wch: 12 }, { wch: 22 }, { wch: 12 }, { wch: 10 }, { wch: 10 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'ฟอร์มลงเวลา');
    const bName = branchId === 'all' ? 'ทุกสาขา' : (branches.find(b => b.id === branchId)?.name || branchId);
    XLSX.writeFile(wb, `ฟอร์มลงเวลา_${bName}_${fromDate}_ถึง_${toDate}.xlsx`);
    onClose();
  };

  if (!open) return null;
  return (
    <Modal open onClose={onClose} title="ดาวน์โหลดฟอร์มเปล่าสำหรับลงเวลา" size="md">
      <div className="space-y-4">
        <p className="text-sm text-ink-500">
          สร้างไฟล์ Excel ที่มีรายชื่อพนักงาน + วันที่ครบตามที่เลือก เว้นช่อง <b>เวลาเข้า/ออก</b> ให้กรอกจากเครื่องสแกนนิ้ว แล้วนำกลับมาอัปโหลด
        </p>

        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">สาขา</label>
          <Select value={branchId} onChange={(e) => setBranchId(e.target.value)} disabled={!!lockedBranch}>
            {!lockedBranch && <option value="all">ทุกสาขา</option>}
            {branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
          </Select>
        </div>

        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">จากวันที่</label>
            <Input type="date" value={fromDate} onChange={(e) => setFromDate(e.target.value)} />
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">ถึงวันที่</label>
            <Input type="date" value={toDate} onChange={(e) => setToDate(e.target.value)} />
          </div>
        </div>

        <div className="bg-flow-50 border border-flow-100 rounded-xl p-4 text-sm">
          <div className="flex items-center justify-between">
            <span className="text-ink-600">พนักงาน</span>
            <span className="font-semibold text-ink-900">{branchEmps.length} คน</span>
          </div>
          <div className="flex items-center justify-between mt-1">
            <span className="text-ink-600">จำนวนวัน</span>
            <span className="font-semibold text-ink-900">{dayList.length} วัน</span>
          </div>
          <div className="flex items-center justify-between mt-1 pt-2 border-t border-flow-100">
            <span className="text-ink-600">รวมทั้งหมด</span>
            <span className="font-bold text-flow-700">{totalRows.toLocaleString()} แถว</span>
          </div>
        </div>

        <div className="flex justify-end gap-2 pt-2">
          <Button variant="secondary" onClick={onClose}>ยกเลิก</Button>
          <Button icon="download" onClick={generate} disabled={totalRows === 0}>ดาวน์โหลดฟอร์ม</Button>
        </div>
      </div>
    </Modal>
  );
};


/* ===== EXPORT ATTENDANCE MODAL — ส่งออกประวัติเข้างานหลายคน ===== */
const ExportAttendanceModal = ({ open, onClose, attendance, employees, branches, leaveTypes, leaves, lockedBranch }) => {
  const today = new Date().toISOString().split('T')[0];
  const firstOfMonth = today.slice(0, 8) + '01';
  const [from, setFrom] = useState(firstOfMonth);
  const [to, setTo] = useState(today);
  const [branch, setBranch] = useState(lockedBranch || 'all');
  const [selected, setSelected] = useState([]);
  const [search, setSearch] = useState('');

  useEffect(() => { if (lockedBranch) setBranch(lockedBranch); }, [lockedBranch]);

  if (!open) return null;

  const branchEmps = employees.filter(e => branch === 'all' || e.branchId === branch);
  const visibleEmps = branchEmps.filter(e => {
    if (!search) return true;
    const q = search.toLowerCase();
    return (e.firstName + e.lastName + e.id + (e.nickname || '')).toLowerCase().includes(q);
  });

  const toggle = (id) => setSelected(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  const allSel = visibleEmps.length > 0 && visibleEmps.every(e => selected.includes(e.id));
  const toggleAll = () => setSelected(allSel ? selected.filter(id => !visibleEmps.some(e => e.id === id)) : [...new Set([...selected, ...visibleEmps.map(e => e.id)])]);

  const doExport = () => {
    const targetEmps = selected.length > 0 ? branchEmps.filter(e => selected.includes(e.id)) : branchEmps;
    if (targetEmps.length === 0) { alert('ไม่มีพนักงานให้ส่งออก'); return; }

    const XLSXlib = window.XLSX;
    const wb = XLSXlib.utils.book_new();

    // Sheet 1: สรุปรวม
    const summaryHeader = ['รหัส', 'ชื่อ-นามสกุล', 'ชื่อเล่น', 'สาขา', 'มาทำงาน', 'มาสาย', 'ขาดงาน', 'ลา', 'WFH'];
    const summaryRows = targetEmps.map(emp => {
      const recs = attendance.filter(a => a.employeeId === emp.id && toYMD(a.date) >= from && toYMD(a.date) <= to);
      const cnt = (st) => recs.filter(r => r.status === st).length;
      const br = branches.find(b => b.id === emp.branchId);
      // น้ำหนักวันมาทำงาน: เต็มวัน=1, มาครึ่งวัน(partial)=0.5 หรือตามชั่วโมงที่เหลือ
      const dayWeight = (a) => {
        if (['ontime','late','wfh','nocheckout'].includes(a.status)) return 1;
        if (a.status === 'partial') {
          if (a.leavePeriod === 'morning' || a.leavePeriod === 'afternoon') return 0.5;
          if (a.leavePeriod === 'hours' && a.leaveHours) return Math.max(0, (8 - Number(a.leaveHours)) / 8);
          return 0.5;
        }
        return 0;
      };
      const workDays = Math.round(recs.reduce((s, a) => s + dayWeight(a), 0) * 10) / 10;
      // วันลา (รวมครึ่งวันของ partial): leave เต็มวัน=1, partial ส่วนที่ลา = 1 - dayWeight
      const leaveDays = Math.round(recs.reduce((s, a) => {
        if (a.status === 'leave') return s + 1;
        if (a.status === 'partial') return s + (1 - dayWeight(a));
        return s;
      }, 0) * 10) / 10;
      return [
        emp.id, `${emp.firstName} ${emp.lastName}`, emp.nickname || '', br?.name || emp.branchId,
        workDays,            // มาทำงาน (รวมครึ่งวัน)
        cnt('late'), cnt('absent'),
        leaveDays,           // ลา (รวมครึ่งวัน)
        cnt('wfh'),
      ];
    });
    const ws1 = XLSXlib.utils.aoa_to_sheet([summaryHeader, ...summaryRows]);
    ws1['!cols'] = [{wch:10},{wch:22},{wch:10},{wch:16},{wch:9},{wch:8},{wch:8},{wch:6},{wch:6}];
    XLSXlib.utils.book_append_sheet(wb, ws1, 'สรุปรวม');

    // Sheet 2: รายละเอียดรายวัน
    const detailHeader = ['วันที่', 'รหัส', 'ชื่อ-นามสกุล', 'สาขา', 'เวลาเข้า', 'เวลาออก', 'สถานะ', 'ใบรับรองแพทย์', 'ยอดหัก'];
    const detailRows = [];
    targetEmps.forEach(emp => {
      const recs = attendance
        .filter(a => a.employeeId === emp.id && toYMD(a.date) >= from && toYMD(a.date) <= to)
        .sort((a, b) => toYMD(a.date).localeCompare(toYMD(b.date)));
      const br = branches.find(b => b.id === emp.branchId);
      recs.forEach(r => {
        const info = attStatusInfo(r.status, r.leaveType, leaveTypes, { leavePeriod: r.leavePeriod, leaveHours: r.leaveHours });
        const dYMD = toYMD(r.date);
        const hasCert = (r.status === 'leave' || r.status === 'partial') && (leaves || []).some(l =>
          l.employeeId === emp.id && l.type === 'sick' && l.medicalCert && l.status === 'approved' &&
          toYMD(l.startDate) <= dYMD && dYMD <= toYMD(l.endDate));
        const ded = recordDeduct(emp, r, leaves, leaveTypes);
        detailRows.push([
          toYMD(r.date), emp.id, `${emp.firstName} ${emp.lastName}`, br?.name || emp.branchId,
          normTime(r.checkIn) || '-', normTime(r.checkOut) || '-', info.label,
          hasCert ? 'มีใบรับรองแพทย์' : '',
          ded.amount > 0 ? ded.amount : '-',
        ]);
      });
    });
    const ws2 = XLSXlib.utils.aoa_to_sheet([detailHeader, ...detailRows]);
    ws2['!cols'] = [{wch:12},{wch:10},{wch:22},{wch:16},{wch:10},{wch:10},{wch:24},{wch:16},{wch:10}];
    XLSXlib.utils.book_append_sheet(wb, ws2, 'รายละเอียด');

    const brName = branch === 'all' ? 'ทุกสาขา' : (branches.find(b => b.id === branch)?.name || branch);
    XLSXlib.writeFile(wb, `ประวัติเข้างาน_${brName}_${from}_ถึง_${to}.xlsx`);
    onClose();
  };

  return (
    <Modal open={open} onClose={onClose} title="ส่งออกประวัติเข้างาน" size="lg">
      <div className="space-y-4">
        <div className="grid md:grid-cols-3 gap-3">
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">ตั้งแต่วันที่</label>
            <Input type="date" value={from} max={to} onChange={(e) => setFrom(e.target.value)} />
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">ถึงวันที่</label>
            <Input type="date" value={to} min={from} onChange={(e) => setTo(e.target.value)} />
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">สาขา</label>
            <Select value={branch} onChange={(e) => { setBranch(e.target.value); setSelected([]); }} disabled={!!lockedBranch}>
              {!lockedBranch && <option value="all">ทุกสาขา</option>}
              {branches.filter(b => !lockedBranch || b.id === lockedBranch).map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
            </Select>
          </div>
        </div>

        <div className="flex flex-wrap gap-1.5">
          {[
            { label: 'เดือนนี้', f: () => { const d = new Date(); return [`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`, today]; } },
            { label: 'เดือนก่อน', f: () => { const d = new Date(); d.setMonth(d.getMonth()-1); const y=d.getFullYear(),m=d.getMonth(); return [`${y}-${String(m+1).padStart(2,'0')}-01`, `${y}-${String(m+1).padStart(2,'0')}-${String(new Date(y,m+1,0).getDate()).padStart(2,'0')}`]; } },
            { label: '7 วันล่าสุด', f: () => { const d = new Date(); d.setDate(d.getDate()-6); return [d.toISOString().split('T')[0], today]; } },
          ].map(p => (
            <button key={p.label} type="button" onClick={() => { const [f, t] = p.f(); setFrom(f); setTo(t); }}
              className="text-xs px-2.5 py-1 rounded-lg border border-ink-200 hover:border-flow-400 hover:bg-flow-50">{p.label}</button>
          ))}
        </div>

        <div className="border border-ink-200 rounded-xl overflow-hidden">
          <div className="flex items-center justify-between px-3 py-2 bg-ink-50 border-b border-ink-100">
            <label className="flex items-center gap-2 text-sm font-medium cursor-pointer">
              <input type="checkbox" checked={allSel} onChange={toggleAll} className="rounded border-ink-300 text-flow-600" />
              เลือกทั้งหมด ({visibleEmps.length})
            </label>
            <span className="text-xs text-ink-500">{selected.length > 0 ? `เลือก ${selected.length} คน` : 'ไม่เลือก = ทุกคน'}</span>
          </div>
          <div className="p-2">
            <Input icon="search" placeholder="ค้นหาพนักงาน..." value={search} onChange={(e) => setSearch(e.target.value)} className="mb-2 !py-1.5 text-sm" />
            <div className="max-h-52 overflow-y-auto space-y-0.5">
              {visibleEmps.map(e => (
                <label key={e.id} className="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-ink-50 cursor-pointer text-sm">
                  <input type="checkbox" checked={selected.includes(e.id)} onChange={() => toggle(e.id)} className="rounded border-ink-300 text-flow-600" />
                  <span className="text-ink-800">{e.firstName} {e.lastName}{e.nickname ? ` (${e.nickname})` : ''}</span>
                  <span className="text-xs text-ink-400 ml-auto">{e.id}</span>
                </label>
              ))}
            </div>
          </div>
        </div>

        <div className="bg-flow-50 border border-flow-200 rounded-xl p-3 text-xs text-ink-700">
          ไฟล์ Excel จะมี 2 ชีต: <strong>สรุปรวม</strong> (จำนวนวันแต่ละสถานะรายคน) + <strong>รายละเอียด</strong> (รายวันทุกคน)
        </div>

        <div className="flex justify-end gap-2 pt-2 border-t border-ink-100">
          <Button variant="secondary" onClick={onClose}>ยกเลิก</Button>
          <Button icon="download" onClick={doExport}>ส่งออก Excel</Button>
        </div>
      </div>
    </Modal>
  );
};

const UploadAttendanceModal = ({ open, onClose, onImport, employees, settings, leaves, leaveTypes }) => {
  const fileRef = useRef(null);
  const [preview, setPreview] = useState(null);
  const [errors, setErrors]   = useState([]);

  const downloadTemplate = () => {
    // create sample Excel with the expected columns
    const ws = XLSX.utils.aoa_to_sheet([
      ['employee_id', 'date',       'check_in', 'check_out'],
      ['EMP1001',     '2025-01-15', '08:00',    '17:00'],
      ['EMP1002',     '2025-01-15', '08:30',    '17:30'],
    ]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Attendance');
    XLSX.writeFile(wb, 'attendance_template.xlsx');
  };

  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type: 'binary' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { defval: '', raw: true });

        // แปลงค่าเวลาจาก Excel เป็นรูปแบบ HH:MM
        // รองรับ: "08:30" (string), 0.3958 (Excel time fraction), 8.5 (decimal hour)
        const parseTime = (val) => {
          if (val === '' || val === null || val === undefined) return '';
          // ถ้าเป็น string ที่มี : อยู่แล้ว
          if (typeof val === 'string') {
            const s = val.trim();
            if (s === '') return '';
            // รูปแบบ HH:MM หรือ HH:MM:SS
            const m = s.match(/^(\d{1,2}):(\d{2})/);
            if (m) {
              return `${m[1].padStart(2,'0')}:${m[2]}`;
            }
            // string ที่เป็นตัวเลข (เช่น "0.3958")
            const num = parseFloat(s);
            if (!isNaN(num)) return fractionToTime(num);
            return s;
          }
          // ถ้าเป็นตัวเลข = Excel time fraction
          if (typeof val === 'number') {
            return fractionToTime(val);
          }
          return String(val);
        };

        // แปลง fraction (0-1) หรือ datetime serial เป็น HH:MM
        const fractionToTime = (num) => {
          // ถ้าเป็น datetime serial (เช่น 45678.396) เอาเฉพาะเศษทศนิยม (ส่วนที่เป็นเวลา)
          let frac = num >= 1 ? num - Math.floor(num) : num;
          const totalMinutes = Math.round(frac * 24 * 60);
          const h = Math.floor(totalMinutes / 60) % 24;
          const m = totalMinutes % 60;
          return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
        };

        const records = [];
        const errs = [];
        rows.forEach((row, idx) => {
          const empId = String(row.employee_id || row.รหัสพนักงาน || '').trim();
          const dateRaw = row.date !== undefined ? row.date : row.วันที่;
          const date  = String(dateRaw ?? '').trim();
          const checkIn  = parseTime(row.check_in  ?? row.เข้างาน);
          const checkOut = parseTime(row.check_out ?? row.ออกงาน);
          if (!empId) {
            errs.push(`แถวที่ ${idx + 2}: ไม่พบรหัสพนักงาน`);
            return;
          }
          if (!employees.some(e => e.id === empId)) {
            errs.push(`แถวที่ ${idx + 2}: ไม่พบพนักงานรหัส ${empId}`);
            return;
          }
          if (!date) {
            errs.push(`แถวที่ ${idx + 2}: ไม่ระบุวันที่`);
            return;
          }
          // normalize date → YYYY-MM-DD
          let normDate;
          if (typeof dateRaw === 'number') {
            // Excel serial number → ใช้ SSF
            const d = XLSX.SSF.parse_date_code(dateRaw);
            normDate = d ? `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}` : '';
          } else {
            normDate = toYMD(dateRaw);
          }
          if (!normDate) normDate = date;

          let status, leaveType = null, leavePeriod = null, leaveHours = null;

          // หาการลาที่อนุมัติแล้วในวันนั้น (ใช้ทั้งกรณีมี/ไม่มีสแกน)
          const matchLeave = (leaves || []).find(l =>
            l.employeeId === empId &&
            l.status === 'approved' &&
            toYMD(l.startDate) <= normDate &&
            toYMD(l.endDate)   >= normDate
          );

          if (!checkIn && !checkOut) {
            // ไม่มีเวลาเข้า-ออก → เทียบกับการลาที่อนุมัติแล้วในวันนั้น
            if (matchLeave) {
              if (matchLeave.type === 'wfh' || matchLeave.type === 'offsite') {
                status = 'wfh';
              } else {
                status = 'leave';
              }
              leaveType = matchLeave.type;
              leavePeriod = matchLeave.period || 'full';
              leaveHours = matchLeave.hours || null;
            } else {
              // เช็ควันอาทิตย์ — ไม่ใช่วันทำงาน ไม่นับขาดงาน
              const dObj = new Date(normDate + 'T00:00:00');
              if (!isNaN(dObj) && dObj.getDay() === 0) {
                status = 'holiday';   // วันหยุด (อาทิตย์)
              } else {
                status = 'absent';
              }
            }
          } else {
            // มีการสแกน (เข้า และ/หรือ ออก)
            // 1) คำนวณ ตรงเวลา/สาย จากเวลาเข้า (ใช้เวลามาตรฐานตรึง: เข้า 08:00 สายได้ 5 นาที)
            const baseAtt = (checkIn && lateMinutesOf(checkIn) > 0) ? 'late' : 'ontime';

            // 2) ถ้ามีลาครึ่งวัน/ลาเป็นชั่วโมงในวันเดียวกัน → ขึ้นสถานะลาแบบนั้น (มาทำงานบางส่วน + ลาบางส่วน)
            const isPartialLeave = matchLeave &&
              matchLeave.type !== 'wfh' && matchLeave.type !== 'offsite' &&
              (matchLeave.period === 'morning' || matchLeave.period === 'afternoon' || matchLeave.period === 'hours');

            if (isPartialLeave) {
              status = 'partial';                 // มาทำงาน + ลาบางส่วน
              leaveType = matchLeave.type;
              leavePeriod = matchLeave.period;
              leaveHours = matchLeave.hours || null;
            } else if (checkIn && !checkOut) {
              // 3) สแกนเข้าแต่ไม่สแกนออก
              status = 'nocheckout';
            } else {
              status = baseAtt;
            }
          }

          records.push({
            id: `ATT_${empId}_${normDate}`,   // id เสถียร: กันซ้ำ + อัปโหลดซ้ำทับของเดิม
            employeeId: empId,
            date: normDate,
            checkIn,
            checkOut: checkOut || null,
            source: 'fingerprint',
            status,
            leaveType,  // เก็บประเภทการลา (ถ้า status = leave/partial)
            leavePeriod, // full/morning/afternoon/hours
            leaveHours,  // จำนวนชั่วโมง (ถ้าลาเป็นชั่วโมง)
          });
        });
        setPreview(records);
        setErrors(errs);
      } catch (err) {
        setErrors([`อ่านไฟล์ไม่สำเร็จ: ${err.message}`]);
        setPreview(null);
      }
    };
    reader.readAsBinaryString(file);
  };

  const reset = () => { setPreview(null); setErrors([]); if (fileRef.current) fileRef.current.value = ''; };
  const close = () => { reset(); onClose(); };

  return (
    <Modal open={open} onClose={close} title="อัปโหลดข้อมูลการเข้างานจาก Excel" size="lg">
      {!preview ? (
        <div className="space-y-5">
          <div className="bg-flow-50 border border-flow-200 rounded-xl p-4">
            <div className="flex items-start gap-3">
              <div className="w-8 h-8 rounded-lg bg-flow-100 text-flow-700 flex items-center justify-center shrink-0">
                <Icon name="info" className="w-4 h-4" />
              </div>
              <div className="text-sm text-ink-700">
                <strong>รูปแบบไฟล์ที่ต้องการ:</strong> ไฟล์ Excel (.xlsx, .xls) ที่ส่งออกจากเครื่องสแกนลายนิ้วมือ
                ต้องมีคอลัมน์: <code className="px-1.5 py-0.5 bg-white rounded font-mono text-xs">employee_id</code>,
                <code className="ml-1 px-1.5 py-0.5 bg-white rounded font-mono text-xs">date</code>,
                <code className="ml-1 px-1.5 py-0.5 bg-white rounded font-mono text-xs">check_in</code>,
                <code className="ml-1 px-1.5 py-0.5 bg-white rounded font-mono text-xs">check_out</code>
                <button onClick={downloadTemplate} className="mt-2 inline-flex items-center gap-1.5 text-flow-700 hover:text-flow-800 font-medium">
                  <Icon name="download" className="w-4 h-4" />
                  ดาวน์โหลดไฟล์ตัวอย่าง
                </button>
              </div>
            </div>
          </div>

          <label className="block">
            <div className="border-2 border-dashed border-ink-200 hover:border-flow-400 hover:bg-flow-50/30 rounded-2xl p-10 text-center cursor-pointer transition-colors">
              <div className="w-16 h-16 mx-auto rounded-2xl bg-flow-100 text-flow-700 flex items-center justify-center mb-3">
                <Icon name="upload" className="w-7 h-7" />
              </div>
              <div className="font-display font-semibold text-ink-900 mb-1">ลากไฟล์มาที่นี่ หรือคลิกเพื่อเลือก</div>
              <div className="text-sm text-ink-500">รองรับไฟล์ .xlsx และ .xls (สูงสุด 10MB)</div>
              <input ref={fileRef} type="file" accept=".xlsx,.xls" onChange={handleFile} className="hidden" />
            </div>
          </label>

          {errors.length > 0 && (
            <div className="bg-red-50 border border-red-200 rounded-xl p-4 text-sm">
              <div className="font-medium text-red-700 mb-2">ตรวจพบปัญหา {errors.length} รายการ:</div>
              <ul className="space-y-1 text-red-600 text-xs">
                {errors.slice(0, 5).map((er, i) => <li key={i}>• {er}</li>)}
                {errors.length > 5 && <li className="text-red-500">...และอีก {errors.length - 5} รายการ</li>}
              </ul>
            </div>
          )}
        </div>
      ) : (
        <div className="space-y-4">
          <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4 flex items-center gap-3">
            <div className="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center">
              <Icon name="check" className="w-4 h-4" />
            </div>
            <div className="text-sm">
              <strong className="text-emerald-700">พบข้อมูล {preview.length} รายการ</strong>
              {errors.length > 0 && <span className="text-ink-600 ml-2">(ข้ามไป {errors.length} แถว ที่มีปัญหา)</span>}
            </div>
          </div>

          <div className="border border-ink-100 rounded-xl overflow-hidden max-h-80 overflow-y-auto">
            <table className="w-full text-xs">
              <thead className="bg-ink-50 text-ink-600 sticky top-0">
                <tr>
                  <th className="text-left px-3 py-2">รหัส</th>
                  <th className="text-left px-3 py-2">วันที่</th>
                  <th className="text-left px-3 py-2">เข้างาน</th>
                  <th className="text-left px-3 py-2">ออกงาน</th>
                  <th className="text-left px-3 py-2">สถานะ</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-ink-100">
                {preview.slice(0, 20).map((r, i) => {
                  const info = attStatusInfo(r.status, r.leaveType, leaveTypes, { leavePeriod: r.leavePeriod, leaveHours: r.leaveHours });
                  return (
                    <tr key={i}>
                      <td className="px-3 py-2 font-mono">{r.employeeId}</td>
                      <td className="px-3 py-2">{r.date}</td>
                      <td className="px-3 py-2 font-mono">{r.checkIn || '-'}</td>
                      <td className="px-3 py-2 font-mono">{r.checkOut || '-'}</td>
                      <td className="px-3 py-2">
                        <Badge color={info.color}>{info.label}</Badge>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            {preview.length > 20 && (
              <div className="px-3 py-2 text-center text-xs text-ink-500 bg-ink-50">
                ...และอีก {preview.length - 20} รายการ
              </div>
            )}
          </div>

          <div className="flex justify-end gap-2 pt-4 border-t border-ink-100">
            <Button variant="secondary" onClick={reset}>ยกเลิก</Button>
            <Button icon="check" onClick={() => { onImport(preview); reset(); }}>นำเข้าข้อมูล</Button>
          </div>
        </div>
      )}
    </Modal>
  );
};

/* =============================================================
   IMPORT EMPLOYEES MODAL — นำเข้าพนักงาน + ประวัติการลา จาก Excel
   รองรับไฟล์ format เดิมของบริษัท (ชีต "พนักงาน" และ "บันทึกการลา")
   ============================================================= */
const ImportEmployeesModal = ({ open, onClose, existingEmployees, branches, leaveTypes, onImport }) => {
  const fileRef = useRef(null);
  const [preview, setPreview] = useState(null);  // { employees: [], leaves: [] }
  const [errors, setErrors] = useState([]);
  const [tab, setTab] = useState('employees');

  // mapping: ชื่อภาคไทย → branchId
  const branchMap = useMemo(() => {
    const m = {};
    branches.forEach(b => {
      m[b.name] = b.id;
      m[b.short] = b.id;
      m[b.id] = b.id;
    });
    // map ดั้งเดิม
    m['ภาคกลาง']  = m['ภาคกลาง']  || 'LLK';
    m['ภาคอีสาน'] = m['ภาคอีสาน'] || 'ISN';
    m['ภาคเหนือ'] = m['ภาคเหนือ'] || 'NRT';
    return m;
  }, [branches]);

  // mapping: ประเภทการลาภาษาไทย → id
  const leaveTypeMap = useMemo(() => {
    const m = {};
    leaveTypes.forEach(t => {
      m[t.label] = t.id;
      m[t.id] = t.id;
    });
    // เพิ่ม mapping ตามไฟล์ตัวอย่าง
    m['ลาป่วย']            = m['ลาป่วย']    || 'sick';
    m['ลากิจ']             = m['ลากิจ']     || 'personal';
    m['ลาพักร้อน']         = m['ลาพักร้อน'] || 'vacation';
    m['ลาคลอด']            = m['ลาคลอด']   || 'maternity';
    m['ลาบวช']             = m['ลาบวช']    || 'ordain';
    m['ขาดงาน']            = 'absent';
    m['ลาไม่รับเงินเดือน'] = 'unpaid';
    return m;
  }, [leaveTypes]);

  const reset = () => {
    setPreview(null); setErrors([]);
    if (fileRef.current) fileRef.current.value = '';
  };
  const close = () => { reset(); onClose(); };

  const handleFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type: 'binary', cellDates: true });
        const errs = [];
        const employees = [];
        const leaves = [];

        // ===== หาชีตพนักงาน =====
        const empSheetName = wb.SheetNames.find(n =>
          /พนักงาน|employees?/i.test(n)) || wb.SheetNames[0];
        const empWs = wb.Sheets[empSheetName];
        const empRows = XLSX.utils.sheet_to_json(empWs, { defval: '', raw: false });

        empRows.forEach((row, idx) => {
          // หา field โดยลองหลายชื่อ
          const id = String(row['รหัสพนักงาน'] || row['employee_id'] || row['id'] || '').trim();
          const fullName = String(row['ชื่อ-นามสกุล'] || row['ชื่อ'] || row['name'] || '').trim();
          const branchRaw = String(row['ภาค'] || row['สาขา'] || row['branch'] || '').trim();
          const position = String(row['ตำแหน่ง'] || row['position'] || '').trim();
          const department = String(row['แผนก'] || row['department'] || '').trim();
          const startDate = row['วันเริ่มงาน'] || row['startDate'] || '';
          const phone = String(row['โทรศัพท์'] || row['phone'] || '').trim();
          const statusRaw = String(row['สถานะ'] || row['status'] || 'ทำงานอยู่').trim();

          // โควต้าการลาเฉพาะบุคคล
          const sickQ = row['สิทธิ์ป่วย/ปี'];
          const vacQ  = row['สิทธิ์พักร้อน/ปี'];
          const perQ  = row['สิทธิ์กิจ/ปี'];

          if (!id) return; // ข้าม row ว่าง
          if (!fullName) {
            errs.push(`พนักงาน แถว ${idx+2}: ไม่ระบุชื่อ (${id})`);
            return;
          }

          // แยกชื่อ-นามสกุล
          const parts = fullName.split(/\s+/);
          const firstName = parts[0] || fullName;
          const lastName  = parts.slice(1).join(' ');

          // map ภาค → branchId
          const branchId = branchMap[branchRaw] || (branchRaw ? branchRaw : 'LLK');

          // โควต้าเฉพาะบุคคล (override)
          // ถ้าเป็น "-" → บันทึก "-" เพื่อให้รู้ว่าไม่ได้กำหนดสิทธิ์ (ลาแล้วติดลบ)
          // ถ้าเป็นตัวเลข → บันทึกเป็นจำนวนเต็ม
          // ถ้าว่าง → ไม่ override (ใช้ค่า default)
          const overrideQuota = {};
          const setOverride = (key, val) => {
            const s = String(val ?? '').trim();
            if (s === '') return;             // ว่าง — ไม่ override
            if (s === '-') overrideQuota[key] = '-';  // ไม่กำหนดสิทธิ์
            else if (!isNaN(Number(s))) overrideQuota[key] = Number(s);
          };
          setOverride('sick',     sickQ);
          setOverride('vacation', vacQ);
          setOverride('personal', perQ);

          // แปลงวันเริ่มงาน
          let startDateStr = new Date().toISOString().split('T')[0];
          if (startDate instanceof Date) {
            startDateStr = startDate.toISOString().split('T')[0];
          } else if (typeof startDate === 'string' && startDate.trim()) {
            const d = new Date(startDate);
            if (!isNaN(d)) startDateStr = d.toISOString().split('T')[0];
          }

          employees.push({
            id, firstName, lastName,
            branchId, department: department || 'ทั่วไป',
            position: position || 'พนักงาน',
            email: '', phone,
            startDate: startDateStr,
            status: /ลาออก|พ้น|inactive/.test(statusRaw) ? 'inactive' : 'active',
            leaveQuotaOverride: overrideQuota,
            photo: '',
          });
        });

        // ===== หาชีตการลา (ถ้ามี) =====
        const lvSheetName = wb.SheetNames.find(n =>
          /บันทึกการลา|leaves?|การลา/i.test(n));
        if (lvSheetName) {
          const lvWs = wb.Sheets[lvSheetName];
          const lvRows = XLSX.utils.sheet_to_json(lvWs, { defval: '', raw: false });

          lvRows.forEach((row, idx) => {
            const empId = String(row['รหัสพนักงาน'] || row['employee_id'] || '').trim();
            const typeRaw = String(row['ประเภทการลา'] || row['type'] || '').trim();
            const startRaw = row['วันที่เริ่มลา'] || row['startDate'] || row['start_date'] || '';
            const endRaw   = row['วันที่สิ้นสุด'] || row['endDate']   || row['end_date']   || '';
            const days = Number(row['จำนวนวัน'] || row['days'] || 0);
            const period = String(row['ช่วงเวลา'] || '').trim();
            const reason = String(row['หมายเหตุ'] || row['reason'] || '').trim();
            const statusRaw = String(row['สถานะ'] || row['status'] || 'อนุมัติ').trim();

            if (!empId) return;
            if (!typeRaw || !startRaw) {
              errs.push(`การลา แถว ${idx+2}: ข้อมูลไม่ครบ (${empId})`);
              return;
            }

            // แปลงวันที่
            const toDateStr = (v) => {
              if (v instanceof Date) return v.toISOString().split('T')[0];
              if (typeof v === 'string') {
                const d = new Date(v);
                if (!isNaN(d)) return d.toISOString().split('T')[0];
              }
              return '';
            };
            const startDate = toDateStr(startRaw);
            const endDate = toDateStr(endRaw) || startDate;
            if (!startDate) return;

            const typeId = leaveTypeMap[typeRaw] || typeRaw.toLowerCase();
            const status = /อนุมัติ|approved/.test(statusRaw) ? 'approved'
                         : /ปฏิเสธ|rejected/.test(statusRaw) ? 'rejected'
                         : 'pending';

            leaves.push({
              id: `LV_IMP_${empId}_${idx}_${startDate.replace(/-/g,'')}`,
              employeeId: empId,
              type: typeId,
              startDate, endDate,
              days: days || 1,
              reason: reason + (period ? ` [${period}]` : ''),
              status,
              createdAt: new Date(startDate).toISOString(),
            });
          });
        }

        // ตรวจสอบ leave references
        const empIdSet = new Set(employees.map(e => e.id).concat(existingEmployees.map(e => e.id)));
        const orphanLeaves = leaves.filter(l => !empIdSet.has(l.employeeId)).length;
        if (orphanLeaves > 0) {
          errs.push(`มี ${orphanLeaves} รายการลา อ้างถึงรหัสพนักงานที่ไม่มีในระบบ`);
        }

        setPreview({ employees, leaves, empSheetName, lvSheetName });
        setErrors(errs);
        setTab('employees');
      } catch (err) {
        setErrors([`อ่านไฟล์ไม่สำเร็จ: ${err.message}`]);
        setPreview(null);
      }
    };
    reader.readAsBinaryString(file);
  };

  if (!open) return null;

  return (
    <Modal open={open} onClose={close} title="นำเข้าข้อมูลพนักงานจาก Excel" size="xl">
      {!preview ? (
        <div className="space-y-5">
          <div className="bg-flow-50 border border-flow-200 rounded-xl p-4">
            <div className="flex items-start gap-3">
              <div className="w-8 h-8 rounded-lg bg-flow-100 text-flow-700 flex items-center justify-center shrink-0">
                <Icon name="info" className="w-4 h-4" />
              </div>
              <div className="text-sm text-ink-700">
                <div className="font-medium text-flow-800 mb-1">รองรับไฟล์ Excel ที่มี:</div>
                <ul className="space-y-0.5 text-xs">
                  <li>• <strong>ชีตพนักงาน</strong> — ต้องมีคอลัมน์: <code className="px-1 bg-white rounded">รหัสพนักงาน</code>, <code className="px-1 bg-white rounded">ชื่อ-นามสกุล</code>, <code className="px-1 bg-white rounded">ภาค</code></li>
                  <li>• <strong>ชีตบันทึกการลา (ถ้ามี)</strong> — ระบบจะนำเข้าประวัติให้ด้วย</li>
                  <li>• <strong>ภาคจะแปลงอัตโนมัติ</strong>: ภาคกลาง→LLK, อีสาน→ISN, เหนือ→NRT</li>

          var prevBodyBg = document.body.style.background;
          el.style.minHeight = 'auto';
          el.style.boxShadow = 'none';
          el.style.margin = '0';
          wrap.style.padding = '0';
          wrap.style.display = 'block';
          document.body.style.background = '#fff';

            pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
          };

            el.style.minHeight = prev.minHeight;
            el.style.boxShadow = prev.boxShadow;
            el.style.margin = prev.margin;
            wrap.style.padding = prevWrap.padding;
            wrap.style.justifyContent = prevWrap.justifyContent;
