          <tr><td class="label">สังกัด</td><td class="colon">:</td><td>${branchName}</td></tr>
          <tr><td class="label">อัตราเงินเดือน</td><td class="colon">:</td><td>${salary}</td></tr>
        </table>
        <p class="closing">${companyTh} ออกหนังสือรับรองฉบับนี้เพื่อรับรองว่าเป็นพนักงานของบริษัทจริง</p>
        <div class="sign-block">
          <div class="sign-company">${companyTh}</div>
          <img src="${SIGNATURE_HR}" class="sign-img" alt="signature" />
          <div class="sign-name">( นายฉัตรดนัย ลี้ฮะจือ )</div>
          <div class="sign-role">ฝ่ายบุคคล</div>
        </div>
        <div class="footer">หนังสือรับรองฉบับนี้ออกโดยระบบ FreedomFlow HR · เลขที่ ${req.id}</div>
      </div>
    </div>
    <${S}>
      function downloadPDF() {
        var el = document.getElementById('cert-page');
        var wrap = el.parentElement;
        // เก็บค่าเดิม
        var prev = { minHeight: el.style.minHeight, boxShadow: el.style.boxShadow, margin: el.style.margin };
        var prevWrap = { padding: wrap.style.padding, justifyContent: wrap.style.justifyContent, display: wrap.style.display };
        var prevBodyBg = document.body.style.background;
        // ปรับ element ให้ html2canvas จับได้พอดี ไม่เลื่อน/ไม่ตัดขอบ
        el.style.minHeight = 'auto';
        el.style.boxShadow = 'none';
        el.style.margin = '0';
        wrap.style.padding = '0';
        wrap.style.display = 'block';
        document.body.style.background = '#fff';
        window.scrollTo(0, 0);
        var opt = {
          margin: 0,
          filename: '${fileName}.pdf',
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true, scrollX: 0, scrollY: 0 },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
          pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
        };
        var restore = function() {
          el.style.minHeight = prev.minHeight;
          el.style.boxShadow = prev.boxShadow;
          el.style.margin = prev.margin;
          wrap.style.padding = prevWrap.padding;
          wrap.style.justifyContent = prevWrap.justifyContent;
          wrap.style.display = prevWrap.display;
          document.body.style.background = prevBodyBg;
        };
        if (window.html2pdf) {
          window.html2pdf().set(opt).from(el).save().then(restore).catch(restore);
        } else {
          restore();
          alert('กำลังโหลดตัวสร้าง PDF กรุณาลองใหม่อีกครั้ง');
        }
      }
    </${S}>
    </body></html>`);
  win.document.close();
};

/* ===== CHECK-IN CARD — เช็คอิน/เช็คเอาท์ด้วย GPS ===== */
/* ===== CHECK-IN PAGE — หน้าเช็คอิน/เอาท์ (โมดูลแยก ดีไซน์ปุ่มวงกลม) ===== */
const CheckInPage = () => {
  const { employees, attendance, setAttendance, branches, addToast, user } = useApp();
  const me = employees.find(e => e.id === user.empId);
  const [busy, setBusy] = useState(false);
  const [gpsMsg, setGpsMsg] = useState('');
  const [now, setNow] = useState(new Date());

  // นาฬิกาเรียลไทม์
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);

  if (!me) {
    return (
      <div>
        <Topbar title="เช็คอิน-เอาท์" subtitle="ลงเวลาเข้า-ออกงานตามพิกัดสาขา" />
        <Card className="p-8 text-center text-ink-400">
          ไม่พบข้อมูลพนักงานของบัญชีนี้ — บัญชีนี้อาจไม่ได้ผูกกับพนักงาน (เช่น admin/hr)
        </Card>
      </div>
    );
  }

  const today = new Date().toISOString().slice(0, 10);
  const branchList = (branches && branches.length) ? branches : DEFAULT_BRANCHES;
  const myBranch = branchList.find(b => b.id === me.branchId);
  const todayRec = attendance.find(a => a.employeeId === me.id && toYMD(a.date) === today);
  const hasCheckIn = todayRec && todayRec.checkIn;
  const hasCheckOut = todayRec && todayRec.checkOut;
  // โหมดถัดไป: ยังไม่เข้า → in, เข้าแล้วยังไม่ออก → out, ครบแล้ว → done
  const nextMode = !hasCheckIn ? 'in' : !hasCheckOut ? 'out' : 'done';

  // คำนวณชั่วโมงรวม (ถ้ามีทั้งเข้า-ออก)
  const totalHrs = (() => {
    if (!hasCheckIn || !hasCheckOut) return null;
    const ci = normTime(todayRec.checkIn), co = normTime(todayRec.checkOut);
    if (!ci || !co) return null;
    const [h1, m1] = ci.split(':').map(Number);
    const [h2, m2] = co.split(':').map(Number);
    let mins = (h2 * 60 + m2) - (h1 * 60 + m1);
    if (mins < 0) mins = 0;
    const h = Math.floor(mins / 60), m = mins % 60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  })();

  const doCheck = (mode) => {
    if (!myBranch || myBranch.lat == null || myBranch.lng == null) {
      addToast('error', 'สาขาของคุณยังไม่ได้ตั้งค่าพิกัด GPS — แจ้ง HR/admin'); return;
    }
    if (!navigator.geolocation) { addToast('error', 'อุปกรณ์นี้ไม่รองรับ GPS'); return; }
    setBusy(true);
    setGpsMsg('กำลังระบุตำแหน่ง...');
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const { latitude, longitude } = pos.coords;
        const dist = distanceMeters(latitude, longitude, Number(myBranch.lat), Number(myBranch.lng));
        const radius = Number(myBranch.radius) || 200;
        if (dist > radius) {
          setBusy(false); setGpsMsg('');
          addToast('error', `อยู่นอกพื้นที่สาขา (ห่าง ${dist} ม. / อนุญาต ${radius} ม.)`);
          return;
        }
        const n = new Date();
        const hhmm = `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
        const recId = todayRec?.id || `ATT_${me.id}_${today}`;
        let rec;
        if (mode === 'in') {
          const late = calcLateFine(hhmm) > 0;
          rec = { ...(todayRec || {}), id: recId, employeeId: me.id, date: today, checkIn: hhmm, status: late ? 'late' : 'ontime', source: 'gps' };
        } else {
          rec = { ...(todayRec || {}), id: recId, employeeId: me.id, date: today, checkOut: hhmm, source: 'gps' };
        }
        setAttendance(prev => {
          const idx = prev.findIndex(a => a.id === recId);
          if (idx >= 0) { const copy = [...prev]; copy[idx] = rec; return copy; }
          return [...prev, rec];
        });
        // บันทึกลง DB — ถ้าพลาด เตือนชัดเจน (ไม่ขึ้นว่าสำเร็จ)
        let saved = true;
        if (api.enabled()) {
          try {
            await api.post('saveAttendance', { data: rec });
          } catch (err) {
            saved = false;
            addToast('error', 'บันทึกลงฐานข้อมูลไม่สำเร็จ: ' + (err.message || err) + ' — ลองใหม่อีกครั้ง');
            console.error('saveAttendance error:', err);
          }
        }
        setBusy(false); setGpsMsg('');
        if (saved) {
          addToast('success', `${mode === 'in' ? 'เช็คอิน' : 'เช็คเอาท์'}สำเร็จ ${hhmm} (ห่างสาขา ${dist} ม.)`);
        }
      },
      (err) => { setBusy(false); setGpsMsg(''); addToast('error', 'ดึงตำแหน่งไม่สำเร็จ: ' + err.message); },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  };

  const TH_DAYS = ['วันอาทิตย์','วันจันทร์','วันอังคาร','วันพุธ','วันพฤหัสบดี','วันศุกร์','วันเสาร์'];
  const clockStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
  const dateStr = `${TH_DAYS[now.getDay()]}ที่ ${now.getDate()} ${THAI_MONTHS[now.getMonth()]} ${now.getFullYear() + 543}`;

  return (
    <div>
      <Topbar title="เช็คอิน-เอาท์" subtitle="ลงเวลาเข้า-ออกงานตามพิกัดสาขา" />

      <div className="max-w-md mx-auto">
        <Card className="p-6">
          {/* นาฬิกา */}
          <div className="text-center">
            <div className="font-display text-4xl font-bold text-brand-700 tracking-wide">{clockStr}</div>
            <div className="text-sm text-flow-600 mt-1">{dateStr}</div>
          </div>

          {/* ปุ่มวงกลมใหญ่ */}
          <div className="flex justify-center my-8">
            <button
              onClick={() => nextMode !== 'done' && !busy && doCheck(nextMode)}
              disabled={busy || nextMode === 'done'}
              className={cls(
                'relative w-52 h-52 rounded-full flex flex-col items-center justify-center transition-all',
                nextMode === 'done'
                  ? 'bg-ink-100 cursor-default'
                  : nextMode === 'in'
                    ? 'bg-brand-700 hover:bg-brand-800 active:scale-95 shadow-lg cursor-pointer'
                    : 'bg-flow-600 hover:bg-flow-700 active:scale-95 shadow-lg cursor-pointer',
                busy && 'opacity-70 cursor-wait',
              )}
              style={{ boxShadow: nextMode !== 'done' ? '0 0 0 12px rgba(11,42,74,0.08)' : 'none' }}>
              {nextMode === 'done' ? (
                <>
                  <Icon name="check" className="w-12 h-12 text-emerald-600 mb-1" />
                  <span className="text-ink-500 font-medium">เสร็จสิ้นวันนี้</span>
                </>
              ) : (
                <>
                  <div className="text-5xl mb-2">👆</div>
                  <span className="text-white text-xl font-semibold">{busy ? 'กำลังบันทึก...' : nextMode === 'in' ? 'Check In' : 'Check Out'}</span>
                </>
              )}
            </button>
          </div>

          {gpsMsg && <div className="text-center text-sm text-flow-600 mb-4">{gpsMsg}</div>}

          {/* สถิติ 3 ช่อง */}
          <div className="grid grid-cols-3 gap-2 text-center">
            <div className="flex flex-col items-center">
              <Icon name="arrow" className="w-7 h-7 text-brand-600 mb-1" />
              <div className="font-semibold text-ink-900">{normTime(todayRec?.checkIn) || '--:--'}</div>
              <div className="text-xs text-ink-500">เวลาเข้า</div>
            </div>
            <div className="flex flex-col items-center">
              <Icon name="logout" className="w-7 h-7 text-flow-600 mb-1" />
              <div className="font-semibold text-ink-900">{normTime(todayRec?.checkOut) || '--:--'}</div>
              <div className="text-xs text-ink-500">เวลาออก</div>
            </div>
            <div className="flex flex-col items-center">
              <Icon name="clock" className="w-7 h-7 text-emerald-600 mb-1" />
              <div className="font-semibold text-ink-900">{totalHrs || '--:--'}</div>
              <div className="text-xs text-ink-500">ชั่วโมงรวม</div>
            </div>
          </div>

          {/* ข้อมูลสาขา */}
          <div className="mt-6 pt-4 border-t border-ink-100 text-center text-xs text-ink-500">
            {myBranch ? (
              <>📍 {myBranch.name} · ต้องอยู่ในรัศมี {Number(myBranch.radius) || 200} เมตร</>
            ) : 'ยังไม่ได้กำหนดสาขา — แจ้ง HR/admin'}
          </div>
        </Card>

        <p className="text-center text-xs text-ink-400 mt-3">ดูประวัติย้อนหลังได้ที่หน้า "ข้อมูลของฉัน → ประวัติเข้างาน"</p>
      </div>
    </div>
  );
};

const MyInfoPage = () => {
  const { employees, attendance, setAttendance, leaves, leaveTypes, branches, payroll, settings, setSettings, user, setEmployees, addToast, loadHistory, historyLoaded, assets } = useApp();
  const [tab, setTab] = useState('overview');
  const [attMonth, setAttMonth] = useState(new Date().toISOString().slice(0, 7));  // เดือนที่เลือกดูประวัติเข้างาน
  const me = employees.find(e => e.id === user.empId);

  // คำขอใบรับรองการทำงานของฉัน
  const myCertRequests = ((settings && settings.certRequests) || []).filter(r => r.employeeId === user.empId)
    .sort((a, b) => String(b.requestedAt || '').localeCompare(String(a.requestedAt || '')));

  // ขอใบรับรองการทำงาน
  const requestCert = async () => {
    const newReq = {
      id: `CERT${Date.now()}`,
      employeeId: user.empId,
      employeeName: `${me.firstName} ${me.lastName}`,
      requestedAt: new Date().toISOString(),
      status: 'pending',   // pending | approved | rejected
    };
    const list = [...((settings && settings.certRequests) || []), newReq];
    setSettings({ ...settings, certRequests: list });
    if (api.enabled()) {
      try { await api.post('saveSettingsKey', { key: 'certRequests', data: list }); addToast('success', 'ส่งคำขอใบรับรองแล้ว รอ HR อนุมัติ'); }
      catch (err) { addToast('error', 'ส่งคำขอไม่สำเร็จ: ' + err.message); }
    }
  };

  if (!me) {
    return (
      <div className="p-8">
        <Topbar title="ข้อมูลของฉัน" subtitle="" />
        <Card className="p-8 text-center text-ink-400">ไม่พบข้อมูลพนักงานที่เชื่อมกับบัญชีนี้ — กรุณาติดต่อ HR</Card>
      </div>
    );
  }

  const branch = branches.find(b => b.id === me.branchId);
  const year = new Date().getFullYear();

  // โควต้าวันลา
  const quota = calcQuota(me, leaveTypes, leaves.filter(l => l.employeeId === me.id && l.status === 'approved'), year);

  // ประวัติเข้างาน (เลือกเดือนได้ ย้อนหลัง 3 เดือน)
  const thisMonth = new Date().toISOString().slice(0, 7);
  const myAtt = attendance.filter(a => a.employeeId === me.id && toYMD(a.date).startsWith(attMonth))
    .sort((a, b) => toYMD(b.date).localeCompare(toYMD(a.date)));

  // รายการเดือนย้อนหลัง 3 เดือน (รวมเดือนปัจจุบัน = 4 ตัวเลือก)
  const monthOptions = (() => {
    const opts = [];
    const now = new Date();
    for (let i = 0; i < 4; i++) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      opts.push({ key, label: `${THAI_MONTHS[d.getMonth()]} ${d.getFullYear() + 543}` });
    }
    return opts;
  })();

  // สลิปเงินเดือนย้อนหลัง
  const mySlips = payroll.filter(p => p.employeeId === me.id)
    .sort((a, b) => (b.period || '').localeCompare(a.period || ''));

  // การลาของฉัน
  const myLeaves = leaves.filter(l => l.employeeId === me.id)
    .sort((a, b) => toYMD(b.startDate).localeCompare(toYMD(a.startDate)));

  // ทรัพย์สินบริษัทที่ถือครองอยู่
  const myAssets = (assets || []).filter(a => a.assignedTo === me.id);

  return (
    <div className="p-8 space-y-6 animate-fade-up">
      <Topbar title="ข้อมูลของฉัน" subtitle={`${me.firstName} ${me.lastName} · ${me.position || ''}`} />

      {/* การ์ดโปรไฟล์ */}
      <Card className="p-6">
        <div className="flex items-center gap-4">
          <Avatar name={`${me.firstName} ${me.lastName}`} photo={me.photo} size="lg" />
          <div className="flex-1">
            <h2 className="font-display text-xl font-bold text-ink-900">{me.firstName} {me.lastName} {me.nickname ? `(${me.nickname})` : ''}</h2>
            <div className="text-sm text-ink-500">{me.position} · {me.department} · {branch?.name}</div>
            <div className="text-xs text-ink-400 mt-1">รหัส {me.id} · เริ่มงาน {me.startDate ? fmtDate(me.startDate) : '-'}</div>
          </div>
        </div>
      </Card>

      {/* Tabs */}
      <div className="flex gap-1 bg-ink-100 p-1 rounded-xl w-fit flex-wrap">
        {[['overview','ภาพรวม'],['leave','วันลาคงเหลือ'],['attendance','ประวัติเข้างาน'],['payslip','สลิปเงินเดือน'],['warning','ใบเตือน'],['assets','ทรัพย์สินที่ถือ'],['cert','ใบรับรองการทำงาน'],['profile','ข้อมูลส่วนตัว']].map(([id,label]) => (
          <button key={id} onClick={() => setTab(id)}
            className={cls('px-4 py-2 rounded-lg text-sm font-medium transition-colors', tab === id ? 'bg-white text-brand-700 shadow-soft' : 'text-ink-600 hover:text-ink-900')}>
            {label}
          </button>
        ))}
      </div>

      {/* ภาพรวม */}
      {tab === 'overview' && (
        <div className="space-y-4">
          <div className="grid md:grid-cols-4 gap-4">
          <Card className="p-5">
            <div className="text-xs text-ink-500 mb-1">วันลาคงเหลือ (รวม)</div>
            <div className="font-display text-2xl font-bold text-brand-700">
              {quota.filter(q => ['sick','personal','vacation'].includes(q.id)).reduce((s, q) => s + Math.max(0, q.remaining), 0)} <span className="text-sm font-normal text-ink-400">วัน</span>
            </div>
          </Card>
          <Card className="p-5">
            <div className="text-xs text-ink-500 mb-1">มาทำงานเดือนนี้</div>
            <div className="font-display text-2xl font-bold text-emerald-700">
              {myAtt.filter(a => ['ontime','late','wfh','partial','nocheckout'].includes(a.status)).length} <span className="text-sm font-normal text-ink-400">วัน</span>
            </div>
          </Card>
          <Card className="p-5">
            <div className="text-xs text-ink-500 mb-1">คำขอลารออนุมัติ</div>
            <div className="font-display text-2xl font-bold text-gold-600">
              {myLeaves.filter(l => l.status === 'pending').length} <span className="text-sm font-normal text-ink-400">รายการ</span>
            </div>
          </Card>
          <Card className="p-5 cursor-pointer hover:shadow-card transition-shadow" onClick={() => setTab('assets')}>
            <div className="text-xs text-ink-500 mb-1">ทรัพย์สินที่ถือ</div>
            <div className="font-display text-2xl font-bold text-flow-600">
              {myAssets.length} <span className="text-sm font-normal text-ink-400">ชิ้น</span>
            </div>
          </Card>
        </div>
        </div>
      )}

      {/* ใบเตือนของฉัน */}
      {tab === 'warning' && (() => {
        const myWarnings = ((settings && settings.warnings) || [])
          .filter(w => w.employeeId === user.empId)
          .sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
        return (
          <Card className="overflow-hidden">
            {myWarnings.length === 0 ? (
              <Empty icon="check" title="ไม่มีใบเตือน" desc="คุณไม่มีประวัติใบเตือน — ทำงานได้ดีมาก" />
            ) : (
              <div className="divide-y divide-ink-100">
                {myWarnings.map(w => {
                  const [y, m] = (w.month || '').split('-');
                  return (
                    <div key={w.id} className="p-5">
                      <div className="flex items-start gap-3">
                        <div className="w-10 h-10 rounded-full bg-red-100 text-red-700 flex items-center justify-center flex-shrink-0">
                          <Icon name="info" className="w-5 h-5" />
                        </div>
                        <div className="flex-1">
                          <div className="font-medium text-ink-900">หนังสือเตือน — {w.reason || 'มาปฏิบัติงานสาย'}</div>
                          <div className="text-sm text-ink-600 mt-1">
                            มาสาย {w.lateCount} ครั้ง ในเดือน{THAI_MONTHS[Number(m) - 1] || ''} {Number(y) + 543}
                            <span className="text-ink-400"> (เกินเกณฑ์ {w.threshold} ครั้ง)</span>
                          </div>
                          {w.note && <div className="text-sm text-ink-500 mt-1">หมายเหตุ: {w.note}</div>}
                          <div className="text-xs text-ink-400 mt-2">
                            ออกเมื่อ {fmtDate(w.createdAt)} · โดย {w.approvedBy || 'ฝ่ายบุคคล'}
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </Card>
        );
      })()}

      {/* ทรัพย์สินที่ถือครอง */}
      {tab === 'assets' && (
        <Card className="overflow-hidden">
          <div className="px-5 py-3 bg-ink-50 text-sm text-ink-600 flex items-center gap-2">
            <Icon name="box" className="w-4 h-4" /> ทรัพย์สินบริษัทที่อยู่ในความครอบครองของคุณ
          </div>
          {myAssets.length === 0 ? (
            <div className="p-8 text-center text-ink-400 text-sm">ไม่มีทรัพย์สินบริษัทที่ถือครองอยู่</div>
          ) : (
            <table className="w-full text-sm">
              <thead className="bg-ink-50/50 text-ink-500 text-left text-xs">
                <tr>
                  <th className="px-5 py-2">รหัส</th>
                  <th className="px-5 py-2">ชื่อทรัพย์สิน</th>
                  <th className="px-5 py-2">ยี่ห้อ/รุ่น</th>
                  <th className="px-5 py-2">วันที่รับมอบ</th>
                  <th className="px-5 py-2">สถานะ</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-ink-100">
                {myAssets.map(a => (
                  <tr key={a.id}>
                    <td className="px-5 py-2.5 font-mono text-brand-700 text-xs">{a.code}</td>
                    <td className="px-5 py-2.5 text-ink-800 font-medium">{a.name}</td>
                    <td className="px-5 py-2.5 text-ink-600">{a.brand || '-'}{a.serialNo ? ` · S/N: ${a.serialNo}` : ''}</td>
                    <td className="px-5 py-2.5 text-ink-600">{a.assignedDate ? fmtDate(a.assignedDate) : '-'}</td>
                    <td className="px-5 py-2.5">
                      <span className={cls('text-xs px-2 py-0.5 rounded', a.status === 'ใช้งานได้' ? 'bg-emerald-50 text-emerald-700' : a.status === 'ชำรุด/รอซ่อม' ? 'bg-red-50 text-red-700' : 'bg-ink-100 text-ink-600')}>{a.status}</span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
          {myAssets.length > 0 && (
            <div className="px-5 py-3 bg-gold-50/50 text-xs text-ink-500 border-t border-ink-100">
              💡 หมายเหตุ: ทรัพย์สินเหล่านี้เป็นของบริษัท กรุณาดูแลรักษาและคืนเมื่อลาออกหรือเมื่อ HR ร้องขอ
            </div>
          )}
        </Card>
      )}

      {/* วันลาคงเหลือ */}
      {tab === 'leave' && (
        <Card className="overflow-hidden">
          <table className="w-full text-sm">
            <thead className="bg-ink-50 text-ink-600 text-left">
              <tr><th className="px-5 py-3 font-medium">ประเภทการลา</th><th className="px-5 py-3 font-medium text-center">สิทธิ์</th><th className="px-5 py-3 font-medium text-center">ใช้ไป</th><th className="px-5 py-3 font-medium text-center">คงเหลือ</th></tr>
            </thead>
            <tbody className="divide-y divide-ink-100">
              {quota.filter(q => !['wfh','offsite','absent','unpaid'].includes(q.id)).map(q => (
                <tr key={q.id}>
                  <td className="px-5 py-3 text-ink-800">{q.label}</td>
                  <td className="px-5 py-3 text-center text-ink-600">{q.max || '-'}</td>
                  <td className="px-5 py-3 text-center text-ink-600">{q.used}</td>
                  <td className="px-5 py-3 text-center">
                    <span className={cls('font-display font-bold', q.remaining > 0 ? 'text-emerald-600' : q.remaining < 0 ? 'text-red-600' : 'text-ink-400')}>{q.remaining}</span>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="px-5 py-3 bg-ink-50 text-xs text-ink-500">การลาของฉันล่าสุด</div>
          <div className="divide-y divide-ink-100">
            {myLeaves.slice(0, 5).map(l => {
              const lt = leaveTypes.find(t => t.id === l.type);
              const st = { approved: ['อนุมัติแล้ว','emerald'], pending: ['รออนุมัติ','gold'], rejected: ['ปฏิเสธ','red'] }[l.status] || ['','gray'];
              return (
                <div key={l.id} className="px-5 py-3 flex items-center justify-between text-sm">
                  <div><span className="text-ink-800">{lt?.label || l.type}</span> <span className="text-ink-400 text-xs">{fmtDate(l.startDate)}{l.endDate && l.endDate !== l.startDate ? ` - ${fmtDate(l.endDate)}` : ''} ({l.days} วัน)</span></div>
                  <span className={cls('text-xs font-medium px-2 py-0.5 rounded', `bg-${st[1]}-50 text-${st[1]}-700`)}>{st[0]}</span>
                </div>
              );
            })}
            {myLeaves.length === 0 && <div className="px-5 py-4 text-center text-ink-400 text-sm">ยังไม่มีประวัติการลา</div>}
          </div>
        </Card>
      )}

      {/* ประวัติเข้างาน */}
      {tab === 'attendance' && (
        <Card className="overflow-hidden">
          <div className="px-5 py-3 bg-ink-50 border-b border-ink-100 flex flex-wrap items-center gap-2">
            <span className="text-sm text-ink-600 mr-1">ประวัติเข้างาน:</span>
            {monthOptions.map(opt => (
              <button key={opt.key} onClick={() => setAttMonth(opt.key)}
                className={cls('text-xs px-3 py-1.5 rounded-lg font-medium transition-colors',
                  attMonth === opt.key ? 'bg-brand-600 text-white' : 'bg-white border border-ink-200 text-ink-600 hover:bg-ink-50')}>
                {opt.label}
              </button>
            ))}
          </div>
          <table className="w-full text-sm">
            <thead className="bg-ink-50/50 text-ink-500 text-left text-xs">
              <tr><th className="px-5 py-2">วันที่</th><th className="px-5 py-2">เข้า</th><th className="px-5 py-2">ออก</th><th className="px-5 py-2">สถานะ</th><th className="px-5 py-2 text-right">ยอดหัก</th></tr>
            </thead>
            <tbody className="divide-y divide-ink-100">
              {myAtt.map(a => {
                const info = attStatusInfo(a.status, a.leaveType, leaveTypes, { leavePeriod: a.leavePeriod, leaveHours: a.leaveHours });
                const dYMD = toYMD(a.date);
                const sickCert = (a.status === 'leave' || a.status === 'partial') && (leaves || []).some(l =>
                  l.employeeId === me.id && l.type === 'sick' && l.medicalCert && l.status === 'approved' &&
                  toYMD(l.startDate) <= dYMD && dYMD <= toYMD(l.endDate));
                return (
                  <tr key={a.id}>
                    <td className="px-5 py-2.5 text-ink-700">{fmtDate(a.date)}</td>
                    <td className="px-5 py-2.5 text-ink-600">{normTime(a.checkIn) || '-'}</td>
                    <td className="px-5 py-2.5 text-ink-600">{normTime(a.checkOut) || '-'}</td>
                    <td className="px-5 py-2.5">
                      <div className="flex items-center gap-1.5 flex-wrap">
                        <span className={cls('text-xs px-2 py-0.5 rounded', `bg-${info.color}-50 text-${info.color}-700`)}>{info.label}</span>
                        {sickCert && (
                          <span className="inline-flex items-center gap-1 text-[10px] px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-100">
                            <Icon name="file" className="w-2.5 h-2.5" /> ใบรับรองแพทย์
                          </span>
                        )}
                      </div>
                    </td>
                    <td className="px-5 py-2.5 text-right">
                      {(() => {
                        const d = recordDeduct(me, a, leaves, leaveTypes);
                        return d.amount > 0
                          ? <span className="text-red-600 font-medium text-xs">{d.label}</span>
                          : <span className="text-ink-400 text-xs">{d.label}</span>;
                      })()}
                    </td>
                  </tr>
                );
              })}
              {myAtt.length === 0 && <tr><td colSpan={5} className="px-5 py-4 text-center text-ink-400">ยังไม่มีข้อมูลเดือนนี้</td></tr>}
            </tbody>
          </table>
        </Card>
      )}

      {/* สลิปเงินเดือน */}
      {tab === 'payslip' && (
        <Card className="overflow-hidden">
          {!historyLoaded && (
            <div className="px-5 py-3 bg-gold-50 border-b border-gold-100 flex items-center justify-between gap-3">
              <span className="text-xs text-gold-700">แสดงสลิป 6 เดือนล่าสุด — กดเพื่อดูย้อนหลังทั้งหมด</span>
              <button onClick={() => loadHistory()} className="text-xs px-3 py-1.5 rounded-lg bg-gold-500 text-white hover:bg-gold-600">โหลดย้อนหลัง</button>
            </div>
          )}
          {mySlips.length === 0 ? (
            <div className="p-8 text-center text-ink-400 text-sm">ยังไม่มีสลิปเงินเดือน</div>
          ) : (
            <div className="divide-y divide-ink-100">
              {mySlips.map(p => {
                const c = calcPayroll(p);
                const [py, pm] = (p.period || '').split('-');
                const label = pm ? `${THAI_MONTHS[parseInt(pm,10)-1]} ${parseInt(py,10)+543}` : p.period;
                return (
                  <div key={p.id} className="px-5 py-4 flex items-center justify-between">
                    <div>
                      <div className="font-medium text-ink-900">{label}</div>
                      <div className="text-xs text-ink-400">รับสุทธิ {fmtMoney(c.net)} บาท</div>
                    </div>
                    <MyPayslipButton record={p} employee={me} branch={branch} settings={settings} />
                  </div>
                );
              })}
            </div>
          )}
        </Card>
      )}

      {/* ใบรับรองการทำงาน */}
      {tab === 'cert' && (
        <Card className="overflow-hidden">
          <div className="p-5 border-b border-ink-100 flex items-start justify-between gap-3">
            <div>
              <h3 className="font-display font-semibold text-ink-900">ใบรับรองการทำงาน</h3>
              <p className="text-sm text-ink-500 mt-1">ขอหนังสือรับรองการเป็นพนักงาน — เมื่อ HR อนุมัติแล้วจะพิมพ์เอกสารได้</p>
            </div>
            <Button icon="plus" onClick={requestCert}>ขอใบรับรอง</Button>
          </div>
          {myCertRequests.length === 0 ? (
            <div className="p-8 text-center text-ink-400 text-sm">ยังไม่มีคำขอใบรับรอง — กดปุ่ม "ขอใบรับรอง" เพื่อเริ่ม</div>
          ) : (
            <table className="w-full text-sm">
              <thead className="bg-ink-50/50 text-ink-500 text-left text-xs">
                <tr>
                  <th className="px-5 py-2">เลขที่</th>
                  <th className="px-5 py-2">วันที่ขอ</th>
                  <th className="px-5 py-2">สถานะ</th>
                  <th className="px-5 py-2 text-right">การจัดการ</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-ink-100">
                {myCertRequests.map(r => (
                  <tr key={r.id}>
                    <td className="px-5 py-2.5 font-mono text-brand-700 text-xs">{r.id}</td>
                    <td className="px-5 py-2.5 text-ink-600">{fmtDate(r.requestedAt)}</td>
                    <td className="px-5 py-2.5">
                      <span className={cls('text-xs px-2 py-0.5 rounded',
                        r.status === 'approved' ? 'bg-emerald-50 text-emerald-700' :
                        r.status === 'rejected' ? 'bg-red-50 text-red-700' : 'bg-gold-50 text-gold-700')}>
                        {r.status === 'approved' ? 'อนุมัติแล้ว' : r.status === 'rejected' ? 'ไม่อนุมัติ' : 'รออนุมัติ'}
                      </span>
                    </td>
                    <td className="px-5 py-2.5 text-right">
                      {r.status === 'approved' ? (
                        <button onClick={() => printCertificate(me, settings, r, branches)} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-brand-600 text-white text-xs hover:bg-brand-700">
                          <Icon name="file" className="w-3.5 h-3.5" /> พิมพ์ใบรับรอง
                        </button>
                      ) : (
                        <span className="text-xs text-ink-400">{r.status === 'rejected' ? '—' : 'รอ HR อนุมัติ'}</span>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </Card>
      )}

      {/* ข้อมูลส่วนตัว */}
      {tab === 'profile' && <MyProfileEditor me={me} onSave={(updated) => {
        setEmployees(employees.map(e => e.id === updated.id ? updated : e));
        if (api.enabled()) api.post('saveEmployee', { data: updated }).catch(() => addToast('error', 'บันทึกไม่สำเร็จ'));
        addToast('success', 'บันทึกข้อมูลเรียบร้อย');
      }} />}
    </div>
  );
};

/* แก้ข้อมูลส่วนตัว (จำกัดเฉพาะ contact info + รูป) */
const MyProfileEditor = ({ me, onSave }) => {
  const [form, setForm] = useState({ email: me.email || '', phone: me.phone || '', nickname: me.nickname || '', photo: me.photo || '' });
  const [uploading, setUploading] = useState(false);

  const pickPhoto = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) { alert('กรุณาเลือกไฟล์รูปภาพ'); return; }
    if (file.size > 5 * 1024 * 1024) { alert('ขนาดไฟล์ต้องไม่เกิน 5 MB'); return; }
    setUploading(true);
    // resize เป็น square 256px ก่อน
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const size = 256;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const minDim = Math.min(img.width, img.height);
        const sx = (img.width - minDim) / 2, sy = (img.height - minDim) / 2;
        ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, size, size);
        if (api.enabled()) {
          canvas.toBlob(async (blob) => {
            try {
              blob.name = 'photo.jpg';
              const url = await sbStorage.upload('employee-photos', blob);
              setForm(f => ({ ...f, photo: url }));
            } catch (err) {
              setForm(f => ({ ...f, photo: canvas.toDataURL('image/jpeg', 0.85) }));
            } finally { setUploading(false); }
          }, 'image/jpeg', 0.85);
        } else {
          setForm(f => ({ ...f, photo: canvas.toDataURL('image/jpeg', 0.85) }));
          setUploading(false);
        }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  return (
    <Card className="p-6 max-w-lg">
      <h3 className="font-display font-semibold text-ink-900 mb-4">แก้ไขข้อมูลส่วนตัว</h3>
      <div className="space-y-4">
        {/* รูปโปรไฟล์ */}
        <div className="flex items-center gap-4">
          <Avatar name={`${me.firstName} ${me.lastName}`} photo={form.photo} size="xl" />
          <div>
            <input type="file" accept="image/*" id="my-photo" className="hidden" onChange={pickPhoto} />
            <label htmlFor="my-photo" className="cursor-pointer inline-flex items-center gap-2 px-4 py-2 rounded-xl border border-ink-200 hover:border-brand-400 hover:bg-brand-50 text-sm font-medium text-ink-700">
              <Icon name="upload" className="w-4 h-4" /> {uploading ? 'กำลังอัปโหลด...' : 'เปลี่ยนรูป'}
            </label>
            {form.photo && (
              <button type="button" onClick={() => setForm(f => ({ ...f, photo: '' }))} className="ml-2 text-xs text-red-500 hover:underline">ลบรูป</button>
            )}
            <p className="text-xs text-ink-400 mt-1.5">รูปสี่เหลี่ยมจัตุรัส ≤ 5MB</p>
          </div>
        </div>

        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">ชื่อเล่น</label>
          <Input value={form.nickname} onChange={(e) => setForm({ ...form, nickname: e.target.value })} />
        </div>
        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">อีเมล</label>
          <Input type="email" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} />
        </div>
        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">เบอร์โทร</label>
          <Input value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} />
        </div>
        <p className="text-xs text-ink-400">ข้อมูลอื่น (ตำแหน่ง เงินเดือน สาขา) ติดต่อ HR เพื่อแก้ไข</p>
        <Button icon="check" onClick={() => onSave({ ...me, ...form })} disabled={uploading}>บันทึก</Button>
      </div>
    </Card>
  );
};


const ReportsPage = () => {
  const { employees, attendance, leaves, leaveTypes, branches, loadHistory, historyLoaded } = useApp();
  const [month, setMonth] = useState(new Date().toISOString().slice(0,7));

  // ตรวจว่าเดือนที่เลือกเก่ากว่าข้อมูลที่โหลดไว้ (3 เดือนล่าสุด) ไหม
  const threeMonthsAgo = (() => { const d = new Date(); d.setMonth(d.getMonth() - 3); return d.toISOString().slice(0, 7); })();
  const needHistory = month < threeMonthsAgo && !historyLoaded;

  // monthly stats
  const monthRecords = attendance.filter(a => String(a.date || '').startsWith(month));
  const monthLeaves  = leaves.filter(l => String(l.startDate || '').startsWith(month) || String(l.endDate || '').startsWith(month));

  const branchData = branches.map(b => {
    const empsB = employees.filter(e => e.branchId === b.id);
    const attB  = monthRecords.filter(a => empsB.some(e => e.id === a.employeeId));
    const lvB   = monthLeaves.filter(l => empsB.some(e => e.id === l.employeeId) && l.status === 'approved');
    const onTime = attB.filter(a => a.status === 'ontime').length;
    const late = attB.filter(a => a.status === 'late').length;
    return {
      name: b.short,
      ตรงเวลา: onTime,
      มาสาย: late,
      ลา: lvB.length,
      color: b.color,
    };
  });

  const leaveDist = leaveTypes.map(t => ({
    name: t.label,
    count: monthLeaves.filter(l => l.type === t.id && l.status === 'approved').length,
    color: t.color,
  }));

  const exportReport = () => {
    const wb = XLSX.utils.book_new();

    // Sheet 1: monthly summary
    const summary = [
      ['รายงานประจำเดือน', month],
      [],
      ['สาขา', 'มาทำงาน (ตรงเวลา)', 'มาทำงาน (สาย)', 'ลา (อนุมัติ)'],
      ...branchData.map(b => [b.name, b.ตรงเวลา, b.มาสาย, b.ลา]),
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), 'สรุปประจำเดือน');

    // Sheet 2: attendance details
    const attRows = [
      ['รหัสพนักงาน','ชื่อ-นามสกุล','สาขา','วันที่','เข้างาน','ออกงาน','สถานะ'],
      ...monthRecords.map(a => {
        const e = employees.find(x => x.id === a.employeeId);
        const b = e ? branches.find(x => x.id === e.branchId) : null;
        return [a.employeeId, e ? `${e.firstName} ${e.lastName}` : '-', b?.short || '-',
                a.date, a.checkIn || '-', a.checkOut || '-', a.status === 'ontime' ? 'ตรงเวลา' : 'สาย'];
      }),
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(attRows), 'การเข้างาน');

    // Sheet 3: leaves
    const lvRows = [
      ['รหัสพนักงาน','ชื่อ-นามสกุล','ประเภท','วันเริ่ม','วันสิ้นสุด','จำนวนวัน','ใบรับรองแพทย์','สถานะ','เหตุผล'],
      ...monthLeaves.map(l => {

        const t = leaveTypes.find(x => x.id === l.type);

                l.reason];
      }),
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(lvRows), 'การลา');

    XLSX.writeFile(wb, `รายงาน_HR_${month}.xlsx`);
  };

  return (

      <Topbar
        title="รายงาน"
        subtitle="สรุปผลการทำงานและการลาของพนักงาน"
        action={
          <div className="flex items-center gap-2">
            <Input type="month" value={month} onChange={(e) => setMonth(e.target.value)} className="w-44" />
            <Button icon="download" variant="gold" onClick={exportReport}>ส่งออก Excel</Button>
          </div>
        }
      />

      {/* แจ้งเตือนเมื่อเลือกเดือนเก่ากว่าข้อมูลที่โหลด */}
      {needHistory && (

          <div className="flex items-center gap-2 text-sm text-gold-800">

      <div className="grid lg:grid-cols-2 gap-6">

          <div style={{ width: '100%', height: 280 }}>
            <ResponsiveContainer>
              <BarChart data={branchData} margin={{ top: 10, right: 10, left: -10, bottom: 0 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="#ECEEF5" />

                />
                <Legend wrapperStyle={{ fontFamily: 'Sarabun', fontSize: 12 }} />
                <Bar dataKey="ตรงเวลา" fill="#10B981" radius={[6,6,0,0]} />

        </Card>

        <Card className="p-6">
          <h3 className="font-display text-lg font-semibold text-ink-900 mb-1">การลาแยกตามประเภท</h3>
          <p className="text-xs text-ink-500 mb-4">สัดส่วนคำขอลาที่ได้รับการอนุมัติ</p>
          <div style={{ width: '100%', height: 280 }}>
            <ResponsiveContainer>
              <BarChart data={leaveDist} layout="vertical" margin={{ top: 10, right: 20, left: 50, bottom: 0 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="#ECEEF5" />

                  contentStyle={{
                    background: '#fff', border: '1px solid #ECEEF5', borderRadius: 12,

/* ═══════════════════════════════════════════════════════════
   USERS TAB — จัดการผู้ใช้งานระบบ (เฉพาะ admin)
═══════════════════════════════════════════════════════════ */
const UsersTab = ({ employees, branches, addToast, currentUser }) => {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [openForm, setOpenForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [resetting, setResetting] = useState(null);   // user ที่กำลังรีเซ็ตรหัส

  const load = async () => {
    if (!api.enabled()) { setLoading(false); return; }
    setLoading(true);
    try {
      const list = await api.get('getUsers');
      setUsers(list.sort((a, b) => String(a.username).localeCompare(String(b.username))));
    } catch (err) { addToast('error', 'โหลดรายชื่อผู้ใช้ไม่สำเร็จ: ' + err.message); }
    finally { setLoading(false); }
  };
  useEffect(() => { load(); }, []);

  const roleLabel = { admin: 'ผู้ดูแลระบบ', hr: 'ฝ่ายบุคคล', manager: 'ผู้จัดการ', employee: 'พนักงาน' };
  const roleColor = { admin: 'red', hr: 'flow', manager: 'gold', employee: 'gray' };

  const deleteUser = async (u) => {
    if (u.username === currentUser.username) { addToast('error', 'ลบบัญชีตัวเองไม่ได้'); return; }
    if (!confirm(`ลบผู้ใช้ "${u.username}" (${u.name})?`)) return;
    try {
      await api.post('deleteUser', { username: u.username });
      addToast('success', 'ลบผู้ใช้เรียบร้อย');
      load();
    } catch (err) { addToast('error', err.message); }
  };

  return (
    <Card className="p-6">
      <div className="flex items-start justify-between mb-5">
        <div>
          <h3 className="font-display text-lg font-semibold text-ink-900">ผู้ใช้งานระบบ</h3>
          <p className="text-sm text-ink-500 mt-1">จัดการบัญชีเข้าระบบ กำหนดสิทธิ์ และรีเซ็ตรหัสผ่าน</p>
        </div>
        <Button icon="plus" onClick={() => { setEditing(null); setOpenForm(true); }}>เพิ่มผู้ใช้</Button>
      </div>

      {loading ? (
        <div className="py-8 text-center text-ink-400 text-sm">กำลังโหลด...</div>
      ) : users.length === 0 ? (
        <Empty icon="users" title="ยังไม่มีผู้ใช้" desc="กดเพิ่มผู้ใช้เพื่อสร้างบัญชีเข้าระบบ" />
      ) : (
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="text-left text-ink-500 text-xs border-b border-ink-100">
              <tr>
                <th className="py-2.5 px-3 font-medium">ชื่อผู้ใช้</th>
                <th className="py-2.5 px-3 font-medium">ชื่อ</th>
                <th className="py-2.5 px-3 font-medium">สิทธิ์</th>
                <th className="py-2.5 px-3 font-medium">สาขา</th>
                <th className="py-2.5 px-3 font-medium text-right">จัดการ</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-ink-50">
              {users.map(u => {
                const branch = branches.find(b => b.id === u.branchId);
                return (
                  <tr key={u.username} className="hover:bg-ink-50/50">
                    <td className="py-2.5 px-3 font-mono text-ink-800">{u.username}</td>
                    <td className="py-2.5 px-3 text-ink-700">{u.name || '-'}</td>
                    <td className="py-2.5 px-3">
                      <span className={cls('text-xs px-2 py-0.5 rounded', `bg-${roleColor[u.role]}-50 text-${roleColor[u.role]}-700`)}>
                        {roleLabel[u.role] || u.role}
                      </span>
                    </td>
                    <td className="py-2.5 px-3 text-ink-500 text-xs">{branch?.name || (u.role === 'admin' || u.role === 'hr' ? 'ทุกสาขา' : '-')}</td>
                    <td className="py-2.5 px-3">
                      <div className="flex items-center justify-end gap-1">
                        <button onClick={() => setResetting(u)} className="p-1.5 rounded-lg text-ink-500 hover:bg-gold-50 hover:text-gold-700" title="รีเซ็ตรหัสผ่าน"><Icon name="refresh" className="w-4 h-4" /></button>
                        <button onClick={() => { setEditing(u); setOpenForm(true); }} className="p-1.5 rounded-lg text-ink-500 hover:bg-flow-50 hover:text-flow-700" title="แก้ไข"><Icon name="edit" className="w-4 h-4" /></button>
                        <button onClick={() => deleteUser(u)} className="p-1.5 rounded-lg text-ink-500 hover:bg-red-50 hover:text-red-600" title="ลบ" disabled={u.username === currentUser.username}><Icon name="trash" className="w-4 h-4" /></button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {openForm && <UserFormModal editing={editing} employees={employees} branches={branches}
        onClose={() => { setOpenForm(false); setEditing(null); }}
        onSaved={() => { setOpenForm(false); setEditing(null); load(); }}
        addToast={addToast} />}

      {resetting && <ResetPasswordModal target={resetting}
        onClose={() => setResetting(null)} addToast={addToast} />}
    </Card>
  );
};

const UserFormModal = ({ editing, employees, branches, onClose, onSaved, addToast }) => {
  const [form, setForm] = useState(() => editing
    ? { username: editing.username, password: '', role: editing.role, name: editing.name || '', branchId: editing.branchId || '', empId: editing.empId || '' }
    : { username: '', password: '', role: 'employee', name: '', branchId: '', empId: '' });
  const [saving, setSaving] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    if (!form.username.trim()) return addToast('error', 'กรุณากรอกชื่อผู้ใช้');
    if (!editing && form.password.length < 6) return addToast('error', 'รหัสผ่านอย่างน้อย 6 ตัว');
    setSaving(true);
    try {
      await api.post('saveUser', { data: form });
      addToast('success', editing ? 'แก้ไขผู้ใช้เรียบร้อย' : 'สร้างผู้ใช้เรียบร้อย');
      onSaved();
    } catch (err) { addToast('error', err.message); }
    finally { setSaving(false); }
  };

  // เลือกพนักงานเพื่อ auto-fill ชื่อ + สาขา
  const linkEmp = (empId) => {
    const emp = employees.find(e => e.id === empId);
    setForm(f => ({ ...f, empId, name: emp ? `${emp.firstName} ${emp.lastName}` : f.name, branchId: emp?.branchId || f.branchId }));
  };

  return (
    <Modal open onClose={onClose} title={editing ? `แก้ไขผู้ใช้: ${editing.username}` : 'เพิ่มผู้ใช้ใหม่'} size="md">
      <form onSubmit={submit} className="space-y-4">
        <div className="grid md:grid-cols-2 gap-3">
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">ชื่อผู้ใช้ (username)</label>
            <Input value={form.username} onChange={(e) => setForm({ ...form, username: e.target.value.trim() })} disabled={!!editing} placeholder="เช่น somchai" required />
            {editing && <p className="text-xs text-ink-400 mt-1">เปลี่ยนชื่อผู้ใช้ไม่ได้</p>}
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">
              {editing ? 'รหัสผ่านใหม่ (เว้นว่าง = ไม่เปลี่ยน)' : 'รหัสผ่าน'}
            </label>
            <Input type="password" value={form.password} onChange={(e) => setForm({ ...form, password: e.target.value })} placeholder={editing ? 'เว้นว่างไว้' : 'อย่างน้อย 6 ตัว'} />
          </div>
        </div>

        <div className="grid md:grid-cols-2 gap-3">
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">สิทธิ์การใช้งาน</label>
            <Select value={form.role} onChange={(e) => setForm({ ...form, role: e.target.value })}>
              <option value="employee">พนักงาน</option>
              <option value="manager">ผู้จัดการ</option>
              <option value="hr">ฝ่ายบุคคล</option>
              <option value="admin">ผู้ดูแลระบบ</option>
            </Select>
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">เชื่อมกับพนักงาน</label>
            <Select value={form.empId} onChange={(e) => linkEmp(e.target.value)}>
              <option value="">— ไม่เชื่อม —</option>
              {employees.slice().sort((a,b)=>String(a.id).localeCompare(String(b.id),undefined,{numeric:true})).map(e => (
                <option key={e.id} value={e.id}>{e.id} - {e.firstName} {e.lastName}</option>
              ))}
            </Select>
          </div>
        </div>

        <div className="grid md:grid-cols-2 gap-3">
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">ชื่อ-นามสกุล (แสดงในระบบ)</label>
            <Input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="ชื่อที่แสดง" />
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">สาขา</label>
            <Select value={form.branchId} onChange={(e) => setForm({ ...form, branchId: e.target.value })}>
              <option value="">— ทุกสาขา —</option>
              {branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
            </Select>
          </div>
        </div>

        <div className="flex justify-end gap-2 pt-3 border-t border-ink-100">
          <Button type="button" variant="secondary" onClick={onClose}>ยกเลิก</Button>
          <Button type="submit" icon="check" disabled={saving}>{saving ? 'กำลังบันทึก...' : (editing ? 'บันทึก' : 'สร้างผู้ใช้')}</Button>
        </div>
      </form>
    </Modal>
  );
};

/* ── รีเซ็ตรหัสผ่าน (admin ตั้งรหัสชั่วคราวให้) ── */
const ResetPasswordModal = ({ target, onClose, addToast }) => {
  const [newPw, setNewPw] = useState('');
  const [saving, setSaving] = useState(false);
  const [done, setDone] = useState(false);

  // สุ่มรหัสชั่วคราว
  const genRandom = () => {
    const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
    let p = '';
    for (let i = 0; i < 8; i++) p += chars[Math.floor(Math.random() * chars.length)];
    setNewPw(p);
  };

  const submit = async (e) => {
    e.preventDefault();
    if (newPw.length < 6) return addToast('error', 'รหัสอย่างน้อย 6 ตัว');
    setSaving(true);
    try {
      await api.post('resetPassword', { username: target.username, newPassword: newPw });
      setDone(true);
    } catch (err) { addToast('error', err.message); }
    finally { setSaving(false); }
  };

  return (
    <Modal open onClose={onClose} title={`รีเซ็ตรหัสผ่าน: ${target.username}`} size="sm">
      {done ? (
        <div className="space-y-4 text-center">
          <div className="w-14 h-14 mx-auto rounded-full bg-emerald-50 flex items-center justify-center">
            <Icon name="check" className="w-7 h-7 text-emerald-600" />
          </div>
          <div>
            <p className="text-sm text-ink-600 mb-2">รีเซ็ตรหัสเรียบร้อย — แจ้งรหัสนี้ให้ผู้ใช้ แล้วให้เปลี่ยนเองหลัง login</p>
            <div className="bg-ink-50 rounded-xl p-4 font-mono text-lg font-bold text-brand-700 tracking-wider">{newPw}</div>
          </div>
          <Button onClick={onClose} className="w-full">เสร็จสิ้น</Button>
        </div>
      ) : (
        <form onSubmit={submit} className="space-y-4">
          <p className="text-sm text-ink-500">
            ตั้งรหัสผ่านชั่วคราวให้ <span className="font-medium text-ink-800">{target.name} ({target.username})</span> แล้วแจ้งให้ผู้ใช้เปลี่ยนเองหลัง login
          </p>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">รหัสผ่านใหม่</label>
            <div className="flex gap-2">
              <Input value={newPw} onChange={(e) => setNewPw(e.target.value)} placeholder="อย่างน้อย 6 ตัว" required className="flex-1" />
              <Button type="button" variant="outline" onClick={genRandom}>สุ่ม</Button>
            </div>
          </div>
          <div className="flex justify-end gap-2 pt-2">
            <Button type="button" variant="secondary" onClick={onClose}>ยกเลิก</Button>
            <Button type="submit" icon="refresh" disabled={saving}>{saving ? 'กำลังรีเซ็ต...' : 'รีเซ็ตรหัส'}</Button>
          </div>
        </form>
      )}
    </Modal>
  );
};

/* ═══════════════════════════════════════════════════════════
   CERT REQUESTS TAB — อนุมัติคำขอใบรับรองการทำงาน (hr/admin)
═══════════════════════════════════════════════════════════ */
const CertRequestsTab = ({ employees, settings, setSettings, addToast, currentUser, branches }) => {
  const [filter, setFilter] = useState('pending');   // pending | all
  const requests = ((settings && settings.certRequests) || [])
    .slice().sort((a, b) => String(b.requestedAt || '').localeCompare(String(a.requestedAt || '')));
  const shown = filter === 'pending' ? requests.filter(r => r.status === 'pending') : requests;

  const updateStatus = async (id, status) => {
    const list = ((settings && settings.certRequests) || []).map(r =>
      r.id === id ? { ...r, status, approvedAt: new Date().toISOString(), approvedBy: currentUser.name || currentUser.username } : r);
    setSettings({ ...settings, certRequests: list });
    if (api.enabled()) {
      try { await api.post('saveSettingsKey', { key: 'certRequests', data: list }); addToast('success', status === 'approved' ? 'อนุมัติแล้ว' : 'ปฏิเสธคำขอแล้ว'); }
      catch (err) { addToast('error', err.message); }
    }
  };

  return (
    <Card className="p-6">
      <div className="flex items-start justify-between mb-5">
        <div>
          <h3 className="font-display text-lg font-semibold text-ink-900">คำขอใบรับรองการทำงาน</h3>
          <p className="text-sm text-ink-500 mt-1">อนุมัติคำขอเพื่อให้พนักงานพิมพ์ใบรับรองได้</p>
        </div>
        <div className="flex gap-1 bg-ink-100 p-1 rounded-lg text-sm">
          <button onClick={() => setFilter('pending')} className={cls('px-3 py-1.5 rounded-md', filter === 'pending' ? 'bg-white text-brand-700 shadow-soft' : 'text-ink-600')}>รออนุมัติ</button>
          <button onClick={() => setFilter('all')} className={cls('px-3 py-1.5 rounded-md', filter === 'all' ? 'bg-white text-brand-700 shadow-soft' : 'text-ink-600')}>ทั้งหมด</button>
        </div>
      </div>

      {shown.length === 0 ? (
        <Empty icon="file" title="ไม่มีคำขอ" desc={filter === 'pending' ? 'ไม่มีคำขอที่รออนุมัติ' : 'ยังไม่มีคำขอใบรับรอง'} />
      ) : (
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="text-left text-ink-500 text-xs border-b border-ink-100">
              <tr>
                <th className="py-2.5 px-3 font-medium">เลขที่</th>
                <th className="py-2.5 px-3 font-medium">พนักงาน</th>
                <th className="py-2.5 px-3 font-medium">วันที่ขอ</th>
                <th className="py-2.5 px-3 font-medium">สถานะ</th>
                <th className="py-2.5 px-3 font-medium text-right">จัดการ</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-ink-50">
              {shown.map(r => {
                const emp = employees.find(e => e.id === r.employeeId);
                return (
                  <tr key={r.id} className="hover:bg-ink-50/50">
                    <td className="py-2.5 px-3 font-mono text-brand-700 text-xs">{r.id}</td>
                    <td className="py-2.5 px-3 text-ink-800">{r.employeeName || (emp ? `${emp.firstName} ${emp.lastName}` : r.employeeId)}</td>
                    <td className="py-2.5 px-3 text-ink-600">{fmtDate(r.requestedAt)}</td>
                    <td className="py-2.5 px-3">
                      <span className={cls('text-xs px-2 py-0.5 rounded',
                        r.status === 'approved' ? 'bg-emerald-50 text-emerald-700' :
                        r.status === 'rejected' ? 'bg-red-50 text-red-700' : 'bg-gold-50 text-gold-700')}>
                        {r.status === 'approved' ? 'อนุมัติแล้ว' : r.status === 'rejected' ? 'ไม่อนุมัติ' : 'รออนุมัติ'}
                      </span>
                    </td>
                    <td className="py-2.5 px-3">
                      <div className="flex items-center justify-end gap-1.5">
                        {r.status === 'pending' ? (
                          <>
                            <button onClick={() => updateStatus(r.id, 'approved')} className="px-3 py-1.5 rounded-lg bg-emerald-600 text-white text-xs hover:bg-emerald-700">อนุมัติ</button>
                            <button onClick={() => updateStatus(r.id, 'rejected')} className="px-3 py-1.5 rounded-lg border border-red-200 text-red-600 text-xs hover:bg-red-50">ปฏิเสธ</button>
                          </>
                        ) : (
                          <>
                            {emp && r.status === 'approved' && (
                              <button onClick={() => printCertificate(emp, settings, r, branches)} className="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-brand-600 text-white text-xs hover:bg-brand-700">
                                <Icon name="file" className="w-3.5 h-3.5" /> พิมพ์
                              </button>
                            )}
                            <span className="text-xs text-ink-400">{r.approvedBy || ''}</span>
                          </>
                        )}
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </Card>
  );
};

const SettingsPage = () => {
  const {
    leaveTypes, setLeaveTypes,
    leaves, employees, settings, setSettings,
    branches, setBranches,
    departments, setDepartments,
    user,
    addToast,
  } = useApp();
  const [tab, setTab] = useState(() => {
    // ถ้ามาจากการคลิกแจ้งเตือน ให้เปิดแท็บที่ระบุ
    try { if (window.__ffcGoTab) { const t = window.__ffcGoTab; window.__ffcGoTab = null; return t; } } catch {}
    return 'leave-types';
  });
  // ฟัง event เปลี่ยนแท็บ (กรณีอยู่หน้า settings อยู่แล้วแล้วคลิกแจ้งเตือน)
  useEffect(() => {
    const onGoTab = () => { try { if (window.__ffcGoTab) { setTab(window.__ffcGoTab); window.__ffcGoTab = null; } } catch {} };
    window.addEventListener('ffc-go-tab', onGoTab);
    return () => window.removeEventListener('ffc-go-tab', onGoTab);
  }, []);
  const [editing, setEditing] = useState(null); // ประเภทที่กำลังแก้ไข
  const [showAdd, setShowAdd] = useState(false);
  const [companyForm, setCompanyForm] = useState(settings);
  const [sbUrlInput, setSbUrlInput] = useState(() => { try { return localStorage.getItem('ffc_sb_url') || ''; } catch { return ''; } });
  const [sbKeyInput, setSbKeyInput] = useState(() => { try { return localStorage.getItem('ffc_sb_key') || ''; } catch { return ''; } });

  // Branch & Department modals
  const [showBranchModal, setShowBranchModal] = useState(false);
  const [editingBranch, setEditingBranch] = useState(null);
  const [showDeptModal, setShowDeptModal] = useState(false);
  const [editingDept, setEditingDept] = useState(null);

  // Sync companyForm กับ settings เมื่อ settings เปลี่ยน
  useEffect(() => { setCompanyForm(settings); }, [settings]);

  const saveCompany = () => {
    setSettings(companyForm);
    addToast('success', 'บันทึกข้อมูลบริษัทเรียบร้อย');
    if (api.enabled()) {
      api.post('saveSettings', { data: companyForm })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
  };

  // === BRANCH handlers ===
  const empCountByBranch = useMemo(() => {
    const m = {};
    employees.forEach(e => { m[e.branchId] = (m[e.branchId] || 0) + 1; });
    return m;
  }, [employees]);

  const saveBranch = (b) => {
    let updated;
    if (editingBranch) {
      updated = branches.map(x => x.id === editingBranch.id ? { ...b, id: editingBranch.id } : x);
      addToast('success', 'บันทึกข้อมูลสาขาเรียบร้อย');
    } else {
      // ตรวจสอบรหัสซ้ำ
      if (branches.some(x => x.id === b.id)) {
        addToast('error', 'รหัสสาขาซ้ำกับที่มีอยู่');
        return;
      }
      updated = [...branches, b];
      addToast('success', 'เพิ่มสาขาใหม่เรียบร้อย');
    }
    setBranches(updated);
    if (api.enabled()) {
      api.post('saveBranches', { data: updated })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
    setEditingBranch(null);
    setShowBranchModal(false);
  };

  const deleteBranch = (b) => {
    const used = empCountByBranch[b.id] || 0;
    if (used > 0) {
      addToast('error', `ไม่สามารถลบได้ มีพนักงาน ${used} คนในสาขานี้ — ย้ายพนักงานก่อน`);
      return;
    }
    if (!confirm(`ยืนยันการลบสาขา "${b.name}"?`)) return;
    const updated = branches.filter(x => x.id !== b.id);
    setBranches(updated);
    addToast('success', 'ลบสาขาเรียบร้อย');
    if (api.enabled()) {
      api.post('saveBranches', { data: updated })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
  };

  // === DEPARTMENT handlers ===
  const empCountByDept = useMemo(() => {
    const m = {};
    employees.forEach(e => { m[e.department] = (m[e.department] || 0) + 1; });
    return m;
  }, [employees]);

  const saveDept = (name, oldName) => {
    let updated;
    if (oldName) {
      // แก้ไข — เปลี่ยนชื่อในรายการ
      if (departments.includes(name) && name !== oldName) {
        addToast('error', 'ชื่อแผนกซ้ำกับที่มีอยู่');
        return;
      }
      updated = departments.map(d => d === oldName ? name : d);
      addToast('success', 'บันทึกชื่อแผนกเรียบร้อย');
    } else {
      // เพิ่ม
      if (departments.includes(name)) {
        addToast('error', 'ชื่อแผนกซ้ำกับที่มีอยู่');
        return;
      }
      updated = [...departments, name];
      addToast('success', 'เพิ่มแผนกใหม่เรียบร้อย');
    }
    setDepartments(updated);
    if (api.enabled()) {
      api.post('saveDepartments', { data: updated })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
    setEditingDept(null);
    setShowDeptModal(false);
  };

  const deleteDept = (d) => {
    const used = empCountByDept[d] || 0;
    if (used > 0) {
      addToast('error', `ไม่สามารถลบได้ มีพนักงาน ${used} คนในแผนกนี้ — ย้ายพนักงานก่อน`);
      return;
    }
    if (!confirm(`ยืนยันการลบแผนก "${d}"?`)) return;
    const updated = departments.filter(x => x !== d);
    setDepartments(updated);
    addToast('success', 'ลบแผนกเรียบร้อย');
    if (api.enabled()) {
      api.post('saveDepartments', { data: updated })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
  };

  // ตรวจสอบว่ามีคำขอลาที่ใช้ประเภทนี้อยู่หรือไม่
  const usedTypes = useMemo(() => {
    const counts = {};
    leaves.forEach(l => { counts[l.type] = (counts[l.type] || 0) + 1; });
    return counts;
  }, [leaves]);

  const saveType = (type) => {
    let updated;
    if (editing) {
      updated = leaveTypes.map(t => t.id === editing.id ? { ...type, id: editing.id } : t);
      setLeaveTypes(updated);
      addToast('success', 'บันทึกการเปลี่ยนแปลงเรียบร้อย');
    } else {
      // สร้าง id ใหม่จากชื่อ
      const newId = (type.id || type.label).toLowerCase()
        .replace(/[^a-z0-9ก-๙]/gi, '_').slice(0, 20) + '_' + Date.now().toString().slice(-4);
      if (leaveTypes.some(t => t.id === newId)) {
        addToast('error', 'รหัสประเภทซ้ำกับที่มีอยู่');
        return;
      }
      updated = [...leaveTypes, { ...type, id: newId }];
      setLeaveTypes(updated);
      addToast('success', 'เพิ่มประเภทการลาใหม่เรียบร้อย');
    }
    if (api.enabled()) {
      api.post('saveLeaveTypes', { data: updated })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
    setEditing(null);
    setShowAdd(false);
  };

  const deleteType = (type) => {
    if (usedTypes[type.id]) {
      if (!confirm(`ประเภท "${type.label}" มีคำขอลาที่ใช้อยู่ ${usedTypes[type.id]} รายการ\n\nหากลบ คำขอเดิมจะยังคงอยู่ แต่อาจแสดงชื่อไม่ถูกต้อง\n\nยืนยันการลบ?`)) return;
    } else {
      if (!confirm(`ยืนยันการลบประเภท "${type.label}"?`)) return;
    }
    const updated = leaveTypes.filter(t => t.id !== type.id);
    setLeaveTypes(updated);
    addToast('success', 'ลบประเภทการลาเรียบร้อย');
    if (api.enabled()) {
      api.post('saveLeaveTypes', { data: updated })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
  };

  const resetDefaults = () => {
    if (!confirm('ยืนยันการรีเซ็ตประเภทการลาเป็นค่าเริ่มต้น?\n\nประเภทที่คุณเพิ่มเองจะถูกลบทั้งหมด')) return;

/* =============================================================
   ROOT APP
   ============================================================= */
const App = () => {
  const [user, setUser]       = useState(() => {
    // คงสถานะล็อกอินไว้เมื่อรีเฟรช
    try {
      const saved = localStorage.getItem('ffc_session_user');
      return saved ? JSON.parse(saved) : null;
    } catch { return null; }
  });
  const [page, setPage]       = useState('dashboard');
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
  const [employees, setEmployees]     = useState([]);
  const [attendance, setAttendance]   = useState([]);
  const [leaves, setLeaves]           = useState([]);
  const [leaveTypes, setLeaveTypes]   = useState(DEFAULT_LEAVE_TYPES);
  const [branches, setBranches]       = useState(DEFAULT_BRANCHES);
  const [departments, setDepartments] = useState(DEFAULT_DEPARTMENTS);
  const [assets, setAssets]           = useState([]);
  const [payroll, setPayroll]         = useState([]);
  const [kpiCriteria, setKpiCriteria] = useState([]);
  const [kpiRecords, setKpiRecords]   = useState([]);
  const [settings, setSettings]       = useState({
    companyName: 'บริษัท ฟรีด้อมโฟล เทรดดิ้ง จำกัด',
    companyNameEn: 'FREEDOM FLOW TRADING CO., LTD.',
    taxId:       '0-1055-XXXXX-XX-X',
    address:     'เลขที่ 10/95 อาคารเดอะเทรนดี้ ชั้น 6 ซอย 13 แขวงคลองเตยเหนือ เขตวัฒนา กรุงเทพมหานคร 10110',
    phone:       '',
    email:       '',
    workStart:   '08:00',
    workEnd:     '17:00',
    lateMinutes: 5,   // ผ่อนผันได้กี่นาที
  });
  const [toast, setToast]             = useState(null);
  const [loading, setLoading]         = useState(api.enabled());

  // Initialize data — โหลดจาก API หรือใช้ Demo data
  useEffect(() => {
    if (api.enabled()) {
      // ฟังก์ชันใส่ข้อมูลลง state
      const applyData = (data) => {
        setEmployees(data.employees || []);
        setAttendance(data.attendance || []);
        setLeaves(data.leaves || []);
        if (data.leaveTypes && data.leaveTypes.length > 0) setLeaveTypes(data.leaveTypes);
        if (data.branches && data.branches.length > 0) setBranches(data.branches);
        if (data.departments && data.departments.length > 0) setDepartments(data.departments);
        if (data.assets && data.assets.length > 0) setAssets(data.assets);
        if (data.payroll && data.payroll.length > 0) setPayroll(data.payroll);
        if (data.kpiCriteria && data.kpiCriteria.length > 0) setKpiCriteria(data.kpiCriteria);
        if (data.kpiRecords && data.kpiRecords.length > 0) setKpiRecords(data.kpiRecords);
        if (data.settings && Object.keys(data.settings).length > 0) setSettings(s => ({ ...s, ...data.settings }));
      };

      // 1) โหลดจาก cache ก่อน (แสดงทันที ไม่ต้องรอเน็ต)
      let hadCache = false;
      try {
        // cache version — เปลี่ยนเลขนี้เมื่อโครงสร้างข้อมูลเปลี่ยน เพื่อล้าง cache เก่าที่ format ผิด
        const CACHE_VER = 'v2-date-normalize';
        if (localStorage.getItem('ffc_cache_ver') !== CACHE_VER) {
          localStorage.removeItem('ffc_data_cache');
          localStorage.setItem('ffc_cache_ver', CACHE_VER);
        }
        const cached = localStorage.getItem('ffc_data_cache');
        if (cached) {
          applyData(JSON.parse(cached));
          hadCache = true;
          setLoading(false);  // มี cache แล้ว ไม่ต้องโชว์ loading
        }
      } catch {}

      // 2) ซิงค์ข้อมูลจริงเบื้องหลัง แล้วอัปเดต + cache
      (async () => {
        try {
          const data = await api.get('getAll');
          applyData(data);
          try { localStorage.setItem('ffc_data_cache', JSON.stringify(data)); } catch {}
        } catch (err) {
          if (!hadCache) {
            setToast({ type: 'error', message: 'เชื่อมต่อ Supabase ล้มเหลว: ' + err.message });
            const emps = seedEmployees();
            setEmployees(emps);
            setAttendance(seedAttendance(emps));
            setLeaves(seedLeaves(emps));
          }
        } finally {
          setLoading(false);
        }
      })();
    } else {
      // โหมด Demo
      const emps = seedEmployees();
      setEmployees(emps);
      setAttendance(seedAttendance(emps));
      setLeaves(seedLeaves(emps));
    }
  }, []);

  // บันทึก cache อัตโนมัติเมื่อข้อมูลเปลี่ยน (กันข้อมูลหายตอนรีเฟรช)
  useEffect(() => {
    if (!api.enabled() || loading) return;
    try {
      localStorage.setItem('ffc_data_cache', JSON.stringify({
        employees, attendance, leaves, leaveTypes, branches,
        departments, assets, payroll, kpiCriteria, kpiRecords, settings,
      }));
    } catch {}
  }, [employees, attendance, leaves, assets, payroll, kpiCriteria, kpiRecords, leaveTypes, branches, departments, settings, loading]);

  const addToast = (type, message) => setToast({ type, message });

  // ดึงข้อมูลใหม่จาก Sheets แบบไม่ต้องรีเฟรชหน้า (เร็วกว่า + ไม่กระพริบ)
  const [syncing, setSyncing] = useState(false);
  // โหลดข้อมูลย้อนหลังเพิ่ม (attendance/leaves/payroll) เมื่อหน้า export/รายงานต้องใช้
  const [historyLoaded, setHistoryLoaded] = useState(false);
  const loadHistory = async (fromDate) => {
    if (!api.enabled() || historyLoaded) return;
    const from = fromDate || '2020-01-01';   // ดึงทั้งหมดตั้งแต่เริ่มใช้ระบบ
    try {
      const [att, lv, pay] = await Promise.all([
        api.get('getRange', { table: 'attendance', from }),
        api.get('getRange', { table: 'leaves', from }),
        api.get('getRange', { table: 'payroll', from }),
      ]);
      // merge แบบไม่ซ้ำ (ใช้ id)
      const mergeById = (cur, more) => {
        const map = new Map(cur.map(x => [x.id, x]));
        (more || []).forEach(x => map.set(x.id, x));
        return Array.from(map.values());
      };
      setAttendance(cur => mergeById(cur, att));
      setLeaves(cur => mergeById(cur, lv));
      setPayroll(cur => mergeById(cur, pay));
      setHistoryLoaded(true);
      addToast('success', 'โหลดข้อมูลย้อนหลังครบแล้ว');
    } catch (err) {
      addToast('error', 'โหลดข้อมูลย้อนหลังไม่สำเร็จ: ' + err.message);
    }
  };

  const refreshData = async () => {
    if (!api.enabled() || syncing) return;
    setSyncing(true);
    try {
      const data = await api.get('getAll');
      setEmployees(data.employees || []);
      setAttendance(data.attendance || []);
      setLeaves(data.leaves || []);
      if (data.leaveTypes?.length) setLeaveTypes(data.leaveTypes);
      if (data.branches?.length) setBranches(data.branches);
      if (data.departments?.length) setDepartments(data.departments);
      if (data.assets?.length) setAssets(data.assets);
      if (data.payroll?.length) setPayroll(data.payroll);
      if (data.kpiCriteria?.length) setKpiCriteria(data.kpiCriteria);
      if (data.kpiRecords?.length) setKpiRecords(data.kpiRecords);
      if (data.settings && Object.keys(data.settings).length) setSettings(s => ({ ...s, ...data.settings }));
      try { localStorage.setItem('ffc_data_cache', JSON.stringify(data)); } catch {}
      addToast('success', 'อัปเดตข้อมูลล่าสุดแล้ว');
    } catch (err) {
      addToast('error', 'ซิงค์ไม่สำเร็จ: ' + err.message);
    } finally {
      setSyncing(false);
    }
  };

  // Loading screen ระหว่างเชื่อมต่อ API
  if (loading) {
    return (
      <div className="min-h-screen login-bg flex items-center justify-center">
        <div className="text-center text-white">
          <div className="w-24 h-24 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center mx-auto mb-6 shadow-card animate-pulse-soft p-3">
            <img src={LOGO_EAGLE} alt="FFC" className="w-full h-full object-contain" style={{ filter: 'brightness(1.5)' }} />
          </div>
          <div className="font-display text-2xl font-bold mb-2">กำลังเชื่อมต่อ Supabase...</div>
          <div className="text-brand-200/70 text-sm flex items-center gap-2 justify-center">
            <Icon name="refresh" className="w-4 h-4 animate-spin" />
            <span>กรุณารอสักครู่</span>
          </div>
        </div>
      </div>
    );
  }

  if (!user) {
    const handleLogin = (u) => {
      try { localStorage.setItem('ffc_session_user', JSON.stringify(u)); } catch {}
      setUser(u);
    };
    return (
      <>
        <LoginPage onLogin={handleLogin} addToast={addToast} />
        {toast && <Toast toast={toast} onClose={() => setToast(null)} />}
      </>
    );
  }

  const handleLogout = () => {
    try { localStorage.removeItem('ffc_session_user'); } catch {}
    setUser(null);
    setPage('dashboard');
  };

  // attach empId if user is employee (demo)
  const effectiveUser = user.role === 'employee' && !user.empId
    ? { ...user, empId: employees[0]?.id }
    : user;

  return (
    <AppCtx.Provider value={{
      user: effectiveUser, employees, setEmployees,
      attendance, setAttendance, leaves, setLeaves,
      leaveTypes, setLeaveTypes,
      branches, setBranches,
      departments, setDepartments,
      assets, setAssets,
      payroll, setPayroll,
      kpiCriteria, setKpiCriteria,
      kpiRecords, setKpiRecords,
      settings, setSettings,
      page, setPage,
      refreshData, syncing,
      loadHistory, historyLoaded,
      addToast,
    }}>
      <div className="flex min-h-screen bg-ink-50">
        {api.enabled() && (
          <div className="fixed bottom-4 left-4 z-40 bg-emerald-500 text-white text-xs font-medium px-3 py-1.5 rounded-full shadow-soft flex items-center gap-1.5 no-print">
            <span className="w-1.5 h-1.5 bg-white rounded-full animate-pulse" />
            เชื่อมต่อ Supabase
          </div>
        )}

        {/* ปุ่มแฮมเบอร์เกอร์ (เฉพาะมือถือ) */}
        <button
          onClick={() => setMobileMenuOpen(true)}
          className="lg:hidden fixed top-3 left-3 z-50 w-10 h-10 rounded-xl bg-white shadow-soft border border-ink-100 flex items-center justify-center no-print">
          <svg className="w-5 h-5 text-ink-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <path d="M3 6h18M3 12h18M3 18h18" strokeLinecap="round" />
          </svg>
        </button>

        {/* Overlay มืดหลังเมนู (มือถือ) */}
        {mobileMenuOpen && (
          <div onClick={() => setMobileMenuOpen(false)}
            className="lg:hidden fixed inset-0 bg-black/40 z-50 no-print" />
        )}

        <Sidebar
          current={page}
          onChange={(p) => { setPage(p); setMobileMenuOpen(false); }}
          user={effectiveUser}
          onLogout={handleLogout}
          mobileOpen={mobileMenuOpen}
          onCloseMobile={() => setMobileMenuOpen(false)}
        />
        <main className="flex-1 min-w-0 pt-14 lg:pt-0">
          {page === 'dashboard'  && <Dashboard />}
          {page === 'checkin'    && <CheckInPage />}
          {page === 'employees'  && <EmployeesPage />}
          {page === 'attendance' && <AttendancePage />}
          {page === 'leaves'     && <LeavesPage />}
          {page === 'ot'         && <OTPage />}
          {page === 'warnings'   && <WarningPage />}
          {page === 'calendar'   && <TeamCalendarPage />}
          {page === 'myinfo'     && <MyInfoPage />}
          {page === 'assets'     && <AssetsPage />}
          {page === 'payroll'    && <PayrollPage />}
          {page === 'kpi'        && <KpiPage />}
          {page === 'expenses'   && <ExpensesPage />}
          {page === 'policies'   && <PoliciesPage />}
          {page === 'reports'    && <ReportsPage />}
          {page === 'branches'   && <BranchesPage />}
          {page === 'settings'   && <SettingsPage />}
        </main>
      </div>
      {toast && <Toast toast={toast} onClose={() => setToast(null)} />}
    </AppCtx.Provider>
  );
};

try {
  if (window.__bootCheck) clearTimeout(window.__bootCheck);
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
} catch (err) {
  document.getElementById('root').innerHTML =
    '<div style="padding:40px;font-family:Sarabun,sans-serif;color:#DC2626;max-width:600px;margin:40px auto;line-height:1.7">'
    + '<h2 style="font-size:20px;margin-bottom:12px">เกิดข้อผิดพลาดในการโหลดระบบ</h2>'
    + '<p style="color:#475569">' + (err && err.message ? err.message : err) + '</p>'
    + '<p style="color:#94A3B8;font-size:13px;margin-top:16px">ลองรีเฟรชหน้า (Ctrl+Shift+R) หรือเปิดด้วยเบราว์เซอร์อื่น</p>'
    + '</div>';
  console.error('App mount error:', err);
}
</script>
</body>
</html>
