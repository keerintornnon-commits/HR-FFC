            <div className="flex items-center justify-between px-5 py-2.5 bg-flow-50/60 border-b border-flow-100">
              <div className="text-sm text-ink-600">
                {selected.length > 0 ? <span className="font-medium text-flow-700">เลือก {selected.length} คน</span> : 'เลือกพนักงานเพื่อพิมพ์สลิปหลายคนพร้อมกัน'}
              </div>
              <Button size="sm" icon="download" onClick={printSelected} disabled={selected.length === 0}>
                พิมพ์สลิป {selected.length > 0 ? `(${selected.length})` : 'ที่เลือก'}
              </Button>
            </div>
            <table className="w-full text-sm">
              <thead className="bg-ink-50 text-ink-600 text-left">
                <tr>
                  <th className="px-5 py-3 w-10">
                    <input type="checkbox" checked={allSelected} onChange={toggleSelectAll}
                      className="rounded border-ink-300 text-flow-600 focus:ring-flow-500 cursor-pointer" />
                  </th>
                  <th className="px-5 py-3 font-medium">พนักงาน</th>
                  <th className="px-5 py-3 font-medium text-right">รายได้รวม</th>
                  <th className="px-5 py-3 font-medium text-right">รายการหัก</th>
                  <th className="px-5 py-3 font-medium text-right">เงินรับสุทธิ</th>
                  <th className="px-5 py-3 font-medium text-right">จัดการ</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-ink-100">
                {monthRecords.map(p => {
                  const emp = employees.find(e => e.id === p.employeeId);
                  if (!emp) return null;
                  const c = calcPayroll(p);
                  const isChecked = selected.includes(p.id);
                  return (
                    <tr key={p.id} className={cls('hover:bg-flow-50/40 transition-colors', isChecked && 'bg-flow-50/50')}>
                      <td className="px-5 py-3" onClick={(e) => e.stopPropagation()}>
                        <input type="checkbox" checked={isChecked} onChange={() => toggleSelect(p.id)}
                          className="rounded border-ink-300 text-flow-600 focus:ring-flow-500 cursor-pointer" />
                      </td>
                      <td className="px-5 py-3 cursor-pointer" onClick={() => setSlip(p)}>
                        <div className="flex items-center gap-3">
                          <Avatar name={`${emp.firstName} ${emp.lastName}`} photo={emp.photo} size="sm" />
                          <div>
                            <div className="font-medium text-ink-900">{emp.firstName} {emp.lastName}</div>
                            <div className="text-xs text-ink-500">{emp.id} · {emp.position}</div>
                          </div>
                        </div>
                      </td>
                      <td className="px-5 py-3 text-right text-emerald-700 cursor-pointer" onClick={() => setSlip(p)}>{fmtMoney(c.earnings)}</td>
                      <td className="px-5 py-3 text-right text-red-600 cursor-pointer" onClick={() => setSlip(p)}>{fmtMoney(c.deductions)}</td>
                      <td className="px-5 py-3 text-right font-display font-bold text-ink-900 cursor-pointer" onClick={() => setSlip(p)}>{fmtMoney(c.net)}</td>
                      <td className="px-5 py-3 text-right">
                        <div className="inline-flex gap-1">
                          <button onClick={() => setSlip(p)} className="p-1.5 rounded-lg text-ink-500 hover:bg-flow-50 hover:text-flow-700" title="ดูสลิป">
                            <Icon name="eye" className="w-4 h-4" />
                          </button>
                          {canEdit && (
                            <>
                              <button onClick={() => { setEditing(p); setOpenForm(true); }} className="p-1.5 rounded-lg text-ink-500 hover:bg-flow-50 hover:text-flow-700" title="แก้ไข">
                                <Icon name="edit" className="w-4 h-4" />
                              </button>
                              <button onClick={() => deletePayroll(p.id)} className="p-1.5 rounded-lg text-ink-500 hover:bg-red-50 hover:text-red-600" title="ลบ">
                                <Icon name="trash" className="w-4 h-4" />
                              </button>
                            </>
                          )}
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      <PayrollFormModal
        open={openForm}
        onClose={() => { setOpenForm(false); setEditing(null); }}
        editing={editing}
        onSave={savePayroll}
        employees={employees.filter(e => user.role !== 'manager' || e.branchId === user.branchId)}
        defaultPeriod={month}
        attendance={attendance}
        leaves={leaves}
        leaveTypes={leaveTypes}
        settings={settings}
      />

      <PayslipModal
        record={slip}
        onClose={() => setSlip(null)}
        employees={employees}
        branches={branches}
        settings={settings}
      />
    </div>
  );
};

/* ===== PAYROLL FORM MODAL ===== */
const PayrollFormModal = ({ open, onClose, editing, onSave, employees, defaultPeriod, attendance, leaves, leaveTypes, settings }) => {
  const [form, setForm] = useState({});
  const [autoInfo, setAutoInfo] = useState(null);  // ผลการคำนวณอัตโนมัติ

  useEffect(() => {
    if (editing) {
      // เติม periodFrom/To ถ้า record เก่ามีแค่ period
      const ed = { ...editing };
      if (!ed.periodFrom && ed.period) {
        ed.periodFrom = ed.period + '-01';
        const [y, m] = ed.period.split('-').map(Number);
        ed.periodTo = `${ed.period}-${String(new Date(y, m, 0).getDate()).padStart(2, '0')}`;
      }
      setForm(ed);
    } else {
      // ค่าเริ่มต้น: เดือนปัจจุบันเต็มเดือน
      const dp = defaultPeriod || new Date().toISOString().slice(0, 7);
      const [y, m] = dp.split('-').map(Number);
      setForm({
        id: '', employeeId: employees[0]?.id || '',
        period: dp,
        periodFrom: dp + '-01',
        periodTo: `${dp}-${String(new Date(y, m, 0).getDate()).padStart(2, '0')}`,
        baseSalary: '', overtime: '', transport: '', bonus: '', otherEarn: '',
        sso: '', tax: '', absenceDeduct: '', gyos: '', otherDeduct: '',
        payDate: new Date().toISOString().split('T')[0], note: '',
      });
    }
    setAutoInfo(null);
  }, [editing, open, defaultPeriod]);

  if (!open) return null;

  const c = calcPayroll(form);
  const selectedEmp = employees.find(e => e.id === form.employeeId);

  // preset ช่วงวันที่
  const setRangePreset = (preset) => {
    const today = new Date();
    let from, to;
    if (preset === 'thisMonth') {
      const y = today.getFullYear(), m = today.getMonth();
      from = new Date(y, m, 1); to = new Date(y, m + 1, 0);
    } else if (preset === 'week') {
      to = new Date(today); from = new Date(today); from.setDate(from.getDate() - 6);
    } else if (preset === 'half1') {
      from = new Date(today.getFullYear(), today.getMonth(), 1);
      to = new Date(today.getFullYear(), today.getMonth(), 15);
    } else if (preset === 'half2') {
      from = new Date(today.getFullYear(), today.getMonth(), 16);
      to = new Date(today.getFullYear(), today.getMonth() + 1, 0);
    }
    const fStr = from.toISOString().split('T')[0], tStr = to.toISOString().split('T')[0];
    setForm(f => ({ ...f, periodFrom: fStr, periodTo: tStr, period: fStr.slice(0, 7) }));
  };

  // คำนวณอัตโนมัติจากข้อมูลพนักงาน + การเข้างาน + การลา
  const runAutoCalc = () => {
    if (!selectedEmp) return alert('กรุณาเลือกพนักงานก่อน');
    if (!form.periodFrom || !form.periodTo) return alert('กรุณาเลือกช่วงวันที่');
    if (form.periodFrom > form.periodTo) return alert('วันเริ่มต้องไม่เกินวันสิ้นสุด');
    const r = computeAutoPayroll(selectedEmp, { from: form.periodFrom, to: form.periodTo }, attendance || [], leaves || [], leaveTypes || [], settings || {});
    setAutoInfo(r);
    // เติมค่าลงฟอร์มอัตโนมัติ
    setForm(f => ({
      ...f,
      baseSalary: r.baseSalary,
      otherEarn: r.special || '',
      absenceDeduct: Math.round((r.lateFine + r.leaveDeduct) * 100) / 100,
      // เก็บรายละเอียดไว้แสดงในสลิป
      breakdown: {
        salaryType: r.salaryType, perDay: r.perDay, workedDays: r.workedDays,
        lateFine: r.lateFine, lateDetails: r.lateDetails,
        leaveDeduct: r.leaveDeduct, leaveDetails: r.leaveDetails,
      },
    }));
  };

  const submit = (e) => {
    e.preventDefault();
    if (!form.employeeId) return alert('กรุณาเลือกพนักงาน');
    if (!form.periodFrom || !form.periodTo) return alert('กรุณาเลือกช่วงวันที่ของรอบ');
    if (form.periodFrom > form.periodTo) return alert('วันเริ่มต้องไม่เกินวันสิ้นสุด');
    onSave({ ...form, id: form.id || `PAY${Date.now()}`, period: form.periodFrom.slice(0, 7) });
  };

  const earnFields = [
    ['baseSalary', 'เงินเดือนพื้นฐาน'],
    ['overtime', 'ค่าล่วงเวลา (OT)'],
    ['transport', 'ค่าพาหนะ'],
    ['bonus', 'โบนัส'],
    ['otherEarn', 'รายได้อื่นๆ'],
  ];
  const deductFields = [
    ['sso', 'ประกันสังคม'],
    ['tax', 'ภาษี ณ ที่จ่าย'],
    ['absenceDeduct', 'หักขาดงาน/มาสาย/ลา'],
    ['gyos', 'หัก กยศ.'],
    ['otherDeduct', 'รายการหักอื่นๆ'],
  ];

  return (
    <Modal open={open} onClose={onClose} title={editing ? 'แก้ไขเงินเดือน' : 'เพิ่มข้อมูลเงินเดือน'} size="lg">
      <form onSubmit={submit} className="space-y-4">
        <div className="space-y-3">
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">พนักงาน</label>
            <Select value={form.employeeId} onChange={(e) => setForm({ ...form, employeeId: e.target.value })} disabled={!!editing} required>
              {employees.map(e => <option key={e.id} value={e.id}>{e.firstName} {e.lastName} ({e.id})</option>)}
            </Select>
          </div>

          {/* รอบจ่ายเงิน - ช่วงวันที่ */}
          <div className="bg-ink-50 rounded-xl p-3">
            <label className="block text-sm font-medium text-ink-700 mb-2">รอบจ่ายเงิน (เลือกช่วงวันที่)</label>
            <div className="flex flex-wrap gap-1.5 mb-2">
              {[
                { id: 'thisMonth', label: 'ทั้งเดือน' },
                { id: 'half1', label: 'วันที่ 1-15' },
                { id: 'half2', label: 'วันที่ 16-สิ้นเดือน' },
                { id: 'week', label: '7 วันล่าสุด' },
              ].map(p => (
                <button key={p.id} type="button" onClick={() => setRangePreset(p.id)}
                  className="text-xs px-2.5 py-1 rounded-lg border border-ink-200 hover:border-flow-400 hover:bg-flow-50 transition-colors">{p.label}</button>
              ))}
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="block text-xs text-ink-500 mb-1">ตั้งแต่วันที่</label>
                <Input type="date" value={form.periodFrom || ''} max={form.periodTo} onChange={(e) => setForm({ ...form, periodFrom: e.target.value, period: e.target.value.slice(0,7) })} required />
              </div>
              <div>
                <label className="block text-xs text-ink-500 mb-1">ถึงวันที่</label>
                <Input type="date" value={form.periodTo || ''} min={form.periodFrom} onChange={(e) => setForm({ ...form, periodTo: e.target.value })} required />
              </div>
            </div>
          </div>

          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">วันที่จ่ายเงิน</label>
            <Input type="date" value={form.payDate || ''} onChange={(e) => setForm({ ...form, payDate: e.target.value })} />
          </div>
        </div>

        {/* คำนวณอัตโนมัติ */}
        <div className="bg-flow-50 border border-flow-200 rounded-xl p-4">
          <div className="flex items-center justify-between gap-3">
            <div className="text-sm text-ink-700">
              <div className="font-medium text-flow-800">คำนวณอัตโนมัติจากการเข้างาน + การลา</div>
              <div className="text-xs text-ink-600 mt-0.5">
                {selectedEmp ? (
                  <>ประเภท: <strong>{selectedEmp.salaryType === 'daily' ? 'รายวัน' : 'รายเดือน'}</strong>
                  {' '}· ฐาน {fmtMoney(selectedEmp.baseSalary)} บาท</>
                ) : 'เลือกพนักงานก่อน'}
              </div>
            </div>
            <Button type="button" variant="outline" size="sm" icon="refresh" onClick={runAutoCalc}>คำนวณ</Button>
          </div>

          {autoInfo && (
            <div className="mt-3 pt-3 border-t border-flow-200 space-y-1.5 text-xs">
              <div className="flex justify-between"><span className="text-ink-600">เงินเดือน/วัน</span><span className="font-medium">{fmtMoney(autoInfo.perDay)} บาท</span></div>
              {autoInfo.salaryType === 'daily' && (
                <div className="flex justify-between"><span className="text-ink-600">วันทำงาน</span><span className="font-medium">{autoInfo.workedDays} วัน</span></div>
              )}
              <div className="flex justify-between"><span className="text-ink-600">ฐานเงินเดือน</span><span className="font-medium text-emerald-700">{fmtMoney(autoInfo.baseSalary)} บาท</span></div>
              {autoInfo.special > 0 && <div className="flex justify-between"><span className="text-ink-600">เงินพิเศษ</span><span className="font-medium text-emerald-700">{fmtMoney(autoInfo.special)} บาท</span></div>}
              {autoInfo.lateFine > 0 && (
                <div className="flex justify-between"><span className="text-ink-600">หักมาสาย ({autoInfo.lateDetails.length} ครั้ง)</span><span className="font-medium text-red-600">-{fmtMoney(autoInfo.lateFine)} บาท</span></div>
              )}
              {autoInfo.leaveDeduct > 0 && (
                <div className="flex justify-between"><span className="text-ink-600">หักการลา</span><span className="font-medium text-red-600">-{fmtMoney(autoInfo.leaveDeduct)} บาท</span></div>
              )}
              {autoInfo.leaveDetails.length > 0 && (
                <div className="bg-white/60 rounded-lg p-2 mt-1 space-y-0.5">
                  {autoInfo.leaveDetails.map((d, i) => (
                    <div key={i} className="flex justify-between text-[11px]">
                      <span className="text-ink-500">{d.label} ({d.days} วัน) — {d.reason}</span>
                      <span className={d.deduct > 0 ? 'text-red-500' : 'text-emerald-600'}>{d.deduct > 0 ? `-${fmtMoney(d.deduct)}` : 'ไม่หัก'}</span>
                    </div>
                  ))}
                </div>
              )}
              <div className="text-[11px] text-ink-500 pt-1">* ค่าถูกเติมลงในช่องด้านล่างแล้ว (หักมาสาย+หักลา รวมอยู่ใน "หักขาดงาน") ปรับแก้ได้</div>
            </div>
          )}
        </div>

        <div className="grid md:grid-cols-2 gap-4">
          {/* Earnings */}
          <div className="bg-emerald-50/50 border border-emerald-100 rounded-xl p-4">
            <h4 className="font-display font-semibold text-emerald-700 mb-3 flex items-center gap-2">
              <Icon name="tag" className="w-4 h-4" /> รายได้
            </h4>
            <div className="space-y-2.5">
              {earnFields.map(([key, label]) => (
                <div key={key} className="flex items-center gap-2">
                  <label className="text-xs text-ink-600 flex-1">{label}</label>
                  <Input type="number" step="0.01" className="w-32 text-right" value={form[key] || ''} onChange={(e) => setForm({ ...form, [key]: e.target.value })} />
                </div>
              ))}
              <div className="flex items-center justify-between pt-2 border-t border-emerald-200">
                <span className="text-sm font-medium text-ink-700">รวมรายได้</span>
                <span className="font-display font-bold text-emerald-700">{fmtMoney(c.earnings)}</span>
              </div>
            </div>
          </div>

          {/* Deductions */}
          <div className="bg-red-50/50 border border-red-100 rounded-xl p-4">
            <h4 className="font-display font-semibold text-red-600 mb-3 flex items-center gap-2">
              <Icon name="x" className="w-4 h-4" /> รายการหัก
            </h4>
            <div className="space-y-2.5">
              {deductFields.map(([key, label]) => (
                <div key={key} className="flex items-center gap-2">
                  <label className="text-xs text-ink-600 flex-1">{label}</label>
                  <Input type="number" step="0.01" className="w-32 text-right" value={form[key] || ''} onChange={(e) => setForm({ ...form, [key]: e.target.value })} />
                </div>
              ))}
              <div className="flex items-center justify-between pt-2 border-t border-red-200">
                <span className="text-sm font-medium text-ink-700">รวมรายการหัก</span>
                <span className="font-display font-bold text-red-600">{fmtMoney(c.deductions)}</span>
              </div>
            </div>
          </div>
        </div>

        {/* Net */}
        <div className="bg-gradient-to-r from-flow-500 to-brand-600 rounded-xl p-4 flex items-center justify-between text-white">
          <span className="font-display font-semibold">เงินรับสุทธิ (NET PAY)</span>
          <span className="font-display text-2xl font-bold">{fmtMoney(c.net)} บาท</span>
        </div>

        <div className="flex justify-end gap-2 pt-4 border-t border-ink-100">
          <Button type="button" variant="secondary" onClick={onClose}>ยกเลิก</Button>
          <Button type="submit" icon={editing ? 'check' : 'plus'}>{editing ? 'บันทึก' : 'เพิ่มเงินเดือน'}</Button>
        </div>
      </form>
    </Modal>
  );
};

/* ===== PAYSLIP MODAL — สลิปเงินเดือน (ปรินได้) ===== */
// สร้าง HTML เนื้อหาสลิป 1 ใบ (ใช้ทั้งพิมพ์เดี่ยวและพิมพ์หลายคน)
const buildSlipInner = (record, employees, branches, settings) => {
  const emp = employees.find(e => e.id === record.employeeId);
  if (!emp) return '';
  const branch = branches.find(b => b.id === emp.branchId);
  const c = calcPayroll(record);
  const [py, pm] = (record.period || '').split('-');
  const monthLabel = pm ? `${THAI_MONTHS[parseInt(pm,10)-1]} ${parseInt(py,10)+543}` : record.period;
  const periodLabel = (record.periodFrom && record.periodTo)
    ? `${fmtDate(record.periodFrom)} - ${fmtDate(record.periodTo)}` : monthLabel;
  const payDateLabel = record.payDate ? fmtDate(record.payDate) : '-';

  const earnRows = [
    ['เงินเดือนพื้นฐาน', 'BASIC SALARY', record.baseSalary],
    ['ค่าล่วงเวลา', 'OVERTIME', record.overtime],
    ['ค่าพาหนะ', 'TRANSPORT', record.transport],
    ['โบนัส', 'BONUS', record.bonus],
    ['รายได้อื่นๆ', 'OTHER', record.otherEarn],
  ].filter(r => Number(r[2]) > 0);

  const bd = record.breakdown;
  let deductRows = [];
  deductRows.push(['ประกันสังคม', 'SSO', record.sso]);
  deductRows.push(['ภาษี ณ ที่จ่าย', 'WITHHOLDING TAX', record.tax]);
  if (bd && (bd.lateFine > 0 || (bd.leaveDetails && bd.leaveDetails.some(d => d.deduct > 0)))) {
    if (bd.lateFine > 0) deductRows.push(['หักมาสาย', `LATE (${bd.lateDetails.length} ครั้ง)`, bd.lateFine]);
    (bd.leaveDetails || []).forEach(d => { if (d.deduct > 0) deductRows.push([`หัก${d.label}`, `${d.days} วัน`, d.deduct]); });
  } else if (Number(record.absenceDeduct) > 0) {
    deductRows.push(['หักขาดงาน/มาสาย/ลา', 'ABSENCE/LATE/LEAVE', record.absenceDeduct]);
  }
  deductRows.push(['หัก กยศ.', 'STUDENT LOAN', record.gyos]);
  deductRows.push(['รายการหักอื่นๆ', 'OTHER', record.otherDeduct]);
  deductRows = deductRows.filter(r => Number(r[2]) > 0);

  const row = (th, en, val, isDeduct) =>
    `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #E2E8F0">
      <div><div style="font-size:12px;color:#1E293B">${th}</div><div style="font-size:8px;color:#94A3B8">${en}</div></div>
      <div style="font-size:12px;font-weight:600;${isDeduct?'color:#DC2626':''}">${isDeduct?'-':''}${fmtMoney(val)}</div>
    </div>`;

  return `
    <div style="display:flex;align-items:center;gap:12px;padding:14px;border-bottom:2px solid #1E3A8A">
      <img src="${LOGO_EAGLE}" style="width:60px;height:auto" />
      <div style="flex:1">
        <div class="font-display" style="font-size:17px;font-weight:700;color:#1E3A8A;line-height:1.2">${settings.companyName||''}</div>
        <div class="font-display" style="font-size:11px;font-weight:600;color:#3B82F6">${settings.companyNameEn||'FREEDOM FLOW TRADING CO., LTD.'}</div>
        <div style="font-size:9px;color:#64748B;margin-top:2px">${settings.address||''}</div>
      </div>
      <div style="text-align:center;padding-left:12px;border-left:2px solid #E2E8F0">
        <div class="font-display" style="font-size:18px;font-weight:700;color:#1E3A8A;white-space:nowrap">สลิปเงินเดือน</div>
        <div style="font-size:10px;color:#64748B;letter-spacing:1px">PAYSLIP</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;border-bottom:1px solid #CBD5E1">
      ${[['รหัสพนักงาน', emp.id], ['ชื่อ-นามสกุล', `${emp.firstName} ${emp.lastName}`], ['ตำแหน่ง', emp.position], ['รอบ / วันที่จ่าย', periodLabel]]
        .map(([l,v],i) => `<div style="padding:7px;${i<3?'border-right:1px solid #E2E8F0':''}"><div style="font-size:9px;color:#94A3B8">${l}</div><div style="font-size:12px;font-weight:600;color:#1E293B">${v}</div></div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr">
      <div style="border-right:1px solid #CBD5E1">
        <div style="background:#BFDBFE;padding:6px;text-align:center;font-weight:700;color:#1E3A8A;font-size:12px">รายได้ (EARNINGS)</div>

   KPI — ประเมินผลงานพนักงาน
   ============================================================= */
// แปลงคะแนน % เป็นเกรด
const kpiGrade = (pct) => {
  if (pct >= 90) return { grade: 'A', label: 'ดีเยี่ยม', color: '#10B981' };
  if (pct >= 80) return { grade: 'B', label: 'ดี', color: '#06B6D4' };
  if (pct >= 70) return { grade: 'C', label: 'พอใช้', color: '#F59E0B' };
  if (pct >= 60) return { grade: 'D', label: 'ต้องปรับปรุง', color: '#F97316' };
  return { grade: 'F', label: 'ไม่ผ่าน', color: '#EF4444' };
};

// คำนวณคะแนนรวมของ record (ถ่วงน้ำหนัก) — ใช้หัวข้อที่เก็บอยู่ใน record เอง
// รองรับ record เก่าที่ยังไม่มี criteria (fallback ไปใช้ criteria ที่ส่งเข้ามา)
// flatten หัวข้อ KPI → รายการตัวชี้วัดที่ให้คะแนนได้ (รองรับทั้งแบบ 2 ระดับ และแบบเก่า)
const flattenKpi = (criteria) => {
  const items = [];
  (criteria || []).forEach(cat => {
    if (cat.subItems && cat.subItems.length > 0) {
      cat.subItems.forEach(s => items.push({ ...s, catId: cat.id, catName: cat.name, catWeight: cat.weight }));
    } else {
      // แบบเก่า: หัวข้อเดียวไม่มีย่อย
      items.push({ id: cat.id, weight: cat.weight, indicator: cat.name, catId: cat.id, catName: cat.name, catWeight: cat.weight });
    }
  });
  return items;
};

// แสดงเป้าหมายเป็นข้อความ
const fmtKpiTarget = (s) => {
  if (!s) return '';
  if (s.targetType === 'count') {
    const unit = s.targetUnit === 'week' ? 'สัปดาห์' : 'เดือน';
    return `${s.targetValue} ครั้ง/${unit}`;
  }
  if (s.targetType === 'percent') return `≥ ${s.targetValue}%`;
  return '';
};

const calcKpiScore = (record, fallbackCriteria) => {
  const criteria = (record.criteria && record.criteria.length > 0) ? record.criteria : (fallbackCriteria || []);
  const items = flattenKpi(criteria);
  let totalWeight = 0, weightedScore = 0;
  items.forEach(it => {
    const score = Number(record.scores?.[it.id]) || 0;  // 0-100
    const weight = Number(it.weight) || 0;
    totalWeight += weight;
    weightedScore += (score * weight) / 100;
  });
  const pct = totalWeight > 0 ? Math.round((weightedScore / totalWeight) * 100) : 0;
  return { pct, totalWeight, criteria, items };
};

const KpiPage = () => {
  const { kpiCriteria, setKpiCriteria, kpiRecords, setKpiRecords, employees, branches, user, addToast } = useApp();
  const [tab, setTab] = useState('eval');   // eval / criteria
  const [period, setPeriod] = useState(new Date().toISOString().slice(0, 7));

  const [editingEval, setEditingEval] = useState(null);
  const [openCrit, setOpenCrit] = useState(false);
  const [editingCrit, setEditingCrit] = useState(null);

  const canEdit = user.role === 'admin' || user.role === 'hr' || user.role === 'manager';

  const myScope = myEmp?.approvalScope || (myEmp?.canApprove ? 'manager' : 'none');
  const isRegional = myScope === 'regional';
  const lockedBranch = (user.role === 'manager' || isRegional) ? (user.branchId || myEmp?.branchId) : null;
  const canEvaluate = canEdit || isRegional;

  // record ของรอบที่เลือก
  const periodRecords = useMemo(() => {
    return kpiRecords.filter(r => {
      if (r.period !== period) return false;
      const emp = employees.find(e => e.id === r.employeeId);
      if (!emp) return false;
      if (lockedBranch && emp.branchId !== lockedBranch) return false;
      if (search) {
        const q = search.toLowerCase();
        return `${emp.firstName} ${emp.lastName}`.toLowerCase().includes(q) || emp.id.toLowerCase().includes(q);
      }
      return true;
    });
  }, [kpiRecords, period, search, employees, user, lockedBranch]);

  const totalWeight = kpiCriteria.reduce((s, c) => s + (Number(c.weight) || 0), 0);

  // ===== จัดการหัวข้อ KPI =====
  const saveCriteria = (c) => {
    let updated;
    if (editingCrit) {
      updated = kpiCriteria.map(x => x.id === c.id ? c : x);

    setKpiCriteria(updated);
    if (api.enabled()) api.post('saveKpiCriteria', { data: updated }).catch(e => addToast('error', 'บันทึกไม่สำเร็จ'));
    setOpenCrit(false); setEditingCrit(null);
  };
  const deleteCriteria = (id) => {
    if (!confirm('ลบหัวข้อนี้? (ผลประเมินเดิมจะยังเก็บคะแนนไว้)')) return;
    const updated = kpiCriteria.filter(c => c.id !== id);
    setKpiCriteria(updated);
    if (api.enabled()) api.post('saveKpiCriteria', { data: updated }).catch(() => {});
  };

  // ===== จัดการผลประเมิน =====
  const saveEval = (rec) => {
    let updated;
    if (editingEval) {
      updated = kpiRecords.map(x => x.id === rec.id ? rec : x);
      addToast('success', 'บันทึกผลประเมินเรียบร้อย');
    } else {
      const dup = kpiRecords.find(x => x.employeeId === rec.employeeId && x.period === rec.period);
      if (dup) { addToast('error', 'มีผลประเมินของพนักงานคนนี้ในรอบนี้แล้ว'); return; }
      updated = [...kpiRecords, rec];
      addToast('success', 'เพิ่มผลประเมินเรียบร้อย');
    }
    setKpiRecords(updated);
    if (api.enabled()) api.post('saveKpiRecord', { data: rec }).catch(e => addToast('error', 'บันทึกไม่สำเร็จ'));
    setOpenEval(false); setEditingEval(null);
  };
  const deleteEval = (id) => {
    if (!confirm('ยืนยันการลบผลประเมินนี้?')) return;
    setKpiRecords(kpiRecords.filter(r => r.id !== id));
    if (api.enabled()) api.post('deleteKpiRecord', { id }).catch(() => {});
    addToast('success', 'ลบเรียบร้อย');
  };

  // สถิติรอบนี้
  const stats = useMemo(() => {
    if (periodRecords.length === 0) return { count: 0, avg: 0, top: null };
    let sum = 0, top = null, topScore = -1;
    periodRecords.forEach(r => {
      const { pct } = calcKpiScore(r, kpiCriteria);
      sum += pct;
      if (pct > topScore) { topScore = pct; top = { r, pct }; }
    });
    return { count: periodRecords.length, avg: Math.round(sum / periodRecords.length), top };
  }, [periodRecords, kpiCriteria]);

  const [py, pm] = period.split('-');
  const periodLabel = `${THAI_MONTHS[parseInt(pm,10)-1]} ${parseInt(py,10)+543}`;

  return (
    <div className="p-8 space-y-6 animate-fade-up">
      <Topbar
        title="ประเมิน KPI"
        subtitle={`รอบ ${periodLabel} · ${periodRecords.length} คน`}
        action={canEvaluate && tab === 'eval' && (
          <Button icon="plus" onClick={() => { setEditingEval(null); setOpenEval(true); }}>
            ประเมินพนักงาน
          </Button>
        )}
      />

      {/* Tabs */}
      <div className="flex items-center gap-2 bg-ink-100 p-1 rounded-xl w-fit">
        {[
          { id: 'eval', label: 'ผลการประเมิน', icon: 'target' },
          { id: 'criteria', label: 'คลังหัวข้อ', icon: 'settings' },
        ].map(t => (
          <button key={t.id} onClick={() => setTab(t.id)}
            className={cls('inline-flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all',
              tab === t.id ? 'bg-white text-brand-700 shadow-soft' : 'text-ink-600')}>
            <Icon name={t.icon} className="w-4 h-4" /> {t.label}
          </button>
        ))}
      </div>

      {tab === 'eval' ? (
        <>
          <>
            <>
              {/* Stats */}
              <div className="grid grid-cols-2 lg:grid-cols-3 gap-4">
                <Card className="p-5 lift">
                  <div className="flex items-center gap-3">
                    <div className="w-11 h-11 rounded-xl bg-flow-100 text-flow-700 flex items-center justify-center"><Icon name="users" className="w-5 h-5" /></div>
                    <div><div className="text-xs text-ink-500">ประเมินแล้ว</div><div className="font-display text-2xl font-bold text-ink-900">{stats.count} คน</div></div>
                  </div>
                </Card>
                <Card className="p-5 lift">
                  <div className="flex items-center gap-3">
                    <div className="w-11 h-11 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center"><Icon name="chart" className="w-5 h-5" /></div>
                    <div><div className="text-xs text-ink-500">คะแนนเฉลี่ย</div><div className="font-display text-2xl font-bold text-ink-900">{stats.avg}%</div></div>
                  </div>
                </Card>
                <Card className="p-5 lift">
                  <div className="flex items-center gap-3">
                    <div className="w-11 h-11 rounded-xl bg-gold-100 text-gold-700 flex items-center justify-center"><Icon name="target" className="w-5 h-5" /></div>
                    <div>
                      <div className="text-xs text-ink-500">คะแนนสูงสุด</div>
                      <div className="font-display text-2xl font-bold text-ink-900">{stats.top ? `${stats.top.pct}%` : '-'}</div>
                    </div>
                  </div>
                </Card>
              </div>

              {/* Filter */}
              <Card className="p-4">
                <div className="grid md:grid-cols-3 gap-3">
                  <div>
                    <label className="block text-xs text-ink-500 mb-1">รอบประเมิน</label>
                    <Input type="month" value={period} onChange={(e) => setPeriod(e.target.value)} />
                  </div>
                  <div className="md:col-span-2">
                    <label className="block text-xs text-ink-500 mb-1">ค้นหา</label>
                    <Input icon="search" placeholder="ชื่อ หรือ รหัสพนักงาน..." value={search} onChange={(e) => setSearch(e.target.value)} />
                  </div>
                </div>
              </Card>

              {/* Records */}
              <Card className="overflow-hidden">
                {periodRecords.length === 0 ? (
                  <Empty icon="target" title="ยังไม่มีผลประเมิน" desc={`รอบ ${periodLabel} — คลิก "ประเมินพนักงาน"`} />
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-sm">
                      <thead className="bg-ink-50 text-ink-600 text-left">
                        <tr>
                          <th className="px-5 py-3 font-medium">พนักงาน</th>
                          <th className="px-5 py-3 font-medium">คะแนนรวม</th>
                          <th className="px-5 py-3 font-medium">เกรด</th>
                          <th className="px-5 py-3 font-medium text-right">จัดการ</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-ink-100">
                        {periodRecords.sort((a,b) => calcKpiScore(b,kpiCriteria).pct - calcKpiScore(a,kpiCriteria).pct).map(r => {
                          const emp = employees.find(e => e.id === r.employeeId);
                          if (!emp) return null;
                          const { pct } = calcKpiScore(r, kpiCriteria);
                          const g = kpiGrade(pct);
                          return (
                            <tr key={r.id} className="hover:bg-flow-50/40 transition-colors">
                              <td className="px-5 py-3">
                                <div className="flex items-center gap-3">
                                  <Avatar name={`${emp.firstName} ${emp.lastName}`} photo={emp.photo} size="sm" />
                                  <div>
                                    <div className="font-medium text-ink-900">{emp.firstName} {emp.lastName}</div>
                                    <div className="text-xs text-ink-500">{emp.id} · {emp.position}</div>
                                  </div>
                                </div>
                              </td>
                              <td className="px-5 py-3">
                                <div className="flex items-center gap-2">
                                  <div className="w-28 h-2 bg-ink-100 rounded-full overflow-hidden">
                                    <div className="h-full rounded-full" style={{ width: `${pct}%`, background: g.color }} />
                                  </div>
                                  <span className="font-display font-bold" style={{ color: g.color }}>{pct}%</span>
                                </div>
                              </td>
                              <td className="px-5 py-3">
                                <span className="inline-flex items-center gap-1.5">
                                  <span className="w-7 h-7 rounded-lg flex items-center justify-center font-display font-bold text-white text-sm" style={{ background: g.color }}>{g.grade}</span>
                                  <span className="text-sm text-ink-600">{g.label}</span>
                                </span>
                              </td>
                              <td className="px-5 py-3 text-right">
                                <div className="inline-flex gap-1">
                                  {canEvaluate && (
                                    <>
                                      <button onClick={() => { setEditingEval(r); setOpenEval(true); }} className="p-1.5 rounded-lg text-ink-500 hover:bg-flow-50 hover:text-flow-700" title="แก้ไข"><Icon name="edit" className="w-4 h-4" /></button>
                                      <button onClick={() => deleteEval(r.id)} className="p-1.5 rounded-lg text-ink-500 hover:bg-red-50 hover:text-red-600" title="ลบ"><Icon name="trash" className="w-4 h-4" /></button>
                                    </>
                                  )}
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
              </Card>
            </>
          </>
        </>
      ) : (
        /* ===== แท็บคลังหัวข้อ ===== */
        <>
          <Card className="p-4 flex items-center justify-between">
            <div className="text-sm text-ink-600">
              น้ำหนักรวมทั้งหมด: <strong className={cls('font-display', totalWeight === 100 ? 'text-emerald-600' : 'text-gold-600')}>{totalWeight}%</strong>
              {totalWeight !== 100 && <span className="text-xs text-gold-600 ml-2">(แนะนำให้รวมเป็น 100%)</span>}
            </div>
            {canEdit && <Button icon="plus" size="sm" onClick={() => { setEditingCrit(null); setOpenCrit(true); }}>เพิ่มหัวข้อ</Button>}
          </Card>

          {kpiCriteria.length === 0 ? (
            <Card className="p-8"><Empty icon="target" title="ยังไม่มีหัวข้อประเมิน" desc="คลิก 'เพิ่มหัวข้อ' เพื่อกำหนดหัวข้องานที่ต้องการวัด" /></Card>
          ) : (
            <div className="grid md:grid-cols-2 gap-4">
              {kpiCriteria.map((c, i) => (
                <Card key={c.id} className="p-5">
                  <div className="flex items-start justify-between gap-3">
                    <div className="flex items-start gap-3 min-w-0">
                      <div className="w-9 h-9 rounded-xl bg-brand-100 text-brand-700 flex items-center justify-center font-display font-bold shrink-0">{i+1}</div>
                      <div className="min-w-0">
                        <div className="font-medium text-ink-900">{c.name}</div>
                        <div className="inline-flex items-center gap-1 mt-1 px-2 py-0.5 bg-flow-50 text-flow-700 rounded-lg text-xs font-medium">น้ำหนัก {c.weight}%</div>
                      </div>
                    </div>
                    {canEdit && (
                      <div className="flex gap-1 shrink-0">
                        <button onClick={() => { setEditingCrit(c); setOpenCrit(true); }} className="p-1.5 rounded-lg text-ink-500 hover:bg-flow-50 hover:text-flow-700"><Icon name="edit" className="w-4 h-4" /></button>
                        <button onClick={() => deleteCriteria(c.id)} className="p-1.5 rounded-lg text-ink-500 hover:bg-red-50 hover:text-red-600"><Icon name="trash" className="w-4 h-4" /></button>
                      </div>
                    )}
                  </div>
                  {/* หัวข้อย่อย */}
                  {(c.subItems || []).length > 0 && (
                    <div className="mt-3 pl-12 space-y-1.5">
                      {c.subItems.map((s, si) => (
                        <div key={s.id} className="text-xs border-l-2 border-ink-100 pl-3 py-0.5">
                          <div className="font-medium text-ink-700">{si+1}. {s.indicator} <span className="text-ink-400">({s.weight}%)</span></div>
                          <div className="text-ink-500 flex flex-wrap gap-x-3">
                            {s.targetType && <span>เป้า: {fmtKpiTarget(s)}</span>}
                            {s.method && <span>วิธีวัด: {s.method}</span>}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </Card>
              ))}
            </div>
          )}
        </>
      )}

      <KpiEvalModal
        open={openEval}
        onClose={() => { setOpenEval(false); setEditingEval(null); }}
        editing={editingEval}
        onSave={saveEval}
        employees={employees.filter(e => (!lockedBranch || e.branchId === lockedBranch) && e.status !== 'inactive')}
        criteria={kpiCriteria}
        defaultPeriod={period}
      />
      <KpiCriteriaModal
        open={openCrit}
        onClose={() => { setOpenCrit(false); setEditingCrit(null); }}
        editing={editingCrit}
        onSave={saveCriteria}
      />
    </div>
  );
};

/* ===== KPI EVAL MODAL — ให้คะแนนพนักงานตามหัวข้อย่อย ===== */
const KpiEvalModal = ({ open, onClose, editing, onSave, employees, criteria, defaultPeriod }) => {
  const [form, setForm] = useState({});
  const [picker, setPicker] = useState(false);

  useEffect(() => {
    if (editing) {
      setForm({ ...editing, criteria: editing.criteria && editing.criteria.length ? editing.criteria : (criteria || []) });
    } else {
      setForm({
        id: '', employeeId: employees[0]?.id || '', period: defaultPeriod,
        criteria: [], scores: {}, note: '', evaluator: '', evalDate: new Date().toISOString().split('T')[0],
      });
    }
    setPicker(false);
  }, [editing, open, defaultPeriod]);

  if (!open) return null;

  const myCriteria = form.criteria || [];

  const setScore = (subId, val) => {
    const v = Math.max(0, Math.min(100, Number(val) || 0));
    setForm(f => ({ ...f, scores: { ...f.scores, [subId]: v } }));
  };
  // เพิ่มหัวข้อใหญ่จากคลัง (พร้อมหัวข้อย่อยทั้งหมด)
  const addCategory = (c) => {
    if (myCriteria.some(x => x.id === c.id)) return;
    setForm(f => ({ ...f, criteria: [...(f.criteria||[]), JSON.parse(JSON.stringify(c))] }));
    setPicker(false);
  };
  const removeCategory = (id) => {
    setForm(f => {
      const cat = f.criteria.find(c => c.id === id);
      const sc = { ...f.scores };
      (cat?.subItems || []).forEach(s => delete sc[s.id]);
      return { ...f, criteria: f.criteria.filter(c => c.id !== id), scores: sc };
    });
  };

  const { pct, items } = calcKpiScore(form);
  const g = kpiGrade(pct);
  const totalWeight = items.reduce((s, it) => s + (Number(it.weight)||0), 0);
  const availableLib = (criteria || []).filter(c => !myCriteria.some(x => x.id === c.id));

  const submit = (e) => {
    e.preventDefault();
    if (!form.employeeId) return alert('กรุณาเลือกพนักงาน');
    if (myCriteria.length === 0) return alert('กรุณาเพิ่มหัวข้อประเมินอย่างน้อย 1 หัวข้อ');
    onSave({ ...form, id: form.id || `KPI${Date.now()}` });
  };

  return (
    <Modal open={open} onClose={onClose} title={editing ? 'แก้ไขผลประเมิน' : 'ประเมินพนักงาน'} size="xl">
      <form onSubmit={submit} className="space-y-4">
        <div className="grid md:grid-cols-3 gap-3">
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">พนักงาน</label>
            <Select value={form.employeeId} onChange={(e) => setForm({ ...form, employeeId: e.target.value })} disabled={!!editing} required>
              {employees.map(e => <option key={e.id} value={e.id}>{e.firstName} {e.lastName} ({e.id})</option>)}
            </Select>
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">รอบประเมิน</label>
            <Input type="month" value={form.period || ''} onChange={(e) => setForm({ ...form, period: e.target.value })} required />
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">ผู้วัดผล / ผู้ประเมิน</label>
            <Input value={form.evaluator || ''} onChange={(e) => setForm({ ...form, evaluator: e.target.value })} placeholder="ชื่อผู้ประเมิน" />
          </div>
        </div>

        {/* เลือกหัวข้อจากคลัง */}
        <div>
          <div className="flex items-center justify-between mb-2">
            <label className="text-sm font-medium text-ink-700">หัวข้อประเมิน (เฉพาะพนักงานคนนี้)</label>
            <span className={cls('text-xs font-medium', totalWeight === 100 ? 'text-emerald-600' : 'text-gold-600')}>น้ำหนักรวม {totalWeight}%</span>
          </div>
          <div className="relative mb-3">
            <Button type="button" variant="outline" size="sm" icon="plus" onClick={() => setPicker(p => !p)}>เพิ่มหัวข้อจากคลัง</Button>
            {picker && (
              <div className="absolute top-10 left-0 z-20 w-72 bg-white rounded-xl shadow-xl border border-ink-100 max-h-60 overflow-y-auto">
                {availableLib.length === 0 ? (
                  <div className="px-3 py-3 text-xs text-ink-400 text-center">ไม่มีหัวข้อในคลัง (เพิ่มได้ที่แท็บ "คลังหัวข้อ")</div>
                ) : availableLib.map(c => (
                  <button key={c.id} type="button" onClick={() => addCategory(c)}
                    className="w-full px-3 py-2 text-left hover:bg-flow-50 text-sm flex items-center justify-between">
                    <span className="text-ink-800">{c.name}</span>
                    <span className="text-xs text-ink-400">{c.weight}% · {(c.subItems||[]).length} ย่อย</span>
                  </button>
                ))}
              </div>
            )}
          </div>

          {myCriteria.length === 0 ? (
            <div className="bg-ink-50 rounded-xl p-4 text-center text-sm text-ink-400">ยังไม่มีหัวข้อ — คลิก "เพิ่มหัวข้อจากคลัง"</div>
          ) : (
            <div className="space-y-4">
              {myCriteria.map((cat) => (
                <div key={cat.id} className="border border-ink-200 rounded-xl overflow-hidden">
                  {/* หัวข้อใหญ่ */}
                  <div className="bg-brand-50 px-4 py-2.5 flex items-center justify-between">
                    <div className="font-medium text-brand-900">{cat.name} <span className="text-xs text-brand-600">({cat.weight}%)</span></div>
                    <button type="button" onClick={() => removeCategory(cat.id)} className="p-1 rounded-lg text-ink-400 hover:bg-red-50 hover:text-red-600"><Icon name="trash" className="w-4 h-4" /></button>
                  </div>
                  {/* หัวข้อย่อย */}
                  <div className="divide-y divide-ink-100">
                    {(cat.subItems || [{ id: cat.id, indicator: cat.name, weight: cat.weight }]).map((s) => {
                      const score = Number(form.scores?.[s.id]) || 0;
                      return (
                        <div key={s.id} className="px-4 py-3">
                          <div className="flex items-start justify-between gap-2 mb-2">
                            <div className="min-w-0">
                              <div className="text-sm font-medium text-ink-900">{s.indicator}</div>
                              <div className="flex flex-wrap gap-x-3 gap-y-0.5 text-xs text-ink-500 mt-0.5">
                                {s.targetType && <span>เป้า: {fmtKpiTarget(s)}</span>}
                                <span>น้ำหนัก {s.weight}%</span>
                                {s.method && <span>วิธีวัด: {s.method}</span>}
                              </div>
                            </div>
                            <span className="font-display font-bold text-brand-700 text-lg shrink-0">{score}</span>
                          </div>
                          <div className="flex items-center gap-3">
                            <input type="range" min={0} max={100} step={5} value={score}
                              onChange={(e) => setScore(s.id, e.target.value)} className="flex-1 accent-brand-600" />
                            <div className="flex gap-1 shrink-0">
                              {[60, 70, 80, 90, 100].map(v => (
                                <button key={v} type="button" onClick={() => setScore(s.id, v)}
                                  className="text-xs px-1.5 py-0.5 rounded border border-ink-200 hover:border-brand-400 hover:bg-brand-50">{v}</button>
                              ))}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* คะแนนรวม */}
        <div className="rounded-xl p-4 flex items-center justify-between text-white" style={{ background: `linear-gradient(135deg, ${g.color}, ${g.color}dd)` }}>
          <div>
            <div className="text-sm opacity-90">คะแนนรวม (ถ่วงน้ำหนัก)</div>
            <div className="font-display text-3xl font-bold">{pct}%</div>
          </div>
          <div className="text-right">
            <div className="font-display text-4xl font-bold">{g.grade}</div>
            <div className="text-sm opacity-90">{g.label}</div>
          </div>
        </div>

        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">ข้อเสนอแนะ</label>
          <Textarea rows={2} value={form.note || ''} onChange={(e) => setForm({ ...form, note: e.target.value })} placeholder="จุดเด่น จุดที่ควรพัฒนา..." />
        </div>

        <div className="flex justify-end gap-2 pt-4 border-t border-ink-100">
          <Button type="button" variant="secondary" onClick={onClose}>ยกเลิก</Button>
          <Button type="submit" icon={editing ? 'check' : 'plus'}>{editing ? 'บันทึก' : 'บันทึกผลประเมิน'}</Button>
        </div>
      </form>
    </Modal>
  );
};

/* ===== KPI CRITERIA MODAL — กำหนดหัวข้องาน ===== */
const KpiCriteriaModal = ({ open, onClose, editing, onSave }) => {
  const [form, setForm] = useState({});
  useEffect(() => {
    if (editing) setForm({ subItems: [], ...editing });
    else setForm({ id: '', name: '', weight: 40, subItems: [] });
  }, [editing, open]);

  if (!open) return null;

  const subItems = form.subItems || [];
  const subTotal = subItems.reduce((s, x) => s + (Number(x.weight) || 0), 0);

  const addSub = () => {
    setForm(f => ({ ...f, subItems: [...(f.subItems||[]), {
      id: `SUB${Date.now()}${Math.floor(Math.random()*1000)}`,
      indicator: '', targetType: 'percent', targetValue: 80, targetUnit: 'month', weight: 0, method: '',
    }]}));
  };
  const updateSub = (id, key, val) => {
    setForm(f => ({ ...f, subItems: f.subItems.map(s => s.id === id
      ? { ...s, [key]: (key==='weight'||key==='targetValue') ? (Number(val)||0) : val } : s) }));
  };
  const removeSub = (id) => setForm(f => ({ ...f, subItems: f.subItems.filter(s => s.id !== id) }));

  const submit = (e) => {
    e.preventDefault();
    if (!form.name.trim()) return alert('กรุณาระบุชื่อหัวข้อใหญ่');
    if (subItems.length === 0) return alert('กรุณาเพิ่มหัวข้อย่อยอย่างน้อย 1 รายการ');
    if (subItems.some(s => !s.indicator.trim())) return alert('กรุณาระบุตัวชี้วัดให้ครบทุกหัวข้อย่อย');
    onSave({ ...form, id: form.id || `CAT${Date.now()}`, name: form.name.trim(), weight: Number(form.weight) || 0 });
  };

  return (

/* =============================================================
   REPORTS PAGE
   ============================================================= */
const ReportsPage = () => {
  const { employees, attendance, leaves, leaveTypes, branches } = useApp();
  const [month, setMonth] = useState(new Date().toISOString().slice(0,7));

  // monthly stats
  const monthRecords = attendance.filter(a => String(a.date || '').startsWith(month));
  const monthLeaves  = leaves.filter(l => String(l.startDate || '').startsWith(month) || String(l.endDate || '').startsWith(month));

  const branchData = branches.map(b => {
    const empsB = employees.filter(e => e.branchId === b.id);
    const attB  = monthRecords.filter(a => empsB.some(e => e.id === a.employeeId));
    const lvB   = monthLeaves.filter(l => empsB.some(e => e.id === l.employeeId) && l.status === 'approved');
    const onTime = attB.filter(a => a.status === 'ontime').length;
    const late = attB.filter(a => a.status === 'late').length;
    return {
      name: b.short,
      ตรงเวลา: onTime,
      มาสาย: late,
      ลา: lvB.length,
      color: b.color,
    };
  });

  const leaveDist = leaveTypes.map(t => ({
    name: t.label,
    count: monthLeaves.filter(l => l.type === t.id && l.status === 'approved').length,
    color: t.color,
  }));

  const exportReport = () => {
    const wb = XLSX.utils.book_new();

    // Sheet 1: monthly summary
    const summary = [
      ['รายงานประจำเดือน', month],
      [],
      ['สาขา', 'มาทำงาน (ตรงเวลา)', 'มาทำงาน (สาย)', 'ลา (อนุมัติ)'],
      ...branchData.map(b => [b.name, b.ตรงเวลา, b.มาสาย, b.ลา]),
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), 'สรุปประจำเดือน');

    // Sheet 2: attendance details
    const attRows = [
      ['รหัสพนักงาน','ชื่อ-นามสกุล','สาขา','วันที่','เข้างาน','ออกงาน','สถานะ'],
      ...monthRecords.map(a => {
        const e = employees.find(x => x.id === a.employeeId);
        const b = e ? branches.find(x => x.id === e.branchId) : null;
        return [a.employeeId, e ? `${e.firstName} ${e.lastName}` : '-', b?.short || '-',
                a.date, a.checkIn || '-', a.checkOut || '-', a.status === 'ontime' ? 'ตรงเวลา' : 'สาย'];
      }),
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(attRows), 'การเข้างาน');

    // Sheet 3: leaves
    const lvRows = [
      ['รหัสพนักงาน','ชื่อ-นามสกุล','ประเภท','วันเริ่ม','วันสิ้นสุด','จำนวนวัน','สถานะ','เหตุผล'],
      ...monthLeaves.map(l => {
        const e = employees.find(x => x.id === l.employeeId);
        const t = leaveTypes.find(x => x.id === l.type);
        return [l.employeeId, e ? `${e.firstName} ${e.lastName}` : '-', t?.label || '-',
                l.startDate, l.endDate, l.days,
                l.status === 'approved' ? 'อนุมัติแล้ว' : l.status === 'rejected' ? 'ปฏิเสธ' : 'รออนุมัติ',
                l.reason];
      }),
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(lvRows), 'การลา');

    XLSX.writeFile(wb, `รายงาน_HR_${month}.xlsx`);
  };

  return (
    <div className="p-8 space-y-6 animate-fade-up">
      <Topbar
        title="รายงาน"
        subtitle="สรุปผลการทำงานและการลาของพนักงาน"
        action={
          <div className="flex items-center gap-2">
            <Input type="month" value={month} onChange={(e) => setMonth(e.target.value)} className="w-44" />
            <Button icon="download" variant="gold" onClick={exportReport}>ส่งออก Excel</Button>
          </div>
        }
      />

      <div className="grid lg:grid-cols-2 gap-6">
        <Card className="p-6">
          <h3 className="font-display text-lg font-semibold text-ink-900 mb-1">การเข้างานแยกตามสาขา</h3>
          <p className="text-xs text-ink-500 mb-4">ภาพรวมการมาทำงานในเดือนที่เลือก</p>
          <div style={{ width: '100%', height: 280 }}>
            <ResponsiveContainer>
              <BarChart data={branchData} margin={{ top: 10, right: 10, left: -10, bottom: 0 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="#ECEEF5" />
                <XAxis dataKey="name" stroke="#7E8AA5" fontSize={12} />
                <YAxis stroke="#7E8AA5" fontSize={12} />
                <Tooltip
                  contentStyle={{
                    background: '#fff', border: '1px solid #ECEEF5', borderRadius: 12,
                    boxShadow: '0 8px 32px -12px rgba(14,19,36,0.18)', fontFamily: 'Sarabun',
                  }}
                />
                <Legend wrapperStyle={{ fontFamily: 'Sarabun', fontSize: 12 }} />
                <Bar dataKey="ตรงเวลา" fill="#10B981" radius={[6,6,0,0]} />
                <Bar dataKey="มาสาย"  fill="#F59E0B" radius={[6,6,0,0]} />
                <Bar dataKey="ลา"      fill="#EF4444" radius={[6,6,0,0]} />
              </BarChart>
            </ResponsiveContainer>
          </div>
        </Card>

        <Card className="p-6">
          <h3 className="font-display text-lg font-semibold text-ink-900 mb-1">การลาแยกตามประเภท</h3>
          <p className="text-xs text-ink-500 mb-4">สัดส่วนคำขอลาที่ได้รับการอนุมัติ</p>
          <div style={{ width: '100%', height: 280 }}>
            <ResponsiveContainer>
              <BarChart data={leaveDist} layout="vertical" margin={{ top: 10, right: 20, left: 50, bottom: 0 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="#ECEEF5" />
                <XAxis type="number" stroke="#7E8AA5" fontSize={12} />
                <YAxis dataKey="name" type="category" stroke="#7E8AA5" fontSize={12} width={70} />
                <Tooltip
                  contentStyle={{
                    background: '#fff', border: '1px solid #ECEEF5', borderRadius: 12,
                    boxShadow: '0 8px 32px -12px rgba(14,19,36,0.18)', fontFamily: 'Sarabun',
                  }}
                />
                <Bar dataKey="count" radius={[0,6,6,0]}>
                  {leaveDist.map((entry, idx) => <Cell key={idx} fill={entry.color} />)}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>
        </Card>
      </div>

      <Card className="p-6">
        <h3 className="font-display text-lg font-semibold text-ink-900 mb-4">สรุปข้อมูลประจำเดือน</h3>
        <div className="grid md:grid-cols-3 gap-4">
          {branchData.map((b, idx) => (
            <div key={b.name} className="rounded-2xl border border-ink-100 p-5 relative overflow-hidden">
              <div className="absolute top-0 left-0 right-0 h-1" style={{ background: b.color }} />
              <div className="flex items-center gap-2 mb-3">
                <Icon name="building" className="w-4 h-4 text-ink-500" />
                <span className="font-display font-semibold text-ink-900">{b.name}</span>
              </div>
              <div className="space-y-2">
                <div className="flex justify-between text-sm"><span className="text-ink-600">ตรงเวลา</span><span className="font-medium text-emerald-600">{b.ตรงเวลา}</span></div>
                <div className="flex justify-between text-sm"><span className="text-ink-600">มาสาย</span><span className="font-medium text-gold-600">{b.มาสาย}</span></div>
                <div className="flex justify-between text-sm"><span className="text-ink-600">ลา</span><span className="font-medium text-red-500">{b.ลา}</span></div>
              </div>

          ))}
        </div>

  );
};

/* =============================================================
   SETTINGS PAGE — ตั้งค่าระบบ + จัดการประเภทการลา
   ============================================================= */
const SettingsPage = () => {
  const {
    leaveTypes, setLeaveTypes,
    leaves, employees, settings, setSettings,
    branches, setBranches,
    departments, setDepartments,
    addToast,
  } = useApp();
  const [tab, setTab] = useState('leave-types');
  const [editing, setEditing] = useState(null); // ประเภทที่กำลังแก้ไข
  const [showAdd, setShowAdd] = useState(false);
  const [companyForm, setCompanyForm] = useState(settings);

  // Branch & Department modals
  const [showBranchModal, setShowBranchModal] = useState(false);
  const [editingBranch, setEditingBranch] = useState(null);
  const [showDeptModal, setShowDeptModal] = useState(false);
  const [editingDept, setEditingDept] = useState(null);

  // Sync companyForm กับ settings เมื่อ settings เปลี่ยน
  useEffect(() => { setCompanyForm(settings); }, [settings]);

  const saveCompany = () => {
    setSettings(companyForm);
    addToast('success', 'บันทึกข้อมูลบริษัทเรียบร้อย');
    if (api.enabled()) {
      api.post('saveSettings', { data: companyForm })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
  };

  // === BRANCH handlers ===
  const empCountByBranch = useMemo(() => {
    const m = {};
    employees.forEach(e => { m[e.branchId] = (m[e.branchId] || 0) + 1; });
    return m;
  }, [employees]);

  const saveBranch = (b) => {
    let updated;
    if (editingBranch) {
      updated = branches.map(x => x.id === editingBranch.id ? { ...b, id: editingBranch.id } : x);
      addToast('success', 'บันทึกข้อมูลสาขาเรียบร้อย');
    } else {
      // ตรวจสอบรหัสซ้ำ
      if (branches.some(x => x.id === b.id)) {
        addToast('error', 'รหัสสาขาซ้ำกับที่มีอยู่');
        return;
      }
      updated = [...branches, b];
      addToast('success', 'เพิ่มสาขาใหม่เรียบร้อย');
    }
    setBranches(updated);
    if (api.enabled()) {
      api.post('saveBranches', { data: updated })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
    setEditingBranch(null);
    setShowBranchModal(false);
  };

  const deleteBranch = (b) => {
    const used = empCountByBranch[b.id] || 0;
    if (used > 0) {
      addToast('error', `ไม่สามารถลบได้ มีพนักงาน ${used} คนในสาขานี้ — ย้ายพนักงานก่อน`);
      return;
    }
    if (!confirm(`ยืนยันการลบสาขา "${b.name}"?`)) return;
    const updated = branches.filter(x => x.id !== b.id);
    setBranches(updated);
    addToast('success', 'ลบสาขาเรียบร้อย');
    if (api.enabled()) {
      api.post('saveBranches', { data: updated })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
  };

  // === DEPARTMENT handlers ===
  const empCountByDept = useMemo(() => {
    const m = {};
    employees.forEach(e => { m[e.department] = (m[e.department] || 0) + 1; });
    return m;
  }, [employees]);

  const saveDept = (name, oldName) => {
    let updated;
    if (oldName) {
      // แก้ไข — เปลี่ยนชื่อในรายการ
      if (departments.includes(name) && name !== oldName) {
        addToast('error', 'ชื่อแผนกซ้ำกับที่มีอยู่');
        return;
      }
      updated = departments.map(d => d === oldName ? name : d);
      addToast('success', 'บันทึกชื่อแผนกเรียบร้อย');
    } else {
      // เพิ่ม
      if (departments.includes(name)) {
        addToast('error', 'ชื่อแผนกซ้ำกับที่มีอยู่');
        return;
      }
      updated = [...departments, name];
      addToast('success', 'เพิ่มแผนกใหม่เรียบร้อย');
    }
    setDepartments(updated);
    if (api.enabled()) {
      api.post('saveDepartments', { data: updated })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
    setEditingDept(null);
    setShowDeptModal(false);
  };

  const deleteDept = (d) => {
    const used = empCountByDept[d] || 0;
    if (used > 0) {
      addToast('error', `ไม่สามารถลบได้ มีพนักงาน ${used} คนในแผนกนี้ — ย้ายพนักงานก่อน`);
      return;
    }
    if (!confirm(`ยืนยันการลบแผนก "${d}"?`)) return;
    const updated = departments.filter(x => x !== d);
    setDepartments(updated);
    addToast('success', 'ลบแผนกเรียบร้อย');
    if (api.enabled()) {
      api.post('saveDepartments', { data: updated })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
  };

  // ตรวจสอบว่ามีคำขอลาที่ใช้ประเภทนี้อยู่หรือไม่
  const usedTypes = useMemo(() => {
    const counts = {};
    leaves.forEach(l => { counts[l.type] = (counts[l.type] || 0) + 1; });
    return counts;
  }, [leaves]);

  const saveType = (type) => {
    let updated;
    if (editing) {
      updated = leaveTypes.map(t => t.id === editing.id ? { ...type, id: editing.id } : t);
      setLeaveTypes(updated);
      addToast('success', 'บันทึกการเปลี่ยนแปลงเรียบร้อย');
    } else {
      // สร้าง id ใหม่จากชื่อ
      const newId = (type.id || type.label).toLowerCase()
        .replace(/[^a-z0-9ก-๙]/gi, '_').slice(0, 20) + '_' + Date.now().toString().slice(-4);
      if (leaveTypes.some(t => t.id === newId)) {
        addToast('error', 'รหัสประเภทซ้ำกับที่มีอยู่');
        return;
      }
      updated = [...leaveTypes, { ...type, id: newId }];
      setLeaveTypes(updated);
      addToast('success', 'เพิ่มประเภทการลาใหม่เรียบร้อย');
    }
    if (api.enabled()) {
      api.post('saveLeaveTypes', { data: updated })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
    setEditing(null);
    setShowAdd(false);

        editing={editingDept}
        onSave={saveDept}
      />
    </div>
  );
};

/* =============================================================
   LEAVE TYPE FORM MODAL — เพิ่ม/แก้ไขประเภทการลา
   ============================================================= */
const LeaveTypeFormModal = ({ open, onClose, editing, onSave }) => {
  const [form, setForm] = useState({ label: '', max: 10, color: LEAVE_COLOR_PALETTE[0] });

  useEffect(() => {
    if (editing) setForm({ label: editing.label, max: editing.max, color: editing.color });
    else setForm({ label: '', max: 10, color: LEAVE_COLOR_PALETTE[Math.floor(Math.random() * LEAVE_COLOR_PALETTE.length)] });
  }, [editing, open]);

  if (!open) return null;

  const submit = (e) => {
    e.preventDefault();
    if (!form.label.trim()) return alert('กรุณาระบุชื่อประเภทการลา');
    if (form.max < 1)       return alert('จำนวนวันต้องไม่น้อยกว่า 1');
    onSave({
      label: form.label.trim(),
      max: Number(form.max),
      color: form.color,
    });
  };

  return (
    <Modal open={open} onClose={onClose} title={editing ? 'แก้ไขประเภทการลา' : 'เพิ่มประเภทการลาใหม่'} size="md">
      <form onSubmit={submit} className="space-y-4">
        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">ชื่อประเภทการลา</label>
          <Input
            placeholder="เช่น ลาฝึกอบรม, ลาดูแลครอบครัว"
            value={form.label}
            onChange={(e) => setForm({ ...form, label: e.target.value })}
            required
            autoFocus
          />
        </div>

        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">
            สิทธิ์สูงสุดต่อปี (วัน)
          </label>
          <Input
            type="number"
            min={1}
            max={365}
            value={form.max}
            onChange={(e) => setForm({ ...form, max: e.target.value })}
            required
          />
          <div className="text-xs text-ink-500 mt-1">
            จำนวนวันที่พนักงานสามารถลาประเภทนี้ได้สูงสุดต่อปี (1-365 วัน)
          </div>
        </div>

        <div>
          <label className="block text-sm font-medium text-ink-700 mb-2">สีประจำประเภท</label>
          <div className="grid grid-cols-8 gap-2">
            {LEAVE_COLOR_PALETTE.map(c => (
              <button
                key={c} type="button"
                onClick={() => setForm({ ...form, color: c })}
                className={cls(
                  'aspect-square rounded-lg transition-all',
                  form.color === c ? 'ring-2 ring-offset-2 ring-ink-800 scale-110' : 'hover:scale-105',
                )}
                style={{ background: c }}
                title={c}
              />
            ))}
          </div>
        </div>

        {/* Preview */}
        <div className="bg-ink-50 rounded-xl p-3 border border-ink-100">
          <div className="text-xs text-ink-500 mb-2">ตัวอย่างที่จะแสดง:</div>
          <div className="rounded-xl border border-ink-100 bg-white p-3" style={{ borderLeftWidth: 4, borderLeftColor: form.color }}>
            <div className="flex items-center gap-2 mb-1">
              <span className="w-3 h-3 rounded-full" style={{ background: form.color }} />
              <span className="font-display font-semibold text-ink-900">{form.label || 'ชื่อประเภทการลา'}</span>
            </div>
            <div className="text-sm text-ink-600">สูงสุด {form.max || 0} วัน/ปี</div>
          </div>
        </div>

        <div className="flex justify-end gap-2 pt-4 border-t border-ink-100">
          <Button type="button" variant="secondary" onClick={onClose}>ยกเลิก</Button>
          <Button type="submit" icon={editing ? 'check' : 'plus'}>
            {editing ? 'บันทึกการแก้ไข' : 'เพิ่มประเภท'}
          </Button>
        </div>
      </form>
    </Modal>
  );
};

/* =============================================================
   BRANCH FORM MODAL — เพิ่ม/แก้ไขสาขา
   ============================================================= */
const BranchFormModal = ({ open, onClose, editing, onSave, existingIds }) => {
  const [form, setForm] = useState({
    id: '', name: '', short: '',
    color: BRANCH_COLOR_PALETTE[0],
    address: '', phone: '',
  });

  useEffect(() => {
    if (editing) {
      setForm(editing);
    } else {
      // generate next id เช่น BR01, BR02
      const usedIds = new Set(existingIds || []);
      let n = 1;
      let newId = '';
      do { newId = 'BR' + String(n).padStart(2, '0'); n++; } while (usedIds.has(newId));
      setForm({
        id: newId, name: '', short: '',
        color: BRANCH_COLOR_PALETTE[(existingIds?.length || 0) % BRANCH_COLOR_PALETTE.length],
        address: '', phone: '',
      });
    }
  }, [editing, open]);

  if (!open) return null;

  const submit = (e) => {
    e.preventDefault();
    if (!form.id.trim())   return alert('กรุณาระบุรหัสสาขา');
    if (!form.name.trim()) return alert('กรุณาระบุชื่อสาขา');
    onSave({
      id:      form.id.trim().toUpperCase(),
      name:    form.name.trim(),
      short:   form.short.trim() || form.name.trim(),
      color:   form.color,
      address: form.address.trim(),
      phone:   form.phone.trim(),
    });
  };

  return (
    <Modal open={open} onClose={onClose} title={editing ? 'แก้ไขข้อมูลสาขา' : 'เพิ่มสาขาใหม่'} size="md">
      <form onSubmit={submit} className="space-y-4">
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">รหัสสาขา</label>
            <Input
              value={form.id}
              onChange={(e) => setForm({ ...form, id: e.target.value.toUpperCase() })}
              placeholder="LLK, BKK"
              maxLength={10}
              required
              disabled={!!editing}
            />
            <div className="text-[11px] text-ink-500 mt-1">ภาษาอังกฤษ 2-10 ตัว แก้ไขไม่ได้หลังสร้าง</div>
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">ชื่อย่อ</label>
            <Input
              value={form.short}
              onChange={(e) => setForm({ ...form, short: e.target.value })}
              placeholder="ลำลูกกา"
            />
          </div>
        </div>

        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">ชื่อสาขา (เต็ม)</label>
          <Input
            value={form.name}
            onChange={(e) => setForm({ ...form, name: e.target.value })}
            placeholder="สาขาลำลูกกา"
            required
          />
        </div>

        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">ที่อยู่</label>
          <Textarea
            rows={2}
            value={form.address}
            onChange={(e) => setForm({ ...form, address: e.target.value })}
            placeholder="ที่ตั้งของสาขา"
          />
        </div>

        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">เบอร์โทรศัพท์</label>
          <Input
            icon="phone"
            value={form.phone}
            onChange={(e) => setForm({ ...form, phone: e.target.value })}
            placeholder="02-XXX-XXXX"
          />
        </div>

        <div>
          <label className="block text-sm font-medium text-ink-700 mb-2">สีประจำสาขา</label>
          <div className="grid grid-cols-10 gap-2">
            {BRANCH_COLOR_PALETTE.map(c => (
              <button
                key={c} type="button"
                onClick={() => setForm({ ...form, color: c })}
                className={cls(
                  'aspect-square rounded-lg transition-all',
                  form.color === c ? 'ring-2 ring-offset-2 ring-ink-800 scale-110' : 'hover:scale-105',
                )}
                style={{ background: c }}
                title={c}
              />
            ))}
          </div>
        </div>

        {/* Preview */}
        <div className="bg-ink-50 rounded-xl p-3 border border-ink-100">
          <div className="text-xs text-ink-500 mb-2">ตัวอย่างที่จะแสดง:</div>
          <div className="rounded-xl border border-ink-100 bg-white p-3" style={{ borderLeftWidth: 4, borderLeftColor: form.color }}>
            <div className="flex items-center gap-2 mb-0.5">
              <span className="w-3 h-3 rounded-full" style={{ background: form.color }} />
              <span className="font-display font-semibold text-ink-900">{form.name || 'ชื่อสาขา'}</span>
            </div>
            <code className="text-[10px] px-1.5 py-0.5 bg-ink-50 text-ink-500 rounded font-mono">{form.id || 'ID'}</code>
            <span className="text-xs text-ink-500 ml-2">{form.short || form.name || '-'}</span>
          </div>
        </div>

        <div className="flex justify-end gap-2 pt-4 border-t border-ink-100">
          <Button type="button" variant="secondary" onClick={onClose}>ยกเลิก</Button>
          <Button type="submit" icon={editing ? 'check' : 'plus'}>
            {editing ? 'บันทึก' : 'เพิ่มสาขา'}
          </Button>
        </div>
      </form>
    </Modal>
  );
};

/* =============================================================
   DEPARTMENT FORM MODAL — เพิ่ม/แก้ไขแผนก
   ============================================================= */
const DepartmentFormModal = ({ open, onClose, editing, onSave }) => {
  const [name, setName] = useState('');

  useEffect(() => {
    setName(editing || '');
  }, [editing, open]);

  if (!open) return null;

  const submit = (e) => {
    e.preventDefault();
    if (!name.trim()) return;
    onSave(name.trim(), editing);
  };

  return (
    <Modal open={open} onClose={onClose} title={editing ? 'แก้ไขชื่อแผนก' : 'เพิ่มแผนกใหม่'} size="sm">
      <form onSubmit={submit} className="space-y-4">
        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">ชื่อแผนก</label>
          <Input
            value={name}
            onChange={(e) => setName(e.target.value)}
            placeholder="เช่น ฝ่ายการตลาด, ฝ่ายผลิต"
            required
            autoFocus
          />
        </div>

        <div className="flex justify-end gap-2 pt-3 border-t border-ink-100">
          <Button type="button" variant="secondary" onClick={onClose}>ยกเลิก</Button>
          <Button type="submit" icon={editing ? 'check' : 'plus'}>
            {editing ? 'บันทึก' : 'เพิ่มแผนก'}
          </Button>
        </div>
      </form>
    </Modal>
  );
};

/* =============================================================
   ROOT APP
   ============================================================= */
const App = () => {
  const [user, setUser]       = useState(() => {
    // คงสถานะล็อกอินไว้เมื่อรีเฟรช
    try {
      const saved = localStorage.getItem('ffc_session_user');
      return saved ? JSON.parse(saved) : null;
    } catch { return null; }
  });
  const [page, setPage]       = useState('dashboard');
  const [employees, setEmployees]     = useState([]);
  const [attendance, setAttendance]   = useState([]);
  const [leaves, setLeaves]           = useState([]);
  const [leaveTypes, setLeaveTypes]   = useState(DEFAULT_LEAVE_TYPES);
  const [branches, setBranches]       = useState(DEFAULT_BRANCHES);
  const [departments, setDepartments] = useState(DEFAULT_DEPARTMENTS);
  const [assets, setAssets]           = useState([]);
  const [payroll, setPayroll]         = useState([]);
  const [kpiCriteria, setKpiCriteria] = useState([]);
  const [kpiRecords, setKpiRecords]   = useState([]);
  const [settings, setSettings]       = useState({
    companyName: 'บริษัท ฟรีด้อมโฟล เทรดดิ้ง จำกัด',
    companyNameEn: 'FREEDOM FLOW TRADING CO., LTD.',
    taxId:       '0-1055-XXXXX-XX-X',
    address:     'เลขที่ 10/95 อาคารเดอะเทรนดี้ ชั้น 6 ซอย 13 แขวงคลองเตยเหนือ เขตวัฒนา กรุงเทพมหานคร 10110',
    phone:       '',
    email:       '',
    workStart:   '08:00',
    workEnd:     '17:00',
    lateMinutes: 5,   // ผ่อนผันได้กี่นาที
  });
  const [toast, setToast]             = useState(null);
  const [loading, setLoading]         = useState(api.enabled());

  // Initialize data — โหลดจาก API หรือใช้ Demo data
  useEffect(() => {
    if (api.enabled()) {
      // โหมด API — โหลดจาก Google Sheets
      (async () => {
        try {
          const data = await api.get('getAll');
          setEmployees(data.employees || []);
          setAttendance(data.attendance || []);
          setLeaves(data.leaves || []);
          if (data.leaveTypes && data.leaveTypes.length > 0) {
            setLeaveTypes(data.leaveTypes);
          }
          if (data.branches && data.branches.length > 0) {
            setBranches(data.branches);
          }
          if (data.departments && data.departments.length > 0) {
            setDepartments(data.departments);
          }
          if (data.assets && data.assets.length > 0) {
            setAssets(data.assets);
          }
          if (data.payroll && data.payroll.length > 0) {
            setPayroll(data.payroll);
          }
          if (data.kpiCriteria && data.kpiCriteria.length > 0) {
            setKpiCriteria(data.kpiCriteria);
          }
          if (data.kpiRecords && data.kpiRecords.length > 0) {
            setKpiRecords(data.kpiRecords);
          }
          if (data.settings && Object.keys(data.settings).length > 0) {
            setSettings(s => ({ ...s, ...data.settings }));
          }
        } catch (err) {
          setToast({ type: 'error', message: 'เชื่อมต่อ Google Sheets ล้มเหลว: ' + err.message });
          // Fallback to demo data
          const emps = seedEmployees();
          setEmployees(emps);
          setAttendance(seedAttendance(emps));
          setLeaves(seedLeaves(emps));
        } finally {
          setLoading(false);
        }
      })();
    } else {
      // โหมด Demo
      const emps = seedEmployees();
      setEmployees(emps);
      setAttendance(seedAttendance(emps));
      setLeaves(seedLeaves(emps));
    }
  }, []);

  const addToast = (type, message) => setToast({ type, message });

  // Loading screen ระหว่างเชื่อมต่อ API
  if (loading) {
    return (
      <div className="min-h-screen login-bg flex items-center justify-center">
        <div className="text-center text-white">
          <div className="w-24 h-24 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center mx-auto mb-6 shadow-card animate-pulse-soft p-3">
            <img src={LOGO_EAGLE} alt="FFC" className="w-full h-full object-contain" style={{ filter: 'brightness(1.5)' }} />
          </div>
          <div className="font-display text-2xl font-bold mb-2">กำลังเชื่อมต่อ Google Sheets...</div>
          <div className="text-brand-200/70 text-sm flex items-center gap-2 justify-center">
            <Icon name="refresh" className="w-4 h-4 animate-spin" />
            <span>กรุณารอสักครู่</span>
          </div>
        </div>
      </div>
    );
  }

  if (!user) {
    const handleLogin = (u) => {
      try { localStorage.setItem('ffc_session_user', JSON.stringify(u)); } catch {}
      setUser(u);
    };
    return (
      <>
        <LoginPage onLogin={handleLogin} addToast={addToast} />
        {toast && <Toast toast={toast} onClose={() => setToast(null)} />}
      </>
    );
  }

  const handleLogout = () => {
    try { localStorage.removeItem('ffc_session_user'); } catch {}
    setUser(null);
    setPage('dashboard');
  };

  // attach empId if user is employee (demo)
  const effectiveUser = user.role === 'employee' && !user.empId
    ? { ...user, empId: employees[0]?.id }
    : user;

  return (
    <AppCtx.Provider value={{
      user: effectiveUser, employees, setEmployees,
      attendance, setAttendance, leaves, setLeaves,
      leaveTypes, setLeaveTypes,
      branches, setBranches,
      departments, setDepartments,
      assets, setAssets,
      payroll, setPayroll,
      kpiCriteria, setKpiCriteria,
      kpiRecords, setKpiRecords,
      settings, setSettings,
      page, setPage,
      addToast,
    }}>
      <div className="flex min-h-screen bg-ink-50">
        {api.enabled() && (
          <div className="fixed bottom-4 left-4 z-40 bg-emerald-500 text-white text-xs font-medium px-3 py-1.5 rounded-full shadow-soft flex items-center gap-1.5 no-print">
            <span className="w-1.5 h-1.5 bg-white rounded-full animate-pulse" />
            เชื่อมต่อ Google Sheets
          </div>
        )}
        <Sidebar
          current={page}
          onChange={setPage}
          user={effectiveUser}
          onLogout={handleLogout}
        />
        <main className="flex-1 min-w-0">
          {page === 'dashboard'  && <Dashboard />}
          {page === 'employees'  && <EmployeesPage />}
          {page === 'attendance' && <AttendancePage />}
          {page === 'leaves'     && <LeavesPage />}
          {page === 'assets'     && <AssetsPage />}
          {page === 'payroll'    && <PayrollPage />}
          {page === 'kpi'        && <KpiPage />}
          {page === 'reports'    && <ReportsPage />}
          {page === 'branches'   && <BranchesPage />}
          {page === 'settings'   && <SettingsPage />}
        </main>
      </div>
      {toast && <Toast toast={toast} onClose={() => setToast(null)} />}
    </AppCtx.Provider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
