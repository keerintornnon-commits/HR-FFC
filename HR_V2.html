/* =============================================================
   SETTINGS PAGE — ตั้งค่าระบบ + จัดการประเภทการลา
   ============================================================= */
const SettingsPage = () => {
  const {
    leaveTypes, setLeaveTypes,
    leaves, employees, settings, setSettings,
    branches, setBranches,
    departments, setDepartments,
    addToast,
  } = useApp();
  const [tab, setTab] = useState('leave-types');
  const [editing, setEditing] = useState(null); // ประเภทที่กำลังแก้ไข
  const [showAdd, setShowAdd] = useState(false);
  const [companyForm, setCompanyForm] = useState(settings);

  // Branch & Department modals
  const [showBranchModal, setShowBranchModal] = useState(false);
  const [editingBranch, setEditingBranch] = useState(null);
  const [showDeptModal, setShowDeptModal] = useState(false);
  const [editingDept, setEditingDept] = useState(null);

  // Sync companyForm กับ settings เมื่อ settings เปลี่ยน
  useEffect(() => { setCompanyForm(settings); }, [settings]);

  const saveCompany = () => {
    setSettings(companyForm);
    addToast('success', 'บันทึกข้อมูลบริษัทเรียบร้อย');
    if (api.enabled()) {
      api.post('saveSettings', { data: companyForm })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
  };

  // === BRANCH handlers ===
  const empCountByBranch = useMemo(() => {
    const m = {};
    employees.forEach(e => { m[e.branchId] = (m[e.branchId] || 0) + 1; });
    return m;
  }, [employees]);

  const saveBranch = (b) => {
    let updated;
    if (editingBranch) {
      updated = branches.map(x => x.id === editingBranch.id ? { ...b, id: editingBranch.id } : x);
      addToast('success', 'บันทึกข้อมูลสาขาเรียบร้อย');
    } else {
      // ตรวจสอบรหัสซ้ำ
      if (branches.some(x => x.id === b.id)) {
        addToast('error', 'รหัสสาขาซ้ำกับที่มีอยู่');
        return;
      }
      updated = [...branches, b];
      addToast('success', 'เพิ่มสาขาใหม่เรียบร้อย');
    }
    setBranches(updated);
    if (api.enabled()) {
      api.post('saveBranches', { data: updated })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
    setEditingBranch(null);
    setShowBranchModal(false);
  };

  const deleteBranch = (b) => {
    const used = empCountByBranch[b.id] || 0;
    if (used > 0) {
      addToast('error', `ไม่สามารถลบได้ มีพนักงาน ${used} คนในสาขานี้ — ย้ายพนักงานก่อน`);
      return;
    }
    if (!confirm(`ยืนยันการลบสาขา "${b.name}"?`)) return;
    const updated = branches.filter(x => x.id !== b.id);
    setBranches(updated);
    addToast('success', 'ลบสาขาเรียบร้อย');
    if (api.enabled()) {
      api.post('saveBranches', { data: updated })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
  };

  // === DEPARTMENT handlers ===
  const empCountByDept = useMemo(() => {
    const m = {};
    employees.forEach(e => { m[e.department] = (m[e.department] || 0) + 1; });
    return m;
  }, [employees]);

  const saveDept = (name, oldName) => {
    let updated;
    if (oldName) {
      // แก้ไข — เปลี่ยนชื่อในรายการ
      if (departments.includes(name) && name !== oldName) {
        addToast('error', 'ชื่อแผนกซ้ำกับที่มีอยู่');
        return;
      }
      updated = departments.map(d => d === oldName ? name : d);
      addToast('success', 'บันทึกชื่อแผนกเรียบร้อย');
    } else {
      // เพิ่ม
      if (departments.includes(name)) {
        addToast('error', 'ชื่อแผนกซ้ำกับที่มีอยู่');
        return;
      }
      updated = [...departments, name];
      addToast('success', 'เพิ่มแผนกใหม่เรียบร้อย');
    }
    setDepartments(updated);
    if (api.enabled()) {
      api.post('saveDepartments', { data: updated })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
    setEditingDept(null);
    setShowDeptModal(false);
  };

  const deleteDept = (d) => {
    const used = empCountByDept[d] || 0;
    if (used > 0) {
      addToast('error', `ไม่สามารถลบได้ มีพนักงาน ${used} คนในแผนกนี้ — ย้ายพนักงานก่อน`);
      return;
    }
    if (!confirm(`ยืนยันการลบแผนก "${d}"?`)) return;
    const updated = departments.filter(x => x !== d);
    setDepartments(updated);
    addToast('success', 'ลบแผนกเรียบร้อย');
    if (api.enabled()) {
      api.post('saveDepartments', { data: updated })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
  };

  // ตรวจสอบว่ามีคำขอลาที่ใช้ประเภทนี้อยู่หรือไม่
  const usedTypes = useMemo(() => {
    const counts = {};
    leaves.forEach(l => { counts[l.type] = (counts[l.type] || 0) + 1; });
    return counts;
  }, [leaves]);

  const saveType = (type) => {
    let updated;
    if (editing) {
      updated = leaveTypes.map(t => t.id === editing.id ? { ...type, id: editing.id } : t);
      setLeaveTypes(updated);
      addToast('success', 'บันทึกการเปลี่ยนแปลงเรียบร้อย');
    } else {
      // สร้าง id ใหม่จากชื่อ
      const newId = (type.id || type.label).toLowerCase()
        .replace(/[^a-z0-9ก-๙]/gi, '_').slice(0, 20) + '_' + Date.now().toString().slice(-4);
      if (leaveTypes.some(t => t.id === newId)) {
        addToast('error', 'รหัสประเภทซ้ำกับที่มีอยู่');
        return;
      }
      updated = [...leaveTypes, { ...type, id: newId }];
      setLeaveTypes(updated);
      addToast('success', 'เพิ่มประเภทการลาใหม่เรียบร้อย');
    }
    if (api.enabled()) {
      api.post('saveLeaveTypes', { data: updated })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
    setEditing(null);
    setShowAdd(false);
  };

  const deleteType = (type) => {
    if (usedTypes[type.id]) {
      if (!confirm(`ประเภท "${type.label}" มีคำขอลาที่ใช้อยู่ ${usedTypes[type.id]} รายการ\n\nหากลบ คำขอเดิมจะยังคงอยู่ แต่อาจแสดงชื่อไม่ถูกต้อง\n\nยืนยันการลบ?`)) return;
    } else {
      if (!confirm(`ยืนยันการลบประเภท "${type.label}"?`)) return;
    }
    const updated = leaveTypes.filter(t => t.id !== type.id);
    setLeaveTypes(updated);
    addToast('success', 'ลบประเภทการลาเรียบร้อย');
    if (api.enabled()) {
      api.post('saveLeaveTypes', { data: updated })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
  };

  const resetDefaults = () => {
    if (!confirm('ยืนยันการรีเซ็ตประเภทการลาเป็นค่าเริ่มต้น?\n\nประเภทที่คุณเพิ่มเองจะถูกลบทั้งหมด')) return;
    setLeaveTypes(DEFAULT_LEAVE_TYPES);
    addToast('success', 'รีเซ็ตเป็นค่าเริ่มต้นเรียบร้อย');
    if (api.enabled()) {
      api.post('saveLeaveTypes', { data: DEFAULT_LEAVE_TYPES })
        .catch(err => addToast('error', 'บันทึกไม่สำเร็จ: ' + err.message));
    }
  };

  return (
    <div className="p-8 space-y-6 animate-fade-up">
      <Topbar title="ตั้งค่าระบบ" subtitle="กำหนดค่าและพารามิเตอร์ของระบบ" />

      {/* Tab navigation */}
      <div className="flex items-center gap-2 bg-white border border-ink-100 p-1.5 rounded-xl w-fit overflow-x-auto">
        {[
          { id: 'leave-types', label: 'ประเภทการลา', icon: 'calendar' },
          { id: 'branches',    label: 'สาขา',         icon: 'building' },
          { id: 'departments', label: 'แผนก',         icon: 'briefcase' },
          { id: 'company',     label: 'ข้อมูลบริษัท', icon: 'info' },
          { id: 'database',    label: 'ฐานข้อมูล',    icon: 'settings' },
        ].map(t => (
          <button
            key={t.id}
            onClick={() => setTab(t.id)}
            className={cls(
              'inline-flex items-center gap-2 px-4 py-1.5 rounded-lg text-sm font-medium transition-all whitespace-nowrap',
              tab === t.id ? 'bg-flow-600 text-white shadow-soft' : 'text-ink-600 hover:text-ink-900',
            )}
          >
            <Icon name={t.icon} className="w-4 h-4" />
            {t.label}
          </button>
        ))}
      </div>

      {/* TAB: Leave Types — กำหนดสิทธิ์การลาเอง */}
      {tab === 'leave-types' && (
        <div className="space-y-4">
          <Card className="p-6">
            <div className="flex items-start justify-between mb-5">
              <div>
                <h3 className="font-display text-lg font-semibold text-ink-900">ประเภทการลาและสิทธิ์</h3>
                <p className="text-sm text-ink-500 mt-1">
                  กำหนดประเภทการลาและจำนวนวันสูงสุดต่อปีที่พนักงานสามารถลาได้
                </p>
              </div>
              <div className="flex gap-2">
                <Button variant="outline" size="sm" icon="refresh" onClick={resetDefaults}>
                  รีเซ็ตค่าเริ่มต้น
                </Button>
                <Button icon="plus" onClick={() => { setEditing(null); setShowAdd(true); }}>
                  เพิ่มประเภทการลา
                </Button>
              </div>
            </div>

            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-3">
              {leaveTypes.map(t => (
                <div
                  key={t.id}
                  className="relative rounded-2xl border border-ink-100 p-4 hover:shadow-soft transition-all"
                  style={{ borderLeftWidth: 4, borderLeftColor: t.color }}
                >
                  <div className="flex items-start justify-between mb-2">
                    <div className="flex items-center gap-2">
                      <span className="w-3 h-3 rounded-full" style={{ background: t.color }} />
                      <span className="font-display font-semibold text-ink-900">{t.label}</span>
                    </div>
                    <div className="flex gap-1">
                      <button
                        onClick={() => { setEditing(t); setShowAdd(true); }}
                        className="p-1.5 rounded-lg text-ink-400 hover:bg-flow-50 hover:text-flow-700"
                        title="แก้ไข"
                      >
                        <Icon name="edit" className="w-4 h-4" />
                      </button>
                      <button
                        onClick={() => deleteType(t)}
                        className="p-1.5 rounded-lg text-ink-400 hover:bg-red-50 hover:text-red-600"
                        title="ลบ"
                      >
                        <Icon name="trash" className="w-4 h-4" />
                      </button>
                    </div>
                  </div>
                  <div className="font-display text-2xl font-bold text-ink-900">{t.max} <span className="text-sm text-ink-500 font-body font-normal">วัน/ปี</span></div>
                  <div className="flex items-center justify-between mt-2 text-xs">
                    <code className="px-1.5 py-0.5 bg-ink-50 text-ink-500 rounded font-mono">{t.id}</code>
                    {usedTypes[t.id] > 0 && (
                      <Badge color="blue">{usedTypes[t.id]} คำขอ</Badge>
                    )}
                  </div>
                </div>
              ))}
            </div>

            {leaveTypes.length === 0 && (
              <Empty icon="calendar" title="ยังไม่มีประเภทการลา" desc="คลิกปุ่ม 'เพิ่มประเภทการลา' เพื่อเริ่มต้น" />
            )}

            <div className="mt-6 pt-5 border-t border-ink-100 bg-flow-50 -mx-6 -mb-6 px-6 py-4 rounded-b-2xl">
              <div className="flex items-start gap-3">
                <Icon name="info" className="w-5 h-5 text-flow-700 mt-0.5 shrink-0" />
                <div className="text-sm text-ink-700">
                  <strong className="text-flow-800">หมายเหตุ:</strong> สิทธิ์ที่กำหนดที่นี่คือ <strong>สิทธิ์เริ่มต้น</strong> สำหรับพนักงานทุกคน
                  หากต้องการกำหนดสิทธิ์เฉพาะสำหรับพนักงานบางคน (เช่น พนักงานเก่าได้สิทธิ์มากกว่า) สามารถกำหนดได้ในหน้า "พนักงาน" → คลิก "แก้ไข" → ส่วน "สิทธิ์การลาเฉพาะบุคคล"
                </div>
              </div>
            </div>
          </Card>

          {/* สรุปสิทธิ์ทั้งหมด */}
          <Card className="p-6">
            <h3 className="font-display text-lg font-semibold text-ink-900 mb-1">สรุปสิทธิ์การลาประจำปี</h3>
            <p className="text-xs text-ink-500 mb-4">รวมสิทธิ์การลาทุกประเภทของพนักงานทั่วไป</p>
            <div className="grid md:grid-cols-2 gap-3">
              <div className="rounded-xl bg-gradient-to-br from-flow-500 to-flow-700 text-white p-5">
                <div className="text-flow-100 text-xs uppercase tracking-wider mb-1">รวมสิทธิ์ลา</div>
                <div className="font-display text-4xl font-bold">
                  {leaveTypes.reduce((sum, t) => sum + t.max, 0)} <span className="text-xl font-normal">วัน/ปี</span>
                </div>
                <div className="text-flow-100 text-sm mt-1">จาก {leaveTypes.length} ประเภท</div>
              </div>
              <div className="space-y-2">
                {leaveTypes.map(t => (
                  <div key={t.id} className="flex items-center gap-3">
                    <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: t.color }} />
                    <span className="text-sm text-ink-700 flex-1">{t.label}</span>
                    <span className="text-sm font-medium text-ink-900">{t.max} วัน</span>
                  </div>
                ))}
              </div>
            </div>
          </Card>
        </div>
      )}

      {/* TAB: Branches — จัดการสาขา */}
      {tab === 'branches' && (
        <Card className="p-6">
          <div className="flex items-start justify-between mb-5">
            <div>
              <h3 className="font-display text-lg font-semibold text-ink-900">สาขาของบริษัท</h3>
              <p className="text-sm text-ink-500 mt-1">เพิ่ม แก้ไข หรือลบสาขา (ลบได้เฉพาะสาขาที่ยังไม่มีพนักงาน)</p>
            </div>
            <Button icon="plus" onClick={() => { setEditingBranch(null); setShowBranchModal(true); }}>
              เพิ่มสาขา

/* =============================================================
   LEAVE TYPE FORM MODAL — เพิ่ม/แก้ไขประเภทการลา
   ============================================================= */
const LeaveTypeFormModal = ({ open, onClose, editing, onSave }) => {
  const [form, setForm] = useState({ label: '', max: 10, color: LEAVE_COLOR_PALETTE[0] });

  useEffect(() => {
    if (editing) setForm({ label: editing.label, max: editing.max, color: editing.color });
    else setForm({ label: '', max: 10, color: LEAVE_COLOR_PALETTE[Math.floor(Math.random() * LEAVE_COLOR_PALETTE.length)] });
  }, [editing, open]);

  if (!open) return null;

  const submit = (e) => {
    e.preventDefault();
    if (!form.label.trim()) return alert('กรุณาระบุชื่อประเภทการลา');
    if (form.max < 1)       return alert('จำนวนวันต้องไม่น้อยกว่า 1');
    onSave({
      label: form.label.trim(),
      max: Number(form.max),
      color: form.color,
    });
  };

  return (
    <Modal open={open} onClose={onClose} title={editing ? 'แก้ไขประเภทการลา' : 'เพิ่มประเภทการลาใหม่'} size="md">
      <form onSubmit={submit} className="space-y-4">
        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">ชื่อประเภทการลา</label>
          <Input
            placeholder="เช่น ลาฝึกอบรม, ลาดูแลครอบครัว"
            value={form.label}
            onChange={(e) => setForm({ ...form, label: e.target.value })}
            required
            autoFocus
          />
        </div>

        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">
            สิทธิ์สูงสุดต่อปี (วัน)
          </label>
          <Input
            type="number"
            min={1}
            max={365}
            value={form.max}
            onChange={(e) => setForm({ ...form, max: e.target.value })}
            required
          />
          <div className="text-xs text-ink-500 mt-1">
            จำนวนวันที่พนักงานสามารถลาประเภทนี้ได้สูงสุดต่อปี (1-365 วัน)
          </div>
        </div>

        <div>
          <label className="block text-sm font-medium text-ink-700 mb-2">สีประจำประเภท</label>
          <div className="grid grid-cols-8 gap-2">
            {LEAVE_COLOR_PALETTE.map(c => (
              <button
                key={c} type="button"
                onClick={() => setForm({ ...form, color: c })}
                className={cls(
                  'aspect-square rounded-lg transition-all',
                  form.color === c ? 'ring-2 ring-offset-2 ring-ink-800 scale-110' : 'hover:scale-105',
                )}
                style={{ background: c }}
                title={c}
              />
            ))}
          </div>
        </div>

        {/* Preview */}
        <div className="bg-ink-50 rounded-xl p-3 border border-ink-100">
          <div className="text-xs text-ink-500 mb-2">ตัวอย่างที่จะแสดง:</div>
          <div className="rounded-xl border border-ink-100 bg-white p-3" style={{ borderLeftWidth: 4, borderLeftColor: form.color }}>
            <div className="flex items-center gap-2 mb-1">
              <span className="w-3 h-3 rounded-full" style={{ background: form.color }} />
              <span className="font-display font-semibold text-ink-900">{form.label || 'ชื่อประเภทการลา'}</span>
            </div>
            <div className="text-sm text-ink-600">สูงสุด {form.max || 0} วัน/ปี</div>
          </div>
        </div>

        <div className="flex justify-end gap-2 pt-4 border-t border-ink-100">
          <Button type="button" variant="secondary" onClick={onClose}>ยกเลิก</Button>
          <Button type="submit" icon={editing ? 'check' : 'plus'}>
            {editing ? 'บันทึกการแก้ไข' : 'เพิ่มประเภท'}
          </Button>
        </div>
      </form>
    </Modal>
  );
};

/* =============================================================
   BRANCH FORM MODAL — เพิ่ม/แก้ไขสาขา
   ============================================================= */
const BranchFormModal = ({ open, onClose, editing, onSave, existingIds }) => {
  const [form, setForm] = useState({
    id: '', name: '', short: '',
    color: BRANCH_COLOR_PALETTE[0],
    address: '', phone: '',
  });

  useEffect(() => {
    if (editing) {
      setForm(editing);
    } else {
      // generate next id เช่น BR01, BR02
      const usedIds = new Set(existingIds || []);
      let n = 1;
      let newId = '';
      do { newId = 'BR' + String(n).padStart(2, '0'); n++; } while (usedIds.has(newId));
      setForm({
        id: newId, name: '', short: '',
        color: BRANCH_COLOR_PALETTE[(existingIds?.length || 0) % BRANCH_COLOR_PALETTE.length],
        address: '', phone: '',
      });
    }
  }, [editing, open]);

  if (!open) return null;

  const submit = (e) => {
    e.preventDefault();
    if (!form.id.trim())   return alert('กรุณาระบุรหัสสาขา');
    if (!form.name.trim()) return alert('กรุณาระบุชื่อสาขา');
    onSave({
      id:      form.id.trim().toUpperCase(),
      name:    form.name.trim(),
      short:   form.short.trim() || form.name.trim(),
      color:   form.color,
      address: form.address.trim(),
      phone:   form.phone.trim(),
    });
  };

  return (
    <Modal open={open} onClose={onClose} title={editing ? 'แก้ไขข้อมูลสาขา' : 'เพิ่มสาขาใหม่'} size="md">
      <form onSubmit={submit} className="space-y-4">
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">รหัสสาขา</label>
            <Input
              value={form.id}
              onChange={(e) => setForm({ ...form, id: e.target.value.toUpperCase() })}
              placeholder="LLK, BKK"
              maxLength={10}
              required
              disabled={!!editing}
            />
            <div className="text-[11px] text-ink-500 mt-1">ภาษาอังกฤษ 2-10 ตัว แก้ไขไม่ได้หลังสร้าง</div>
          </div>
          <div>
            <label className="block text-sm font-medium text-ink-700 mb-1.5">ชื่อย่อ</label>
            <Input
              value={form.short}
              onChange={(e) => setForm({ ...form, short: e.target.value })}
              placeholder="ลำลูกกา"
            />
          </div>
        </div>

        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">ชื่อสาขา (เต็ม)</label>
          <Input
            value={form.name}
            onChange={(e) => setForm({ ...form, name: e.target.value })}
            placeholder="สาขาลำลูกกา"
            required
          />
        </div>

        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">ที่อยู่</label>
          <Textarea
            rows={2}
            value={form.address}
            onChange={(e) => setForm({ ...form, address: e.target.value })}
            placeholder="ที่ตั้งของสาขา"
          />
        </div>

        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">เบอร์โทรศัพท์</label>
          <Input
            icon="phone"
            value={form.phone}
            onChange={(e) => setForm({ ...form, phone: e.target.value })}
            placeholder="02-XXX-XXXX"
          />
        </div>

        <div>
          <label className="block text-sm font-medium text-ink-700 mb-2">สีประจำสาขา</label>
          <div className="grid grid-cols-10 gap-2">
            {BRANCH_COLOR_PALETTE.map(c => (
              <button
                key={c} type="button"
                onClick={() => setForm({ ...form, color: c })}
                className={cls(
                  'aspect-square rounded-lg transition-all',
                  form.color === c ? 'ring-2 ring-offset-2 ring-ink-800 scale-110' : 'hover:scale-105',
                )}
                style={{ background: c }}
                title={c}
              />
            ))}
          </div>
        </div>

        {/* Preview */}
        <div className="bg-ink-50 rounded-xl p-3 border border-ink-100">
          <div className="text-xs text-ink-500 mb-2">ตัวอย่างที่จะแสดง:</div>
          <div className="rounded-xl border border-ink-100 bg-white p-3" style={{ borderLeftWidth: 4, borderLeftColor: form.color }}>
            <div className="flex items-center gap-2 mb-0.5">
              <span className="w-3 h-3 rounded-full" style={{ background: form.color }} />
              <span className="font-display font-semibold text-ink-900">{form.name || 'ชื่อสาขา'}</span>
            </div>
            <code className="text-[10px] px-1.5 py-0.5 bg-ink-50 text-ink-500 rounded font-mono">{form.id || 'ID'}</code>
            <span className="text-xs text-ink-500 ml-2">{form.short || form.name || '-'}</span>
          </div>
        </div>

        <div className="flex justify-end gap-2 pt-4 border-t border-ink-100">
          <Button type="button" variant="secondary" onClick={onClose}>ยกเลิก</Button>
          <Button type="submit" icon={editing ? 'check' : 'plus'}>
            {editing ? 'บันทึก' : 'เพิ่มสาขา'}
          </Button>
        </div>
      </form>
    </Modal>
  );
};

/* =============================================================
   DEPARTMENT FORM MODAL — เพิ่ม/แก้ไขแผนก
   ============================================================= */
const DepartmentFormModal = ({ open, onClose, editing, onSave }) => {
  const [name, setName] = useState('');

  useEffect(() => {
    setName(editing || '');
  }, [editing, open]);

  if (!open) return null;

  const submit = (e) => {
    e.preventDefault();
    if (!name.trim()) return;
    onSave(name.trim(), editing);
  };

  return (
    <Modal open={open} onClose={onClose} title={editing ? 'แก้ไขชื่อแผนก' : 'เพิ่มแผนกใหม่'} size="sm">
      <form onSubmit={submit} className="space-y-4">
        <div>
          <label className="block text-sm font-medium text-ink-700 mb-1.5">ชื่อแผนก</label>
          <Input
            value={name}
            onChange={(e) => setName(e.target.value)}
            placeholder="เช่น ฝ่ายการตลาด, ฝ่ายผลิต"
            required
            autoFocus
          />
        </div>

        <div className="flex justify-end gap-2 pt-3 border-t border-ink-100">
          <Button type="button" variant="secondary" onClick={onClose}>ยกเลิก</Button>
          <Button type="submit" icon={editing ? 'check' : 'plus'}>
            {editing ? 'บันทึก' : 'เพิ่มแผนก'}
          </Button>
        </div>
      </form>
    </Modal>
  );
};

/* =============================================================
   ROOT APP
   ============================================================= */
const App = () => {
  const [user, setUser]       = useState(null);
  const [page, setPage]       = useState('dashboard');
  const [employees, setEmployees]     = useState([]);
  const [attendance, setAttendance]   = useState([]);
  const [leaves, setLeaves]           = useState([]);
  const [leaveTypes, setLeaveTypes]   = useState(DEFAULT_LEAVE_TYPES);
  const [branches, setBranches]       = useState(DEFAULT_BRANCHES);
  const [departments, setDepartments] = useState(DEFAULT_DEPARTMENTS);
  const [assets, setAssets]           = useState([]);
  const [settings, setSettings]       = useState({
    companyName: 'บริษัท ฟรีด้อมโฟล เทรดดิ้ง จำกัด',
    taxId:       '0-1055-XXXXX-XX-X',
    address:     '',
    phone:       '',
    email:       '',
    workStart:   '08:00',
    workEnd:     '17:00',
    lateMinutes: 5,   // ผ่อนผันได้กี่นาที
  });
  const [toast, setToast]             = useState(null);
  const [loading, setLoading]         = useState(api.enabled());

  // Initialize data — โหลดจาก API หรือใช้ Demo data
  useEffect(() => {
    if (api.enabled()) {
      // โหมด API — โหลดจาก Google Sheets
      (async () => {
        try {
          const data = await api.get('getAll');
          setEmployees(data.employees || []);
          setAttendance(data.attendance || []);
          setLeaves(data.leaves || []);
          if (data.leaveTypes && data.leaveTypes.length > 0) {
            setLeaveTypes(data.leaveTypes);
          }
          if (data.branches && data.branches.length > 0) {
            setBranches(data.branches);
          }
          if (data.departments && data.departments.length > 0) {
            setDepartments(data.departments);
          }
          if (data.assets && data.assets.length > 0) {
            setAssets(data.assets);
          }
          if (data.settings && Object.keys(data.settings).length > 0) {
            setSettings(s => ({ ...s, ...data.settings }));
          }
        } catch (err) {
          setToast({ type: 'error', message: 'เชื่อมต่อ Google Sheets ล้มเหลว: ' + err.message });
          // Fallback to demo data
          const emps = seedEmployees();
          setEmployees(emps);
          setAttendance(seedAttendance(emps));
          setLeaves(seedLeaves(emps));
        } finally {
          setLoading(false);
        }
      })();
    } else {
      // โหมด Demo
      const emps = seedEmployees();
      setEmployees(emps);
      setAttendance(seedAttendance(emps));
      setLeaves(seedLeaves(emps));
    }
  }, []);

  const addToast = (type, message) => setToast({ type, message });

  // Loading screen ระหว่างเชื่อมต่อ API
  if (loading) {
    return (
      <div className="min-h-screen login-bg flex items-center justify-center">
        <div className="text-center text-white">
          <div className="w-24 h-24 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center mx-auto mb-6 shadow-card animate-pulse-soft p-3">
            <img src={LOGO_EAGLE} alt="FFC" className="w-full h-full object-contain" style={{ filter: 'brightness(1.5)' }} />
          </div>
          <div className="font-display text-2xl font-bold mb-2">กำลังเชื่อมต่อ Google Sheets...</div>
          <div className="text-brand-200/70 text-sm flex items-center gap-2 justify-center">
            <Icon name="refresh" className="w-4 h-4 animate-spin" />
            <span>กรุณารอสักครู่</span>
          </div>
        </div>
      </div>
    );
  }

  if (!user) {
    return (
      <>
        <LoginPage onLogin={setUser} addToast={addToast} />
        {toast && <Toast toast={toast} onClose={() => setToast(null)} />}
      </>
    );
  }

  // attach empId if user is employee (demo)
  const effectiveUser = user.role === 'employee' && !user.empId
    ? { ...user, empId: employees[0]?.id }
    : user;

  return (
    <AppCtx.Provider value={{
      user: effectiveUser, employees, setEmployees,
      attendance, setAttendance, leaves, setLeaves,
      leaveTypes, setLeaveTypes,
      branches, setBranches,
      departments, setDepartments,
      assets, setAssets,
      settings, setSettings,
      addToast,
    }}>
      <div className="flex min-h-screen bg-ink-50">
        {api.enabled() && (
          <div className="fixed bottom-4 left-4 z-40 bg-emerald-500 text-white text-xs font-medium px-3 py-1.5 rounded-full shadow-soft flex items-center gap-1.5 no-print">
            <span className="w-1.5 h-1.5 bg-white rounded-full animate-pulse" />
            เชื่อมต่อ Google Sheets
          </div>
        )}
        <Sidebar
          current={page}
          onChange={setPage}
          user={effectiveUser}
          onLogout={() => { setUser(null); setPage('dashboard'); }}
        />
        <main className="flex-1 min-w-0">
          {page === 'dashboard'  && <Dashboard />}
          {page === 'employees'  && <EmployeesPage />}
          {page === 'attendance' && <AttendancePage />}
          {page === 'leaves'     && <LeavesPage />}
          {page === 'assets'     && <AssetsPage />}
          {page === 'reports'    && <ReportsPage />}
          {page === 'branches'   && <BranchesPage />}
          {page === 'settings'   && <SettingsPage />}
        </main>
      </div>
      {toast && <Toast toast={toast} onClose={() => setToast(null)} />}
    </AppCtx.Provider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
